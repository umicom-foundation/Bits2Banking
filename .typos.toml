# .typos.toml — repo-level config for crate-ci/typos

[default]
# Ignore generated/output areas (same spirit as your CI find patterns)
extend-ignore-re = [
  "volumes/.*",
  "book/.*",
  "site/.*",
  ".github/ISSUE_TEMPLATE/.*",
  # Keep spelling checks enabled around each deliberately escaped text fixture.
  '\bcaf\\(?:u00e9\b|u\{00e9\}|xc3\\xa9\b)',
  '(?:"|&quot;)caf(?:"|&quot;)(?:[ \t]*(?:&amp;|&)[ \t]*Chr\b|,[ \t]*"this known boundary)',
  '\b(?:gives caf|prints caf as the known safe prefix)\b',
  # BA is matrix multiplication in the LoRA and matrix examples.
  '\bweight update BA\b',
  '\bBA=\[\[',
  # Match only generated values in the JSON id field. Titles and prose
  # keep their normal spelling checks.
  '"id"[ \t]*:[ \t]*"(?:resource-[0-9a-f]{22,24}|native-[0-9a-f]{20})"'
]

[files]
extend-exclude = [
  "output/**",   # BookForge generated
  "volumes/**"   # legacy outputs, just in case
]

[default.extend-words]
# Project/tech nouns
Calypso   = "Calypso"
TMS       = "TMS"
Umicom    = "Umicom"
MkDocs    = "MkDocs"
DOCX      = "DOCX"
GitHub    = "GitHub"
RISC      = "RISC"
PnL       = "PnL"
Wise      = "Wise"
acknowledgement = "acknowledgement"
acknowledgements = "acknowledgements"

# Allow lowercase 'github' in code/links if you use it that way
"github"  = "github"

# Finance & Islamic finance terms we use a lot
SME        = "SME"
SMEs       = "SMEs"
Sukuk      = "Sukuk"
Hawala     = "Hawala"
Riba       = "Riba"
Shariah    = "Shariah"
Taqwa      = "Taqwa"
Mudarabah  = "Mudarabah"
Musharakah = "Musharakah"
Ijarah     = "Ijarah"
Sakk       = "Sakk"

# Arabic names / transliterations (prevent false positives like Abd/ʿAbd)
"Abd"       = "Abd"
"ʿAbd"      = "ʿAbd"
"al-Malik"  = "al-Malik"
Umayyad     = "Umayyad"

# Valid terms in recovery, simulator, ELF and cataloguing material.
rto = "rto"
udid = "udid"
rela = "rela"
uncatalogued = "uncatalogued"
