<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Compiler and runtime pipeline</title><desc id="desc">Source, tokens, checked stack instructions and portable bytes lead to a native interpreter. The interpreter is built for a specific processor and operating system.</desc><rect width="960" height="350" rx="18" fill="#edf4f8"/><g font-family="sans-serif" text-anchor="middle" fill="#14344e"><g fill="#fff" stroke="#27808e" stroke-width="2"><rect x="20" y="45" width="200" height="90" rx="10"/><rect x="260" y="45" width="200" height="90" rx="10"/><rect x="500" y="45" width="200" height="90" rx="10"/><rect x="740" y="45" width="200" height="90" rx="10"/></g><g font-size="22"><text x="120" y="80">Source text</text><text x="360" y="80">Tokens</text><text x="600" y="80">Instructions</text><text x="840" y="80">Portable bytes</text></g><g font-size="18"><text x="120" y="112">return 7 * 6;</text><text x="360" y="112">7 · * · 6</text><text x="600" y="112">PUSH · MULTIPLY</text><text x="840" y="112">UMCB format</text></g><g font-size="28"><text x="240" y="100">→</text><text x="480" y="100">→</text><text x="720" y="100">→</text></g><path d="M840 140 V180 H480 V200" fill="none" stroke="#27808e" stroke-width="3"/><rect x="240" y="200" width="480" height="65" rx="10" fill="#14344e"/><text x="480" y="240" fill="white" font-size="22">Native CVM interpreter → result 42</text><text x="480" y="306" font-size="18">Build the interpreter separately for each supported CPU and system.</text></g></svg>
