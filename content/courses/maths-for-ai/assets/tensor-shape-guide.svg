<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
<title id="title">Three rows and four columns form a 3 by 4 tensor</title><desc id="desc">The top row contains four cells numbered 0 to 3, the second row cells 4 to 7, and the third row cells 8 to 11. A highlighted cell in row 2 column 1 has index 9.</desc>
<rect width="920" height="410" rx="18" fill="#eff7fb"/>
<text x="36" y="49" fill="#10344d" font-size="27" font-family="Segoe UI,Arial,sans-serif" font-weight="700">Tensor shape: [3, 4]</text>
<text x="36" y="84" fill="#416076" font-size="17" font-family="Segoe UI,Arial,sans-serif">3 rows × 4 columns = 12 values</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173f55" text-anchor="middle">
<text x="230" y="126">Column 0</text><text x="375" y="126">Column 1</text><text x="520" y="126">Column 2</text><text x="665" y="126">Column 3</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173f55">
<text x="55" y="170">Row 0</text><text x="55" y="250">Row 1</text><text x="55" y="330">Row 2</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#143851" stroke="#8cb5ce" stroke-width="2">
<rect x="160" y="142" width="140" height="63" rx="8" fill="#fff"/><rect x="305" y="142" width="140" height="63" rx="8" fill="#fff"/><rect x="450" y="142" width="140" height="63" rx="8" fill="#fff"/><rect x="595" y="142" width="140" height="63" rx="8" fill="#fff"/>
<rect x="160" y="222" width="140" height="63" rx="8" fill="#fff"/><rect x="305" y="222" width="140" height="63" rx="8" fill="#fff"/><rect x="450" y="222" width="140" height="63" rx="8" fill="#fff"/><rect x="595" y="222" width="140" height="63" rx="8" fill="#fff"/>
<rect x="160" y="302" width="140" height="63" rx="8" fill="#fff"/><rect x="305" y="302" width="140" height="63" rx="8" fill="#dbf3ea" stroke="#16856e" stroke-width="3"/><rect x="450" y="302" width="140" height="63" rx="8" fill="#fff"/><rect x="595" y="302" width="140" height="63" rx="8" fill="#fff"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173f55">
<text x="230" y="180">0</text><text x="375" y="180">1</text><text x="520" y="180">2</text><text x="665" y="180">3</text>
<text x="230" y="260">4</text><text x="375" y="260">5</text><text x="520" y="260">6</text><text x="665" y="260">7</text>
<text x="230" y="340">8</text><text x="375" y="340" font-weight="700">9</text><text x="520" y="340">10</text><text x="665" y="340">11</text>
</g><text x="745" y="334" fill="#126d5b" font-family="Segoe UI,Arial,sans-serif" font-size="15">row 2, col 1</text>
</svg>
