<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc"><title id="title">Mathematics stepping stones for language models</title><desc id="desc">Five stages connect numbers, vectors, probability, derivatives and the attention system.</desc><rect width="1100" height="230" rx="22" fill="#10283c"/><g font-family="system-ui" fill="#10283c" font-weight="700" font-size="23" text-anchor="middle"><rect x="30" y="74" width="180" height="82" rx="14" fill="#dcf5ee"/><text x="120" y="123">Numbers</text><rect x="245" y="74" width="180" height="82" rx="14" fill="#d5ecfb"/><text x="335" y="123">Vectors</text><rect x="460" y="74" width="180" height="82" rx="14" fill="#dcf5ee"/><text x="550" y="123">Probability</text><rect x="675" y="74" width="180" height="82" rx="14" fill="#d5ecfb"/><text x="765" y="123">Gradients</text><rect x="890" y="74" width="180" height="82" rx="14" fill="#dcf5ee"/><text x="980" y="123">Attention</text></g><g fill="none" stroke="#b8d9ee" stroke-width="5"><path d="M210 115H245"/><path d="M425 115H460"/><path d="M640 115H675"/><path d="M855 115H890"/></g><text x="550" y="40" fill="#fff" font-size="24" font-family="system-ui" font-weight="700" text-anchor="middle">From familiar mathematics to a native C23 language model</text></svg>