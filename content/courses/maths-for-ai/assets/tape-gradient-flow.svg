<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
<title id="title">Forward calculations and backward gradients</title>
<desc id="desc">Three forward boxes labelled weight w, prediction p equals 2w plus 1, and loss L equals half the square of p minus 5. Blue arrows advance forwards. A green reverse arrow returns the gradient dL by dw, which equals minus four at w equals one.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#226aab" stroke-width="2"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#0f8073" stroke-width="2"/></marker></defs>
<rect width="980" height="320" rx="18" fill="#eff7fb"/>
<text x="40" y="52" fill="#17364d" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">One trainable weight — two directions</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
<rect x="55" y="92" width="230" height="98" rx="13" fill="#fff" stroke="#8db2c9" stroke-width="2"/><text x="170" y="129" font-size="21" fill="#143e5e">Weight w = 1</text><text x="170" y="162" font-size="15" fill="#557184">Starting number</text>
<rect x="374" y="92" width="230" height="98" rx="13" fill="#fff" stroke="#8db2c9" stroke-width="2"/><text x="489" y="129" font-size="21" fill="#143e5e">p = 2w + 1</text><text x="489" y="162" font-size="15" fill="#557184">Prediction p = 3</text>
<rect x="693" y="92" width="230" height="98" rx="13" fill="#fff" stroke="#8db2c9" stroke-width="2"/><text x="808" y="129" font-size="20" fill="#143e5e">L = (p − 5)² / 2</text><text x="808" y="162" font-size="15" fill="#557184">Loss L = 2</text>
</g>
<path d="M286 140 H370" stroke="#226aab" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M605 140 H690" stroke="#226aab" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<path d="M807 201 V240 H171 V200" stroke="#0f8073" stroke-width="3" fill="none" marker-end="url(#back)"/>
<text x="480" y="232" fill="#0c655c" font-size="17" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Backward: dL/dw = −4</text>
<text x="40" y="289" fill="#43647a" font-size="16" font-family="Segoe UI,Arial,sans-serif">The chain rule carries the loss change back through the prediction to the weight.</text>
</svg>
