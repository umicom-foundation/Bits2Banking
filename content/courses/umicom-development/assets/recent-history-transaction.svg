<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Save a proposed history change before publishing it</title>
<desc id="desc">A displayed row provides a copied item ID and revision. Framework validates it, builds a candidate, saves metadata, and publishes the candidate only on success. A failure retains the live history. Project files are never part of this operation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365c6d"/></marker></defs>
<rect width="1000" height="480" fill="#f5f8fb"/>
<g fill="#fff" stroke="#365c6d" stroke-width="2"><rect x="25" y="40" width="200" height="100" rx="8"/><rect x="270" y="40" width="200" height="100" rx="8"/><rect x="515" y="40" width="200" height="100" rx="8"/><rect x="760" y="40" width="215" height="100" rx="8"/><rect x="650" y="255" width="290" height="100" rx="8" fill="#e2f4e9"/><rect x="285" y="255" width="280" height="100" rx="8" fill="#fff0e2"/><rect x="30" y="385" width="940" height="65" rx="8" fill="#eaf1fa"/></g>
<g fill="none" stroke="#365c6d" stroke-width="2" marker-end="url(#arrow)"><path d="M225 90H263"/><path d="M470 90H508"/><path d="M715 90H753"/><path d="M870 140V245"/><path d="M810 140V195H430V245"/></g>
<g font-family="sans-serif" fill="#18364a" text-anchor="middle" font-size="21"><text x="125" y="72">Displayed row</text><text x="125" y="106">ID + revision</text><text x="370" y="72">Check selection</text><text x="370" y="106">Still current?</text><text x="615" y="72">Make candidate</text><text x="615" y="106">Remove entry</text><text x="867" y="72">Save metadata</text><text x="867" y="106">Local file only</text><text x="795" y="290">Success</text><text x="795" y="326">Publish + refresh rows</text><text x="425" y="290">Failure</text><text x="425" y="326">Keep live history</text><text x="500" y="425">Project folders and source files remain unchanged.</text></g>
<text x="885" y="223" fill="#235b3b" font-family="sans-serif" font-size="18">Saved</text><text x="585" y="185" fill="#8a4328" font-family="sans-serif" font-size="18">Refused or save failed</text>
</svg>
