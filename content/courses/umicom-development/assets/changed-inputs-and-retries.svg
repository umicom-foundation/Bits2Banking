<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" role="img" aria-labelledby="title desc">
<title id="title">Combine changed inputs and required test retries</title>
<desc id="desc">Changed core source selects core, view and view.check. A separate earlier nonpass requires other.check and its owner. The combined plan keeps both paths and related fixtures. A plan is not a test result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#335a70"/></marker></defs>
<rect width="1180" height="580" rx="18" fill="#f7fafc"/>
<g font-family="system-ui, sans-serif" fill="#18344a">
<text x="40" y="52" font-size="29" font-weight="700">Two independent reasons to do work</text>
<rect x="40" y="87" width="340" height="160" rx="14" fill="#e5f2fa" stroke="#4c819d" stroke-width="2"/>
<text x="62" y="122" font-size="22" font-weight="700">Changed listed source</text>
<text x="62" y="160" font-size="20">core.c has different bytes</text>
<text x="62" y="193" font-size="18">Select its owner and dependents:</text>
<text x="62" y="222" font-size="19">core → view → view.check</text>
<rect x="40" y="293" width="340" height="160" rx="14" fill="#fff4dc" stroke="#986c19" stroke-width="2"/>
<text x="62" y="330" font-size="22" font-weight="700">Required retry</text>
<text x="62" y="369" font-size="20">other.check still needs evidence</text>
<text x="62" y="404" font-size="18">Its source may be unchanged.</text>
<text x="62" y="434" font-size="19">Keep the test and its owner.</text>
<path d="M385 168 H443 V253 H483 M385 373 H443 V286 H483" fill="none" stroke="#335a70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="500" y="180" width="280" height="190" rx="14" fill="#e8f5ee" stroke="#3c795b" stroke-width="2"/>
<text x="522" y="219" font-size="22" font-weight="700">Shared Framework plan</text>
<text x="522" y="257" font-size="19">Combine exact identities.</text>
<text x="522" y="289" font-size="19">Keep related fixtures.</text>
<text x="522" y="321" font-size="19">Keep executable owners.</text>
<text x="522" y="349" font-size="17">Unknown names → full selection</text>
<path d="M785 276 H823" fill="none" stroke="#335a70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="840" y="180" width="300" height="190" rx="14" fill="#ffffff" stroke="#4c819d" stroke-width="2"/>
<text x="862" y="220" font-size="22" font-weight="700">Separate execution</text>
<text x="862" y="257" font-size="19">Build required programs.</text>
<text x="862" y="289" font-size="19">Run selected tests.</text>
<text x="862" y="321" font-size="19">Capture actual outcomes.</text>
<text x="862" y="349" font-size="17">The plan cannot report a pass.</text>
<rect x="40" y="492" width="1100" height="51" rx="9" fill="#18344a"/>
<text x="62" y="525" fill="#ffffff" font-size="20">No source change does not mean no test work. A missing registration must be investigated.</text>
</g></svg>
