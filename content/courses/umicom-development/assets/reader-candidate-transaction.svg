<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<!--
Umicom Foundation
File: content/courses/umicom-development/assets/reader-candidate-transaction.svg
PURPOSE: Explain independent candidate preparation and a single publication boundary.
AUTHOR AND ORGANISATION: Sammy Hegab, Umicom Foundation
LICENCE: MIT
-->
<title id="title">Prepare a candidate before replacing the current reader</title>
<desc id="desc">The current reader stays complete while an independent candidate reads and verifies another resource and prepares its display. Success accepts the candidate. Failure releases the candidate and keeps the current reader.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#24637e"/></marker></defs>
<rect width="960" height="360" rx="16" fill="#f2f6f9"/>
<g fill="#fff" stroke="#24637e" stroke-width="2">
<rect x="25" y="35" width="245" height="115" rx="12"/>
<rect x="355" y="35" width="245" height="115" rx="12"/>
<rect x="685" y="35" width="245" height="115" rx="12"/>
<rect x="355" y="235" width="420" height="95" rx="12"/>
</g>
<g font-family="sans-serif" fill="#173047" text-anchor="middle">
<text x="147" y="70" font-size="21">Current reader</text><text x="147" y="103" font-size="17">Visible text and history</text><text x="147" y="129" font-size="17">remain complete</text>
<text x="477" y="70" font-size="21">Independent candidate</text><text x="477" y="103" font-size="17">Read, verify and prepare</text><text x="477" y="129" font-size="17">without changing current</text>
<text x="807" y="70" font-size="21">Accept on success</text><text x="807" y="103" font-size="17">Publish text and reader</text><text x="807" y="129" font-size="17">as one complete result</text>
<text x="565" y="272" font-size="21">Failure: release candidate</text><text x="565" y="304" font-size="17">Keep the earlier reader and explain the refusal</text>
<text x="314" y="75" font-size="16">Clone</text><text x="644" y="75" font-size="16">Ready</text><text x="521" y="195" font-size="16">Refused</text>
</g>
<g stroke="#24637e" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M270 95H350"/><path d="M600 95H680"/><path d="M477 150V228"/>
</g></svg>
