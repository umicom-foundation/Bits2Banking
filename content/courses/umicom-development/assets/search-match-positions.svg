<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">UTF-8 bytes and GTK character positions</title><desc id="desc">In é space ownership, ownership starts at byte 3 and character 2. Its exclusive ends are byte 12 and character 11. The highlighted cells contain the same word.</desc><rect width="960" height="360" rx="18" fill="#f3f6fb"/><g font-family="sans-serif" fill="#1f334b"><text x="30" y="40" font-size="25" font-weight="700">Same text, different positions: é ownership</text><text x="30" y="77" font-size="16">The search range counts UTF-8 bytes. The window selection counts characters.</text><text x="30" y="128" font-size="18">Stored bytes</text><rect x="180" y="103" width="54" height="44" rx="5" fill="#e0e7f0" stroke="#526b82"/><text x="207" y="131" font-size="17" text-anchor="middle">C3</text><text x="207" y="168" font-size="14" text-anchor="middle">0</text><rect x="238" y="103" width="54" height="44" rx="5" fill="#e0e7f0" stroke="#526b82"/><text x="265" y="131" font-size="17" text-anchor="middle">A9</text><text x="265" y="168" font-size="14" text-anchor="middle">1</text><rect x="296" y="103" width="54" height="44" rx="5" fill="#e0e7f0" stroke="#526b82"/><text x="323" y="131" font-size="17" text-anchor="middle">20</text><text x="323" y="168" font-size="14" text-anchor="middle">2</text><rect x="354" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="381" y="131" font-size="17" text-anchor="middle">6F</text><text x="381" y="168" font-size="14" text-anchor="middle">3</text><rect x="412" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="439" y="131" font-size="17" text-anchor="middle">77</text><text x="439" y="168" font-size="14" text-anchor="middle">4</text><rect x="470" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="497" y="131" font-size="17" text-anchor="middle">6E</text><text x="497" y="168" font-size="14" text-anchor="middle">5</text><rect x="528" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="555" y="131" font-size="17" text-anchor="middle">65</text><text x="555" y="168" font-size="14" text-anchor="middle">6</text><rect x="586" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="613" y="131" font-size="17" text-anchor="middle">72</text><text x="613" y="168" font-size="14" text-anchor="middle">7</text><rect x="644" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="671" y="131" font-size="17" text-anchor="middle">73</text><text x="671" y="168" font-size="14" text-anchor="middle">8</text><rect x="702" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="729" y="131" font-size="17" text-anchor="middle">68</text><text x="729" y="168" font-size="14" text-anchor="middle">9</text><rect x="760" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="787" y="131" font-size="17" text-anchor="middle">69</text><text x="787" y="168" font-size="14" text-anchor="middle">10</text><rect x="818" y="103" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="845" y="131" font-size="17" text-anchor="middle">70</text><text x="845" y="168" font-size="14" text-anchor="middle">11</text><text x="30" y="228" font-size="18">GTK characters</text><rect x="180" y="203" width="54" height="44" rx="5" fill="#e0e7f0" stroke="#526b82"/><text x="207" y="231" font-size="17" text-anchor="middle">é</text><text x="207" y="268" font-size="14" text-anchor="middle">0</text><rect x="238" y="203" width="54" height="44" rx="5" fill="#e0e7f0" stroke="#526b82"/><text x="265" y="231" font-size="12" text-anchor="middle">space</text><text x="265" y="268" font-size="14" text-anchor="middle">1</text><rect x="296" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="323" y="231" font-size="17" text-anchor="middle">o</text><text x="323" y="268" font-size="14" text-anchor="middle">2</text><rect x="354" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="381" y="231" font-size="17" text-anchor="middle">w</text><text x="381" y="268" font-size="14" text-anchor="middle">3</text><rect x="412" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="439" y="231" font-size="17" text-anchor="middle">n</text><text x="439" y="268" font-size="14" text-anchor="middle">4</text><rect x="470" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="497" y="231" font-size="17" text-anchor="middle">e</text><text x="497" y="268" font-size="14" text-anchor="middle">5</text><rect x="528" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="555" y="231" font-size="17" text-anchor="middle">r</text><text x="555" y="268" font-size="14" text-anchor="middle">6</text><rect x="586" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="613" y="231" font-size="17" text-anchor="middle">s</text><text x="613" y="268" font-size="14" text-anchor="middle">7</text><rect x="644" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="671" y="231" font-size="17" text-anchor="middle">h</text><text x="671" y="268" font-size="14" text-anchor="middle">8</text><rect x="702" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="729" y="231" font-size="17" text-anchor="middle">i</text><text x="729" y="268" font-size="14" text-anchor="middle">9</text><rect x="760" y="203" width="54" height="44" rx="5" fill="#c7eddb" stroke="#526b82"/><text x="787" y="231" font-size="17" text-anchor="middle">p</text><text x="787" y="268" font-size="14" text-anchor="middle">10</text><text x="30" y="308" font-size="17">Selected range: bytes [3, 12), characters [2, 11). End positions are excluded.</text><text x="30" y="337" font-size="15">Starting at byte 1 would split é. Validate complete characters before converting.</text></g></svg>
