<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Each test owns its own state</title>
<desc id="desc">A caller has a project and data-store setting. Test A and Test B create different temporary roots, each with config, application history and a sample project. Each restores caller settings when finished; neither borrows the caller's files.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#46657b"/></marker></defs>
<rect width="1120" height="690" rx="20" fill="#f6f9fb"/>
<g font-family="system-ui,sans-serif" fill="#203348">
<text x="40" y="55" font-size="28" font-weight="700">Give each test a place it owns</text>
<rect x="40" y="90" width="1040" height="125" rx="14" fill="#e3edf4" stroke="#46657b" stroke-width="2"/>
<text x="65" y="125" font-size="23" font-weight="700">Caller state</text>
<text x="65" y="161" font-size="20">Original working directory · original data-store setting · real project files</text>
<text x="65" y="191" font-size="18">Capture the settings. Do not treat these files as disposable test data.</text>
<path d="M300 215V265" fill="none" stroke="#46657b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M820 215V265" fill="none" stroke="#46657b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="500" height="230" rx="14" fill="#fff" stroke="#1b7488" stroke-width="3"/>
<rect x="580" y="280" width="500" height="230" rx="14" fill="#fff" stroke="#8b5d20" stroke-width="3"/>
<text x="65" y="320" font-size="23" font-weight="700">Test A: unique directory A</text>
<text x="605" y="320" font-size="23" font-weight="700">Test B: unique directory B</text>
<g font-size="21"><text x="85" y="365">config/</text><text x="85" y="405">.umicom/</text><text x="85" y="445">sample-project/</text>
<text x="625" y="365">config/</text><text x="625" y="405">.umicom/</text><text x="625" y="445">sample-project/</text></g>
<text x="65" y="482" font-size="18">Creates and uses its own sample state</text>
<text x="605" y="482" font-size="18">Creates and uses its own sample state</text>
<path d="M290 510V550M830 510V550" fill="none" stroke="#46657b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="565" width="1040" height="85" rx="14" fill="#e6f1ed" stroke="#276d52" stroke-width="2"/>
<text x="65" y="600" font-size="21" font-weight="700">Release services, then restore caller settings</text>
<text x="65" y="630" font-size="18">Keep fixture paths as evidence. A unique folder is ownership preparation, not a sandbox.</text>
<text x="40" y="677" font-size="14">Sammy Hegab · Umicom Foundation · MIT · Original teaching diagram</text>
</g></svg>
