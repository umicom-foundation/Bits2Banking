<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">A requirement needs matching evidence</title><desc id="desc">A named test, host and build configuration are compared with saved evidence for the requested source. Only a matching passed observation satisfies the requirement. Skipped, failed, missing and mismatched observations remain outstanding.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="960" height="440" rx="20" fill="#f8fafc"/><g font-family="sans-serif" fill="#142e43"><text x="32" y="42" font-size="24" font-weight="700">Match the requirement before interpreting the outcome</text><rect x="32" y="78" width="260" height="142" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="52" y="111" font-size="20" font-weight="700">Required check</text><text x="52" y="143" font-size="17">Test: editor.open</text><text x="52" y="171" font-size="17">Host: desktop</text><text x="52" y="199" font-size="17">Configuration: Debug</text><rect x="352" y="78" width="254" height="142" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="372" y="111" font-size="20" font-weight="700">Saved evidence</text><text x="372" y="143" font-size="17">Matching source identity</text><text x="372" y="171" font-size="17">Matching host and test</text><text x="372" y="199" font-size="17">Outcome and message</text><path d="M 294 150 H 344" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><path d="M 608 150 H 662" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="674" y="78" width="254" height="142" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="694" y="111" font-size="20" font-weight="700">Matching pass</text><text x="694" y="145" font-size="17">This requirement is met</text><text x="694" y="178" font-size="17">Other requirements</text><text x="694" y="202" font-size="17">still need their evidence</text><path d="M 479 222 V 260" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="248" y="274" width="462" height="116" rx="12" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/><text x="270" y="307" font-size="20" font-weight="700">Keep the requirement outstanding</text><text x="270" y="340" font-size="17">Failed, skipped, disabled, not run, missing</text><text x="270" y="368" font-size="17">or recorded for a different source</text><text x="32" y="420" font-size="16">Filtering a display never changes the whole-review decision.</text></g></svg>
