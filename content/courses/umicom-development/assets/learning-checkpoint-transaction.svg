<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Record a checkpoint without losing newer history</title>
<desc id="desc">A verified reader supplies the document identity. A transaction compares current stored records before appending an event and committing. Stale history is refused and storage failure leaves the prior projection unchanged.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#173047}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:600}.body{font-size:17px}.box{stroke:#315f77;stroke-width:2;fill:#eff6fa}.arrow{stroke:#315f77;stroke-width:3;fill:none;marker-end:url(#tip)}</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f77"/></marker></defs>
<rect width="960" height="480" rx="16" fill="#fff"/>
<text x="30" y="40" class="title">A checkpoint belongs to exact lesson bytes</text>
<rect x="25" y="75" width="260" height="125" rx="12" class="box"/>
<text x="43" y="108" class="label">Verified reader</text><text x="43" y="141" class="body">Pack + revision + resource</text><text x="43" y="172" class="body">Content hash + checkpoint</text>
<path d="M290 138H335" class="arrow"/>
<rect x="345" y="75" width="270" height="125" rx="12" class="box"/>
<text x="363" y="108" class="label">Compare saved history</text><text x="363" y="141" class="body">Begin transaction</text><text x="363" y="172" class="body">Validate every saved event</text>
<path d="M620 138H665" class="arrow"/>
<rect x="675" y="75" width="260" height="125" rx="12" class="box"/>
<text x="693" y="108" class="label">Append and commit</text><text x="693" y="141" class="body">Event + header together</text><text x="693" y="172" class="body">Then publish success</text>
<path d="M480 207V248" class="arrow"/>
<rect x="295" y="260" width="370" height="90" rx="12" fill="#fff5df" stroke="#9b6e1b" stroke-width="2"/>
<text x="313" y="292" class="label">History changed: BUSY</text><text x="313" y="325" class="body">Preserve it; refresh and review</text>
<path d="M805 207V376H665" class="arrow"/>
<rect x="295" y="365" width="370" height="90" rx="12" fill="#fff0ed" stroke="#a24f43" stroke-width="2"/>
<text x="313" y="397" class="label">Commit or rollback uncertain</text><text x="313" y="430" class="body">Retire writes; reopen storage</text>
</svg>
