<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title description">
<!-- Umicom Bits2Banking
File: content/courses/umicom-development/assets/workspace-regions.svg
PURPOSE: Explain product-specific workspace regions and their distinct tasks.
AUTHOR AND ORGANISATION: Sammy Hegab / Umicom Foundation
LICENCE: MIT -->
<title id="title">Workspaces arranged around different product tasks</title><desc id="description">Studio has a large split editor and a bottom output panel. Trader has account status, market views and an order draft. Media has a library, preview and inspector above a wide timeline. These are schematic learning diagrams, not application screenshots.</desc><style>text{font-family:system-ui,sans-serif;fill:#203449}.heading{font-size:24px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.region{fill:#edf4fa;stroke:#7995ac;stroke-width:2}.main{fill:#d6ecff;stroke:#1674b3;stroke-width:2}</style><rect width="1100" height="650" fill="#fff"/><text x="30" y="40" class="heading">Arrange the workspace around the task</text><text x="30" y="68" class="small">Learning diagrams — proportions illustrate purpose, not a finished application design.</text><g transform="translate(30,105)"><text y="25" class="heading">Studio IDE</text><rect x="0" y="45" width="30" height="310" class="region"/><text x="8" y="68" class="small"></text><rect x="36" y="45" width="85" height="310" class="region"/><text x="44" y="68" class="small">Explorer</text><rect x="127" y="45" width="187" height="32" class="region"/><text x="135" y="68" class="small">File tabs</text><rect x="127" y="83" width="110" height="174" class="main"/><text x="135" y="106" class="small">Editor</text><rect x="243" y="83" width="71" height="174" class="main"/><text x="251" y="106" class="small">Split</text><rect x="127" y="263" width="187" height="92" class="region"/><text x="135" y="286" class="small">Output / Problems</text><text y="385" class="small">Code stays central; output sits below it.</text></g><g transform="translate(390,105)"><text y="25" class="heading">Trader</text><rect x="0" y="45" width="314" height="39" class="region"/><text x="8" y="68" class="small">Mode • Account • Data age</text><rect x="0" y="90" width="92" height="177" class="region"/><text x="8" y="113" class="small">Watchlist</text><rect x="98" y="90" width="131" height="177" class="main"/><text x="106" y="113" class="small">Chart / depth</text><rect x="235" y="90" width="79" height="177" class="region"/><text x="243" y="113" class="small">Order</text><rect x="0" y="273" width="314" height="82" class="region"/><text x="8" y="296" class="small">Positions • Orders • Execution</text><text y="385" class="small">Market context surrounds reviewed actions.</text></g><g transform="translate(750,105)"><text y="25" class="heading">Media</text><rect x="0" y="45" width="85" height="184" class="region"/><text x="8" y="68" class="small">Library</text><rect x="91" y="45" width="138" height="184" class="main"/><text x="99" y="68" class="small">Preview</text><rect x="235" y="45" width="79" height="184" class="region"/><text x="243" y="68" class="small">Inspector</text><rect x="0" y="235" width="314" height="120" class="main"/><text x="8" y="258" class="small">Sequence timeline</text><path d="M15 293 H298 M15 320 H298" stroke="#7995ac"/><text y="385" class="small">Preview and time-based edits share space.</text></g><text x="30" y="555" class="label">Resize a divider to change space. Select a tab to change the visible page.</text><text x="30" y="586" class="label">Move focus to change where keys go. Apply a command to change the document.</text><text x="30" y="620" class="small">These operations are separate: rearranging panels should preserve unsaved work.</text></svg>
