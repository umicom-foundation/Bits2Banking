<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-labelledby="title description"><title id="title">One wait, one time budget</title><desc id="description">A first read takes six milliseconds. A second read takes six more. The ten millisecond deadline occurs before the complete reply at twelve milliseconds.</desc><rect width="940" height="360" rx="18" fill="#f1f6fa"/><g font-family="sans-serif" fill="#1e3346"><text x="36" y="43" font-size="24" font-weight="bold">One wait, one time budget</text><text x="36" y="75" font-size="17">Elapsed time continues across both transport reads.</text><path d="M60 222H875" fill="none" stroke="#1e3346" stroke-width="3"/><rect x="60" y="110" width="360" height="64" rx="7" fill="#245c80"/><rect x="420" y="110" width="360" height="64" rx="7" fill="#647f2c"/><g fill="#fff" font-size="20"><text x="92" y="148">First read: 6 ms</text><text x="452" y="148">Second read: 6 ms</text></g><path d="M660 92V250" stroke="#ae343b" stroke-width="4" stroke-dasharray="7 6"/><g font-size="18"><text x="50" y="250">0</text><text x="409" y="250">6</text><text x="640" y="277" fill="#ae343b">10 ms deadline</text><text x="757" y="250">12 ms</text></g><circle cx="780" cy="222" r="6" fill="#1e3346"/><text x="60" y="311" font-size="19">Complete reply arrives after the deadline.</text><text x="60" y="340" font-size="17">Retain it if queue capacity permits; leave this wait’s output unchanged.</text></g></svg>
