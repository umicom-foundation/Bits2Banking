<title id="title">Keyboard focus moves between live regions</title><desc id="description">F6 moves from Media to Preview to Inspector to Timeline and wraps. Shift F6 reverses. Hidden regions are skipped; edits and commands remain unchanged.</desc><style>text{font-family:system-ui,sans-serif;fill:#203449}.heading{font-size:24px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.region{fill:#edf4fa;stroke:#7995ac;stroke-width:2}.main{fill:#d6ecff;stroke:#1674b3;stroke-width:2}</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1674b3"/></marker></defs><text x="30" y="42" class="heading">Move between panels without applying an edit</text><text x="30" y="75" class="label">F6: next region     Shift+F6: previous region     Tab: controls within the region</text><rect x="30" y="130" width="215" height="135" rx="10" class="region"/><text x="48" y="165" class="heading">Media</text><rect x="45" y="188" width="185" height="48" fill="#fff" stroke="#7995ac"/><text x="54" y="217" class="small">Existing controls</text><path d="M250 195 H281" stroke="#1674b3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="290" y="130" width="215" height="135" rx="10" class="main"/><text x="308" y="165" class="heading">Preview</text><rect x="305" y="188" width="185" height="48" fill="#fff" stroke="#7995ac"/><text x="314" y="217" class="small">Focused control</text><path d="M510 195 H541" stroke="#1674b3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="550" y="130" width="215" height="135" rx="10" class="region"/><text x="568" y="165" class="heading">Inspector</text><rect x="565" y="188" width="185" height="48" fill="#fff" stroke="#7995ac"/><text x="574" y="217" class="small">Unapplied trim draft</text><path d="M770 195 H801" stroke="#1674b3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="810" y="130" width="215" height="135" rx="10" class="region"/><text x="828" y="165" class="heading">Timeline</text><rect x="825" y="188" width="185" height="48" fill="#fff" stroke="#7995ac"/><text x="834" y="217" class="small">Existing controls</text><path d="M920 277 V318 H138 V280" fill="none" stroke="#1674b3" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="347" class="small">Wrap to the first available region</text><text x="30" y="400" class="label">Hidden or unavailable panels are skipped. A single focused region stays put.</text><text x="30" y="434" class="label">No clip is trimmed, order submitted, file saved or build started by F6.</text><text x="30" y="480" class="small">Schematic learning diagram. The actual order follows the current widget arrangement.</text></svg>
