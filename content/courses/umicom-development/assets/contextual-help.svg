<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">From a help request to a verified guide</title>
<desc id="desc">The application supplies product, locale, kind and key. Its explicit route selects pack and resource identities from the current shelf. The reader checks revision, digest and bytes before displaying content. Refusals leave the current document unchanged. No command is executed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#23617c"/></marker></defs>
<rect width="960" height="430" rx="16" fill="#f5f8fa"/>
<g font-family="sans-serif" fill="#173047">
<text x="32" y="42" font-size="23" font-weight="700">Help selects a guide; the reader verifies its bytes</text>
<g fill="white" stroke="#23617c" stroke-width="2">
<rect x="25" y="76" width="215" height="140" rx="10"/>
<rect x="275" y="76" width="200" height="140" rx="10"/>
<rect x="510" y="76" width="200" height="140" rx="10"/>
<rect x="745" y="76" width="190" height="140" rx="10"/>
</g>
<g font-size="18" text-anchor="middle">
<text x="132" y="109" font-weight="700">Application request</text>
<text x="132" y="140">Product + locale</text><text x="132" y="169">Kind + exact key</text>
<text x="375" y="109" font-weight="700">Explicit route</text>
<text x="375" y="140">Pack identifier</text><text x="375" y="169">Resource identifier</text>
<text x="610" y="109" font-weight="700">Current shelf</text>
<text x="610" y="140">Guide or lesson</text><text x="610" y="169">Copied metadata</text>
<text x="840" y="109" font-weight="700">Verified reader</text>
<text x="840" y="140">Revision + digest</text><text x="840" y="169">Read actual bytes</text>
</g>
<g stroke="#23617c" stroke-width="2" marker-end="url(#arrow)">
<path d="M240 145H270"/><path d="M475 145H505"/><path d="M710 145H740"/>
<path d="M840 216V274"/>
<path d="M375 216V260H360V286" stroke-dasharray="6 4"/>
<path d="M610 216V260H360"/>
</g>
<rect x="585" y="286" width="350" height="104" rx="10" fill="#e7f2e9" stroke="#356c42" stroke-width="2"/>
<text x="760" y="323" font-size="20" text-anchor="middle" font-weight="700">Display verified content</text>
<text x="760" y="355" font-size="17" text-anchor="middle">This does not run an example.</text>
<rect x="25" y="286" width="500" height="104" rx="10" fill="#fff5df" stroke="#98701e" stroke-width="2"/>
<text x="275" y="323" font-size="20" text-anchor="middle" font-weight="700">Missing, incompatible or changed?</text>
<text x="275" y="355" font-size="17" text-anchor="middle">Report refusal; keep the current document.</text>
</g></svg>
