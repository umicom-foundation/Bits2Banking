<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">From historical evidence to a new selection</title>
<desc id="desc">Keep baseline observation, qualification report and their receipts separately. Reopen historical evidence against the configured inventory, capture current source and toolchain, then plan changed work and unresolved checks. A selection is not a test result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#315f78"/></marker></defs>
<rect width="1120" height="450" fill="#f5f8fb"/>
<g font-family="system-ui,sans-serif" fill="#19354c">
<text x="30" y="40" font-size="25" font-weight="700">Remember the inputs and the results</text>
<rect x="30" y="75" width="290" height="210" rx="12" fill="#fff" stroke="#315f78"/>
<text x="50" y="107" font-size="20" font-weight="700">Earlier attempt</text>
<text x="50" y="145" font-size="17">Baseline: listed paths and hashes</text>
<text x="50" y="177" font-size="17">Report: outcomes and identities</text>
<text x="50" y="209" font-size="17">Receipts: retained independently</text>
<text x="50" y="253" font-size="15" fill="#485b6b">Private historical data; no source code</text>
<path d="M325 170 H380" stroke="#315f78" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="390" y="75" width="300" height="210" rx="12" fill="#fff" stroke="#315f78"/>
<text x="410" y="107" font-size="20" font-weight="700">Reopen and check</text>
<text x="410" y="145" font-size="17">Match inventory and receipts</text>
<text x="410" y="177" font-size="17">Validate bounds and exact paths</text>
<text x="410" y="209" font-size="17">Recompute historical identities</text>
<text x="410" y="253" font-size="15" fill="#485b6b">Damaged data produces an error</text>
<path d="M695 170 H750" stroke="#315f78" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="760" y="75" width="330" height="210" rx="12" fill="#fff" stroke="#315f78"/>
<text x="780" y="107" font-size="20" font-weight="700">Plan a new attempt</text>
<text x="780" y="145" font-size="17">Observe current inputs and tools</text>
<text x="780" y="177" font-size="17">Select changed work + due checks</text>
<text x="780" y="209" font-size="17">Widen when evidence is missing</text>
<text x="780" y="253" font-size="15" fill="#485b6b">The host schedules execution later</text>
<rect x="30" y="320" width="1060" height="96" rx="12" fill="#e6eef4"/>
<text x="50" y="353" font-size="18" font-weight="700">Keep the meanings separate</text>
<text x="50" y="384" font-size="17">Historical hash equality is not current source proof. A planned selection is not a completed test run.</text>
</g></svg>
