<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Matrix product and memory layout</title><desc id="ddesc">Three row-major rectangles show an input matrix multiplied by weights into an output matrix.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="74" y="94" width="222" height="155" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="185.0" y="167.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Input X</text>
<text x="185.0" y="195.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">32 × 8 token features</text>
<rect x="366" y="94" width="211" height="155" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="471.5" y="167.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Weights W</text>
<text x="471.5" y="195.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">8 × 260 vocabulary</text>
<rect x="647" y="94" width="222" height="155" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="758.0" y="167.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Logits XW</text>
<text x="758.0" y="195.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">32 × 260 values</text>
<text x="333" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="29" text-anchor="middle" fill="#087784">×</text>
<text x="610" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="29" text-anchor="middle" fill="#087784">=</text>
<text x="473" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#526879">Every resulting value combines one row with one weight column.</text>
</svg>
