<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">From reviewed source text to an LLM training step</title><desc id="ddesc">Source examples become token IDs, vectors, transformer predictions, loss and an optimiser update.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="24" y="118" width="163" height="91" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="105.5" y="159.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Reviewed text</text>
<text x="105.5" y="187.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">approved corpus</text>
<path d="M188 164 L208 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="210" y="118" width="163" height="91" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="291.5" y="159.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Token IDs</text>
<text x="291.5" y="187.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">byte vocabulary</text>
<path d="M374 164 L394 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="396" y="118" width="163" height="91" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="477.5" y="159.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Embeddings</text>
<text x="477.5" y="187.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">learned vectors</text>
<path d="M560 164 L580 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="582" y="118" width="163" height="91" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="663.5" y="159.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Transformer</text>
<text x="663.5" y="187.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">context processing</text>
<path d="M746 164 L766 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="768" y="118" width="163" height="91" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="849.5" y="159.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Loss</text>
<text x="849.5" y="187.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">measured error</text>
<text x="470" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#203247">TRAINING • How a language model improves its next-token predictions</text>
<text x="470" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#087784">Backpropagation  →  optimiser  →  updated model parameters</text>
