<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-label="Train and evaluation are separated by complete source files">
<title>Train and evaluation are separated by complete source files</title>
<style>
 text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}
 .title{font-size:23px;font-weight:750}.note{font-size:15px;fill:#597183}
 .label{font-size:16px;font-weight:700}.small{font-size:13px}
 .box{fill:#fff;stroke:#b9cdd8;stroke-width:2}.soft{fill:#ecf7f7;stroke:#53b2b8;stroke-width:2}
 .navy{fill:#203247}.navyText{fill:#fff}.accent{fill:#087784}.white{fill:#fff}
 .arr{stroke:#087784;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1000" height="365" rx="22" fill="#f5f9fb"/>
<text x="42" y="54" class="title">Train and evaluation are separated by complete source files</text>
<rect x="55" y="102" width="320" height="165" rx="13" class="box"/><text x="215.0" y="144" class="label" text-anchor="middle">Training partition</text><text x="215.0" y="170" class="small" text-anchor="middle">account.c  +  notes.c</text>
<rect x="625" y="102" width="320" height="165" rx="13" class="soft"/><text x="785.0" y="144" class="label" text-anchor="middle">Held-out partition</text><text x="785.0" y="170" class="small" text-anchor="middle">payment.c</text>
<path d="M500 105 L500 275" stroke="#d87b67" stroke-width="4" stroke-dasharray="11 10"/><text x="500" y="301" text-anchor="middle" class="label">NO CROSS-FILE WINDOWS</text><text x="500" y="330" text-anchor="middle" class="note">Do not include near-duplicate source in both partitions.</text></svg>
