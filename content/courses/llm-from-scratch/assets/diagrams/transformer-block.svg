<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Transformer decoder block</title><desc id="ddesc">Layer normalisation, causal multi-head attention, residual connection and feedforward layers in the canonical decoder.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="30" y="100" width="176" height="106" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="118.0" y="149.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">LayerNorm</text>
<text x="118.0" y="177.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">stabilise inputs</text>
<rect x="258" y="100" width="193" height="106" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="354.5" y="149.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Attention</text>
<text x="354.5" y="177.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">context-aware</text>
<rect x="502" y="100" width="176" height="106" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="590.0" y="149.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Residual</text>
<text x="590.0" y="177.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">add input</text>
<rect x="732" y="100" width="176" height="106" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="820.0" y="149.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Feed-forward</text>
<text x="820.0" y="177.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">feature transform</text>
<path d="M206 153 L257 153" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M451 153 L501 153" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M678 153 L731 153" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#203247">One pre-layer-normalised Transformer block</text>
<text x="470" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">The training tape owns the intermediate tensors and gradients.</text>
</svg>
