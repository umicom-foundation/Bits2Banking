<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="460" viewBox="0 0 1020 460" role="img" aria-labelledby="title desc">
<title id="title">Rotary training-tape lifecycle and rollback</title><desc id="desc">Four retained leaf tensors enter a temporary graph of rotary attention and loss. A backward pass creates gradients. A successful rewind or failed operation rolls back to four original leaf nodes and releases intermediate graph allocations. The tracked peak memory remains the high-water mark.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#2f7799" stroke-width="2"/></marker><marker id="rollback" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#13816c" stroke-width="2"/></marker></defs>
<rect width="1020" height="460" rx="20" fill="#f2f7fa"/><text x="42" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#173c54">Umicom C23 training tape: retain the leaves, release the work</text>
<rect x="48" y="108" width="282" height="162" rx="16" fill="#e5f4ee" stroke="#3f987b" stroke-width="2"/><text x="189" y="144" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#125d4f">Retained leaf tensors</text><g font-size="17" font-family="Segoe UI,Arial,sans-serif" fill="#194b43" text-anchor="middle"><text x="189" y="178">Query · Key</text><text x="189" y="208">Value · Target</text><text x="189" y="241">4 retained graph nodes</text></g>
<rect x="373" y="108" width="282" height="162" rx="16" fill="#e6f2fc" stroke="#5a99c9" stroke-width="2"/><text x="514" y="144" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#14496e">Temporary work</text><g font-size="17" font-family="Segoe UI,Arial,sans-serif" fill="#225577" text-anchor="middle"><text x="514" y="178">RoPE Q/K rotation</text><text x="514" y="208">Causal attention · Loss</text><text x="514" y="241">Forward + Backward</text></g>
<rect x="698" y="108" width="282" height="162" rx="16" fill="#e5f4ee" stroke="#3f987b" stroke-width="2"/><text x="839" y="144" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#125d4f">Rewind or rollback</text><g font-size="17" font-family="Segoe UI,Arial,sans-serif" fill="#194b43" text-anchor="middle"><text x="839" y="178">Release intermediate nodes</text><text x="839" y="208">Return to 4 leaves</text><text x="839" y="241">Keep valid weights</text></g>
<path d="M333 189 H369" stroke="#2f7799" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M658 189 H694" stroke="#2f7799" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M840 275 V333 H189 V275" stroke="#13816c" stroke-width="3.5" fill="none" marker-end="url(#rollback)"/><text x="515" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0c695a" text-anchor="middle">Next iteration starts from the same leaf graph</text>
<text x="42" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#335971">Current tracked bytes fall after rollback. Peak tracked bytes record the historical maximum.</text>
<text x="42" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#587387">This diagram does not represent whole-process RSS or prove every possible memory defect is absent.</text>
</svg>
