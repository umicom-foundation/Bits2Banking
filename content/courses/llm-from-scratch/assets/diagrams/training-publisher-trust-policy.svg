<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">Trust-policy verification before accepting a signed training publication</title>
<desc id="desc">An independently controlled trust policy supplies an allowlisted fingerprint and PEM key. Validity and revocation are checked before canonical Ed25519 signature verification, followed by SHA-256 publication file checks.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#0b8185" stroke-width="2"/></marker></defs>
<rect x="1" y="1" width="1198" height="523" rx="25" fill="#f2f9fa" stroke="#b9d5dc" stroke-width="2"/>
<text x="48" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#193f51">Publisher trust is an independent decision</text>
<text x="48" y="89" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#54717c">A signature may identify a key, but it cannot enrol itself into a trusted publisher list.</text>
<rect x="48" y="137" width="295" height="240" rx="17" fill="#ffffff" stroke="#7eaab5" stroke-width="2"/>
<text x="68" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#184658">Independent trust policy</text>
<text x="68" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">Approved key SHA-256</text>
<text x="68" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">Public-key PEM location</text>
<text x="68" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">From / until Unix seconds</text>
<text x="68" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">Active or revoked</text>
<rect x="68" y="314" width="254" height="42" rx="9" fill="#dcefeb"/>
<text x="87" y="341" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#126870">Not from model archive</text>
<path d="M345 256H394" fill="none" stroke="#0b8185" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="410" y="155" width="340" height="201" rx="18" fill="#e1f4f0" stroke="#479e98" stroke-width="2.5"/>
<text x="430" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#175363">1. Evaluate policy</text>
<text x="430" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#355f6a">Is claimed fingerprint approved?</text>
<text x="430" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#355f6a">Is the key active at this instant?</text>
<text x="430" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#355f6a">Resolve reviewed PEM safely</text>
<text x="430" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#137173">Otherwise reject</text>
<path d="M751 256H793" fill="none" stroke="#0b8185" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="810" y="155" width="344" height="201" rx="18" fill="#ffffff" stroke="#7eaab5" stroke-width="2"/>
<text x="830" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#184658">2. Verify signed bundle</text>
<text x="830" y="230" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">Ed25519 signature + real PEM</text>
<text x="830" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">Exact publication record bytes</text>
<text x="830" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#466775">SHA-256: four evidence files</text>
<text x="830" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#176b48">Accept only if every check passes</text>
<rect x="48" y="416" width="1106" height="66" rx="14" fill="#e8f1f5" stroke="#acc9d3"/>
<text x="70" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193f51">Verification-time policy is not evidence of signing time.</text>
<text x="70" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#54717c">The operator must still protect policy files, review training permissions and control filesystem races.</text>
</svg>
