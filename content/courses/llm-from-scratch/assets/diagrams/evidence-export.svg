<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Read-only native benchmark evidence export</title>
<desc id="desc">Framework services run a reviewed model, validate aggregate score counters, combine SHA-256 identities, then publish an atomic JSON record that can be reviewed without compiling generated text.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087784"/></marker><style>.box{fill:#fff;stroke:#9fb4c5;stroke-width:2}.t{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#203247}.sub{font:17px 'Segoe UI',Arial,sans-serif;fill:#405565}</style></defs>
<rect width="1000" height="350" rx="22" fill="#eaf1f5"/><text x="35" y="46" class="t" font-size="27">From measurements to a reviewable report</text>
<rect x="35" y="88" width="205" height="152" rx="17" class="box"/><text x="58" y="128" class="t">Existing decoder</text><text x="58" y="158" class="sub">Reviewed test suite</text><text x="58" y="187" class="sub">Fixed sampling seed</text><text x="58" y="215" class="sub">No code execution</text>
<path d="M240 165H275" fill="none" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="280" y="88" width="205" height="152" rx="17" class="box"/><text x="302" y="128" class="t">Framework C23</text><text x="302" y="158" class="sub">Validate counters</text><text x="302" y="187" class="sub">Hash exact bytes</text><text x="302" y="215" class="sub">Escape case labels</text>
<path d="M485 165H518" fill="none" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="524" y="88" width="205" height="152" rx="17" class="box"/><text x="546" y="128" class="t">Staged JSON</text><text x="546" y="158" class="sub">Model hash</text><text x="546" y="187" class="sub">Suite and score hashes</text><text x="546" y="215" class="sub">Case metrics</text>
<path d="M729 165H764" fill="none" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="768" y="88" width="195" height="152" rx="17" fill="#203247"/><text x="790" y="128" fill="#fff" font-family="Segoe UI,Arial" font-size="22" font-weight="700">Reviewer</text><text x="790" y="160" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="17">Compare evidence</text><text x="790" y="190" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="17">Check source splits</text><text x="790" y="220" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="17">Do not infer skill</text>
<rect x="107" y="265" width="786" height="51" rx="12" fill="#d2ebea"/><text x="500" y="296" fill="#203247" font-family="Segoe UI,Arial" font-size="19" text-anchor="middle">JSON export is read-only and failure-atomic — it is not a digital signature.</text>
</svg>
