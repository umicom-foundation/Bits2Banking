<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 385" role="img" aria-labelledby="receipt-title receipt-desc">
  <title id="receipt-title">Verified native LLM training receipt</title>
  <desc id="receipt-desc">A reviewed trust policy and signed checkpoint bundle are verified by the Framework's Ed25519 and integrity services. Success produces an unsigned machine-readable JSON observation, while a rejected check produces no JSON success record.</desc>
  <rect width="1160" height="385" rx="22" fill="#12273c"/>
  <text x="45" y="51" fill="#f1f7f8" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Native training verification → machine-readable receipt</text>
  <text x="45" y="80" fill="#b6d1db" font-family="Segoe UI,Arial,sans-serif" font-size="15">Only the Framework verifies signatures, approved keys and original saved file bytes.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="129" width="254" height="94" rx="12" fill="#244258" stroke="#87a5b4" stroke-width="1.5"/>
    <text x="58" y="164" fill="#eafaff" font-size="19" font-weight="700">Signed publication</text>
    <text x="58" y="193" fill="#c4dce4" font-size="14">checkpoint + 3 sidecars</text>
    <rect x="40" y="242" width="254" height="84" rx="12" fill="#204653" stroke="#65bdba" stroke-width="1.5"/>
    <text x="58" y="273" fill="#eafaff" font-size="18" font-weight="700">Approved trust policy</text>
    <text x="58" y="298" fill="#c4dce4" font-size="14">operator-selected public key</text>
    <path d="M303 175 H354" stroke="#75d0cb" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M344 166 L357 175 L344 184" stroke="#75d0cb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M303 284 H330 V210 H354" stroke="#75d0cb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M344 201 L357 210 L344 219" stroke="#75d0cb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="364" y="149" width="330" height="120" rx="14" fill="#0d6071" stroke="#74e5dd" stroke-width="1.5"/>
    <text x="386" y="181" fill="#ffffff" font-size="20" font-weight="700">Framework verification</text>
    <text x="386" y="210" fill="#e0fcf7" font-size="15">Key policy · Ed25519 signature</text>
    <text x="386" y="234" fill="#e0fcf7" font-size="15">Publication and file SHA-256</text>
    <path d="M707 189 H757" stroke="#75d0cb" stroke-width="3" fill="none"/>
    <path d="M747 180 L760 189 L747 198" stroke="#75d0cb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="769" y="140" width="347" height="99" rx="12" fill="#1d524b" stroke="#82e0bd" stroke-width="1.5"/>
    <text x="790" y="172" fill="#f8fffe" font-size="19" font-weight="700">Verified → JSON receipt</text>
    <text x="790" y="197" fill="#d7f4e9" font-size="14">approved key · four file digests</text>
    <text x="790" y="219" fill="#d7f4e9" font-size="14">not signed; no signing-time proof</text>
    <path d="M695 255 L766 294" stroke="#f2b9a2" stroke-width="3" fill="none"/>
    <path d="M758 280 L767 296 L749 295" stroke="#f2b9a2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="779" y="266" width="337" height="72" rx="12" fill="#633c45" stroke="#efa996" stroke-width="1.5"/>
    <text x="799" y="294" fill="#fff5ef" font-size="18" font-weight="700">Rejected → no success JSON</text>
    <text x="799" y="317" fill="#f9d5c8" font-size="14">nonzero return status</text>
  </g>
  <text x="44" y="360" fill="#b9d0da" font-family="Segoe UI,Arial,sans-serif" font-size="13">Umicom Foundation · C23 shared training services · Integrity is not the same as model correctness.</text>
</svg>
