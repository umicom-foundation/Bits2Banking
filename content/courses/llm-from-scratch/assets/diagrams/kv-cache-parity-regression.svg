<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Validate cached and canonical generation before a release</title>
  <desc id="desc">The same reviewed decoder, prompt, sampling policy, and seed feed the original full-context decoder and the KV-cache adapter. Both results must match byte-for-byte. Separate checks establish unchanged checkpoints, invalid-input atomicity, and reported recomputation rows.</desc>
  <rect width="1100" height="380" rx="24" fill="#f5f8fb"/>
  <text x="44" y="53" font-size="29" font-weight="700" font-family="system-ui,sans-serif" fill="#203247">One model, identical inputs, strict parity checks</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="40" y="95" width="295" height="78" rx="14" fill="#e8eef4" stroke="#b4c5d2" stroke-width="2"/>
    <text x="188" y="127" font-size="20" font-weight="700" fill="#203247">Reviewed decoder</text>
    <text x="188" y="152" font-size="15" fill="#203247">prompt + seed + top-K/top-p</text>
    <rect x="389" y="93" width="306" height="78" rx="14" fill="#e8eef4" stroke="#b4c5d2" stroke-width="2"/>
    <text x="542" y="126" font-size="19" font-weight="700" fill="#203247">Canonical inference</text>
    <text x="542" y="152" font-size="15" fill="#203247">full-context logits</text>
    <rect x="389" y="216" width="306" height="78" rx="14" fill="#ddf2ef" stroke="#168074" stroke-width="2"/>
    <text x="542" y="250" font-size="19" font-weight="700" fill="#203247">KV-cache inference</text>
    <text x="542" y="275" font-size="15" fill="#203247">prefill and qualified rebuilds</text>
    <rect x="748" y="139" width="310" height="108" rx="14" fill="#203247"/>
    <text x="903" y="174" font-size="20" font-weight="700" fill="white">Assert exact token parity</text>
    <text x="903" y="201" font-size="15" fill="white">checkpoint byte identity</text>
    <text x="903" y="224" font-size="15" fill="white">rejections + row counters</text>
  </g>
  <g fill="none" stroke="#3d6075" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M338 133h45m-10 -7l10 7l-10 7"/>
    <path d="M335 153v101h48m-10 -7l10 7l-10 7"/>
    <path d="M697 132h24v64h21m-10 -7l10 7l-10 7"/>
    <path d="M697 255h24v-59h21"/>
  </g>
  <text x="46" y="353" font-family="system-ui,sans-serif" font-size="16" fill="#476176">A process that never starts is an environment failure, not a failed numerical comparison.</text>
</svg>
