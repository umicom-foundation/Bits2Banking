<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc">
<title id="title">Compare uninterrupted and disk-resumed AdamW training</title>
<desc id="desc">Route A performs steps one to four. Route B saves after step two, reloads a combined checkpoint, validates two companion records, then completes steps three and four. Both final combined checkpoints must match byte for byte.</desc>
<rect width="1000" height="365" rx="18" fill="#142b40"/>
<g font-family="system-ui,sans-serif" font-size="17">
<text x="36" y="47" fill="#f6fafc" font-size="27" font-weight="700">Verify the complete training path, including disk I/O</text>
<text x="40" y="111" fill="#d0f6ef" font-weight="700">Route A</text>
<rect x="165" y="78" width="385" height="60" rx="13" fill="#d6eeeb"/>
<text x="358" y="116" fill="#15334b" text-anchor="middle">Train 1 → 2 → 3 → 4</text>
<rect x="677" y="78" width="273" height="60" rx="13" fill="#eaf4f7"/>
<text x="813" y="115" fill="#15334b" text-anchor="middle">Combined checkpoint A</text>
<path d="M550 108H677" stroke="#64ded0" stroke-width="4"/>
<text x="40" y="223" fill="#d0f6ef" font-weight="700">Route B</text>
<rect x="165" y="176" width="208" height="69" rx="12" fill="#d6eeeb"/>
<text x="269" y="205" fill="#15334b" text-anchor="middle">Train 1 → 2</text>
<text x="269" y="232" fill="#15334b" font-size="14" text-anchor="middle">save + reload</text>
<rect x="397" y="176" width="235" height="69" rx="12" fill="#eaf4f7"/>
<text x="514" y="205" fill="#15334b" text-anchor="middle">Check both records</text>
<text x="514" y="232" fill="#15334b" font-size="14" text-anchor="middle">train 3 → 4 only if valid</text>
<rect x="677" y="176" width="273" height="69" rx="12" fill="#eaf4f7"/>
<text x="813" y="215" fill="#15334b" text-anchor="middle">Combined checkpoint B</text>
<path d="M373 211H397 M632 211H677" stroke="#64ded0" stroke-width="4"/>
<rect x="281" y="279" width="440" height="64" rx="13" fill="#087d86"/>
<text x="501" y="306" fill="white" text-anchor="middle" font-weight="700">A and B must be byte-identical</text>
<text x="501" y="329" fill="#e4ffff" text-anchor="middle" font-size="14">weights · moments · completed step counter</text>
<path d="M813 138V158H501V279 M813 245V262H501V279" fill="none" stroke="#64ded0" stroke-width="3"/>
</g>
</svg>
