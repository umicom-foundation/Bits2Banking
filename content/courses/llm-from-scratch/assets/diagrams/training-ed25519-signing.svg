<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title description">
<title id="title">Signing a completed LLM training publication with Ed25519</title>
<desc id="description">A complete four-file checkpoint bundle is covered by an existing SHA-256 publication record. An approved Ed25519 private key signs the publication bytes, creating a new detached signature. Verification uses a separate trusted public key.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7f8"/><stop offset="1" stop-color="#f8fbfc"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#087c84" stroke-width="2.4"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="488" rx="24" fill="url(#background)" stroke="#b4d4d9" stroke-width="2"/>
<text x="45" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#15374c">From byte integrity to publisher attestation</text>
<text x="45" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4a6875">The model and all policy records remain unchanged. A detached signature is added after review.</text>
<rect x="40" y="132" width="323" height="229" rx="19" fill="#fff" stroke="#aac6d0" stroke-width="2"/>
<rect x="40" y="132" width="323" height="55" rx="19" fill="#1e4253"/>
<rect x="40" y="171" width="323" height="16" fill="#1e4253"/>
<text x="62" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Four original evidence files</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#284452">
 <text x="68" y="216">▣  Model + AdamW checkpoint</text>
 <text x="68" y="255">▣  Gradient clipping policy</text>
 <text x="68" y="294">▣  Training schedule lock</text>
 <text x="68" y="333">▣  Source snapshot lock</text>
</g>
<path d="M363 247H413" fill="none" stroke="#087c84" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="432" y="153" width="304" height="186" rx="19" fill="#fff" stroke="#3d9a9e" stroke-width="2.5"/>
<text x="456" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#15374c">.publication</text>
<text x="456" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#486472">SHA-256 digest + length</text>
<text x="456" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#486472">for each original file</text>
<rect x="450" y="274" width="266" height="45" rx="10" fill="#e9f5f3"/>
<text x="465" y="302" font-family="Consolas,monospace" font-size="15" fill="#11747c">Canonical byte sequence</text>
<path d="M736 247H786" fill="none" stroke="#087c84" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="802" y="130" width="345" height="230" rx="19" fill="#fff" stroke="#aac6d0" stroke-width="2"/>
<rect x="823" y="150" width="303" height="62" rx="12" fill="#e7effb" stroke="#afc6e1"/>
<text x="844" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17465c">Approved private key</text>
<text x="844" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#476373">Never commit or distribute</text>
<path d="M974 218V253" fill="none" stroke="#087c84" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="823" y="270" width="303" height="67" rx="12" fill="#0f7180"/>
<text x="846" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Ed25519 signature</text>
<text x="846" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#ddf9f7">New .publication.ed25519</text>
<rect x="41" y="388" width="1107" height="64" rx="13" fill="#dceff0"/>
<text x="66" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#164857">What is signed?</text>
<text x="66" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#335c65">A fixed domain prefix followed by the EXACT .publication bytes — not model predictions or the signing key.</text>
</svg>
