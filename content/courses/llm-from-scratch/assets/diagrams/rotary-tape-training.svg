<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" role="img" aria-labelledby="title desc"><title id="title">Training-tape gradient path for rotary attention</title><desc id="desc">Query and key projections go to tape-owned rotary operations, then attention and loss. The reverse gradient flow returns through the original tape toward learned weights. The mathematics bridge provides explanations of each arrow.</desc><rect width="1180" height="450" rx="20" fill="#eff5fa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#1f678a"/></marker><marker id="reverse" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#08745e"/></marker></defs><g font-family="system-ui" font-size="20" font-weight="700" fill="#17364c" text-anchor="middle"><rect x="28" y="100" width="195" height="90" rx="13" fill="#fff" stroke="#92adbf" stroke-width="2"/><text x="126" y="134">Trainable</text><text x="126" y="165">Q/K projections</text><rect x="267" y="100" width="195" height="90" rx="13" fill="#dff5ef" stroke="#08745e" stroke-width="2"/><text x="364" y="135">RoPE matrix</text><text x="364" y="167">tape nodes</text><rect x="506" y="100" width="195" height="90" rx="13" fill="#fff" stroke="#92adbf" stroke-width="2"/><text x="603" y="138">Causal</text><text x="603" y="166">attention</text><rect x="745" y="100" width="195" height="90" rx="13" fill="#fff" stroke="#92adbf" stroke-width="2"/><text x="842" y="154">Learning loss</text><rect x="978" y="100" width="170" height="90" rx="13" fill="#fff" stroke="#92adbf" stroke-width="2"/><text x="1063" y="154">Backward</text></g><g fill="none" stroke="#1f678a" stroke-width="4" marker-end="url(#arrow)"><path d="M223 144H267"/><path d="M462 144H506"/><path d="M701 144H745"/><path d="M940 144H978"/></g><path d="M1063 190V255H126V190" fill="none" stroke="#08745e" stroke-width="4" marker-end="url(#reverse)"/><text x="589" y="281" text-anchor="middle" font-size="21" fill="#08745e" font-weight="700" font-family="system-ui">Chain-rule gradients return to the original projected tensors</text><rect x="173" y="331" width="832" height="72" rx="16" fill="#e1eef8" stroke="#8faabd" stroke-width="2"/><text x="589" y="371" text-anchor="middle" font-size="21" fill="#134765" font-weight="700" font-family="system-ui">Maths companion: vectors → matrices → angles → derivatives</text></svg>