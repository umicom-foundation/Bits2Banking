<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<defs><style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#203247} .head{font-size:25px;font-weight:700}.txt{font-size:21px;font-weight:600}.small{font-size:17px} .muted{fill:#566879}
.box{fill:white;stroke:#a0b4c5;stroke-width:2}.teal{fill:#ddf4f4;stroke:#087784;stroke-width:2}.navy{fill:#203247}.line{stroke:#087784;stroke-width:4;fill:none;stroke-linecap:round}
</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#087784"/></marker></defs>
<title id="title">Separate training diagnostics</title><desc id="desc">Gradient norm, training loss, held-out loss, and task benchmarks represent distinct types of evidence.</desc>
<rect width="1200" height="390" rx="26" fill="#f0f6f8"/>
<text x="58" y="65" class="head">Four different questions, four different measurements</text>
<rect class="teal" x="50" y="125" width="257" height="166" rx="20"/>
<text x="73" y="171" class="txt">Gradient norm</text><text x="73" y="210" class="small">How large is</text><text x="73" y="239" class="small">the update signal?</text>
<rect class="box" x="333" y="125" width="257" height="166" rx="20"/>
<text x="356" y="171" class="txt">Training loss</text><text x="356" y="210" class="small">How well are fitted</text><text x="356" y="239" class="small">examples predicted?</text>
<rect class="box" x="616" y="125" width="257" height="166" rx="20"/>
<text x="639" y="171" class="txt">Held-out loss</text><text x="639" y="210" class="small">How do unseen</text><text x="639" y="239" class="small">examples compare?</text>
<rect class="box" x="899" y="125" width="257" height="166" rx="20"/>
<text x="922" y="171" class="txt">Task benchmark</text><text x="922" y="210" class="small">Did the specific</text><text x="922" y="239" class="small">completion match?</text>
<text x="55" y="335" class="small muted">No single measurement proves that a model has become a reliable programming assistant.</text>
</svg>
