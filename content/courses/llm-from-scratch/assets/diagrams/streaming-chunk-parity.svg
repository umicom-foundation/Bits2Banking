<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
<title id="title">Chunked and one-shot KV-cache generation parity</title>
<desc id="description">One-shot generation returns twenty-four tokens. The same model and seed also return identical twenty-four tokens when pulled from a persistent streaming session in groups of three, seven and fourteen. A comparator verifies every returned token ID.</desc>
<rect width="1120" height="360" rx="22" fill="#f1f6f8"/>
<g font-family="Arial,sans-serif" fill="#15324a">
<text x="34" y="48" font-size="25" font-weight="700">Unequal pull sizes must not change token IDs</text>
<text x="38" y="97" font-size="18" font-weight="700">One-shot cached generator</text>
<rect x="315" y="77" width="767" height="59" rx="12" fill="#163c55"/>
<g font-size="17" fill="#fff"><text x="336" y="111">24 tokens in one request — reference sequence</text></g>
<text x="38" y="190" font-size="18" font-weight="700">Persistent streaming cursor</text>
<rect x="315" y="160" width="99" height="58" rx="9" fill="#087784"/>
<rect x="424" y="160" width="222" height="58" rx="9" fill="#087784"/>
<rect x="656" y="160" width="426" height="58" rx="9" fill="#087784"/>
<g font-size="18" font-weight="700" fill="#fff"><text x="331" y="196">3 tokens</text><text x="488" y="196">7 tokens</text><text x="803" y="196">14 tokens</text></g>
<path d="M696 219 V259" stroke="#167b66" stroke-width="3"/>
<path d="M689 250 L696 263 703 250" stroke="#167b66" stroke-width="3" fill="none"/>
<rect x="347" y="267" width="613" height="56" rx="12" fill="#e2fff4" stroke="#087784" stroke-width="2"/>
<text x="365" y="300" font-size="17" font-weight="700">Compare all 24 token IDs → identical output required</text>
<text x="38" y="277" font-size="15">Same decoder</text>
<text x="38" y="299" font-size="15">Same top-p policy</text>
<text x="38" y="321" font-size="15">Same seed, once</text>
</g>
</svg>
