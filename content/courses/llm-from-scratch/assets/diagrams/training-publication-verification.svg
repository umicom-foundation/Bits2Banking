<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Read-only verification of native training evidence</title>
<desc id="desc">The verifier hashes the four checkpoint files, compares recorded byte counts and SHA-256 digests, and rejects on any mismatch. Semantic source, schedule, checkpoint and signature checks remain separate.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087784"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="20" fill="#f2f8fa" stroke="#ccdde4"/>
<text x="30" y="42" fill="#203247" font-size="24" font-weight="700" font-family="system-ui,sans-serif">Verify without loading or running a model</text>
<text x="30" y="68" fill="#415a6b" font-size="14" font-family="system-ui,sans-serif">The Framework streams file identities and compares them with a canonical publication record.</text>
<rect x="29" y="96" width="272" height="222" rx="14" fill="#fff" stroke="#9fb9c4"/>
<text x="47" y="126" fill="#203247" font-size="17" font-weight="700" font-family="system-ui,sans-serif">Four input files</text>
<text x="47" y="159" fill="#344f60" font-size="14" font-family="system-ui,sans-serif">checkpoint.umi</text>
<text x="47" y="192" fill="#344f60" font-size="14" font-family="system-ui,sans-serif">.clip-policy</text>
<text x="47" y="225" fill="#344f60" font-size="14" font-family="system-ui,sans-serif">.training-lock</text>
<text x="47" y="258" fill="#344f60" font-size="14" font-family="system-ui,sans-serif">.source-lock</text>
<text x="47" y="295" fill="#087784" font-size="12" font-family="system-ui,sans-serif">Each byte stream read with bounded memory</text>
<path d="M301 203H333" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="345" y="116" width="270" height="182" rx="14" fill="#203247"/>
<text x="366" y="151" fill="#fff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">Recompute file identity</text>
<text x="366" y="186" fill="#e2f6f5" font-size="14" font-family="system-ui,sans-serif">1. File length</text>
<text x="366" y="214" fill="#e2f6f5" font-size="14" font-family="system-ui,sans-serif">2. Streaming SHA-256</text>
<text x="366" y="242" fill="#e2f6f5" font-size="14" font-family="system-ui,sans-serif">3. Exact canonical record</text>
<text x="366" y="273" fill="#b8e3de" font-size="12" font-family="system-ui,sans-serif">No optimiser update or source execution</text>
<path d="M616 203H645" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="656" y="96" width="274" height="222" rx="14" fill="#fff" stroke="#9fb9c4"/>
<text x="674" y="126" fill="#203247" font-size="17" font-weight="700" font-family="system-ui,sans-serif">Compare `.publication`</text>
<text x="674" y="165" fill="#275951" font-size="14" font-family="system-ui,sans-serif">Match: byte integrity verified</text>
<text x="674" y="205" fill="#99513d" font-size="14" font-family="system-ui,sans-serif">Mismatch: reject</text>
<text x="674" y="245" fill="#99513d" font-size="14" font-family="system-ui,sans-serif">Missing record: reject</text>
<text x="674" y="287" fill="#415a6b" font-size="12" font-family="system-ui,sans-serif">Authentication requires separate review</text>
<rect x="29" y="345" width="901" height="53" rx="10" fill="#dcf4ef" stroke="#a2d0c6"/>
<text x="48" y="369" fill="#15534c" font-weight="700" font-size="15" font-family="system-ui,sans-serif">Before a real resume, independently check the model codec, approved dataset and training settings.</text>
<text x="48" y="387" fill="#275951" font-size="12" font-family="system-ui,sans-serif">Unsigned digests do not establish publisher identity or model correctness.</text>
</svg>
