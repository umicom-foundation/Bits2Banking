<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Independent numerical audit of native rotary attention training</title><desc id="desc">One set of feature vectors and query/key weights flows into two paths: a Framework training tape which applies one backward and SGD step, and a test-only independent causal attention loss function which perturbs each weight. The two gradients and starting/final losses must match within published tolerances.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#1c607a"/></marker></defs><rect x="300" y="18" width="400" height="68" rx="12" fill="#e2f3fa" stroke="#24607d" stroke-width="3"/><text x="500" y="48" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle" fill="#143950">One fixed teaching problem</text><text x="500" y="72" font-family="Arial" font-size="15" text-anchor="middle" fill="#143950">3 rows · 2 heads · 32 trainable weights</text><path d="M460 86 V120 H225 V142 M540 86 V120 H775 V142" fill="none" stroke="#1c607a" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="142" width="350" height="78" rx="13" fill="#e4f4ec" stroke="#0a745f" stroke-width="3"/><text x="225" y="176" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#124f43">Framework production path</text><text x="225" y="199" font-family="Arial" font-size="15" text-anchor="middle" fill="#124f43">Tape → Backward → SGD</text><rect x="600" y="142" width="350" height="78" rx="13" fill="#fff1dc" stroke="#b0740f" stroke-width="3"/><text x="775" y="176" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#744a0c">Independent test-only path</text><text x="775" y="199" font-family="Arial" font-size="15" text-anchor="middle" fill="#744a0c">Causal loss at w+ε and w−ε</text><path d="M225 220 V280 H500 M775 220 V280 H500" fill="none" stroke="#1c607a" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="280" width="510" height="93" rx="15" fill="#e7edf7" stroke="#3b638b" stroke-width="3"/><text x="500" y="313" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#193b5e">Compare 32 gradients and both losses</text><text x="500" y="343" font-family="Arial" font-size="16" text-anchor="middle" fill="#193b5e">Reject mismatches · report exact evidence</text><text x="500" y="407" font-family="Arial" font-size="14" text-anchor="middle" fill="#516574">No alternate neural engine is installed; the reference lives in a native C23 test.</text></svg>