<?xml version="1.0" encoding="UTF-8"?>
<!-- Umicom Foundation | Sammy Hegab | MIT | Diagram uses established Umicom palette, not substitute branding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title description">
  <title id="title">Umicom Framework and LLM module responsibilities</title>
  <desc id="description">Reusable training generation checkpointing and metrics live in Umicom Framework. The Umicom LLM module only loads approved input and presents benchmark results.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087784"/></marker></defs>
  <rect width="1000" height="365" fill="#f3f7fb" rx="18"/>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247} .title{font-size:25px;font-weight:750} .label{font-size:19px;font-weight:650} .sub{font-size:14px} .chip{font-size:16px;font-weight:700;fill:#fff} .line{stroke:#087784;stroke-width:4;marker-end:url(#arrow);fill:none}</style>
<text class="title" x="35" y="47">Keep reusable mathematics inside Umicom Framework</text>
<rect x="40" y="89" width="555" height="224" rx="14" fill="#203247"/>
<text x="317" y="128" text-anchor="middle" style="fill:#fff;font-family:Segoe UI,Arial;font-size:24px;font-weight:750">Umicom Framework (C23)</text>
<rect x="62" y="160" width="143" height="79" rx="10" fill="#e3f5f4"/><text x="133" y="191" text-anchor="middle" class="label">Decoder</text><text x="133" y="217" class="sub" text-anchor="middle">Checkpoint</text>
<rect x="224" y="160" width="153" height="79" rx="10" fill="#e3f5f4"/><text x="300" y="191" text-anchor="middle" class="label">Generate</text><text x="300" y="217" class="sub" text-anchor="middle">Byte sampling</text>
<rect x="398" y="160" width="171" height="79" rx="10" fill="#e3f5f4"/><text x="483" y="191" text-anchor="middle" class="label">Benchmark</text><text x="483" y="217" class="sub" text-anchor="middle">Score agreement</text>
<path class="line" d="M595 206H650"/>
<rect x="661" y="89" width="298" height="224" rx="14" fill="#e3f5f4" stroke="#087784" stroke-width="3"/>
<text x="810" y="129" text-anchor="middle" class="label">Umicom LLM application</text>
<text x="810" y="174" text-anchor="middle" class="sub">Choose reviewed cases</text>
<text x="810" y="201" text-anchor="middle" class="sub">Display scores and warnings</text>
<text x="810" y="228" text-anchor="middle" class="sub">Never execute generated C23</text>
<text x="500" y="345" text-anchor="middle" style="font-family:Segoe UI,Arial;font-size:15px;fill:#203247">Reusable engine ↔ thin product composition · Shared ABI · No duplicate model implementation</text>
</svg>