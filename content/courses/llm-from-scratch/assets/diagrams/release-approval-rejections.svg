<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title description">
  <title id="title">Native LLM release approval uses a failure-atomic decision</title>
  <desc id="description">Publisher trust and checkpoint evidence must pass first. The verifier then checks that the number, order, evaluation time and exact SHA-256 equal the separately approved values. Only a complete match produces success JSON; any failed check produces no success JSON.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#0b7d83" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1120" height="450" rx="23" fill="#eaf2f6"/>
  <rect x="25" y="25" width="1070" height="70" rx="15" fill="#203247"/>
  <text x="49" y="56" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">A proposed release passes only when every required check passes</text>
  <text x="49" y="79" fill="#d6e7ea" font-family="Arial,sans-serif" font-size="15">No partially verified set may be labelled as approved.</text>
  <rect x="52" y="134" width="280" height="135" rx="14" fill="white" stroke="#8daab9" stroke-width="2"/>
  <text x="74" y="164" fill="#203247" font-family="Arial,sans-serif" font-size="19" font-weight="700">1 · Recheck signatures</text>
  <text x="74" y="197" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Publisher policy is current</text>
  <text x="74" y="223" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Every publication verified</text>
  <path d="M332 202 H393" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="397" y="134" width="313" height="135" rx="14" fill="white" stroke="#0b7d83" stroke-width="3"/>
  <text x="420" y="164" fill="#203247" font-family="Arial,sans-serif" font-size="19" font-weight="700">2 · Match reviewer pin</text>
  <text x="420" y="197" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Same count, order and time</text>
  <text x="420" y="223" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Exact expected batch SHA-256</text>
  <path d="M710 202 H775" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="779" y="134" width="287" height="135" rx="14" fill="#ddf4e9" stroke="#16845c" stroke-width="2"/>
  <text x="801" y="166" fill="#19553f" font-family="Arial,sans-serif" font-size="19" font-weight="700">3 · Emit success JSON</text>
  <text x="801" y="199" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Approved exact batch</text>
  <text x="801" y="227" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Unchanged published evidence</text>
  <path d="M545 270 V306" stroke="#b14646" stroke-width="3" fill="none"/>
  <rect x="243" y="311" width="629" height="99" rx="14" fill="#fae9e7" stroke="#b14646" stroke-width="2"/>
  <text x="269" y="343" fill="#853b3b" font-family="Arial,sans-serif" font-size="19" font-weight="700">Any failure → reject the entire release</text>
  <text x="269" y="375" fill="#653c3c" font-family="Arial,sans-serif" font-size="16">Caller outputs remain unchanged; no false success receipt.</text>
  <text x="269" y="396" fill="#653c3c" font-family="Arial,sans-serif" font-size="14">Approval does not attest to a secure host, trusted signing time or model quality.</text>
</svg>
