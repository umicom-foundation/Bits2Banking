<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Autoregressive generation</title><desc id="ddesc">Predict a token, append it to the context and repeat without modifying the weights.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="28" y="107" width="262" height="125" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="159.0" y="165.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Current context</text>
<text x="159.0" y="193.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">previous tokens</text>
<rect x="357" y="107" width="250" height="125" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="482.0" y="165.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Decoder logits</text>
<text x="482.0" y="193.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">next-token scores</text>
<rect x="673" y="107" width="240" height="125" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="793.0" y="165.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Sample + append</text>
<text x="793.0" y="193.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">repeat until limit</text>
<path d="M291 170 L356 170" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M608 170 L671 170" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="469" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">Generation reads trained parameters. It does not train them.</text>
</svg>
