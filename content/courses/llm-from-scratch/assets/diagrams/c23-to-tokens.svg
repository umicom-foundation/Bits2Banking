<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-label="How a C23 source file becomes training data">
<title>How a C23 source file becomes training data</title>
<style>
 text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}
 .title{font-size:23px;font-weight:750}.note{font-size:15px;fill:#597183}
 .label{font-size:16px;font-weight:700}.small{font-size:13px}
 .box{fill:#fff;stroke:#b9cdd8;stroke-width:2}.soft{fill:#ecf7f7;stroke:#53b2b8;stroke-width:2}
 .navy{fill:#203247}.navyText{fill:#fff}.accent{fill:#087784}.white{fill:#fff}
 .arr{stroke:#087784;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1000" height="365" rx="22" fill="#f5f9fb"/>
<text x="42" y="54" class="title">How a C23 source file becomes training data</text>
<rect x="45" y="122" width="180" height="103" rx="13" class="box"/><text x="135.0" y="164" class="label" text-anchor="middle">C23 source</text><text x="135.0" y="190" class="small" text-anchor="middle">CanTransfer(...)</text>
<rect x="295" y="122" width="180" height="103" rx="13" class="box"/><text x="385.0" y="164" class="label" text-anchor="middle">UTF-8 bytes</text><text x="385.0" y="190" class="small" text-anchor="middle">67  97  110</text>
<rect x="545" y="122" width="180" height="103" rx="13" class="box"/><text x="635.0" y="164" class="label" text-anchor="middle">Token IDs</text><text x="635.0" y="190" class="small" text-anchor="middle">71  101  114</text>
<rect x="795" y="122" width="180" height="103" rx="13" class="soft"/><text x="885.0" y="164" class="label" text-anchor="middle">Windows</text><text x="885.0" y="190" class="small" text-anchor="middle">Input → target</text>
<path class="arr" d="M227 175 L290 175 m-10 -7 l10 7 l-10 7"/>
<path class="arr" d="M477 175 L540 175 m-10 -7 l10 7 l-10 7"/>
<path class="arr" d="M727 175 L790 175 m-10 -7 l10 7 l-10 7"/>
<text x="500" y="296" text-anchor="middle" class="note">Model learns next-byte predictions, not proof of safe banking logic.</text></svg>
