<svg xmlns="http://www.w3.org/2000/svg" width="940" height="368" viewBox="0 0 940 368" role="img" aria-labelledby="title description">
  <title id="title">SHA-256 source snapshot identity</title>
  <desc id="description">Reviewed manifest and imported train/evaluation bytes feed immutable corpora. Each corpus has a SHA-256 digest. Ordered metadata and hashes form one dataset SHA-256.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9Z" fill="#087784"/>
    </marker>
  </defs>
  <rect width="940" height="368" rx="20" fill="#f2f8fa" stroke="#d4e4e8"/>
  <text x="32" y="42" font-family="system-ui,sans-serif" fill="#203247" font-size="22" font-weight="700">Identify the exact source bytes used for training</text>
  <rect x="33" y="74" width="241" height="227" rx="13" fill="#ffffff" stroke="#99bbc1" stroke-width="1.5"/>
  <text x="53" y="103" font-size="17" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">Reviewed dataset</text>
  <text x="53" y="133" font-size="14" fill="#344c5d" font-family="monospace">train train/account.c</text>
  <text x="53" y="161" font-size="14" fill="#344c5d" font-family="monospace">train train/notes.c</text>
  <text x="53" y="189" font-size="14" fill="#344c5d" font-family="monospace">eval  eval/payment.c</text>
  <path d="M53 211H255" stroke="#e1edf1"/>
  <text x="53" y="239" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">Load each file once into an</text>
  <text x="53" y="261" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">immutable C23 corpus.</text>
  <path d="M275 186H322" stroke="#087784" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="332" y="74" width="267" height="227" rx="13" fill="#ffffff" stroke="#99bbc1" stroke-width="1.5"/>
  <text x="354" y="103" font-size="17" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">Hash owned source bytes</text>
  <text x="354" y="137" font-size="14" fill="#087784" font-family="monospace">SHA256(corpus 1)</text>
  <text x="354" y="167" font-size="14" fill="#087784" font-family="monospace">SHA256(corpus 2)</text>
  <text x="354" y="197" font-size="14" fill="#087784" font-family="monospace">SHA256(corpus 3)</text>
  <path d="M354 211H574" stroke="#e1edf1"/>
  <text x="354" y="240" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">No second file read.</text>
  <text x="354" y="262" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">No FNV-only identity.</text>
  <path d="M600 186H647" stroke="#087784" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="656" y="74" width="252" height="227" rx="13" fill="#203247" stroke="#203247"/>
  <text x="676" y="103" font-size="17" font-weight="700" fill="#ffffff" font-family="system-ui,sans-serif">One dataset identity</text>
  <text x="676" y="143" font-size="14" fill="#cce8eb" font-family="monospace">partition + path</text>
  <text x="676" y="171" font-size="14" fill="#cce8eb" font-family="monospace">+ byte count</text>
  <text x="676" y="199" font-size="14" fill="#cce8eb" font-family="monospace">+ source SHA-256</text>
  <path d="M677 214H886" stroke="#557482"/>
  <text x="676" y="246" font-size="17" fill="#6de0d4" font-family="system-ui,sans-serif" font-weight="700">SHA-256 snapshot</text>
  <text x="32" y="340" font-size="14" fill="#4e6470" font-family="system-ui,sans-serif">The digest identifies the supplied immutable bytes; it does not authenticate their author or establish model correctness.</text>
</svg>
