<svg xmlns="http://www.w3.org/2000/svg" width="940" height="404" viewBox="0 0 940 404" role="img" aria-labelledby="title description">
  <title id="title">Strict source-locked AdamW continuation</title>
  <desc id="description">A combined checkpoint and three independently checked companion records must all pass before the optimiser can continue.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9Z" fill="#087784"/></marker>
  </defs>
  <rect width="940" height="404" rx="20" fill="#f2f8fa" stroke="#d4e4e8"/>
  <text x="29" y="43" font-family="system-ui,sans-serif" fill="#203247" font-size="23" font-weight="700">Verify before the next AdamW update</text>
  <rect x="31" y="72" width="247" height="56" rx="9" fill="#203247"/>
  <text x="50" y="98" font-size="16" font-weight="700" font-family="system-ui,sans-serif" fill="#fff">Combined checkpoint</text>
  <text x="50" y="117" font-size="12" font-family="system-ui,sans-serif" fill="#c1d9df">Weights + optimiser moments</text>
  <rect x="31" y="147" width="247" height="56" rx="9" fill="#fff" stroke="#99bbc1"/>
  <text x="50" y="174" font-size="16" font-weight="700" font-family="system-ui,sans-serif" fill="#203247">.clip-policy</text>
  <text x="50" y="192" font-size="12" font-family="system-ui,sans-serif" fill="#344c5d">Clipping threshold and batches</text>
  <rect x="31" y="221" width="247" height="56" rx="9" fill="#fff" stroke="#99bbc1"/>
  <text x="50" y="248" font-size="16" font-weight="700" font-family="system-ui,sans-serif" fill="#203247">.training-lock</text>
  <text x="50" y="266" font-size="12" font-family="system-ui,sans-serif" fill="#344c5d">Schedule, seeds, AdamW settings</text>
  <rect x="31" y="295" width="247" height="56" rx="9" fill="#fff" stroke="#99bbc1"/>
  <text x="50" y="322" font-size="16" font-weight="700" font-family="system-ui,sans-serif" fill="#203247">.source-lock</text>
  <text x="50" y="340" font-size="12" font-family="system-ui,sans-serif" fill="#344c5d">Imported source bytes SHA-256</text>
  <path d="M279 100H362M279 175H362M279 249H362M279 323H362" stroke="#087784" stroke-width="2.4"/>
  <path d="M362 100V323" stroke="#087784" stroke-width="2.4"/>
  <path d="M362 211H429" stroke="#087784" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="441" y="142" width="213" height="139" rx="13" fill="#fff" stroke="#99bbc1" stroke-width="1.5"/>
  <text x="459" y="176" font-size="17" fill="#203247" font-family="system-ui,sans-serif" font-weight="700">Strict verification</text>
  <text x="459" y="203" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">All records present</text>
  <text x="459" y="228" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">All digests match</text>
  <text x="459" y="253" font-size="14" fill="#344c5d" font-family="system-ui,sans-serif">No optimiser update yet</text>
  <path d="M655 211H721" stroke="#087784" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="734" y="142" width="176" height="139" rx="13" fill="#203247"/>
  <text x="754" y="181" font-size="18" fill="#6de0d4" font-family="system-ui,sans-serif" font-weight="700">PASS</text>
  <text x="754" y="205" font-size="15" fill="#fff" font-family="system-ui,sans-serif">Resume at the</text>
  <text x="754" y="228" font-size="15" fill="#fff" font-family="system-ui,sans-serif">next absolute step</text>
  <text x="754" y="258" font-size="13" fill="#c1d9df" font-family="system-ui,sans-serif">Or fail closed</text>
  <text x="29" y="385" font-size="13" fill="#4e6470" font-family="system-ui,sans-serif">Three unsigned companions provide consistency evidence, not authorship, security attestation or an atomic multi-file commit.</text>
</svg>
