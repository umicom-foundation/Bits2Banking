<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Clip-policy companion record checked before native AdamW resume</title>
<desc id="desc">A combined checkpoint and separate policy record are validated. The Framework checks the exact checkpoint SHA-256 and clipping threshold, batch count and microbatch count before resuming training. Any mismatch is rejected.</desc>
<rect width="1000" height="350" rx="18" fill="#142b40"/>
<text x="38" y="47" font-family="system-ui, sans-serif" font-size="27" fill="#f4f7fa" font-weight="700">Checkpoint integrity is not enough for reproducible resume</text>
<g font-family="system-ui, sans-serif">
<rect x="36" y="90" width="280" height="120" rx="13" fill="#eaf4f7"/>
<text x="54" y="122" font-size="19" font-weight="700" fill="#173346">combined.umi</text>
<text x="54" y="148" font-size="15" fill="#173346">model weights · AdamW moments</text>
<text x="54" y="175" font-size="15" fill="#173346">completed optimiser steps</text>
<rect x="36" y="225" width="280" height="90" rx="13" fill="#d6eeeb"/>
<text x="54" y="257" font-size="18" font-weight="700" fill="#173346">combined.umi.clip-policy</text>
<text x="54" y="283" font-size="14" fill="#173346">threshold bits · batch policy · SHA-256</text>
<rect x="408" y="133" width="234" height="121" rx="13" fill="#b6e2dd"/>
<text x="425" y="164" font-size="18" font-weight="700" fill="#173346">Framework verification</text>
<text x="425" y="192" font-size="15" fill="#173346">exact bytes + fields</text>
<text x="425" y="220" font-size="15" fill="#173346">no implicit fallback</text>
<rect x="735" y="102" width="228" height="84" rx="13" fill="#d5eed9"/>
<text x="750" y="136" font-size="18" font-weight="700" fill="#173346">Matches</text>
<text x="750" y="161" font-size="15" fill="#173346">resume approved steps</text>
<rect x="735" y="211" width="228" height="84" rx="13" fill="#f7d9dd"/>
<text x="750" y="244" font-size="18" font-weight="700" fill="#6c2431">Mismatch / missing</text>
<text x="750" y="271" font-size="15" fill="#6c2431">reject before training</text>
<path d="M318 150h88m-10-7 10 7-10 7M318 269h43v-62h45m-10-7 10 7-10 7M643 160h90m-10-7 10 7-10 7M643 223h90m-10-7 10 7-10 7" stroke="#67dbc8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
</g></svg>
