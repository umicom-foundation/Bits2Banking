<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Quality decision gates for two decoder audits</title>
<desc id="desc">A sequence of gates checks the same dataset and plan, valid metrics, sample size and separate loss/accuracy thresholds. An assessment pass is not the same as independent signed release approval.</desc>
<rect width="1000" height="480" rx="20" fill="#eef6f6"/>
<text x="45" y="61" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#203247">Every condition must hold before a quality pass</text>
<g font-family="Arial,sans-serif" font-size="17" font-weight="bold">
<rect x="42" y="120" width="215" height="115" rx="11" fill="#203247"/>
<text x="149" y="155" text-anchor="middle" fill="#fff">Comparable samples</text>
<text x="149" y="181" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">Same dataset, plan</text>
<text x="149" y="207" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">and token count</text>
<rect x="294" y="120" width="215" height="115" rx="11" fill="#203247"/>
<text x="401" y="155" text-anchor="middle" fill="#fff">Valid metrics</text>
<text x="401" y="181" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">Finite values</text>
<text x="401" y="207" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">Consistent top-k counts</text>
<rect x="546" y="120" width="215" height="115" rx="11" fill="#203247"/>
<text x="653" y="155" text-anchor="middle" fill="#fff">Policy thresholds</text>
<text x="653" y="181" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">Strict loss reduction</text>
<text x="653" y="207" text-anchor="middle" fill="#c8e6e9" font-size="15" font-weight="normal">Top-1 / top-5 safeguards</text>
<rect x="798" y="120" width="160" height="115" rx="11" fill="#0a7e83"/>
<text x="878" y="155" text-anchor="middle" fill="#fff">Decision</text>
<text x="878" y="183" text-anchor="middle" fill="#fff" font-size="15" font-weight="normal">PASS or</text>
<text x="878" y="208" text-anchor="middle" fill="#fff" font-size="15" font-weight="normal">NOT PASSED</text>
</g>
<path d="M259 178 H289 M511 178 H541 M763 178 H793" stroke="#0a7e83" stroke-width="4"/>
<path d="M281 169 L293 178 281 187 M533 169 L545 178 533 187 M785 169 L797 178 785 187" fill="none" stroke="#0a7e83" stroke-width="3"/>
<rect x="42" y="284" width="916" height="102" rx="12" fill="white" stroke="#bdcdd2" stroke-width="2"/>
<text x="72" y="316" font-size="19" font-family="Arial,sans-serif" font-weight="bold" fill="#203247">Separate decision: independently reviewed release</text>
<text x="72" y="346" font-size="17" font-family="Arial,sans-serif" fill="#426778">A quality pass does not authenticate checkpoints, secure training data or approve a release.</text>
<text x="46" y="442" font-size="14" font-family="Arial,sans-serif" fill="#426778">Bits to Banking · Native C23 regression testing</text>
</svg>
