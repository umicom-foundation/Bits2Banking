<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Reproducible checkpoint lifecycle</title><desc id="ddesc">A combined checkpoint retains model weights, AdamW first and second moments, optimiser steps and checksum before verified restoration.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="34" y="95" width="250" height="138" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="159.0" y="160.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Trained model</text>
<text x="159.0" y="188.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">weights + completed step</text>
<rect x="350" y="95" width="250" height="138" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="475.0" y="160.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Combined checkpoint</text>
<text x="475.0" y="188.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">weights · moments · metadata</text>
<rect x="667" y="95" width="237" height="138" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="785.5" y="160.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Resume training</text>
<text x="785.5" y="188.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">same sources and schedule</text>
<path d="M284 164 L348 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M600 164 L665 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#526879">Integrity checks are not a cryptographic signature or source-provenance proof.</text>
</svg>
