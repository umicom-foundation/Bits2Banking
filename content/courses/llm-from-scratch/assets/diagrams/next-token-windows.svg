<rect x="145" y="225" width="130" height="75" rx="13" class="soft"/><text x="210.0" y="267" class="label" text-anchor="middle">A</text><text x="210.0" y="293" class="small" text-anchor="middle">target</text>
<path class="arr" d="M210 189 L210 220 m-10 -7 l10 7 l-10 7"/>
<rect x="400" y="112" width="130" height="75" rx="13" class="box"/><text x="465.0" y="154" class="label" text-anchor="middle">A</text><text x="465.0" y="180" class="small" text-anchor="middle">input</text>
<rect x="400" y="225" width="130" height="75" rx="13" class="soft"/><text x="465.0" y="267" class="label" text-anchor="middle">N</text><text x="465.0" y="293" class="small" text-anchor="middle">target</text>
<path class="arr" d="M465 189 L465 220 m-10 -7 l10 7 l-10 7"/>
<rect x="655" y="112" width="130" height="75" rx="13" class="box"/><text x="720.0" y="154" class="label" text-anchor="middle">N</text><text x="720.0" y="180" class="small" text-anchor="middle">input</text>
