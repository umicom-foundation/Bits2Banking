<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Umicom Windows release trust pipeline</title>
<desc id="desc">Reviewed C23 source and dependency checks lead to clean build and complete tests, then Authenticode publisher signing and independent security vendor review. Publisher signing does not bypass antivirus scanning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087784"/></marker><style>.box{fill:#fff;stroke:#9fb4c5;stroke-width:2}.h{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#203247}.s{font:16px 'Segoe UI',Arial,sans-serif;fill:#405565}.path{fill:none;stroke:#087784;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="350" rx="22" fill="#eaf1f5"/><text x="35" y="43" class="h" font-size="28">Signing belongs at the end of a verified release pipeline</text>
<g><rect x="36" y="80" width="197" height="139" rx="16" class="box"/><text x="56" y="116" class="h">Review source</text><text x="56" y="147" class="s">Dependencies, licences</text><text x="56" y="173" class="s">and build provenance</text><text x="56" y="199" class="s">No unknown binaries</text></g>
<path class="path" d="M234 148H255"/>
<g><rect x="261" y="80" width="205" height="139" rx="16" class="box"/><text x="283" y="116" class="h">Qualify Release</text><text x="283" y="147" class="s">Clean host, full tests</text><text x="283" y="173" class="s">Resolve AV findings</text><text x="283" y="199" class="s">Stop on blockers</text></g>
<path class="path" d="M467 148H489"/>
<g><rect x="495" y="80" width="207" height="139" rx="16" class="box"/><text x="516" y="116" class="h">Sign &amp; timestamp</text><text x="516" y="147" class="s">Verified publisher</text><text x="516" y="173" class="s">SHA-256 / RFC 3161</text><text x="516" y="199" class="s">Verify signature</text></g>
<path class="path" d="M702 148H724"/>
<g><rect x="731" y="80" width="233" height="139" rx="16" fill="#203247"/><text x="750" y="116" fill="#fff" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Independent review</text><text x="750" y="147" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="16">Security vendor decision</text><text x="750" y="173" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="16">Signed-file SHA-256</text><text x="750" y="199" fill="#dbe9f3" font-family="Segoe UI,Arial" font-size="16">Verified release manifest</text></g>
<rect x="125" y="254" width="750" height="56" rx="12" fill="#f4dddc"/><text x="500" y="279" fill="#6b262b" font-family="Segoe UI,Arial" font-weight="700" font-size="18" text-anchor="middle">A publisher certificate is not an antivirus allowlist.</text><text x="500" y="299" fill="#6b262b" font-family="Segoe UI,Arial" font-size="16" text-anchor="middle">Never sign a quarantined test executable merely to get CTest running.</text>
</svg>
