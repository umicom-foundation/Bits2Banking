<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" role="img" aria-labelledby="gate-title gate-desc">
  <title id="gate-title">Native LLM release verification gates</title>
  <desc id="gate-desc">Five release checks progress from C23 contracts through cryptographic integrity, complete Framework integration, Windows platform validation, and independent release approval. A failed or unverified gate stops publication.</desc>
  <rect width="1160" height="390" rx="22" fill="#12273c"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="45" y="51" font-size="28" font-weight="700" fill="#f5f9fb">Release validation is a sequence of gates</text>
    <text x="45" y="82" font-size="16" fill="#b8d2db">Each stage checks something the preceding stage cannot establish.</text>
    <g fill="#25465c" stroke="#73bbbe" stroke-width="1.7">
      <rect x="41" y="132" width="202" height="123" rx="13"/>
      <rect x="266" y="132" width="202" height="123" rx="13"/>
      <rect x="491" y="132" width="202" height="123" rx="13"/>
      <rect x="716" y="132" width="202" height="123" rx="13"/>
      <rect x="941" y="132" width="179" height="123" rx="13" fill="#1b625c" stroke="#8de1c9"/>
    </g>
    <g fill="#f4ffff" font-size="18" font-weight="700">
      <text x="57" y="165">01 · C23</text><text x="57" y="191">contracts</text>
      <text x="282" y="165">02 · Ed25519</text><text x="282" y="191">&amp; SHA-256</text>
      <text x="507" y="165">03 · Framework</text><text x="507" y="191">integration</text>
      <text x="732" y="165">04 · Windows</text><text x="732" y="191">build &amp; tests</text>
      <text x="957" y="165">05 · Independent</text><text x="957" y="191">release review</text>
    </g>
    <g fill="#cfe4e7" font-size="13">
      <text x="57" y="223">Validation and</text><text x="57" y="242">atomic rejection</text>
      <text x="282" y="223">Trusted keys and</text><text x="282" y="242">unchanged bytes</text>
      <text x="507" y="223">Real library and</text><text x="507" y="242">dependent targets</text>
      <text x="732" y="223">Intended toolchain,</text><text x="732" y="242">runtime and CTest</text>
      <text x="957" y="223">Provenance, rights</text><text x="957" y="242">and security</text>
    </g>
    <g stroke="#77d8d0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M246 194 H262 M255 188 L263 194 L255 200"/>
      <path d="M471 194 H487 M480 188 L488 194 L480 200"/>
      <path d="M696 194 H712 M705 188 L713 194 L705 200"/>
      <path d="M921 194 H937 M930 188 L938 194 L930 200"/>
    </g>
    <rect x="41" y="285" width="1078" height="51" rx="12" fill="#663b49" stroke="#edb1aa" stroke-width="1.5"/>
    <text x="62" y="318" font-size="19" font-weight="700" fill="#fff4f1">STOP if any required gate fails, is skipped, or remains unverified.</text>
    <text x="44" y="361" font-size="13" fill="#b9d0da">Umicom Foundation · Optional signing support does not replace security review or antivirus incident resolution.</text>
  </g>
</svg>
