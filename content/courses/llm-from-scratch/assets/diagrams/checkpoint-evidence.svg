<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-label="Resume a training run with the right saved state">
<title>Resume a training run with the right saved state</title>
<style>
 text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}
 .title{font-size:23px;font-weight:750}.note{font-size:15px;fill:#597183}
 .label{font-size:16px;font-weight:700}.small{font-size:13px}
 .box{fill:#fff;stroke:#b9cdd8;stroke-width:2}.soft{fill:#ecf7f7;stroke:#53b2b8;stroke-width:2}
 .navy{fill:#203247}.navyText{fill:#fff}.accent{fill:#087784}.white{fill:#fff}
 .arr{stroke:#087784;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1000" height="365" rx="22" fill="#f5f9fb"/>
<text x="42" y="54" class="title">Resume a training run with the right saved state</text>
<rect x="55" y="112" width="260" height="112" rx="13" class="box"/><text x="185.0" y="154" class="label" text-anchor="middle">Completed step 3</text><text x="185.0" y="180" class="small" text-anchor="middle">weights + AdamW moments</text>
<rect x="370" y="112" width="260" height="112" rx="13" class="soft"/><text x="500.0" y="154" class="label" text-anchor="middle">Verified checkpoint</text><text x="500.0" y="180" class="small" text-anchor="middle">parameters · step · metadata</text>
<rect x="685" y="112" width="260" height="112" rx="13" class="box"/><text x="815.0" y="154" class="label" text-anchor="middle">Continue step 4</text><text x="815.0" y="180" class="small" text-anchor="middle">same plan and data</text>
<path class="arr" d="M318 169 L362 169 m-10 -7 l10 7 l-10 7"/>
<path class="arr" d="M632 169 L677 169 m-10 -7 l10 7 l-10 7"/>
<text x="500" y="294" text-anchor="middle" class="note">Restoring weights without AdamW moments changes the next update.</text></svg>
