<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">From reviewed plan through accumulated clipping to one AdamW update</title>
<desc id="desc">A strict native plan supplies the maximum gradient norm. Microbatch gradients are combined first, then a global norm and clipping factor are calculated, and AdamW applies a single update.</desc>
<rect width="1000" height="340" rx="18" fill="#142b40"/>
<text x="40" y="52" font-family="system-ui, sans-serif" font-size="28" fill="#f4f7fa" font-weight="700">A reviewed gradient-clipping policy</text>
<text x="40" y="82" font-family="system-ui, sans-serif" font-size="15" fill="#b6cdd4">The Framework applies one global clip after microbatch reduction.</text>
<g font-family="system-ui, sans-serif">
<rect x="36" y="124" width="197" height="133" rx="14" fill="#eaf4f7"/>
<text x="52" y="154" font-size="17" font-weight="700" fill="#163246">1. Plan file</text>
<text x="52" y="188" font-size="15" fill="#163246">maximum norm = 5</text>
<text x="52" y="214" font-size="14" fill="#3c5362">strict C23 parser</text>
<text x="52" y="235" font-size="14" fill="#3c5362">reviewed settings</text>
<rect x="272" y="124" width="202" height="133" rx="14" fill="#d8edeb"/>
<text x="287" y="154" font-size="17" font-weight="700" fill="#163246">2. Reduce</text>
<text x="287" y="188" font-size="15" fill="#163246">[6, 0] + [0, 8]</text>
<text x="287" y="216" font-size="15" fill="#163246">weighted: [3, 4]</text>
<rect x="513" y="124" width="206" height="133" rx="14" fill="#b6e2dd"/>
<text x="529" y="154" font-size="17" font-weight="700" fill="#163246">3. Global clip</text>
<text x="529" y="188" font-size="15" fill="#163246">norm = 5</text>
<text x="529" y="215" font-size="15" fill="#163246">scale = min(1, T/5)</text>
<rect x="758" y="124" width="207" height="133" rx="14" fill="#faf0d4"/>
<text x="773" y="154" font-size="17" font-weight="700" fill="#163246">4. AdamW</text>
<text x="773" y="188" font-size="15" fill="#163246">one moment update</text>
<text x="773" y="214" font-size="15" fill="#163246">one weight update</text>
<path d="M235 192h33m-8-7 8 7-8 7M475 192h35m-8-7 8 7-8 7M720 192h34m-8-7 8 7-8 7" fill="none" stroke="#67dbc8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="307" font-size="14" fill="#b6cdd4">Clipping controls the size of a gradient; it does not establish model quality.</text>
</g></svg>
