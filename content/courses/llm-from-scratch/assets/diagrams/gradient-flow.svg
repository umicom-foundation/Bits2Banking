<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Forward propagation and backward gradients</title><desc id="ddesc">Top row shows parameter predictions and error; lower row shows backward gradients returning to parameters.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="48" y="75" width="244" height="88" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="170.0" y="115.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Parameters</text>
<text x="170.0" y="143.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">current weights</text>
<rect x="342" y="75" width="252" height="88" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="468.0" y="115.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Predictions</text>
<text x="468.0" y="143.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">decoder logits</text>
<rect x="644" y="75" width="244" height="88" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="766.0" y="115.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Loss</text>
<text x="766.0" y="143.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">difference from target</text>
<path d="M292 118 L340 118" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M594 118 L642 118" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M759 164 L759 242" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M759 242 L227 242" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M227 242 L227 164" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="483" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#087784">BACKPROPAGATION — gradient information flows back</text>
<text x="478" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">The optimiser uses these gradients to change the weights.</text>
</svg>
