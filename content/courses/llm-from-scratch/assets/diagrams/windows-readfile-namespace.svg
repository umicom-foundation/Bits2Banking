<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
<title id="t">Windows ReadFile and C23 private helper name collision</title>
<desc id="d">A Windows API declaration conflicts with an unrelated private helper named ReadFile. The private helper is renamed ReadAttestationFileBytes while its file-reading behaviour is preserved.</desc>
<rect width="1000" height="380" rx="22" fill="#152b44"/>
<text x="42" y="53" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">One translation unit · two incompatible declarations</text>
<rect x="42" y="87" width="420" height="107" rx="14" fill="#25425e" stroke="#85b9da" stroke-width="2"/>
<text x="67" y="122" fill="#e4f3ff" font-family="Arial,sans-serif" font-weight="700" font-size="20">Windows fileapi.h</text>
<text x="67" y="155" fill="#b8d8ed" font-family="Consolas,monospace" font-size="17">ReadFile(HANDLE, ..., 5 args)</text>
<rect x="538" y="87" width="420" height="107" rx="14" fill="#25425e" stroke="#85b9da" stroke-width="2"/>
<text x="563" y="122" fill="#e4f3ff" font-family="Arial,sans-serif" font-weight="700" font-size="20">Old private C23 helper</text>
<text x="563" y="155" fill="#b8d8ed" font-family="Consolas,monospace" font-size="17">ReadFile(path, ..., 4 args)</text>
<path d="M462 143 H538" stroke="#ffa69a" stroke-width="4"/>
<circle cx="500" cy="143" r="20" fill="#c74848"/>
<text x="500" y="151" fill="#fff" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="700">×</text>
<text x="500" y="226" fill="#ffd7d2" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Conflicting types: static does not create a separate identifier namespace</text>
<path d="M500 245 V274" stroke="#56d6bd" stroke-width="3"/>
<path d="M491 263 L500 276 L509 263" fill="none" stroke="#56d6bd" stroke-width="3"/>
<rect x="150" y="286" width="700" height="64" rx="12" fill="#12665e" stroke="#56d6bd" stroke-width="2"/>
<text x="500" y="312" text-anchor="middle" fill="#ffffff" font-family="Consolas,monospace" font-size="19">ReadAttestationFileBytes(...)</text>
<text x="500" y="337" text-anchor="middle" fill="#d8fff4" font-family="Arial,sans-serif" font-size="16">Same bounded-file implementation · no public ABI changes</text>
</svg>
