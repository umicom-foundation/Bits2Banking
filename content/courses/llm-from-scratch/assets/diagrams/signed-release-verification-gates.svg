<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Signed native LLM release verification gates</title>
<desc id="desc">First verify independent approval signature and parsed approval, then revalidate publisher trust and every checkpoint, then compare ordered batch SHA-256. Any failure rejects the release; all passing checks produce a JSON receipt.</desc>
<rect width="1120" height="470" rx="22" fill="#142a40"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="52" y="57" font-size="28" font-weight="740" fill="#ffffff">A release passes only when all three gates agree</text>
<text x="52" y="89" font-size="17" fill="#bfd4df">Each gate must succeed. There is no partial success receipt.</text>
<g>
<rect x="50" y="126" width="313" height="185" rx="16" fill="#203c53" stroke="#75d4d9" stroke-width="2"/>
<rect x="402" y="126" width="313" height="185" rx="16" fill="#203c53" stroke="#75d4d9" stroke-width="2"/>
<rect x="754" y="126" width="313" height="185" rx="16" fill="#203c53" stroke="#75d4d9" stroke-width="2"/>
<text x="72" y="166" font-size="20" font-weight="700" fill="#8de6e2">1 · Approval signature</text>
<text x="72" y="204" font-size="17" fill="#fff">Exact approved bytes</text>
<text x="72" y="231" font-size="16" fill="#c8dde7">Trusted external approver key</text>
<text x="72" y="264" font-size="15" fill="#c8dde7">Reject an invalid signature</text>
<text x="424" y="166" font-size="20" font-weight="700" fill="#8de6e2">2 · Publisher checks</text>
<text x="424" y="204" font-size="17" fill="#fff">All signed checkpoints</text>
<text x="424" y="231" font-size="16" fill="#c8dde7">Current approved publisher policy</text>
<text x="424" y="264" font-size="15" fill="#c8dde7">Reject tampering or revocation</text>
<text x="776" y="166" font-size="20" font-weight="700" fill="#8de6e2">3 · Exact batch match</text>
<text x="776" y="204" font-size="17" fill="#fff">Count, ordered SHA-256</text>
<text x="776" y="231" font-size="16" fill="#c8dde7">Approved evaluation instant</text>
<text x="776" y="264" font-size="15" fill="#c8dde7">Reject different order or digest</text>
<path d="M365 214h31 M717 214h31" stroke="#9ce9e7" stroke-width="4"/>
<path d="M383 205l12 9-12 9 M735 205l12 9-12 9" fill="none" stroke="#9ce9e7" stroke-width="4"/>
</g>
<path d="M561 315v48" stroke="#9ce9e7" stroke-width="3"/>
<path d="M550 353l11 12 11-12" fill="none" stroke="#9ce9e7" stroke-width="3"/>
<rect x="278" y="367" width="565" height="62" rx="15" fill="#087784"/>
<text x="560" y="404" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">One verified JSON release receipt</text>
</g>
</svg>
