<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="t d">
<title id="t">Native C23 Windows signing and release validation stages</title>
<desc id="d">Five stages: dependency configuration, Win32-header compilation, link the release approval executable, run cryptographic tests, and review the wider release. The compile-only symbol probe is a dependency of the targeted build.</desc>
<rect width="1080" height="390" rx="24" fill="#152b44"/>
<text x="43" y="51" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Native C23 release verification is a sequence of gates</text>
<g font-family="Arial,sans-serif">
<rect x="38" y="102" width="182" height="119" rx="14" fill="#24415d" stroke="#7fa9c9" stroke-width="2"/>
<text x="129" y="135" fill="#def2ff" font-size="19" text-anchor="middle" font-weight="700">Configure</text><text x="129" y="164" fill="#c5dded" font-size="16" text-anchor="middle">OpenSSL 3</text><text x="129" y="185" fill="#c5dded" font-size="16" text-anchor="middle">CMake + Ninja</text>
<rect x="241" y="102" width="182" height="119" rx="14" fill="#24415d" stroke="#56d6bd" stroke-width="3"/>
<text x="332" y="135" fill="#def2ff" font-size="19" text-anchor="middle" font-weight="700">Compile</text><text x="332" y="164" fill="#c5dded" font-size="16" text-anchor="middle">C23 + windows.h</text><text x="332" y="185" fill="#a8ffed" font-size="15" text-anchor="middle">name collision probe</text>
<rect x="444" y="102" width="182" height="119" rx="14" fill="#24415d" stroke="#7fa9c9" stroke-width="2"/>
<text x="535" y="135" fill="#def2ff" font-size="19" text-anchor="middle" font-weight="700">Link</text><text x="535" y="164" fill="#c5dded" font-size="16" text-anchor="middle">Ed25519 library</text><text x="535" y="185" fill="#c5dded" font-size="16" text-anchor="middle">release approval</text>
<rect x="647" y="102" width="182" height="119" rx="14" fill="#24415d" stroke="#7fa9c9" stroke-width="2"/>
<text x="738" y="135" fill="#def2ff" font-size="19" text-anchor="middle" font-weight="700">CTest</text><text x="738" y="164" fill="#c5dded" font-size="16" text-anchor="middle">signatures</text><text x="738" y="185" fill="#c5dded" font-size="16" text-anchor="middle">approval gates</text>
<rect x="850" y="102" width="192" height="119" rx="14" fill="#24415d" stroke="#7fa9c9" stroke-width="2"/>
<text x="946" y="135" fill="#def2ff" font-size="19" text-anchor="middle" font-weight="700">Review</text><text x="946" y="164" fill="#c5dded" font-size="16" text-anchor="middle">full Windows build</text><text x="946" y="185" fill="#c5dded" font-size="16" text-anchor="middle">security posture</text>
<g stroke="#64cdb8" stroke-width="3" fill="none"><path d="M220 162 H238"/><path d="M423 162 H441"/><path d="M626 162 H644"/><path d="M829 162 H847"/></g>
<rect x="196" y="275" width="686" height="75" rx="14" fill="#12665e" stroke="#64dbc8" stroke-width="2"/>
<text x="539" y="302" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Every gate must pass independently</text>
<text x="539" y="329" text-anchor="middle" fill="#d5fff4" font-size="17">Found OpenSSL ≠ compiled source ≠ successful tests ≠ approved release</text>
</g></svg>
