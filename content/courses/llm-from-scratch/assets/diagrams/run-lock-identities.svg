<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Three identities in the AdamW training run lock</title>
<desc id="desc">Checkpoint bytes, ordered dataset metadata, and deterministic training settings produce independent SHA-256 digests that are compared before resumed optimisation.</desc>
<rect width="1000" height="350" rx="18" fill="#142b40"/>
<text x="35" y="47" font-family="system-ui,sans-serif" font-weight="700" font-size="25" fill="#f8fafc">An exact checkpoint is only one part of an exact training run</text>
<g font-family="system-ui,sans-serif">
<rect x="35" y="90" width="275" height="135" rx="12" fill="#e8f5f7"/>
<text x="54" y="127" font-size="19" font-weight="700" fill="#14334b">Checkpoint bytes</text>
<text x="54" y="156" font-size="16" fill="#14334b">decoder weights + moments</text>
<text x="54" y="184" font-size="16" fill="#14334b">SHA-256</text>
<rect x="362" y="90" width="275" height="135" rx="12" fill="#d4efe9"/>
<text x="381" y="127" font-size="19" font-weight="700" fill="#14334b">Dataset metadata</text>
<text x="381" y="156" font-size="16" fill="#14334b">ordered paths, sizes, FNV</text>
<text x="381" y="184" font-size="16" fill="#14334b">SHA-256 of catalogue</text>
<rect x="690" y="90" width="275" height="135" rx="12" fill="#e8f5f7"/>
<text x="709" y="127" font-size="19" font-weight="700" fill="#14334b">Run settings</text>
<text x="709" y="156" font-size="16" fill="#14334b">seeds, schedule, AdamW, clip</text>
<text x="709" y="184" font-size="16" fill="#14334b">SHA-256</text>
<path d="M173 225V254H500V276 M500 254V276 M827 225V254H500" stroke="#64ded0" stroke-width="4" fill="none"/>
<rect x="341" y="276" width="318" height="55" rx="13" fill="#087d86"/>
<text x="500" y="309" font-size="20" font-weight="700" text-anchor="middle" fill="white">Compare before resume</text>
</g>
</svg>
