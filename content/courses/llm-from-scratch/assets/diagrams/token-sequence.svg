<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Tokeniser: text into numbers</title><desc id="ddesc">An editable visual example showing Umicom source text split into bytes and converted to numerical token IDs.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="30" y="106" width="263" height="120" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="161.5" y="162.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">&quot;Data Server&quot;</text>
<text x="161.5" y="190.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">source-code vocabulary</text>
<rect x="351" y="106" width="244" height="120" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="473.0" y="162.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">D · a · t · a · ...</text>
<text x="473.0" y="190.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">UTF-8 bytes</text>
<rect x="649" y="106" width="263" height="120" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="780.5" y="162.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">72 · 101 · 120 · ...</text>
<text x="780.5" y="190.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">illustrative token IDs</text>
<path d="M294 165 L350 165" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M595 165 L648 165" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="468" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#203247">The decoder reads numbers, not words</text>
<text x="470" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#526879">Exact IDs depend on the tokenizer; inspect the vocabulary before training.</text>
</svg>
