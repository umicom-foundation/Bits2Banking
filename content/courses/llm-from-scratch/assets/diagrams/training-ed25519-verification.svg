<!-- Umicom Foundation | Author: Sammy Hegab | Licence: MIT | Educational SVG diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">Trusted Ed25519 verification for a published LLM checkpoint</title>
<desc id="desc">A trusted public key checks the detached signature against the exact publication marker. If that check passes, the Framework rehashes all four published checkpoint and policy files. Any mismatch means reject.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f8fa"/><stop offset="1" stop-color="#fcfdfd"/></linearGradient>
 <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10" fill="none" stroke="#0c7e85" stroke-width="2.3"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="523" rx="24" fill="url(#sky)" stroke="#b7d7de" stroke-width="2"/>
<text x="45" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#183b4d">Verify publisher authenticity, then validate every file</text>
<text x="45" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#526f7c">The public key must come from a trusted channel — never from the unsigned evidence bundle alone.</text>
<rect x="42" y="131" width="303" height="135" rx="17" fill="#ffffff" stroke="#b0cbd2" stroke-width="2"/>
<text x="61" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1c485b">Trusted public key</text>
<text x="61" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#486571">Independently approved</text>
<text x="61" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52737f">32-byte raw-key identity</text>
<rect x="42" y="296" width="303" height="120" rx="17" fill="#ffffff" stroke="#b0cbd2" stroke-width="2"/>
<text x="61" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1c485b">Signed evidence</text>
<text x="61" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#486571">.publication</text>
<text x="61" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#486571">.publication.ed25519</text>
<path d="M345 200H420M345 350H420V200" fill="none" stroke="#0c7e85" stroke-width="3" marker-end="url(#arr)"/>
<rect x="439" y="167" width="305" height="166" rx="17" fill="#eaf5f3" stroke="#48a19f" stroke-width="2.5"/>
<text x="459" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#16475a">1. Verify Ed25519</text>
<text x="459" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#436573">Authentic signature over</text>
<text x="459" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#436573">exact publication bytes</text>
<rect x="459" y="286" width="260" height="32" rx="9" fill="#ccebe5"/>
<text x="476" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#0c6370">No key = no acceptance</text>
<path d="M744 249H795" fill="none" stroke="#0c7e85" stroke-width="3" marker-end="url(#arr)"/>
<rect x="816" y="167" width="344" height="166" rx="17" fill="#ffffff" stroke="#b0cbd2" stroke-width="2"/>
<text x="836" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#16475a">2. Rehash four files</text>
<text x="836" y="239" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#486571">Checkpoint + optimiser</text>
<text x="836" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#486571">Clipping + training locks</text>
<text x="836" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#486571">Cryptographic source lock</text>
<rect x="43" y="447" width="550" height="46" rx="10" fill="#d9f1e5" stroke="#90d2b1"/>
<text x="64" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#176343">ACCEPT — signature and all file digests match</text>
<rect x="610" y="447" width="550" height="46" rx="10" fill="#fae7e3" stroke="#e5ac9f"/>
<text x="631" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#973c30">REJECT — wrong key, bytes or missing evidence</text>
<text x="44" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#54707b">Both checks must pass. Training quality, dataset consent and host security still require separate review.</text>
</svg>
