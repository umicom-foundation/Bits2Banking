<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title description">
<title id="title">Qualification flow for comparing native generation paths</title>
<desc id="description">One reviewed model, prompt, sampling policy and seed feed the canonical decoder and a KV-cache session. Both generated sequences and predicted-versus-observed work are compared before a measurement record is accepted.</desc>
<rect width="1000" height="400" rx="18" fill="#f6fafc"/>
<text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#203247">Measured inference is accepted only after exact parity</text>
<rect x="205" y="78" width="590" height="57" rx="10" fill="#203247"/>
<text x="244" y="113" font-family="Arial,sans-serif" font-size="18" fill="white">Same decoder + prompt + nucleus policy + seeded RNG</text>
<path d="M500 135v30H275v26 M500 165h225v26" stroke="#5b7688" stroke-width="3" fill="none"/>
<rect x="58" y="190" width="435" height="67" rx="10" fill="#e6f2f7" stroke="#126c83" stroke-width="2"/>
<text x="77" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#15465a">Canonical full-context generator</text>
<text x="77" y="240" font-family="Arial,sans-serif" font-size="15" fill="#15465a">Generated tokens + process CPU observation</text>
<rect x="507" y="190" width="435" height="67" rx="10" fill="#e8f4ef" stroke="#2d8e77" stroke-width="2"/>
<text x="525" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#15465a">Persistent KV-cache session</text>
<text x="525" y="240" font-family="Arial,sans-serif" font-size="15" fill="#15465a">Generated tokens + actual row/rebuild counts</text>
<path d="M275 257v34h225 M725 257v34H500v20" stroke="#5b7688" stroke-width="3" fill="none"/>
<rect x="235" y="311" width="530" height="56" rx="10" fill="#2d8e77"/>
<text x="255" y="336" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">Publish only if tokens and work counters agree</text>
<text x="255" y="354" font-family="Arial,sans-serif" font-size="14" fill="white">Otherwise reject without modifying the caller's report</text>
</svg>
