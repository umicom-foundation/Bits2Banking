<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">A fair comparison of two language models</title>
<desc id="desc">One reviewed held-out source dataset and evaluation plan feed the baseline and candidate models. Their resulting metrics are compared together; the data and plan do not change between evaluations.</desc>
<rect width="1000" height="470" rx="18" fill="#eef6f6"/>
<text x="48" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#203247">Both models answer the same held-out questions</text>
<rect x="52" y="115" width="280" height="104" rx="12" fill="#203247"/>
<text x="192" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#fff">One approved dataset</text>
<text x="192" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#c8e6e9">One evaluation plan</text>
<text x="192" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#c8e6e9">Fixed seeds and windows</text>
<path d="M332 162 H392 V109 H447 M392 162 V305 H447" stroke="#0a7e83" stroke-width="5" fill="none"/>
<path d="M440 101 L452 109 440 117 M440 297 L452 305 440 313" stroke="#0a7e83" stroke-width="4" fill="none"/>
<rect x="451" y="78" width="240" height="88" rx="12" fill="#fff" stroke="#0a7e83" stroke-width="3"/>
<rect x="451" y="261" width="240" height="88" rx="12" fill="#fff" stroke="#0a7e83" stroke-width="3"/>
<text x="571" y="112" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#203247">Baseline decoder</text>
<text x="571" y="142" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#426778">Held-out audit A</text>
<text x="571" y="295" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#203247">Candidate decoder</text>
<text x="571" y="325" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#426778">Held-out audit B</text>
<path d="M691 122 H733 V209 H761 M691 305 H733 V249 H761" stroke="#0a7e83" stroke-width="4" fill="none"/>
<rect x="761" y="165" width="193" height="129" rx="12" fill="#0a7e83"/>
<text x="858" y="202" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="middle">Quality gate</text>
<text x="858" y="229" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle">Cross-entropy</text>
<text x="858" y="254" font-family="Arial,sans-serif" font-size="15" fill="white" text-anchor="middle">Top-1 and top-5</text>
<text x="858" y="279" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">Comparable evidence?</text>
<text x="50" y="408" font-family="Arial,sans-serif" font-size="17" fill="#203247">A lower loss is useful evidence, not proof of correct generated C23 code.</text>
<text x="50" y="438" font-family="Arial,sans-serif" font-size="13" fill="#426778">Bits to Banking · Native C23 model evaluation</text>
</svg>
