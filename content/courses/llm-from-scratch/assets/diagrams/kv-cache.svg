<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Key/value cache and rolling context</title><desc id="ddesc">Warm prefixes reuse previous attention values; a full shifted context rebuilds for learned absolute positions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="34" y="96" width="263" height="146" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="165.5" y="165.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Prefix 1 · 2 · 3</text>
<text x="165.5" y="193.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">reuse earlier K and V</text>
<rect x="344" y="96" width="247" height="146" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="467.5" y="165.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Append token 4</text>
<text x="467.5" y="193.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">compute one new row</text>
<rect x="640" y="96" width="266" height="146" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="773.0" y="165.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Window shifts</text>
<text x="773.0" y="193.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">rebuild positional rows</text>
<path d="M298 169 L342 169" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M592 169 L638 169" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#526879">A cache is correct only if its logits match the canonical decoder.</text>
</svg>
