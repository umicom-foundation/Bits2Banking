<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 475" role="img" aria-labelledby="title desc">
  <title id="title">Umicom native model admission</title>
  <desc id="desc">Approved source supplies checkpoint bytes and a separate positional sidecar. The Framework checks the sidecar, exact model digest, canonical checkpoint decoder and model identity before publishing an owned decoder. Unsigned hashes are not proof of authenticity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#40758f" stroke-width="1.7"/></marker>
    <style>
      .bg{fill:#f5fafb}.box{fill:white;stroke:#678b9c;stroke-width:2}.input{fill:#e6f2ff;stroke:#5980ae;stroke-width:2}.good{fill:#e1f7ee;stroke:#21815c;stroke-width:2}.warn{fill:#fff3db;stroke:#a96d20;stroke-width:2}.bad{fill:#fff0f0;stroke:#b44e53;stroke-width:2}.line{fill:none;stroke:#40758f;stroke-width:2.7;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.title{font:700 24px system-ui,Segoe UI,sans-serif;fill:#153c50}.label{font:700 16px system-ui,Segoe UI,sans-serif;fill:#1b394b;text-anchor:middle}.sub{font:14px system-ui,Segoe UI,sans-serif;fill:#496578;text-anchor:middle}.small{font:14px system-ui,Segoe UI,sans-serif;fill:#6c4d19;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1080" height="475" rx="16"/>
  <text class="title" x="36" y="44">Checkpoint-bound admission — Umicom Framework (C23)</text>
  <rect class="input" x="45" y="83" width="210" height="77" rx="10"/>
  <text class="label" x="150" y="113">Approved model bytes</text><text class="sub" x="150" y="136">Original checkpoint</text>
  <rect class="input" x="45" y="204" width="210" height="77" rx="10"/>
  <text class="label" x="150" y="234">Position sidecar</text><text class="sub" x="150" y="257">128-byte UMIPOS01</text>
  <rect class="box" x="313" y="199" width="210" height="87" rx="10"/>
  <text class="label" x="418" y="230">Validate sidecar</text><text class="sub" x="418" y="252">Format · context</text><text class="sub" x="418" y="270">Digest · supported policy</text>
  <rect class="box" x="313" y="78" width="210" height="87" rx="10"/>
  <text class="label" x="418" y="109">Check exact bytes</text><text class="sub" x="418" y="131">Length + SHA-256</text><text class="sub" x="418" y="148">before model loading</text>
  <rect class="box" x="583" y="78" width="210" height="87" rx="10"/>
  <text class="label" x="688" y="109">Canonical decoder</text><text class="sub" x="688" y="131">Existing checkpoint</text><text class="sub" x="688" y="148">codec creates model</text>
  <rect class="box" x="849" y="78" width="185" height="87" rx="10"/>
  <text class="label" x="941" y="109">Verify decoded</text><text class="sub" x="941" y="131">model identity</text><text class="sub" x="941" y="148">and context</text>
  <rect class="good" x="839" y="213" width="195" height="82" rx="10"/>
  <text class="label" x="936" y="245">Publish owned</text><text class="label" x="936" y="265">decoder</text>
  <path class="line" d="M255 122 H313"/><path class="line" d="M255 243 H313"/>
  <path class="line" d="M419 199 V165"/><path class="line" d="M523 122 H583"/><path class="line" d="M793 122 H849"/><path class="line" d="M942 165 V213"/>
  <path class="line dash" d="M523 244 H746 V165"/>
  <rect class="bad" x="311" y="337" width="348" height="71" rx="10"/>
  <text class="label" x="485" y="366">Any mismatch: refuse and clean up</text>
  <text class="sub" x="485" y="388">Caller outputs stay unchanged</text>
  <rect class="warn" x="697" y="337" width="338" height="71" rx="10"/>
  <text class="label" x="866" y="365">Publisher trust is a separate control</text>
  <text class="small" x="866" y="386">SHA-256 is not a digital signature</text>
  <path class="line dash" d="M419 286 V336"/>
</svg>
