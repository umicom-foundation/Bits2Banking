<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Native C23 quality-test build and execution sequence</title>
  <desc id="desc">CMake configure creates build rules, Ninja compiles typed C23 test sources, links the test executables, and only then CTest runs them. A pointer type error blocks compilation and prevents test execution.</desc>
  <rect width="1120" height="320" rx="20" fill="#f2f7f9"/>
  <text x="45" y="43" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#203247">Compile before interpreting CTest results</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="38" y="84" width="225" height="113" rx="15" fill="#203247"/>
    <text x="150" y="125" fill="#fff" font-size="23" font-weight="700">1. Configure</text>
    <text x="150" y="156" fill="#d1ecec" font-size="15">CMake creates targets</text>
    <text x="150" y="176" fill="#d1ecec" font-size="15">but no test binary yet</text>
    <path d="M275 141h35" stroke="#087784" stroke-width="5" stroke-linecap="round"/>
    <path d="M301 130l13 11-13 11" fill="none" stroke="#087784" stroke-width="5"/>
    <rect x="321" y="84" width="225" height="113" rx="15" fill="#087784"/>
    <text x="433" y="125" fill="#fff" font-size="23" font-weight="700">2. Compile</text>
    <text x="433" y="156" fill="#e1f7f5" font-size="15">Check public ABI and</text>
    <text x="433" y="176" fill="#e1f7f5" font-size="15">pointer types</text>
    <path d="M558 141h35" stroke="#087784" stroke-width="5" stroke-linecap="round"/>
    <path d="M584 130l13 11-13 11" fill="none" stroke="#087784" stroke-width="5"/>
    <rect x="604" y="84" width="225" height="113" rx="15" fill="#203247"/>
    <text x="716" y="125" fill="#fff" font-size="23" font-weight="700">3. Link</text>
    <text x="716" y="156" fill="#d1ecec" font-size="15">Produce each real</text>
    <text x="716" y="176" fill="#d1ecec" font-size="15">CTest executable</text>
    <path d="M841 141h35" stroke="#087784" stroke-width="5" stroke-linecap="round"/>
    <path d="M867 130l13 11-13 11" fill="none" stroke="#087784" stroke-width="5"/>
    <rect x="887" y="84" width="197" height="113" rx="15" fill="#087784"/>
    <text x="985" y="125" fill="#fff" font-size="23" font-weight="700">4. Test</text>
    <text x="985" y="156" fill="#e1f7f5" font-size="15">CTest executes</text>
    <text x="985" y="176" fill="#e1f7f5" font-size="15">the built binary</text>
  </g>
  <rect x="321" y="220" width="763" height="65" rx="12" fill="#fff1ee" stroke="#b9483a" stroke-width="2"/>
  <text x="342" y="246" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#8f352b">If compilation fails:</text>
  <text x="342" y="268" font-family="system-ui, sans-serif" font-size="15" fill="#44342f">Fix the earliest compiler diagnostic. “Not Run” means no executable was available.</text>
</svg>
