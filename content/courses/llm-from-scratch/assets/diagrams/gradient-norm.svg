<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<defs><style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#203247} .head{font-size:25px;font-weight:700}.txt{font-size:21px;font-weight:600}.small{font-size:17px} .muted{fill:#566879}
.box{fill:white;stroke:#a0b4c5;stroke-width:2}.teal{fill:#ddf4f4;stroke:#087784;stroke-width:2}.navy{fill:#203247}.line{stroke:#087784;stroke-width:4;fill:none;stroke-linecap:round}
</style><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#087784"/></marker></defs>
<title id="title">Global gradient norm</title><desc id="desc">Two parameter vectors contribute to one Euclidean norm of thirteen.</desc>
<rect width="1200" height="390" rx="26" fill="#f0f6f8"/>
<text x="60" y="65" class="head">Measure the whole gradient</text>
<rect class="box" x="60" y="120" width="345" height="154" rx="20"/>
<text class="txt" x="84" y="163">Token embedding</text><text x="84" y="210" font-size="31">[3, 4]</text>
<rect class="box" x="430" y="120" width="345" height="154" rx="20"/>
<text class="txt" x="454" y="163">Attention projection</text><text x="454" y="210" font-size="31">[−12, 0]</text>
<rect class="teal" x="845" y="120" width="298" height="154" rx="20"/>
<text class="txt" x="875" y="163">Global norm</text><text x="875" y="215" font-size="41" font-weight="700">13.0</text>
<path class="line" d="M775 198H833" marker-end="url(#arrow)"/>
<text x="65" y="325" class="small muted">One norm across all gradient arrays: √(3² + 4² + 12² + 0²) = 13</text>
</svg>
