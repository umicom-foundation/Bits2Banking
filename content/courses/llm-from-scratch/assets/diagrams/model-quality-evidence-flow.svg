<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">From held-out quality comparison to deterministic JSON evidence</title>
  <desc id="desc">A canonical model-audit result and an explicit quality policy enter the Framework quality gate. The gate recomputes acceptance and serialises exact binary64 metrics and counted tokens into JSON. The JSON is an unsigned quality observation, not a signed release approval.</desc>
  <rect width="1120" height="350" rx="20" fill="#f2f7f9"/>
  <text x="42" y="45" fill="#203247" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Deterministic, read-only quality evidence</text>
  <g font-family="system-ui, sans-serif">
    <rect x="42" y="81" width="270" height="87" rx="12" fill="#203247"/>
    <text x="62" y="113" font-size="20" font-weight="700" fill="#fff">Held-out model audits</text>
    <text x="62" y="139" font-size="15" fill="#d1ecec">Same dataset, same plan,</text>
    <text x="62" y="157" font-size="15" fill="#d1ecec">comparable token counts</text>
    <rect x="42" y="184" width="270" height="87" rx="12" fill="#eef9f8" stroke="#087784" stroke-width="2"/>
    <text x="62" y="217" font-size="20" font-weight="700" fill="#203247">Reviewed quality policy</text>
    <text x="62" y="245" font-size="15" fill="#30555a">Loss, top-k and sample floor</text>
    <path d="M323 125h76M323 226h76M399 125v101" fill="none" stroke="#087784" stroke-width="4"/>
    <path d="M388 173l13 12 13-12" fill="none" stroke="#087784" stroke-width="4"/>
    <rect x="415" y="118" width="294" height="124" rx="15" fill="#087784"/>
    <text x="437" y="156" font-size="21" font-weight="700" fill="#fff">Framework quality gate</text>
    <text x="437" y="185" font-size="15" fill="#e0f9f6">Validate and recompute decision</text>
    <text x="437" y="210" font-size="15" fill="#e0f9f6">No new evaluator or trainer</text>
    <path d="M725 180h48" stroke="#087784" stroke-width="4"/>
    <path d="M764 169l13 11-13 11" fill="none" stroke="#087784" stroke-width="4"/>
    <rect x="787" y="91" width="294" height="181" rx="14" fill="#203247"/>
    <text x="808" y="127" font-size="22" font-weight="700" fill="#fff">Machine-readable JSON</text>
    <text x="808" y="158" font-size="15" fill="#d1ecec">Exact IEEE754 binary64 bits</text>
    <text x="808" y="185" font-size="15" fill="#d1ecec">Measured top-1 and top-5 counts</text>
    <text x="808" y="212" font-size="15" fill="#d1ecec">accepted: true / false</text>
    <text x="808" y="239" font-size="15" fill="#d1ecec">Explicit assurance limitations</text>
  </g>
  <rect x="42" y="295" width="1039" height="36" rx="9" fill="#fff6e8"/>
  <text x="62" y="319" font-family="system-ui, sans-serif" font-size="16" fill="#65461f">Unsigned evaluation evidence does not establish signed provenance, release approval or C23 programming competence.</text>
</svg>
