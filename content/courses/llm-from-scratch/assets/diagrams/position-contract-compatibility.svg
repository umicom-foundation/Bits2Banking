<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
 <title id="title">Position strategy compatibility and checkpoint identity</title>
 <desc id="desc">The original checkpoint codec is hashed by the Framework SHA-256 service and combined with an explicit positional policy and generation mode in an unsigned sidecar. A verification gate either permits a matching model and generation policy or refuses mismatched context or future position encodings.</desc>
 <rect x="1" y="1" width="1078" height="558" rx="24" fill="#f5f8fb" stroke="#cddce6" stroke-width="2"/>
 <text x="56" y="58" fill="#193852" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="750">One checkpoint, explicit positional policy</text>
 <g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
  <rect x="55" y="115" width="260" height="86" rx="14" fill="#e3f3f6" stroke="#0b7786" stroke-width="2"/>
  <text x="185" y="148" fill="#14384a" font-size="18" font-weight="700">Canonical checkpoint</text>
  <text x="185" y="177" fill="#35566b" font-size="14">Original native decoder bytes</text>
  <rect x="412" y="115" width="260" height="86" rx="14" fill="#e3f3f6" stroke="#0b7786" stroke-width="2"/>
  <text x="542" y="148" fill="#14384a" font-size="18" font-weight="700">Framework SHA-256</text>
  <text x="542" y="177" fill="#35566b" font-size="14">No model format change</text>
  <rect x="775" y="115" width="260" height="86" rx="14" fill="#e7efff" stroke="#4b70a8" stroke-width="2"/>
  <text x="905" y="148" fill="#14384a" font-size="18" font-weight="700">Position declaration</text>
  <text x="905" y="174" fill="#35566b" font-size="14">Encoding, context, rollover</text>
  <path d="M315 158H412" stroke="#0b7786" stroke-width="3" fill="none"/>
  <path d="M671 158H775" stroke="#4b70a8" stroke-width="3" fill="none"/>
  <rect x="305" y="258" width="470" height="84" rx="14" fill="#15354d"/>
  <text x="540" y="292" fill="#fff" font-size="22" font-weight="700">128-byte unsigned sidecar</text>
  <text x="540" y="321" fill="#d1e3ef" font-size="15">Checksum identity + context policy + record digest</text>
  <path d="M542 201V257" stroke="#4b70a8" stroke-width="3" fill="none"/>
  <path d="M905 201V236H697V258" stroke="#4b70a8" stroke-width="3" fill="none"/>
  <path d="M540 342V385" stroke="#4b70a8" stroke-width="3" fill="none"/>
  <rect x="370" y="386" width="340" height="65" rx="12" fill="#fff" stroke="#4b70a8" stroke-width="2"/>
  <text x="540" y="425" fill="#14384a" font-size="19" font-weight="700">Verify live model + requested context</text>
  <path d="M480 452V475H268V493" stroke="#188463" stroke-width="3" fill="none"/>
  <path d="M600 452V475H812V493" stroke="#bb5b4b" stroke-width="3" fill="none"/>
  <rect x="95" y="493" width="345" height="46" rx="12" fill="#e6f8ef" stroke="#188463" stroke-width="2"/>
  <text x="267" y="522" fill="#176447" font-size="18" font-weight="700">Exact match: accept declaration</text>
  <rect x="639" y="493" width="347" height="46" rx="12" fill="#fff0ee" stroke="#bb5b4b" stroke-width="2"/>
  <text x="812" y="522" fill="#9d3f36" font-size="17" font-weight="700">Different model / policy: refuse</text>
 </g>
</svg>
