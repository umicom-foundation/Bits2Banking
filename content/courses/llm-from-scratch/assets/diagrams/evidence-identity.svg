<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Three identities for a reviewed Umicom model benchmark</title>
<desc id="desc">A model checkpoint, a set of reviewed source-completion cases, and completion scores each receive an independent SHA-256 content identity and meet in one evidence record. A digest is not a publisher signature.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087784"/></marker><style>.frame{fill:#f4f8fa;stroke:#9fb4c5;stroke-width:2}.head{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#203247}.small{font:17px 'Segoe UI',Arial,sans-serif;fill:#405565}.hash{font:700 16px Consolas,monospace;fill:#06727e}.line{stroke:#087784;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1000" height="350" rx="22" fill="#eaf1f5"/>
<text x="38" y="45" class="head" font-size="27">What exactly did we evaluate?</text>
<g><rect x="38" y="83" width="265" height="133" rx="16" class="frame"/><text x="59" y="121" class="head">Model checkpoint</text><text x="59" y="151" class="small">Portable weights + steps</text><text x="59" y="185" class="hash">model SHA-256</text></g>
<g><rect x="366" y="83" width="266" height="133" rx="16" class="frame"/><text x="387" y="121" class="head">Reviewed cases</text><text x="387" y="151" class="small">Prompt + expected bytes</text><text x="387" y="185" class="hash">suite SHA-256</text></g>
<g><rect x="695" y="83" width="267" height="133" rx="16" class="frame"/><text x="716" y="121" class="head">Observed scores</text><text x="716" y="151" class="small">Exact/prefix matches</text><text x="716" y="185" class="hash">scores SHA-256</text></g>
<path d="M170 217V254H470" class="line"/><path d="M500 217V254" class="line"/><path d="M824 217V254H526" class="line"/>
<rect x="340" y="254" width="320" height="58" rx="14" fill="#203247"/><text x="500" y="289" fill="#fff" font-family="Segoe UI,Arial" font-weight="700" font-size="20" text-anchor="middle">Reproducible evidence record</text>
<text x="500" y="337" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#506676">Digests identify bytes; they do not prove safety or correctness.</text>
</svg>
