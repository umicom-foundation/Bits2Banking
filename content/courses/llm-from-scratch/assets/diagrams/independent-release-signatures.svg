<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Two independent signatures for one model release</title>
<desc id="desc">An Ed25519 publisher key signs the model publication, an independent Ed25519 approver key signs a reviewed release approval. Both are required by the release verifier.</desc>
<rect width="1120" height="470" rx="22" fill="#142a40"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="54" y="59" fill="#ffffff" font-size="28" font-weight="750">Two different signatures, two different decisions</text>
<text x="54" y="92" fill="#c5d9e3" font-size="17">Cryptographic evidence identifies signed bytes; independent governance determines approval.</text>
<rect x="55" y="124" width="453" height="208" rx="17" fill="#203c53" stroke="#63c7ce" stroke-width="2"/>
<rect x="612" y="124" width="453" height="208" rx="17" fill="#203c53" stroke="#daa965" stroke-width="2"/>
<text x="79" y="165" fill="#9ef0ed" font-size="24" font-weight="700">Publisher signature</text>
<text x="636" y="165" fill="#ffe2a2" font-size="24" font-weight="700">Release approval signature</text>
<text x="79" y="205" fill="#fff" font-size="18">Signed: exact .publication bytes</text>
<text x="79" y="237" fill="#c5d9e3" font-size="17">Verified against approved publisher keys</text>
<text x="79" y="280" fill="#c5d9e3" font-size="16">Checks publication and checkpoint integrity</text>
<text x="636" y="205" fill="#fff" font-size="18">Signed: exact .approval bytes</text>
<text x="636" y="237" fill="#c5d9e3" font-size="17">Verified against trusted approver key</text>
<text x="636" y="280" fill="#c5d9e3" font-size="16">Checks authorisation of ordered SHA-256</text>
<path d="M281 338v43 M838 338v43" stroke="#a3dbe3" stroke-width="3" fill="none"/>
<path d="M270 370l11 12 11-12 M827 370l11 12 11-12" stroke="#a3dbe3" stroke-width="3" fill="none"/>
<rect x="265" y="383" width="590" height="56" rx="14" fill="#087784"/>
<text x="560" y="418" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Verify both before any release receipt</text>
</g>
</svg>
