<?xml version="1.0" encoding="UTF-8"?>
<!-- Umicom Foundation | Sammy Hegab | MIT | Diagram uses established Umicom palette, not substitute branding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title description">
  <title id="title">Read-only native decoder completion benchmark</title>
  <desc id="description">Reviewed prompt and reference, trained checkpoint, canonical decoder generation, byte scoring and report.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087784"/></marker></defs>
  <rect width="1000" height="365" fill="#f3f7fb" rx="18"/>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247} .title{font-size:25px;font-weight:750} .label{font-size:19px;font-weight:650} .sub{font-size:14px} .chip{font-size:16px;font-weight:700;fill:#fff} .line{stroke:#087784;stroke-width:4;marker-end:url(#arrow);fill:none}</style>
<text class="title" x="36" y="52">A reproducible, read-only completion experiment</text>
<rect x="35" y="125" width="185" height="85" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="127.5" y="155" text-anchor="middle">Reviewed case</text>
 <text class="sub" x="127.5" y="179" text-anchor="middle">Prompt + expected bytes</text>
<rect x="272" y="125" width="186" height="85" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="365.0" y="155" text-anchor="middle">Checkpoint</text>
 <text class="sub" x="365.0" y="179" text-anchor="middle">Approved native weights</text>
<rect x="510" y="125" width="198" height="85" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="609.0" y="155" text-anchor="middle">Decoder</text>
 <text class="sub" x="609.0" y="179" text-anchor="middle">Existing byte generator</text>
<rect x="760" y="125" width="205" height="85" rx="12" fill="#e3f5f4" stroke="#087784" stroke-width="2"/>
 <text class="label" x="862.5" y="155" text-anchor="middle">Score</text>
 <text class="sub" x="862.5" y="179" text-anchor="middle">Exact · position · prefix</text>
<path class="line" d="M220 166H258"/><path class="line" d="M458 166H496"/><path class="line" d="M708 166H745"/>
<rect x="35" y="263" width="930" height="62" rx="11" fill="#203247"/>
<text x="500" y="290" text-anchor="middle" style="fill:#fff;font-family:Segoe UI,Arial;font-size:17px;font-weight:700">No compilation · No execution · No weight updates</text>
<text x="500" y="310" text-anchor="middle" style="fill:#b6dce0;font-family:Segoe UI,Arial;font-size:14px">Only the Framework performs tokenisation, inference, sampling and scoring.</text>
</svg>