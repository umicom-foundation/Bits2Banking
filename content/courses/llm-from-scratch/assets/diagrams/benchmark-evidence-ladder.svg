<?xml version="1.0" encoding="UTF-8"?>
<!-- Umicom Foundation | Sammy Hegab | MIT | Diagram uses established Umicom palette, not substitute branding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title description">
  <title id="title">Model evaluation evidence ladder</title>
  <desc id="description">Byte agreement is one stage, below compilation, functional tests, sanitiser testing and independent review.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087784"/></marker></defs>
  <rect width="1000" height="365" fill="#f3f7fb" rx="18"/>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247} .title{font-size:25px;font-weight:750} .label{font-size:19px;font-weight:650} .sub{font-size:14px} .chip{font-size:16px;font-weight:700;fill:#fff} .line{stroke:#087784;stroke-width:4;marker-end:url(#arrow);fill:none}</style>
<text class="title" x="35" y="45">Different evidence answers different questions</text>
<rect x="25" y="115" width="181" height="105" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="115.5" y="145" text-anchor="middle">Next-token loss</text>
 <text class="sub" x="115.5" y="169" text-anchor="middle">Predict withheld data</text>
<path class="line" d="M206 164H216"/>
<rect x="221" y="105" width="181" height="120" rx="12" fill="#e3f5f4" stroke="#087784" stroke-width="2"/>
 <text class="label" x="311.5" y="135" text-anchor="middle">Exact bytes</text>
 <text class="sub" x="311.5" y="159" text-anchor="middle">Match one reference</text>
<path class="line" d="M402 154H412"/>
<rect x="417" y="95" width="181" height="135" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="507.5" y="125" text-anchor="middle">Compile</text>
 <text class="sub" x="507.5" y="149" text-anchor="middle">Pass one toolchain</text>
<path class="line" d="M598 144H608"/>
<rect x="613" y="85" width="181" height="150" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="703.5" y="115" text-anchor="middle">Unit tests</text>
 <text class="sub" x="703.5" y="139" text-anchor="middle">Behave on selected inputs</text>
<path class="line" d="M794 134H804"/>
<rect x="809" y="75" width="181" height="165" rx="12" fill="#fff" stroke="#d9e6ed" stroke-width="2"/>
 <text class="label" x="899.5" y="105" text-anchor="middle">Review</text>
 <text class="sub" x="899.5" y="129" text-anchor="middle">Ownership and suitability</text>
<text x="500" y="315" text-anchor="middle" style="font-family:Segoe UI,Arial;font-size:18px;font-weight:700;fill:#203247">Current Framework module stops at byte scoring. Higher stages are separate engineering work.</text></svg>