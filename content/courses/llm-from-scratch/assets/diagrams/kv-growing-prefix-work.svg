<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Growing-prefix inference: repeated recomputation versus reuse</title>
  <desc id="desc">Six growing prefixes need one, two, three, four, five and six computed token rows respectively when independently recomputed, totalling twenty-one rows. A retained KV cache computes one new row per step, totalling six rows. Neither approach evicts a token.</desc>
  <rect width="980" height="430" rx="24" fill="#f2f6fa"/>
  <text x="46" y="50" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#203247">The same six prefixes, measured two ways</text>
  <text x="46" y="79" font-family="system-ui, sans-serif" font-size="17" fill="#42566b">Both paths start at position 0. No BOS padding. No eviction.</text>
  <text x="54" y="129" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#8b3939">Independent Prefill on every prefix</text>
  <text x="520" y="129" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#087784">One Prefill + successive Append</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#42566b">
    <text x="20" y="164">1</text><text x="20" y="202">2</text><text x="20" y="240">3</text>
    <text x="20" y="278">4</text><text x="20" y="316">5</text><text x="20" y="354">6</text>
  </g>
  <g fill="#c56b66" stroke="#a74343" stroke-width="1">
    <rect x="55" y="146" width="47" height="22" rx="5"/>
    <rect x="55" y="184" width="47" height="22" rx="5"/><rect x="109" y="184" width="47" height="22" rx="5"/>
    <rect x="55" y="222" width="47" height="22" rx="5"/><rect x="109" y="222" width="47" height="22" rx="5"/><rect x="163" y="222" width="47" height="22" rx="5"/>
    <rect x="55" y="260" width="47" height="22" rx="5"/><rect x="109" y="260" width="47" height="22" rx="5"/><rect x="163" y="260" width="47" height="22" rx="5"/><rect x="217" y="260" width="47" height="22" rx="5"/>
    <rect x="55" y="298" width="47" height="22" rx="5"/><rect x="109" y="298" width="47" height="22" rx="5"/><rect x="163" y="298" width="47" height="22" rx="5"/><rect x="217" y="298" width="47" height="22" rx="5"/><rect x="271" y="298" width="47" height="22" rx="5"/>
    <rect x="55" y="336" width="47" height="22" rx="5"/><rect x="109" y="336" width="47" height="22" rx="5"/><rect x="163" y="336" width="47" height="22" rx="5"/><rect x="217" y="336" width="47" height="22" rx="5"/><rect x="271" y="336" width="47" height="22" rx="5"/><rect x="325" y="336" width="47" height="22" rx="5"/>
  </g>
  <g fill="#198c84" stroke="#087784" stroke-width="1">
    <rect x="552" y="146" width="47" height="22" rx="5"/>
    <rect x="552" y="184" width="47" height="22" rx="5"/>
    <rect x="552" y="222" width="47" height="22" rx="5"/>
    <rect x="552" y="260" width="47" height="22" rx="5"/>
    <rect x="552" y="298" width="47" height="22" rx="5"/>
    <rect x="552" y="336" width="47" height="22" rx="5"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="700">
    <text x="56" y="407" fill="#8b3939">21 token rows</text>
    <text x="553" y="407" fill="#087784">6 token rows · 15 avoided</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#42566b">
    <text x="395" y="266">= same logits</text>
    <text x="395" y="288">at each length</text>
  </g>
</svg>
