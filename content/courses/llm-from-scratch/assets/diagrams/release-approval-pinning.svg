<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title description">
  <title id="title">Pin the independently approved native LLM release selection</title>
  <desc id="description">The existing trusted batch verifier identifies checkpoints A and B, while a separate reviewer protects the expected ordered batch SHA-256. A later release must match the approved digest exactly.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#0b7d83" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1120" height="470" rx="23" fill="#eaf2f6"/>
  <rect x="25" y="25" width="1070" height="75" rx="15" fill="#203247"/>
  <text x="48" y="57" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">Pin a release selection independently of the release package</text>
  <text x="48" y="84" fill="#cfe4e8" font-family="Arial,sans-serif" font-size="15">Digital signatures confirm publishers; the reviewer approves the exact ordered checkpoints.</text>
  <rect x="52" y="158" width="267" height="185" rx="14" fill="white" stroke="#9cb9c4" stroke-width="2"/>
  <text x="74" y="190" fill="#203247" font-family="Arial,sans-serif" font-size="18" font-weight="700">Candidate release</text>
  <text x="74" y="228" fill="#38566c" font-family="Arial,sans-serif" font-size="16">1. baseline.umi</text>
  <text x="74" y="255" fill="#38566c" font-family="Arial,sans-serif" font-size="16">2. candidate.umi</text>
  <text x="74" y="301" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Signatures + companions</text>
  <path d="M319 247 H392" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="397" y="158" width="295" height="185" rx="14" fill="white" stroke="#0b7d83" stroke-width="3"/>
  <text x="423" y="191" fill="#203247" font-family="Arial,sans-serif" font-size="18" font-weight="700">Framework verification</text>
  <text x="423" y="225" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Approved Ed25519 publishers</text>
  <text x="423" y="255" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Verified checkpoint identities</text>
  <text x="423" y="285" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Ordered batch SHA-256</text>
  <path d="M692 247 H749" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="753" y="158" width="311" height="185" rx="14" fill="#e4f7f4" stroke="#0b7d83" stroke-width="2"/>
  <text x="777" y="191" fill="#203247" font-family="Arial,sans-serif" font-size="18" font-weight="700">Independent reviewer</text>
  <text x="777" y="227" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Reviews this exact selection</text>
  <text x="777" y="257" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Pins count, time and digest</text>
  <text x="777" y="287" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Protects approval separately</text>
  <rect x="65" y="377" width="992" height="59" rx="12" fill="#203247"/>
  <text x="86" y="402" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Release gate: verify again and require the exact pinned digest</text>
  <text x="86" y="423" fill="#d4e7ea" font-family="Arial,sans-serif" font-size="14">The approval file is not signed automatically; secure custody and independent review remain essential.</text>
</svg>
