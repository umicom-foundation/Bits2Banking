<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="465" viewBox="0 0 1120 465" role="img" aria-labelledby="title desc">
  <title id="title">Ordered native LLM release verification</title>
  <desc id="desc">Two signed training publications pass independent evidence and publisher checks, before an ordered JSON batch record can be issued.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#0b7d83" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="465" rx="22" fill="#eaf2f6"/>
  <rect x="28" y="28" width="1064" height="68" rx="14" fill="#203247"/>
  <text x="50" y="58" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Verify every signed checkpoint before approving the release</text>
  <text x="50" y="82" fill="#cde1e6" font-family="Arial,sans-serif" font-size="15">One operator-approved policy • One evaluation instant • Up to eight ordered entries</text>
  <rect x="48" y="143" width="255" height="108" rx="15" fill="#ffffff" stroke="#97b3be" stroke-width="2"/>
  <text x="68" y="175" fill="#203247" font-family="Arial,sans-serif" font-size="20" font-weight="700">Checkpoint A</text>
  <text x="68" y="200" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Combined AdamW state</text>
  <text x="68" y="226" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Signature + companions</text>
  <rect x="48" y="280" width="255" height="108" rx="15" fill="#ffffff" stroke="#97b3be" stroke-width="2"/>
  <text x="68" y="313" fill="#203247" font-family="Arial,sans-serif" font-size="20" font-weight="700">Checkpoint B</text>
  <text x="68" y="338" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Combined AdamW state</text>
  <text x="68" y="365" fill="#38566c" font-family="Arial,sans-serif" font-size="15">Signature + companions</text>
  <rect x="425" y="172" width="260" height="189" rx="16" fill="#ffffff" stroke="#0b7d83" stroke-width="3"/>
  <text x="449" y="204" fill="#203247" font-family="Arial,sans-serif" font-size="19" font-weight="700">Framework trust checks</text>
  <path d="M446 221 H664" stroke="#d0e1e5"/>
  <text x="446" y="247" fill="#38566c" font-family="Arial,sans-serif" font-size="15">✓ Policy-approved publisher</text>
  <text x="446" y="277" fill="#38566c" font-family="Arial,sans-serif" font-size="15">✓ Valid Ed25519 signature</text>
  <text x="446" y="307" fill="#38566c" font-family="Arial,sans-serif" font-size="15">✓ Publication file digests</text>
  <text x="446" y="337" fill="#38566c" font-family="Arial,sans-serif" font-size="15">✓ Fresh per-model receipts</text>
  <path d="M303 197 H367 Q392 197 392 218 V251 H423" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M303 334 H367 Q392 334 392 311 V283 H423" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M685 267 H777" stroke="#0b7d83" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="783" y="170" width="291" height="193" rx="17" fill="#e1f4f1" stroke="#0b7d83" stroke-width="3"/>
  <text x="805" y="207" fill="#203247" font-family="Arial,sans-serif" font-size="19" font-weight="700">One batch JSON receipt</text>
  <text x="806" y="239" fill="#38566c" font-family="Arial,sans-serif" font-size="16">result: verified</text>
  <text x="806" y="269" fill="#38566c" font-family="Arial,sans-serif" font-size="16">entries: [A, B]</text>
  <text x="806" y="299" fill="#38566c" font-family="Arial,sans-serif" font-size="16">ordered SHA-256 digest</text>
  <text x="806" y="328" fill="#087784" font-family="Arial,sans-serif" font-size="16" font-weight="700">Only if every check passes</text>
  <text x="48" y="430" fill="#203247" font-family="Arial,sans-serif" font-size="15">Read-only verification • No model execution • JSON is an unsigned observation, not a trusted timestamp.</text>
</svg>
