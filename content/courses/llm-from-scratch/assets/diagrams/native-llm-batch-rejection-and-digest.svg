<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Failure-atomic release verification and ordered SHA-256 input</title>
  <desc id="desc">One tampered publication rejects the entire proposed release. A successful batch commits to domain, entry count, evaluation time and length-delimited canonical receipts.</desc>
  <rect width="1120" height="460" rx="22" fill="#eaf2f6"/>
  <rect x="24" y="24" width="1072" height="67" rx="14" fill="#203247"/>
  <text x="48" y="53" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Release approval is all or nothing</text>
  <text x="48" y="79" font-family="Arial,sans-serif" font-size="14" fill="#cde1e6">One bad checkpoint produces no JSON success, even when earlier checks passed.</text>
  <rect x="45" y="130" width="210" height="108" rx="14" fill="#ffffff" stroke="#0b7d83" stroke-width="2"/>
  <text x="65" y="164" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203247">Model A: verified</text>
  <text x="65" y="194" font-family="Arial,sans-serif" font-size="15" fill="#38566c">Key + evidence match</text>
  <rect x="287" y="130" width="230" height="108" rx="14" fill="#fff5ee" stroke="#ad593d" stroke-width="2"/>
  <text x="307" y="164" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8a3b27">Model B: rejected</text>
  <text x="307" y="194" font-family="Arial,sans-serif" font-size="15" fill="#753d2b">Source-lock bytes changed</text>
  <path d="M256 183 H282" stroke="#38566c" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M518 185 H553" stroke="#ad593d" stroke-width="3"/>
  <rect x="560" y="130" width="508" height="108" rx="14" fill="#fff5ee" stroke="#ad593d" stroke-width="2"/>
  <text x="585" y="168" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8a3b27">Whole batch refused</text>
  <text x="585" y="199" font-family="Arial,sans-serif" font-size="16" fill="#753d2b">No partial JSON success • Outputs remain unchanged</text>
  <rect x="45" y="268" width="1023" height="147" rx="15" fill="#ffffff" stroke="#97b3be" stroke-width="2"/>
  <text x="68" y="305" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#203247">If every model passes, compute SHA-256 over a framed, ordered sequence:</text>
  <rect x="68" y="327" width="222" height="62" rx="10" fill="#d9edf0"/>
  <text x="84" y="352" font-family="Arial,sans-serif" font-size="15" fill="#203247">Domain + entry count</text>
  <text x="84" y="374" font-family="Arial,sans-serif" font-size="13" fill="#38566c">Fixed binary framing</text>
  <rect x="303" y="327" width="180" height="62" rx="10" fill="#d9edf0"/>
  <text x="318" y="361" font-family="Arial,sans-serif" font-size="15" fill="#203247">Evaluation time</text>
  <rect x="496" y="327" width="237" height="62" rx="10" fill="#d9edf0"/>
  <text x="514" y="352" font-family="Arial,sans-serif" font-size="15" fill="#203247">Length + receipt A</text>
  <text x="514" y="374" font-family="Arial,sans-serif" font-size="13" fill="#38566c">Canonical JSON bytes</text>
  <rect x="746" y="327" width="296" height="62" rx="10" fill="#d9edf0"/>
  <text x="768" y="352" font-family="Arial,sans-serif" font-size="15" fill="#203247">Length + receipt B</text>
  <text x="768" y="374" font-family="Arial,sans-serif" font-size="13" fill="#38566c">Order matters; no NUL bytes</text>
  <text x="48" y="441" font-family="Arial,sans-serif" font-size="14" fill="#38566c">A matching SHA-256 is a content identifier. It is not itself a signature or proof of authorisation.</text>
</svg>
