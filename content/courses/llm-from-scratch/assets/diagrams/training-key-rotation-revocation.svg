<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">Key rotation and revocation for signed training evidence</title>
<desc id="desc">A publisher policy explicitly denies signatures from a revoked old key, while a newly approved active key may verify its separately signed training publication. Old checkpoints are not rewritten.</desc>
<rect x="1" y="1" width="1198" height="523" rx="25" fill="#f2f9fa" stroke="#b9d5dc" stroke-width="2"/>
<text x="50" y="59" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#193f51">Rotate signing keys without rewriting earlier checkpoints</text>
<text x="50" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#526f7c">One independently reviewed policy can describe both a retired signer and an authorised replacement.</text>
<rect x="50" y="138" width="515" height="274" rx="19" fill="#fff" stroke="#e0b7ab" stroke-width="2"/>
<rect x="50" y="138" width="515" height="57" rx="19" fill="#fae8e3"/>
<text x="76" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#8a3f35">Old publisher key — REVOKED</text>
<text x="77" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">Signature mathematically valid</text>
<text x="77" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">Policy state = revoked</text>
<text x="77" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">Even historical verification is denied</text>
<rect x="76" y="346" width="451" height="43" rx="11" fill="#fbe3dc" stroke="#e4afa4"/>
<text x="102" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#9c3b30">REJECT — do not trust as publisher</text>
<rect x="635" y="138" width="515" height="274" rx="19" fill="#fff" stroke="#89b9ad" stroke-width="2"/>
<rect x="635" y="138" width="515" height="57" rx="19" fill="#e5f4ed"/>
<text x="662" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#196746">Replacement key — ACTIVE</text>
<text x="662" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">New key identity approved separately</text>
<text x="662" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">Time lies inside active interval</text>
<text x="662" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3d5661">Own signature and four file hashes match</text>
<rect x="662" y="346" width="450" height="43" rx="11" fill="#dff2e8" stroke="#94c9ae"/>
<text x="686" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#176344">ACCEPT — when all checks succeed</text>
<rect x="50" y="444" width="1100" height="49" rx="12" fill="#e8f1f5" stroke="#acc9d3"/>
<text x="69" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#255264">Key status changes the authorisation decision, not the original checkpoint or signature bytes.</text>
</svg>
