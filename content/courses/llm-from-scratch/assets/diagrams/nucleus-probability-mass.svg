<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="title desc">
  <title id="title">How top-p nucleus sampling retains the smallest sufficient probability mass</title>
  <desc id="desc">Four sorted tokens have probabilities A 68.1 percent, B 25.1 percent, C 3.4 percent and D 3.4 percent. A and B together exceed a top-p threshold of ninety percent, so C and D are excluded.</desc>
  <rect width="940" height="420" rx="26" fill="#f5f8fb"/>
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#203247">Top-p = 0.90 · a changing nucleus</text>
  <text x="50" y="86" font-family="system-ui,sans-serif" font-size="17" fill="#465c70">Probabilities after top-K filtering and temperature scaling</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#203247">
    <text x="50" y="139">A</text><text x="50" y="198">B</text><text x="50" y="257">C</text><text x="50" y="316">D</text>
  </g>
  <rect x="98" y="116" width="640" height="31" rx="6" fill="#e0e7ee"/>
  <rect x="98" y="116" width="436" height="31" rx="6" fill="#14796e"/>
  <rect x="98" y="175" width="640" height="31" rx="6" fill="#e0e7ee"/>
  <rect x="98" y="175" width="160" height="31" rx="6" fill="#14796e"/>
  <rect x="98" y="234" width="640" height="31" rx="6" fill="#e0e7ee"/>
  <rect x="98" y="234" width="22" height="31" rx="6" fill="#8796a6"/>
  <rect x="98" y="293" width="640" height="31" rx="6" fill="#e0e7ee"/>
  <rect x="98" y="293" width="22" height="31" rx="6" fill="#8796a6"/>
  <g font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#203247">
    <text x="762" y="139">68.1%</text><text x="762" y="198">25.1%</text>
    <text x="762" y="257">3.4%</text><text x="762" y="316">3.4%</text>
  </g>
  <rect x="43" y="101" width="850" height="118" rx="13" fill="none" stroke="#14796e" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="52" y="378" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#14796e">Retain A and B: cumulative mass = 93.2% ≥ 90%</text>
  <text x="52" y="404" font-family="system-ui,sans-serif" font-size="15" fill="#465c70">C and D remain excluded from this draw; the retained weights are renormalised.</text>
</svg>
