<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Gradient accumulation for AdamW</title><desc id="ddesc">Four independently processed microbatches are combined into one weighted gradient and one AdamW step.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="28" y="61" width="196" height="94" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="126.0" y="104.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Microbatch 1</text>
<text x="126.0" y="132.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">8 source tokens</text>
<rect x="259" y="61" width="196" height="94" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="357.0" y="104.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Microbatch 2</text>
<text x="357.0" y="132.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">8 source tokens</text>
<rect x="490" y="61" width="196" height="94" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="588.0" y="104.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Microbatch 3</text>
<text x="588.0" y="132.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">8 source tokens</text>
<rect x="721" y="61" width="196" height="94" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="819.0" y="104.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Microbatch 4</text>
<text x="819.0" y="132.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">8 source tokens</text>
<path d="M126 155 L470 216" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M357 155 L470 216" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M588 155 L470 216" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M819 155 L470 216" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="335" y="220" width="270" height="88" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="470.0" y="260.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Mean gradients</text>
<text x="470.0" y="288.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">token-weighted sum</text>
<text x="470" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#087784">ONE AdamW update — moments advance only once</text>
