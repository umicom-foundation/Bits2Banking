<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Publish the completion marker after the four checkpoint files</title>
<desc id="desc">A sequence of four data files is written and checked before a fifth publication marker is published last. If interrupted before the final marker, the bundle is not considered published.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087784"/></marker></defs>
<rect x="1" y="1" width="958" height="388" rx="20" fill="#f2f8fa" stroke="#ccdde4"/>
<text x="30" y="43" font-size="24" fill="#203247" font-weight="700" font-family="system-ui,sans-serif">A complete training publication is a sequence</text>
<text x="30" y="68" font-size="14" fill="#405669" font-family="system-ui,sans-serif">Publish only after all four required files have been created and read successfully.</text>
<rect x="30" y="101" width="180" height="103" rx="12" fill="#203247"/>
<text x="46" y="133" font-size="16" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">1 · Combined</text><text x="46" y="155" font-size="15" fill="#fff" font-family="system-ui,sans-serif">checkpoint</text><text x="46" y="181" font-size="12" fill="#c2e5e6" font-family="system-ui,sans-serif">Model + AdamW moments</text>
<path d="M211 152H227" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="238" y="101" width="162" height="103" rx="12" fill="#fff" stroke="#a2bdc8"/>
<text x="254" y="133" font-size="16" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">2 · Clip policy</text><text x="254" y="164" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">Gradient threshold</text><text x="254" y="182" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">and batch sizes</text>
<path d="M402 152H418" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="429" y="101" width="158" height="103" rx="12" fill="#fff" stroke="#a2bdc8"/>
<text x="445" y="133" font-size="16" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">3 · Run lock</text><text x="445" y="164" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">Schedule, seeds</text><text x="445" y="182" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">and optimiser policy</text>
<path d="M588 152H604" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="101" width="148" height="103" rx="12" fill="#fff" stroke="#a2bdc8"/>
<text x="631" y="133" font-size="16" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">4 · Source lock</text><text x="631" y="164" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">SHA-256 of</text><text x="631" y="182" font-size="13" fill="#415a6a" font-family="system-ui,sans-serif">imported source bytes</text>
<path d="M765 152H781" stroke="#087784" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="792" y="101" width="138" height="103" rx="12" fill="#087784"/>
<text x="806" y="133" font-size="15" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">5 · Publication</text><text x="806" y="163" font-size="13" fill="#e9fffc" font-family="system-ui,sans-serif">4 file digests</text><text x="806" y="182" font-size="13" fill="#e9fffc" font-family="system-ui,sans-serif">Written LAST</text>
<rect x="30" y="237" width="425" height="104" rx="12" fill="#fff" stroke="#c2d5dd"/>
<text x="49" y="267" font-size="17" font-weight="700" fill="#203247" font-family="system-ui,sans-serif">Interrupted before step 5?</text>
<text x="49" y="294" font-size="14" fill="#445e6d" font-family="system-ui,sans-serif">No valid publication marker. Treat evidence as incomplete;</text>
<text x="49" y="314" font-size="14" fill="#445e6d" font-family="system-ui,sans-serif">never auto-reconstruct missing records.</text>
<rect x="474" y="237" width="456" height="104" rx="12" fill="#dcf4ef" stroke="#9acfc2"/>
<text x="493" y="267" font-size="17" font-weight="700" fill="#15534c" font-family="system-ui,sans-serif">Step 5 present and verified?</text>
<text x="493" y="294" font-size="14" fill="#275951" font-family="system-ui,sans-serif">Bytes match their record. Still verify the approved</text>
<text x="493" y="314" font-size="14" fill="#275951" font-family="system-ui,sans-serif">source, training policy and publisher separately.</text>
</svg>
