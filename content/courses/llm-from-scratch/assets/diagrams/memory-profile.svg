<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Model training memory budget</title><desc id="ddesc">A small diagram distinguishes persistent model and optimiser memory from temporary activation memory.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="55" y="109" width="247" height="112" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="178.5" y="161.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Weights</text>
<text x="178.5" y="189.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">persistent FP32</text>
<rect x="347" y="109" width="247" height="112" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="470.5" y="161.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Gradients</text>
<text x="470.5" y="189.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">temporary per step</text>
<rect x="640" y="109" width="247" height="112" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="763.5" y="161.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Activations</text>
<text x="763.5" y="189.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">rewind after backward</text>
<text x="470" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#203247">Memory planning: what remains and what is released</text>
<text x="470" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526879">Committed graph memory is not identical to operating-system RAM usage.</text>
</svg>
