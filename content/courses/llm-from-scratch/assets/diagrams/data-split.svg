<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Separate source documents for training and evaluation</title><desc id="ddesc">Whole files assigned to training or held-out evaluation. Testing documents are never used to train weights.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e8f6f6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087784"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" rx="18" fill="url(#bg)" stroke="#d5e7ed"/>
<rect x="31" y="105" width="267" height="130" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="164.5" y="166.0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Reviewed files</text>
<text x="164.5" y="194.0" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">known source provenance</text>
<rect x="374" y="70" width="501" height="95" rx="13" fill="#e3f5f4" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="624.5" y="113.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Train partition</text>
<text x="624.5" y="141.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">used for gradients and parameter updates</text>
<rect x="374" y="194" width="501" height="95" rx="13" fill="#ffffff" stroke="#c3dfe3" stroke-width="1.5"/>
<text x="624.5" y="237.5" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="720" text-anchor="middle" fill="#203247">Hold-out partition</text>
<text x="624.5" y="265.5" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#587381">used to measure generalisation, not update weights</text>
<path d="M299 169 L365 119" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M299 169 L365 239" fill="none" stroke="#087784" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#526879">Do not allow the same source document to appear in both partitions.</text>
</svg>
