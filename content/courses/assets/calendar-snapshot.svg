<title id="title">Validate a new snapshot before replacing the visible calendar</title>
<desc id="desc">CSV bytes pass encoding, schema and event checks. Success replaces the model and displays its source facts. Failure retains the previous model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276080"/></marker></defs>
<rect width="900" height="290" rx="18" fill="#eef5fa"/>
<g fill="#fff" stroke="#276080" stroke-width="2"><rect x="20" y="35" width="190" height="90" rx="10"/><rect x="285" y="35" width="240" height="90" rx="10"/><rect x="610" y="35" width="270" height="90" rx="10"/><rect x="285" y="195" width="320" height="70" rx="10"/></g>
<g stroke="#276080" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 80H280"/><path d="M525 80H605"/><path d="M405 125V188"/></g>
<g font-family="system-ui,sans-serif" font-size="18" fill="#203247" text-anchor="middle"><text x="115" y="72">Saved CSV bytes</text><text x="115" y="101">4 MiB limit</text><text x="405" y="68">Text, schema, dates</text><text x="405" y="100">and identity checks</text><text x="565" y="65" font-size="15">valid</text><text x="745" y="70">New immutable calendar</text><text x="745" y="101">Source facts stay visible</text><text x="455" y="163" font-size="15">refused</text><text x="445" y="225">Keep the previous calendar</text><text x="445" y="251">Explain the failed check</text></g></svg>
