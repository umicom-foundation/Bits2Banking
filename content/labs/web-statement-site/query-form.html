<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a statement review</title>
    <link rel="icon" href="../../assets/branding/umicom.ico">
  </head>
  <body>
    <main>
      <img src="../../assets/branding/umicom-wordmark.svg" width="220" alt="Umicom Foundation">
      <h1>Choose a statement review</h1>
      <p>Pick a practice site and the period you want to review.</p>
      <!-- GET keeps a shareable filter in the URL for this read-only exercise. -->
      <form action="query-result.html" method="get">
        <p>
          <label for="site">Site</label>
          <select id="site" name="site">
            <option value="North Office">North Office</option>
            <option value="North + Annex">North + Annex</option>
          </select>
        </p>
        <p>
          <label for="period">Period</label>
          <select id="period" name="period">
            <option value="week">This week</option>
            <option value="month">This month</option>
          </select>
        </p>
        <button type="submit">Open review page</button>
      </form>
    </main>
  </body>
</html>
