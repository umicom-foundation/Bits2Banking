<?xml version="1.0" encoding="UTF-8"?>
<!--
  Umicom Framework
  File: resources/brand/umicom-logo-on-dark.svg

  PURPOSE:
  Store scalable umicom logo on dark artwork with accessible metadata for
  every supported frontend.

  AUTHOR AND ORGANISATION:
  Sammy Hegab
  Umicom Foundation

  LICENCE:
  MIT
-->

<!--
  This transparent wordmark keeps the Umicom name readable on dark surfaces.
  Applications select this variant through the Framework resource catalogue.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1060 256"
     role="img"
     aria-labelledby="umicom-dark-logo-title umicom-dark-logo-description">
  <title id="umicom-dark-logo-title">Umicom</title>
  <desc id="umicom-dark-logo-description">The Umicom code mark and light wordmark.</desc>
  <!-- The dark wordmark reuses the supplied canonical symbol rather than a
       separately drawn approximation that could drift from the brand. -->
  <image href="umicom-icon-on-dark.svg"
         x="10" y="10" width="236" height="236"
         preserveAspectRatio="xMidYMid meet"/>
  <!-- The pale wordmark provides clear contrast without a background tile. -->
  <text x="282" y="184"
        fill="#F4F7FB"
        font-family="Segoe UI Variable Display, Segoe UI, Inter, sans-serif"
        font-size="166"
        font-weight="650"
        letter-spacing="1">umicom</text>
</svg>
