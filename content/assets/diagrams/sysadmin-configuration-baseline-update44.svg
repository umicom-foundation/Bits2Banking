<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Configuration drift review</title><desc id="diagram-desc">Hash agreement is a byte-level property, not proof of deployed runtime state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087566"/></marker></defs>
<style>
.bg{fill:#f2f7fb;stroke:#d9e5ee;stroke-width:2} .node{fill:#fff;stroke:#3c7599;stroke-width:2} .end{fill:#d8f2e9;stroke:#087566;stroke-width:2.6}
.arrow{fill:none;stroke:#087566;stroke-width:2.8;marker-end:url(#arrow)}
.heading{fill:#12314b;font:700 29px system-ui,'Segoe UI',Arial,sans-serif}
.sub{fill:#536a7b;font:16px system-ui,'Segoe UI',Arial,sans-serif}
.main{fill:#173b51;font:700 16px system-ui,'Segoe UI',Arial,sans-serif}
