</style>
<rect class="bg" x="5" y="5" width="1030" height="290" rx="20"/>
<text class="heading" x="48" y="58">Configuration drift review</text>
<text class="sub" x="48" y="91">Hash agreement is a byte-level property, not proof of deployed runtime state.</text>
<rect class="node" x="50.0" y="127" width="174.4" height="98" rx="14"/><text class="main" x="137.2" y="163" text-anchor="middle">Expected</text><text class="small" x="137.2" y="188" text-anchor="middle">approved baseline</text><path class="arrow" d="M 226.4 178 L 237.4 178"/><rect class="node" x="241.4" y="127" width="174.4" height="98" rx="14"/><text class="main" x="328.6" y="163" text-anchor="middle">Observed</text><text class="small" x="328.6" y="188" text-anchor="middle">current bytes</text><path class="arrow" d="M 417.8 178 L 428.8 178"/><rect class="node" x="432.8" y="127" width="174.4" height="98" rx="14"/><text class="main" x="520.0" y="163" text-anchor="middle">Hash and review</text><text class="small" x="520.0" y="188" text-anchor="middle">content comparison</text><path class="arrow" d="M 609.2 178 L 620.2 178"/><rect class="node" x="624.2" y="127" width="174.4" height="98" rx="14"/><text class="main" x="711.4" y="163" text-anchor="middle">Runtime state</text><text class="small" x="711.4" y="188" text-anchor="middle">actual overrides</text><path class="arrow" d="M 800.6 178 L 811.6 178"/><rect class="end" x="815.6" y="127" width="174.4" height="98" rx="14"/><text class="main" x="902.8" y="163" text-anchor="middle">Decision</text><text class="small" x="902.8" y="188" text-anchor="middle">approve or block</text>
<text class="sub" x="50" y="264">Bits2Banking · Umicom Foundation · educational model, not an operating-system control.</text>
