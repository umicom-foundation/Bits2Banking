<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">Who owns a DMA-capable buffer, and for how long?</title><desc id="desc">An original Notes buffer is copied to a driver buffer; publication allows device access; release waits for a checked completion or separately observed reset acknowledgement.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#167a89"/></marker>
<style>.cap{font-family:Segoe UI,Arial,sans-serif;font-size:28px;font-weight:700;fill:#1c344a}.body{font-family:Segoe UI,Arial,sans-serif;font-size:19px;fill:#36546a}.small{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#39566d}.num{font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700;fill:#167a89}.code{font-family:Consolas,monospace;font-size:18px;fill:#1d3a4f}.warn{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#853a24;font-weight:600}.line{stroke:#167a89;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c8dce8;stroke-width:2;rx:16}.hcard{fill:#eaf5f5;stroke:#9ac8c8;stroke-width:2;rx:16}</style></defs>
<rect x="0" y="0" width="1280" height="520" fill="#f4f8fa" />
<text x="52" y="62" class="cap">Who owns a DMA-capable buffer, and for how long?</text>
<rect class="card" x="46" y="144" width="225" height="181" rx="16" />
<rect class="card" x="319" y="144" width="225" height="181" rx="16" />
<rect class="card" x="592" y="144" width="225" height="181" rx="16" />
<rect class="hcard" x="865" y="144" width="366" height="181" rx="16" />
<text x="65" y="174" class="num">A. Editor owns</text>
<text x="65" y="216" class="body">Original note</text>
<text x="65" y="246" class="body">buffer</text>
<text x="65" y="284" class="small">May be edited</text>
<text x="337" y="174" class="num">B. Driver owns</text>
<text x="337" y="216" class="body">Copied bounce</text>
<text x="337" y="246" class="body">buffer</text>
<text x="337" y="284" class="small">Stable storage</text>
<text x="611" y="174" class="num">C. Published</text>
<text x="611" y="216" class="body">Device may read</text>
<text x="611" y="246" class="body">or write bytes</text>
<text x="611" y="284" class="small">Still driver-owned</text>
<text x="884" y="174" class="num">D. Checked completion</text>
<text x="884" y="216" class="body">or reset ACK</text>
<text x="884" y="246" class="body">before scrub and release</text>
<text x="884" y="284" class="small">Hardware proof required</text>
<path class="line" d="M274,231 L316,231" />
<path class="line" d="M547,231 L589,231" />
<path class="line" d="M820,231 L862,231" />
<rect class="hcard" x="93" y="356" width="1090" height="108" rx="16" />
<text x="126" y="393" class="warn">CANCEL REQUEST ≠ DEVICE STOPPED</text>
<text x="126" y="421" class="body">A timeout ends the wait, not necessarily the device’s access to RAM.</text>
<text x="126" y="448" class="small">Model uses copied arrays; it never performs hardware DMA.</text>
</svg>