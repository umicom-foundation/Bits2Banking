<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1180 390">
<title id="title">Selected ELF and PE header fields</title>
<desc id="desc">ELF begins with the 7f ELF signature and includes its address class, endianness, machine and entry fields. Windows PE begins with MZ, points to a PE signature and has machine, sections and entry RVA fields. Both need bounds checks.</desc>
<rect width="1180" height="390" rx="22" fill="#f1f6f9"/>
<text x="40" y="44" fill="#153a51" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700">Reading a binary header without executing it</text>
<g font-family="Segoe UI,sans-serif">
<text x="40" y="98" fill="#176d80" font-size="22" font-weight="700">ELF</text>
<rect x="40" y="114" width="160" height="74" rx="10" fill="#193e54"/>
<text x="120" y="145" text-anchor="middle" fill="white" font-size="18" font-weight="700">7F 45 4C 46</text><text x="120" y="167" text-anchor="middle" fill="#c6e5ed" font-size="15">signature</text>
<rect x="209" y="114" width="166" height="74" rx="10" fill="#1c657e"/>
<text x="292" y="144" text-anchor="middle" fill="white" font-size="17">class and</text><text x="292" y="167" text-anchor="middle" fill="#e0f2fb" font-size="15">byte order</text>
<rect x="384" y="114" width="166" height="74" rx="10" fill="#1c657e"/>
<text x="467" y="146" text-anchor="middle" fill="white" font-size="17">e_machine</text><text x="467" y="167" text-anchor="middle" fill="#e0f2fb" font-size="15">target processor</text>
<rect x="559" y="114" width="221" height="74" rx="10" fill="#1c657e"/>
<text x="669" y="146" text-anchor="middle" fill="white" font-size="17">e_entry</text><text x="669" y="167" text-anchor="middle" fill="#e0f2fb" font-size="15">entry address</text>
<rect x="789" y="114" width="352" height="74" rx="10" fill="#d5ece7" stroke="#53a48c"/>
<text x="965" y="147" text-anchor="middle" fill="#195f4c" font-size="19" font-weight="700">RISC-V kernel: ELF64</text><text x="965" y="169" text-anchor="middle" fill="#326a5e" font-size="15">target architecture ≠ build host</text>
<text x="40" y="253" fill="#176d80" font-size="22" font-weight="700">Windows PE</text>
<rect x="40" y="268" width="160" height="74" rx="10" fill="#193e54"/>
<text x="120" y="300" text-anchor="middle" fill="white" font-size="18" font-weight="700">MZ</text><text x="120" y="320" text-anchor="middle" fill="#c6e5ed" font-size="15">file start</text>
<rect x="209" y="268" width="166" height="74" rx="10" fill="#1c657e"/>
<text x="292" y="301" text-anchor="middle" fill="white" font-size="17">offset 0x3C</text><text x="292" y="322" text-anchor="middle" fill="#e0f2fb" font-size="15">PE pointer</text>
<rect x="384" y="268" width="166" height="74" rx="10" fill="#1c657e"/>
<text x="467" y="301" text-anchor="middle" fill="white" font-size="17">PE + COFF</text><text x="467" y="322" text-anchor="middle" fill="#e0f2fb" font-size="15">machine/sections</text>
<rect x="559" y="268" width="221" height="74" rx="10" fill="#1c657e"/>
<text x="669" y="301" text-anchor="middle" fill="white" font-size="17">optional header</text><text x="669" y="322" text-anchor="middle" fill="#e0f2fb" font-size="15">entry RVA</text>
<rect x="789" y="268" width="352" height="74" rx="10" fill="#d5ece7" stroke="#53a48c"/>
<text x="965" y="300" text-anchor="middle" fill="#195f4c" font-size="18" font-weight="700">umicom-education.exe</text><text x="965" y="322" text-anchor="middle" fill="#326a5e" font-size="15">read-only C23 header inspection</text>
</g>
</svg>
