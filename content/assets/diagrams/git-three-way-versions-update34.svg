<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Three-way versions</title><desc id="desc">Base commit is the common ancestor. Ours and theirs derive from base and either agree or need explicit review.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192b43}.heading{font-size:26px;font-weight:750}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#35536a}.mono{font-size:15px;font-family:Consolas,monospace}.darktext{fill:#fff}.line{stroke:#54758b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.box{fill:#f3f8fd;stroke:#315f83;stroke-width:2}.ok{fill:#e1f6ee;stroke:#08745f;stroke-width:2}.warn{fill:#fff1da;stroke:#bb7429;stroke-width:2}.dark{fill:#14283f;stroke:#243c55;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#54758b"/></marker></defs><rect width="1080" height="460" fill="#f9fbfe"/>
<text x="540" y="45" text-anchor="middle" class="heading">THREE-WAY REVIEW · COMPARE THE COMMON ANCESTOR</text>
<rect x="410" y="78" width="260" height="76" rx="14" class="dark"/>
<text x="540" y="110" text-anchor="middle" class="label darktext">BASE</text>
<text x="540" y="134" text-anchor="middle" class="small darktext">ledger.c · v1</text>
<path d="M480,155 L290,212" class="line"/>
<path d="M600,155 L790,212" class="line"/>
<rect x="100" y="216" width="360" height="85" rx="14" class="box"/>
<text x="280" y="246" text-anchor="middle" class="label">OURS</text>
<text x="280" y="275" text-anchor="middle" class="small">fixed-point C23 validation</text>
<rect x="620" y="216" width="360" height="85" rx="14" class="box"/>
<text x="800" y="246" text-anchor="middle" class="label">THEIRS</text>
<text x="800" y="275" text-anchor="middle" class="small">audit evidence and controls</text>
<path d="M280,301 L425,350" class="line"/>
<path d="M800,301 L655,350" class="line"/>
<rect x="357" y="351" width="365" height="75" rx="14" class="warn"/>
<text x="540" y="382" text-anchor="middle" class="label">CONFLICT · DO NOT PICK A SIDE</text>
<text x="540" y="410" text-anchor="middle" class="small">Review both implementations; run tests</text>
</svg>
