<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
<title id="title">Roles in a request to save a note</title>
<desc id="description">A person asks an application to save. The application requests operating-system services. Kernel and driver mechanisms control access to a storage device. A result returns to the application. Exact driver placement differs between operating systems.</desc>
<!-- Original educational diagram. Sammy Hegab, Umicom Foundation. MIT. -->
<rect width="960" height="440" rx="20" fill="#f3f7fb"/>
<g font-family="Arial,sans-serif" fill="#192c3e">
<g fill="#fff" stroke="#087784" stroke-width="2"><rect x="35" y="40" width="260" height="90" rx="12"/><rect x="350" y="40" width="260" height="90" rx="12"/><rect x="665" y="40" width="260" height="90" rx="12"/></g>
<text x="60" y="78" font-size="24" font-weight="bold">Person</text><text x="60" y="110" font-size="19">Chooses Save</text>
<text x="375" y="78" font-size="24" font-weight="bold">Application</text><text x="375" y="110" font-size="19">Requests a file write</text>
<text x="690" y="78" font-size="23" font-weight="bold">OS services</text><text x="690" y="110" font-size="19">Manage the request</text>
<path d="M305 85 H335 M325 75 L338 85 L325 95 M620 85 H650 M640 75 L653 85 L640 95" fill="none" stroke="#087784" stroke-width="3"/>
<rect x="350" y="200" width="575" height="90" rx="12" fill="#e3f5f4" stroke="#203247" stroke-width="2"/>
<text x="375" y="236" font-size="23" font-weight="bold">Kernel and device mechanisms</text><text x="375" y="269" font-size="20">Control permitted access to hardware</text>
<path d="M795 140 V185 M785 175 L795 188 L805 175" fill="none" stroke="#087784" stroke-width="3"/>
<rect x="35" y="200" width="260" height="90" rx="12" fill="#fff" stroke="#203247" stroke-width="2"/>
<text x="60" y="237" font-size="23" font-weight="bold">Storage device</text><text x="60" y="269" font-size="19">Stores the information</text>
<path d="M335 245 H310 M320 235 L307 245 L320 255" fill="none" stroke="#087784" stroke-width="3"/>
<text x="45" y="346" font-size="22">A result returns: the write succeeded or needs attention.</text>
<text x="45" y="380" font-size="19">The arrows show responsibility, not every internal operation.</text>
<text x="45" y="412" font-size="19">Drivers and services can be arranged differently in different systems.</text>
</g></svg>
