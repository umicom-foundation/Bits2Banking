<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Daily cash forecast with and without a late customer payment</title>
<desc id="desc">Five working days. With payment on time, balances are 7500, 14000, 6700, 3200 and 7200 pounds. With the payment late, balances are 7500, 7500, 200, minus 3300 and 700 pounds.</desc>
