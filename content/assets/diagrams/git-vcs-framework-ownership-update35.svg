<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1160 560">
  <title id="title">One Umicom Framework VCS service, several consumers</title>
  <desc id="desc">Studio, Trader and OS observe Git through a shared Framework C23 VCS contract. Bits2Banking consumes copied observations in a separate, read-only teaching model.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1e35"/><stop offset="1" stop-color="#145266"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#6ec6dd"/></marker>
    <style>.title{font:700 29px system-ui;fill:#effbff}.sub{font:16px system-ui;fill:#b9dce5}.label{font:700 19px system-ui;fill:#ebf9ff;text-anchor:middle}.small{font:14px system-ui;fill:#b7dae4;text-anchor:middle}.box{fill:#183954;stroke:#4f98ae;stroke-width:2}.core{fill:#174a56;stroke:#8ae3c5;stroke-width:3}.line{fill:none;stroke:#6ec6dd;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1160" height="560" rx="18" fill="url(#bg)"/>
  <text x="44" y="54" class="title">Framework-first source-control architecture</text>
  <text x="44" y="84" class="sub">No application-local Git parser, no duplicate source-control implementation</text>
  <rect class="box" x="55" y="132" width="275" height="95" rx="13"/><text x="192" y="169" class="label">Umicom Studio IDE</text><text x="192" y="195" class="small">status and Problems panels</text>
  <rect class="box" x="442" y="132" width="275" height="95" rx="13"/><text x="579" y="169" class="label">Umicom Trader</text><text x="579" y="195" class="small">build and workspace evidence</text>
  <rect class="box" x="830" y="132" width="275" height="95" rx="13"/><text x="967" y="169" class="label">Umicom OS</text><text x="967" y="195" class="small">gitlink review and health</text>
  <path class="line" d="M192 227 V270 H390 V295"/><path class="line" d="M579 227 V295"/><path class="line" d="M967 227 V270 H770 V295"/>
  <rect class="core" x="312" y="295" width="535" height="104" rx="15"/><text x="579" y="332" class="label">Umicom Framework (C23)</text><text x="579" y="358" class="small">UmiVcsWorkingTreeRead · Describe · Destroy</text><text x="579" y="379" class="small">Git process ownership + bounded public C ABI</text>
  <path class="line" d="M579 399 V432"/>
  <rect class="box" x="235" y="432" width="690" height="80" rx="13"/><text x="580" y="461" class="label">Bits2Banking educational C23 consumer</text><text x="580" y="488" class="small">Copy already-normalised facts; analyse safely; never stage or push</text>
  <text x="54" y="537" class="sub">Notes: detached HEAD, remote freshness, gitlink identity and test evidence are separate facts.</text>
</svg>
