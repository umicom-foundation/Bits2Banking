<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="345" viewBox="0 0 1080 345" role="img" aria-labelledby="title desc"><title id="title">Private and public keys have different responsibilities</title><desc id="desc">Never commit, upload or screenshot the private key.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#166c81"/></marker></defs><rect width="1080" height="345" fill="#f2f7fa" rx="18"/><rect x="20" y="16" width="1040" height="313" rx="15" fill="#fff" stroke="#c8dde6" stroke-width="2"/><text x="45" y="61" font-family="Segoe UI,Arial,sans-serif" font-weight="750" font-size="25" fill="#15344c">Private and public keys have different responsibilities</text><line x1="45" y1="74" x2="1030" y2="74" stroke="#d6e4e9" stroke-width="2"/><rect x="45" y="113" width="184" height="111" rx="13" fill="#e9f4fb" stroke="#34808b" stroke-width="2"/><text x="137" y="157" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#143a50">Local computer</text><text x="137" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#246273">Protect private key</text><path d="M230 168 L252 168" stroke="#166c81" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="253" y="113" width="184" height="111" rx="13" fill="#edf8f4" stroke="#34808b" stroke-width="2"/><text x="345" y="157" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#143a50">Public key</text><text x="345" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#246273">May be shared</text><path d="M438 168 L460 168" stroke="#166c81" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="461" y="113" width="184" height="111" rx="13" fill="#e9f4fb" stroke="#34808b" stroke-width="2"/><text x="553" y="157" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#143a50">Approved owner</text><text x="553" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#246273">Authorises account</text><path d="M646 168 L668 168" stroke="#166c81" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="669" y="113" width="184" height="111" rx="13" fill="#edf8f4" stroke="#34808b" stroke-width="2"/><text x="761" y="157" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#143a50">Remote server</text><text x="761" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#246273">Trusts public key</text><path d="M854 168 L876 168" stroke="#166c81" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="877" y="113" width="184" height="111" rx="13" fill="#e9f4fb" stroke="#34808b" stroke-width="2"/><text x="969" y="157" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#143a50">User session</text><text x="969" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#246273">Still scoped</text><rect x="44" y="256" width="989" height="49" rx="10" fill="#103d52"/><text x="539" y="287" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#fff">Never commit, upload or screenshot the private key.</text></svg>
