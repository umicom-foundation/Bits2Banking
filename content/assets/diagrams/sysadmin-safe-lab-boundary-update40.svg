<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1240" height="340" viewBox="0 0 1240 340">
<title>A bounded learning environment</title><desc>Boundary: no live finance data, privileged changes or destructive commands.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#177a77"/></marker></defs>
<style>.title{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#103e58}.heading{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#153548}.desc{font:15px 'Segoe UI',Arial,sans-serif;fill:#35576c}.note{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#175b54}</style>
<rect width="1240" height="340" rx="22" fill="#f9fcfd"/><text class="title" x="36" y="57">A bounded learning environment</text><rect x="35" y="108" width="255" height="118" rx="18" fill="#eaf5fd" stroke="#466f85" stroke-width="2"/><text x="163" y="143" text-anchor="middle" class="heading">Own computer</text><text x="163" y="179" text-anchor="middle" class="desc">Know whose device it is</text><path d="M293 168 H329" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="108" width="255" height="118" rx="18" fill="#eaf8f3" stroke="#466f85" stroke-width="2"/><text x="463" y="143" text-anchor="middle" class="heading">Practice folder</text><text x="463" y="179" text-anchor="middle" class="desc">Use only owned files</text><path d="M593 168 H629" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="635" y="108" width="255" height="118" rx="18" fill="#fff5e8" stroke="#466f85" stroke-width="2"/><text x="763" y="143" text-anchor="middle" class="heading">Read-only checks</text><text x="763" y="179" text-anchor="middle" class="desc">Observe actual facts</text><path d="M893 168 H929" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="935" y="108" width="255" height="118" rx="18" fill="#eff1fe" stroke="#466f85" stroke-width="2"/><text x="1063" y="143" text-anchor="middle" class="heading">Report and review</text><text x="1063" y="179" text-anchor="middle" class="desc">No unapproved changes</text><text class="note" x="35" y="286">Boundary: no live finance data, privileged changes or destructive commands.</text></svg>