<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">From device description to authorised driver use</title><desc id="desc">Five stages: firmware, bounded parser, bus translation, transport qualification, and driver claim; discovery alone does not grant access.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#167a89"/></marker>
<style>.cap{font-family:Segoe UI,Arial,sans-serif;font-size:28px;font-weight:700;fill:#1c344a}.body{font-family:Segoe UI,Arial,sans-serif;font-size:19px;fill:#36546a}.small{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#39566d}.num{font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700;fill:#167a89}.code{font-family:Consolas,monospace;font-size:18px;fill:#1d3a4f}.warn{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#853a24;font-weight:600}.line{stroke:#167a89;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c8dce8;stroke-width:2;rx:16}.hcard{fill:#eaf5f5;stroke:#9ac8c8;stroke-width:2;rx:16}</style></defs>
<rect x="0" y="0" width="1280" height="520" fill="#f4f8fa" />
<text x="52" y="62" class="cap">From device description to authorised driver use</text>
<rect class="card" x="50" y="139" width="211" height="190" rx="16" />
<rect class="card" x="308" y="139" width="211" height="190" rx="16" />
<rect class="card" x="565" y="139" width="211" height="190" rx="16" />
<rect class="hcard" x="823" y="139" width="211" height="190" rx="16" />
<rect class="card" x="1081" y="139" width="150" height="190" rx="16" />
<text x="69" y="170" class="num">1. Firmware</text>
<text x="69" y="214" class="body">Device tree</text>
<text x="69" y="243" class="body">(candidate)</text>
<text x="69" y="279" class="small">FDT bytes</text>
<text x="327" y="170" class="num">2. Parser</text>
<text x="327" y="214" class="body">Validate</text>
<text x="327" y="243" class="body">offsets and</text>
<text x="327" y="268" class="body">tokens</text>
<text x="584" y="170" class="num">3. Translate</text>
<text x="584" y="214" class="body">Resolve bus</text>
<text x="584" y="243" class="body">address; check</text>
<text x="584" y="268" class="body">overlap</text>
<text x="842" y="170" class="num">4. Qualify</text>
<text x="842" y="214" class="body">Read identity</text>
<text x="842" y="243" class="body">and negotiate</text>
<text x="842" y="268" class="body">features</text>
<text x="1097" y="170" class="num">5. Claim</text>
<text x="1097" y="214" class="body">Driver owns</text>
<text x="1097" y="243" class="body">the resource</text>
<path class="line" d="M264,229 L301,229" />
<path class="line" d="M522,229 L559,229" />
<path class="line" d="M779,229 L816,229" />
<path class="line" d="M1037,229 L1074,229" />
<rect class="hcard" x="100" y="366" width="1080" height="97" rx="16" />
<text x="132" y="402" class="body">Discovery describes a resource. Qualification and admission grant use.</text>
<text x="132" y="436" class="warn">Never dereference an advertised MMIO address in the classroom example.</text>
</svg>