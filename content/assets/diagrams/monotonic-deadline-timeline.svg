<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
<title id="title">A monotonic logical clock and two possible wait outcomes</title>
<desc id="desc">At tick 100 the Notes task waits for five ticks. A signal at tick 104 succeeds before its deadline; without the signal, tick 105 produces a timeout. A signal at the exact deadline loses.</desc>
<rect width="1080" height="410" rx="16" fill="#F2F6FA"/>
<text x="36" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#17384D">One clock, two possible outcomes</text>
<text x="36" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#496073">Deadline = start tick 100 + interval 5 = tick 105</text>
<rect x="30" y="103" width="1020" height="119" rx="12" fill="#FFFFFF" stroke="#D8E4EB"/>
<text x="49" y="133" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#264155">Signal before deadline</text>
<line x1="258" y1="181" x2="1000" y2="181" stroke="#426579" stroke-width="3"/>
<path d="M1000 181 l-14 -7 v14 z" fill="#426579"/>
<circle cx="300" cy="181" r="9" fill="#2E7B82"/>
<circle cx="749" cy="181" r="9" fill="#258A75"/>
<circle cx="884" cy="181" r="9" fill="#C58540"/>
<text x="268" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#2E7B82">100 · WAIT</text>
<text x="685" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#146A5C">104 · SIGNAL ✓</text>
<text x="840" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#89562B">105 · deadline</text>
<text x="48" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#496073">Result: EVENT</text>
<rect x="30" y="236" width="1020" height="119" rx="12" fill="#FFFFFF" stroke="#D8E4EB"/>
<text x="49" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#264155">No early signal</text>
<line x1="258" y1="315" x2="1000" y2="315" stroke="#426579" stroke-width="3"/>
<path d="M1000 315 l-14 -7 v14 z" fill="#426579"/>
<circle cx="300" cy="315" r="9" fill="#2E7B82"/>
<circle cx="884" cy="315" r="11" fill="#C58540"/>
<text x="268" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#2E7B82">100 · WAIT</text>
<text x="808" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#89562B">105 · TIMEOUT ✓</text>
<text x="48" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#496073">Result: TIMEOUT</text>
<text x="37" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#496073">Logical ticks are deterministic test values, not milliseconds or hardware interrupts.</text>
</svg>
