<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 670" role="img" aria-labelledby="title description">
 <title id="title">C23 web-service ownership boundaries</title><desc id="description">Sequence of parsing, admitted rooted file lookup, tag validation, response sending and OS services.</desc>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7fb"/><stop offset="1" stop-color="#e7f2f3"/></linearGradient>
 <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9" fill="#08777a"/></marker>
 </defs><rect width="1120" height="670" rx="25" fill="url(#bg)"/>
 <rect x="32" y="32" width="8" height="68" rx="4" fill="#0b8589"/>
 <text x="62" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">C23 web-service ownership boundaries</text>
 <text x="62" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#536879">Bits2Banking · Native C23 · Umicom Foundation</text>
<rect x="43" y="149" width="320" height="135" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="61" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">TCP listener</text><text x="61" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Owns accepted socket</text><text x="61" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">One client at a time</text><rect x="395" y="149" width="320" height="135" rx="16" fill="#e6eef9" stroke="#b5c9d5" stroke-width="1.6"/><text x="413" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Request parser</text><text x="413" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Checks bytes and Host</text><text x="413" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Publishes request only on success</text><rect x="747" y="149" width="320" height="135" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="765" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Rooted file owner</text><text x="765" y="209" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Checks path and file handle</text><text x="765" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Lends admitted file bytes</text><rect x="219" y="360" width="320" height="135" rx="16" fill="#e2f5f4" stroke="#b5c9d5" stroke-width="1.6"/><text x="237" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Cache validator</text><text x="237" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Compares metadata tag</text><text x="237" y="443" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Selects 200 or 304</text><rect x="649" y="360" width="320" height="135" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="667" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Response sender</text><text x="667" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Accounts for transmitted bytes</text><text x="667" y="443" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Closes client socket</text><path d="M364 216 L390 216" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M716 216 L743 216" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M916 291 L390 354" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M538 428 L643 428" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="612" width="1044" height="40" rx="10" fill="#d4e8ec"/><text x="58" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#203247">Framework owns production reusable web services; Kernel owns privileged memory and I/O services.</text></svg>