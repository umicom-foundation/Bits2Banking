<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="title desc">
<title id="title">One transaction preserves related records</title><desc id="desc">A sample transfer reduces one balance and increases the other before the transaction commits</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="550" y="43" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">One transfer, one controlled transaction</text>
<rect x="55" y="92" width="250" height="112" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="180.0" y="141.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Account A</text>
<text x="180.0" y="165.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">− £10.00</text>
<rect x="427" y="92" width="250" height="112" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="552.0" y="141.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Transaction</text>
<text x="552.0" y="165.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">validate and commit</text>
<rect x="795" y="92" width="250" height="112" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="920.0" y="141.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Account B</text>
<text x="920.0" y="165.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">+ £10.00</text>
<path d="M313 148 L415 148" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<path d="M685 148 L783 148" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<text x="550" y="255" text-anchor="middle" font-size="16"  fill="#2d4f64">Either all required postings succeed, or the operation is rolled back.</text></g></svg>