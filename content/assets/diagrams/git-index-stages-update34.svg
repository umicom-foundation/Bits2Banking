<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="382" viewBox="0 0 1080 382" role="img" aria-labelledby="title desc"><title id="title">Unmerged Git index stages</title><desc id="desc">Stage 1 stores base, stage 2 stores ours and stage 3 stores theirs. Human reviewed stage 0 follows git add.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192b43}.heading{font-size:26px;font-weight:750}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#35536a}.mono{font-size:15px;font-family:Consolas,monospace}.darktext{fill:#fff}.line{stroke:#54758b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.box{fill:#f3f8fd;stroke:#315f83;stroke-width:2}.ok{fill:#e1f6ee;stroke:#08745f;stroke-width:2}.warn{fill:#fff1da;stroke:#bb7429;stroke-width:2}.dark{fill:#14283f;stroke:#243c55;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#54758b"/></marker></defs><rect width="1080" height="382" fill="#f9fbfe"/>
<text x="540" y="44" text-anchor="middle" class="heading">GIT INDEX · UNMERGED FILE</text>
<rect x="30" y="84" width="300" height="132" rx="14" class="box"/>
<text x="180" y="118" text-anchor="middle" class="label">STAGE 1</text>
<text x="180" y="151" text-anchor="middle" class="small">Merge base</text>
<text x="180" y="184" text-anchor="middle" class="mono">git show :1:path</text>
<rect x="390" y="84" width="300" height="132" rx="14" class="box"/>
<text x="540" y="118" text-anchor="middle" class="label">STAGE 2</text>
<text x="540" y="151" text-anchor="middle" class="small">Checked-out side</text>
<text x="540" y="184" text-anchor="middle" class="mono">git show :2:path</text>
<rect x="750" y="84" width="300" height="132" rx="14" class="box"/>
<text x="900" y="118" text-anchor="middle" class="label">STAGE 3</text>
<text x="900" y="151" text-anchor="middle" class="small">Incoming side</text>
<text x="900" y="184" text-anchor="middle" class="mono">git show :3:path</text>
<path d="M540,218 L540,264" class="line"/>
<rect x="292" y="265" width="496" height="88" rx="14" class="ok"/>
<text x="540" y="299" text-anchor="middle" class="label">STAGE 0 · REVIEWED RESULT</text>
<text x="540" y="328" text-anchor="middle" class="small">Edit + test + git add path</text>
</svg>
