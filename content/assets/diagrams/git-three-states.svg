<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 345" role="img" aria-labelledby="title desc">
<title id="title">Git working tree staging area and HEAD</title><desc id="desc">Edited files in the working tree are staged with git add, then committed as the next immutable snapshot. Git diff compares working tree to index, while git diff --cached compares index to HEAD.</desc>
<defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#155c86"/></marker></defs>
<rect width="1040" height="345" rx="18" fill="#f2f7fa"/><text x="38" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#133047">Git records the proposed snapshot, not every file on disk</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#18374b">
<rect x="45" y="99" width="254" height="115" rx="14" stroke="#1f7093" stroke-width="2" fill="#fff"/><text x="172" y="140" font-size="22" font-weight="700">Working tree</text><text x="172" y="173" font-size="16">files you are editing</text>
<rect x="394" y="99" width="254" height="115" rx="14" stroke="#1b8065" stroke-width="2" fill="#def5ea"/><text x="521" y="140" font-size="22" font-weight="700">Index</text><text x="521" y="173" font-size="16">proposed next snapshot</text>
<rect x="743" y="99" width="254" height="115" rx="14" stroke="#6b6bb0" stroke-width="2" fill="#eeebfd"/><text x="870" y="140" font-size="22" font-weight="700">HEAD commit</text><text x="870" y="173" font-size="16">recorded project history</text>
</g>
<g fill="none" stroke="#155c86" stroke-width="3" marker-end="url(#g)"><path d="M299 151H389"/><path d="M648 151H738"/></g>
<text x="345" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#155c86">git add</text><text x="694" y="130" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#155c86">commit</text>
<rect x="100" y="245" width="840" height="59" rx="12" fill="#fff" stroke="#c2d2db"/>
<text x="520" y="269" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#264759">git diff: working tree ↔ index</text><text x="520" y="291" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#264759">git diff --cached: index ↔ HEAD</text>
</svg>
