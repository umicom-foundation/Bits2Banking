<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="From observation to a release claim">
<title>From observation to a release claim</title><desc>A clean status answers only one question. Each claim needs its own evidence.</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#426d88"/></marker></defs>
<style>.title{font:700 27px system-ui,sans-serif;fill:#142d49}.sub{font:15px system-ui,sans-serif;fill:#4a6274}.name{font:700 17px system-ui,sans-serif;fill:#163f61}.detail{font:13px system-ui,sans-serif;fill:#3c596b}.foot{font:14px system-ui,sans-serif;fill:#4a6274}</style>
<rect width="1120" height="380" rx="16" fill="#fafcff" stroke="#d4e1ec"/>
<text x="50" y="50" class="title">From observation to a release claim</text><text x="50" y="77" class="sub">A clean status answers only one question. Each claim needs its own evidence.</text>
<g><rect x="35" y="134" width="220" height="91" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="145.0" y="164" class="name" text-anchor="middle">Git working tree</text><text x="145.0" y="187" class="detail" text-anchor="middle">modified / staged / untracked</text></g><path d="M255,179 L289,179" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="290" y="134" width="230" height="91" rx="13" fill="#e8f5f4" stroke="#087a70" stroke-width="2"/><text x="405.0" y="164" class="name" text-anchor="middle">Framework VCS</text><text x="405.0" y="187" class="detail" text-anchor="middle">owned snapshot + commit ID</text></g><path d="M520,179 L554,179" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="555" y="134" width="230" height="91" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="670.0" y="164" class="name" text-anchor="middle">Build and tests</text><text x="670.0" y="187" class="detail" text-anchor="middle">results linked to exact input</text></g><path d="M785,179 L819,179" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="820" y="134" width="260" height="91" rx="13" fill="#e8f5f4" stroke="#087a70" stroke-width="2"/><text x="950.0" y="164" class="name" text-anchor="middle">Publication review</text><text x="950.0" y="187" class="detail" text-anchor="middle">index, Git SHA and parent pin</text></g><text x="50" y="333" class="foot">Remote freshness and a tested parent gitlink remain separate checks.</text>
</svg>