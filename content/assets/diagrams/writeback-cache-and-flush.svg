<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="A write-back cache has two different views"><title>A write-back cache has two different views</title><desc>Reading your recent change is not the same as making it survive a restart.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235a70" stroke-width="1.7" stroke-linecap="round"/></marker></defs>
 <rect width="1200" height="490" fill="#f5f9fc"/>
 <text x="38" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#16354a">A write-back cache has two different views</text>
 <text x="38" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4d6575">Reading your recent change is not the same as making it survive a restart.</text>
<rect x="70" y="124" width="335" height="142" rx="16" fill="#fff5e1" stroke="#e2a146" stroke-width="2"/>
<text x="89" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Volatile staged sector</text>
<text x="89" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">New note visible to reader</text>
<text x="89" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Dirty flag = 1</text>
<rect x="780" y="124" width="335" height="142" rx="16" fill="#e6f7f1" stroke="#52a29c" stroke-width="2"/>
<text x="799" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Simulated stable sector</text>
<text x="799" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Old note until flush</text>
<text x="799" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Retained after Crash()</text>
<path d="M410 185 L773 185" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="475" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#1b6773">Flush: copy accepted bytes</text>
<rect x="70" y="309" width="335" height="102" rx="16" fill="#fff1f0" stroke="#db7b6c" stroke-width="2"/>
<text x="89" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Crash before flush</text>
<text x="89" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Unflushed staged data disappears</text>
<rect x="780" y="309" width="335" height="102" rx="16" fill="#e6f7f1" stroke="#52a29c" stroke-width="2"/>
<text x="799" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Crash after flush</text>
<text x="799" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Acknowledged stable copy remains</text>
<path d="M240 269 L240 305" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M946 269 L946 305" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#506879">Both arrays live in RAM: stable means durable only within this deterministic simulation.</text>
</svg>