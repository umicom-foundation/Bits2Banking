<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
<title id="title">Cancellation, acknowledgement and return are different</title><desc id="desc">An armed source can be cancelled; an entered handler cannot be erased; acknowledgement and return are separate steps.</desc>
<rect width="1160" height="420" rx="14" fill="#f1f6f8"/>
<text x="38" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#203247">Cancellation, acknowledgement and return are different</text>
<rect x="35" y="93" width="280" height="85" rx="10" fill="#e2f2e8" stroke="#95c2ac" stroke-width="2"/><text x="175" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">ARMED</text><text x="175" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">No handler has entered</text><rect x="440" y="93" width="280" height="85" rx="10" fill="#e2f0fa" stroke="#94b9cf" stroke-width="2"/><text x="580" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">SERVICING</text><text x="580" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Handler has begun</text><rect x="845" y="93" width="280" height="85" rx="10" fill="#e2f0fa" stroke="#94b9cf" stroke-width="2"/><text x="985" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">ACKED</text><text x="985" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Recorded acknowledgement</text><path d="M315 135 L430 135" fill="none" stroke="#36677c" stroke-width="3"/><path d="M439 135 l-12 -7 v14 z" fill="#36677c"/><path d="M720 135 L835 135" fill="none" stroke="#36677c" stroke-width="3"/><path d="M844 135 l-12 -7 v14 z" fill="#36677c"/><text x="360" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#2d6676">ENTER</text><text x="756" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#2d6676">ACK</text><rect x="55" y="265" width="305" height="80" rx="10" fill="#dff4e8" stroke="#76bba4" stroke-width="2"/><text x="208" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">CANCEL is allowed</text><text x="208" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Return to LEASED</text><rect x="431" y="265" width="308" height="80" rx="10" fill="#ffebdf" stroke="#d4a078" stroke-width="2"/><text x="585" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">CANCEL is refused</text><text x="585" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Accepted handler work exists</text><rect x="813" y="265" width="303" height="80" rx="10" fill="#e2f2f6" stroke="#a6c6cf" stroke-width="2"/><text x="964" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">RETURN is separate</text><text x="964" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Do not skip completion</text><path d="M176 180 V264" stroke="#499278" stroke-width="3" fill="none"/><path d="M585 180 V264" stroke="#a97448" stroke-width="3" fill="none"/><path d="M990 180 V264" stroke="#427b92" stroke-width="3" fill="none"/>
<text x="45" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#3e5966">Cancellation stops unstarted work; acknowledgement does not mean safe handler return.</text>
</svg>