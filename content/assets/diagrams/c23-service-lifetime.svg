<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" viewBox="0 0 1200 600">
 <title id="tt">Service ownership and safe shutdown</title><desc id="dd">A C23 route registry is configured before serving and cannot be stopped during an active handler.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#187e86"/></marker></defs>
 <rect width="1200" height="600" fill="#f5f9fb" rx="14"/>
 <text x="42" y="60" font-family="Segoe UI, sans-serif" font-weight="700" font-size="30" fill="#163047">Service ownership and safe shutdown</text>
<rect x="40" y="155" width="225" height="135" rx="13" fill="#e6f1f4" stroke="#76a9ae" stroke-width="2"/>
<text x="152.5" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Zero-filled owner</text>
<text x="152.5" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">init once / stable address</text>
<rect x="345" y="155" width="235" height="135" rx="13" fill="#e6f1f4" stroke="#76a9ae" stroke-width="2"/>
<text x="462.5" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">CONFIGURING</text>
<text x="462.5" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">register / reject duplicates</text>
<rect x="655" y="155" width="225" height="135" rx="13" fill="#e5f3e7" stroke="#76a9ae" stroke-width="2"/>
<text x="767.5" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">READY</text>
<text x="767.5" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">dispatch one handler</text>
<rect x="955" y="155" width="205" height="135" rx="13" fill="#fff3dc" stroke="#76a9ae" stroke-width="2"/>
<text x="1057.5" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">STOPPED</text>
<text x="1057.5" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">resources may close</text>
<path d="M265 220 L345 220" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="305.0" y="210.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">init</text>
<path d="M580 220 L655 220" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="617.5" y="210.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">start</text>
<path d="M880 220 L955 220" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="917.5" y="210.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">stop</text>
<rect x="620" y="380" width="290" height="110" rx="13" fill="#fde7e6" stroke="#76a9ae" stroke-width="2"/>
<text x="765.0" y="415" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">BUSY while dispatching</text>
<text x="765.0" y="445" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">Stop must return BUSY</text>
<path d="M745 290 L745 380" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="745.0" y="325.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">handler active</text>
<path d="M875 380 L830 290" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="852.5" y="325.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">returns</text>
<text x="45" y="545" font-size="17" font-family="Segoe UI, sans-serif" fill="#415b70">The handler borrows its context; the owner retains it until every request is finished.</text>
</svg>
