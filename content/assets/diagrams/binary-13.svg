<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="title desc">
<title id="title">Binary representation of 13</title><desc id="desc">Binary 1101 equals eight plus four plus zero plus one</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="480" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">Binary 1101 = decimal 13</text>
<rect x="66" y="82" width="180" height="98" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="156.0" y="124.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Place value 8</text>
<text x="156.0" y="148.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Bit = 1</text>
<rect x="296" y="82" width="180" height="98" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="386.0" y="124.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Place value 4</text>
<text x="386.0" y="148.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Bit = 1</text>
<rect x="526" y="82" width="180" height="98" rx="14" fill="#fff3e2" stroke="#b57b2e" stroke-width="2"/>
<text x="616.0" y="124.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Place value 2</text>
<text x="616.0" y="148.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Bit = 0</text>
<rect x="756" y="82" width="180" height="98" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="846.0" y="124.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Place value 1</text>
<text x="846.0" y="148.0" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">Bit = 1</text>
<text x="480" y="225" text-anchor="middle" font-size="23" font-weight="700" fill="#2d4f64">8 + 4 + 0 + 1 = 13</text></g></svg>