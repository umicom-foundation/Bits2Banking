<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="From a Notes document to stored sectors"><title>From a Notes document to stored sectors</title><desc>Each layer owns a different contract: a file name is not a device address.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235a70" stroke-width="1.7" stroke-linecap="round"/></marker></defs>
 <rect width="1200" height="380" fill="#f5f9fc"/>
 <text x="38" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#16354a">From a Notes document to stored sectors</text>
 <text x="38" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4d6575">Each layer owns a different contract: a file name is not a device address.</text>
<rect x="40" y="115" width="194" height="170" rx="16" fill="#ffffff" stroke="#8bb1bd" stroke-width="2"/>
<text x="59" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Notes application</text>
<text x="59" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Working copy</text>
<text x="59" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Save requested</text>
<rect x="270" y="115" width="198" height="170" rx="16" fill="#ebf7fb" stroke="#8bb1bd" stroke-width="2"/>
<text x="289" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Filesystem</text>
<text x="289" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Paths and metadata</text>
<text x="289" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">File offsets</text>
<rect x="504" y="115" width="194" height="170" rx="16" fill="#f1f7fc" stroke="#8bb1bd" stroke-width="2"/>
<text x="523" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Block driver</text>
<text x="523" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Sector requests</text>
<text x="523" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Completion checks</text>
<rect x="734" y="115" width="198" height="170" rx="16" fill="#fff7e9" stroke="#e0ab54" stroke-width="2"/>
<text x="753" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Device/cache</text>
<text x="753" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Staged writes</text>
<text x="753" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Explicit flush</text>
<rect x="968" y="115" width="192" height="170" rx="16" fill="#e9f6f2" stroke="#53a5a0" stroke-width="2"/>
<text x="987" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Stable storage</text>
<text x="987" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Persistence depends</text>
<text x="987" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">on device contract</text>
<path d="M238 200 L262 200" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M472 200 L496 200" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M702 200 L726 200" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M936 200 L960 200" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#506879">The classroom laboratories simulate the final two stages; they do not issue hardware writes.</text>
</svg>