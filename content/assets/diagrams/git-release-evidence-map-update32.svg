<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Release qualification requires separate evidence</title><desc id="desc">Source identity, tests, documentation and deployed behaviour are not interchangeable.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80d3f1" /></marker></defs><rect width="1200" height="430" rx="18" fill="#0b1624" /><text x="40" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#e9f4ff" font-weight="bold" text-anchor="start">Release qualification requires separate evidence</text><text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">Source identity, tests, documentation and deployed behaviour are not interchangeable.</text><rect x="45" y="125" width="238" height="155" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><text x="164.0" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Commit SHA</text><text x="164.0" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">HEAD / remote identity</text><text x="164.0" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">Framework pin</text><rect x="333" y="125" width="238" height="155" rx="14" fill="#1c3752" stroke="#9be8b0" stroke-width="2" /><text x="452.0" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Native build</text><text x="452.0" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">compiler and preset</text><text x="452.0" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">warnings / exit status</text><rect x="621" y="125" width="238" height="155" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><text x="740.0" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Tests and docs</text><text x="740.0" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">CTest result</text><text x="740.0" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">MkDocs strict build</text><rect x="909" y="125" width="238" height="155" rx="14" fill="#1c3752" stroke="#ffd483" stroke-width="2" /><text x="1028.0" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Distribution</text><text x="1028.0" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">artifact checksum</text><text x="1028.0" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">boot / startup checks</text><path d="M283 203 L324 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><path d="M571 203 L612 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><path d="M859 203 L900 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><text x="56" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#e9f4ff" font-weight="normal" text-anchor="start">Release decision = reviewed evidence for the exact revision, not the existence of a Git tag.</text><text x="56" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#b4c9dc" font-weight="normal" text-anchor="start">NOT RUN must remain NOT RUN. Linux tests cannot certify an untested Windows deployment.</text></svg>