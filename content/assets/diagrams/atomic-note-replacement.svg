<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 435">
  <title id="title">Failure-atomic Notes replacement with an injectable allocator</title>
  <desc id="desc">Old note stays readable while title and body are allocated. If allocation fails, temporary memory is freed. If both allocations succeed, the new note replaces the previous pair and the revision increases.</desc>
  <rect x="0" y="0" width="1000" height="435" fill="#f5f8fb" rx="18"/>
  <rect x="30" y="25" width="240" height="108" fill="#ffffff" rx="10" stroke="#50798c" stroke-width="2"/>
  <text x="150" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#173b51">Original note</text>
  <text x="150" y="87" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">Title and body</text>
  <text x="150" y="111" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">Revision 1</text>
  <path d="M270 80 H360" fill="none" stroke="#147f88" stroke-width="4"/>
  <polygon points="360,80 348,73 348,87" fill="#147f88"/>
  <rect x="365" y="25" width="270" height="108" fill="#e4f4f3" rx="10" stroke="#147f88" stroke-width="2"/>
  <text x="500" y="59" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#173b51">Prepare copies</text>
  <text x="500" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">Allocate new title</text>
  <text x="500" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">Allocate new body</text>
  <path d="M635 80 H735" fill="none" stroke="#147f88" stroke-width="4"/>
  <polygon points="735,80 723,73 723,87" fill="#147f88"/>
  <rect x="740" y="25" width="230" height="108" fill="#fff" rx="10" stroke="#50798c" stroke-width="2"/>
  <text x="855" y="59" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#173b51">Check result</text>
  <text x="855" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">Both ready?</text>
  <path d="M855 133 V186 M855 186 H661 V214" stroke="#008a66" stroke-width="4" fill="none"/>
  <path d="M855 186 H865 V214" stroke="#b96c2c" stroke-width="4" fill="none"/>
  <rect x="510" y="218" width="290" height="135" fill="#e6f6ed" stroke="#008a66" stroke-width="2.5" rx="11"/>
  <text x="655" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#007853">SUCCESS</text>
  <text x="655" y="277" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#245649">Publish both new values</text>
  <text x="655" y="303" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#245649">Release old copies</text>
  <text x="655" y="329" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#245649">Revision becomes 2</text>
  <rect x="817" y="218" width="153" height="135" fill="#fff0e4" stroke="#b96c2c" stroke-width="2.5" rx="11"/>
  <text x="894" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#9f561e">FAILURE</text>
  <text x="894" y="276" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#704a30">Free temporary</text>
  <text x="894" y="299" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#704a30">copies</text>
  <text x="894" y="329" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#704a30">Old note intact</text>
  <path d="M150 133 V375 H893 V355" stroke="#b96c2c" stroke-width="2" stroke-dasharray="7 7" fill="none"/>
  <text x="500" y="407" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#355768">The original data is retained until a complete replacement is ready.</text>
</svg>
