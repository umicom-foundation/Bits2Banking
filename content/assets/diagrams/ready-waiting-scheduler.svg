<?xml version="1.0" encoding="UTF-8"?>
<!-- Bits to Banking · Umicom Foundation · MIT · Source-editable teaching diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Task scheduling: ready, running, and waiting</title>
<desc id="desc">Notes waits for an external event, Reports runs, and Notes rejoins the back of the ready queue when woken.</desc>
<rect width="1100" height="440" fill="#f2f6f9"/>
<rect x="30" y="25" width="1040" height="390" rx="17" fill="#ffffff" stroke="#cadae5" stroke-width="2"/>
<text x="64" y="70" fill="#1e394b" font-size="27" font-weight="700" font-family="Segoe UI, sans-serif">One processor, several tasks</text>
<rect x="65" y="105" width="385" height="115" rx="12" fill="#e9f6f3" stroke="#168378" stroke-width="2"/>
<text x="90" y="135" fill="#105c55" font-size="20" font-weight="700" font-family="Segoe UI, sans-serif">READY — FIFO queue</text>
<rect x="89" y="157" width="327" height="43" rx="7" fill="#ffffff" stroke="#168378"/>
<text x="176" y="184" fill="#1e394b" font-size="18" font-family="Segoe UI, sans-serif">Notes (woken)</text>
<path d="M 452 169 H 528" stroke="#178477" stroke-width="4" fill="none"/>
<path d="M 528 169 l -13 -8 v 16 z" fill="#178477"/>
<rect x="530" y="105" width="244" height="115" rx="12" fill="#1b475e"/>
<text x="563" y="137" fill="#f5f9fd" font-size="20" font-weight="700" font-family="Segoe UI, sans-serif">RUNNING</text>
<text x="561" y="179" fill="#f5f9fd" font-size="23" font-family="Segoe UI, sans-serif">Reports</text>
<rect x="800" y="105" width="230" height="115" rx="12" fill="#fff5e1" stroke="#cf9947" stroke-width="2"/>
<text x="826" y="137" fill="#775414" font-size="20" font-weight="700" font-family="Segoe UI, sans-serif">WAITING</text>
<text x="829" y="177" fill="#775414" font-size="20" font-family="Segoe UI, sans-serif">(now empty)</text>
<text x="67" y="269" fill="#455e6c" font-size="18" font-family="Segoe UI, sans-serif">1. Notes waits for storage confirmation and leaves the ready queue.</text>
<text x="67" y="303" fill="#455e6c" font-size="18" font-family="Segoe UI, sans-serif">2. Reports is selected. Notes cannot run while blocked.</text>
<text x="67" y="337" fill="#455e6c" font-size="18" font-family="Segoe UI, sans-serif">3. On wake, Notes rejoins the back of Ready, not the front.</text>
<text x="67" y="384" fill="#008075" font-size="16" font-weight="650" font-family="Segoe UI, sans-serif">Bits2Banking · single-threaded C23 simulation, not a real Kernel trace</text>
</svg>
