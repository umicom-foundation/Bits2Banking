<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 303" width="1040" height="303" role="img" aria-labelledby="title desc">
<title id="title">Balanced donation journal</title><desc id="desc">Debit cash fifty pounds and credit donation income fifty pounds</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="520" y="43" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">A balanced £50 donation journal</text>
<rect x="70" y="88" width="410" height="104" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="275.0" y="133.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">DEBIT — Cash at bank</text>
<text x="275.0" y="157.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">+ £50 asset</text>
<rect x="560" y="88" width="410" height="104" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="765.0" y="133.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">CREDIT — Donation income</text>
<text x="765.0" y="157.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">+ £50 income</text>
<text x="520" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#2d4f64">Total debit £50 = total credit £50</text></g></svg>