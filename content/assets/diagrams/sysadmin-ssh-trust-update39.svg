<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title39 desc39" viewBox="0 0 1160 317">
<title id="title39">SSH uses two distinct trust checks</title><desc id="desc39">Do not suppress unexpected changed-host-key warnings.</desc>
<defs><linearGradient id="bg39" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf4f7"/></linearGradient><marker id="arrow39" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167f75"/></marker></defs>
<rect width="1160" height="317" rx="20" fill="url(#bg39)"/>
<text x="580" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#12304b">SSH uses two distinct trust checks</text>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="38" y="105" width="240" height="115" rx="17" fill="#e7f7f1" stroke="#91b3c5" stroke-width="2"/><text x="158" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#12304b">Local SSH client</text><text x="158" y="183" text-anchor="middle" font-size="15" fill="#3e5968">Keep private key private</text><rect x="326" y="105" width="240" height="115" rx="17" fill="#f1f6fd" stroke="#91b3c5" stroke-width="2"/><text x="446" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#12304b">Host verification</text><text x="446" y="183" text-anchor="middle" font-size="15" fill="#3e5968">Verify server fingerprint</text><rect x="614" y="105" width="240" height="115" rx="17" fill="#f1f6fd" stroke="#91b3c5" stroke-width="2"/><text x="734" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#12304b">Encrypted channel</text><text x="734" y="183" text-anchor="middle" font-size="15" fill="#3e5968">Authenticated transport</text><rect x="902" y="105" width="240" height="115" rx="17" fill="#e7f7f1" stroke="#91b3c5" stroke-width="2"/><text x="1022" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#12304b">Remote identity</text><text x="1022" y="183" text-anchor="middle" font-size="15" fill="#3e5968">Permissions on the host</text><path d="M280 163 H319" stroke="#167f75" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow39)"/><path d="M568 163 H607" stroke="#167f75" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow39)"/><path d="M856 163 H895" stroke="#167f75" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow39)"/></g>
<text x="580" y="273" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#23645c">Do not suppress unexpected changed-host-key warnings.</text>
