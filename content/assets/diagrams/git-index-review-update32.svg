<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" role="img" aria-labelledby="title desc"><title id="title">The Git index is a reviewed snapshot</title><desc id="desc">One repository, three distinct versions of the same files.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80d3f1" /></marker></defs><rect width="1200" height="395" rx="18" fill="#0b1624" /><text x="40" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#e9f4ff" font-weight="bold" text-anchor="start">The Git index is a reviewed snapshot</text><text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">One repository, three distinct versions of the same files.</text><rect x="45" y="122" width="335" height="148" rx="14" fill="#1c3752" stroke="#9be8b0" stroke-width="2" /><text x="212.5" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">HEAD — recorded commit</text><text x="212.5" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">git show HEAD</text><text x="212.5" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">committed source</text><rect x="431" y="122" width="335" height="148" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><text x="598.5" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Index — next snapshot</text><text x="598.5" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">git diff --cached</text><text x="598.5" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">git add -A stages changes</text><rect x="817" y="122" width="335" height="148" rx="14" fill="#1c3752" stroke="#ffd483" stroke-width="2" /><text x="984.5" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Worktree — current files</text><text x="984.5" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">git diff</text><text x="984.5" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">untracked files: git status</text><path d="M380 195 L422 195" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><path d="M766 195 L808 195" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><text x="45" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e9f4ff" font-weight="normal" text-anchor="start">Read before writing: git status  →  git add -A  →  git diff --cached --check  →  review  →  commit</text><text x="45" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">Unstaging a path does not delete the working file. Git cannot approve a diff for you.</text></svg>