<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Manual-reset and auto-reset event behaviour</title>
<desc id="desc">A manual-reset signal stays set until reset; an auto-reset signal grants one waiting consumer or retains one credit. Neither counts messages in the queue.</desc>
<rect width="1120" height="420" fill="#F2F6FA" rx="15"/>
<text x="38" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#18374B">Events remember a condition, not the message bytes</text>
<rect x="28" y="74" width="520" height="278" rx="15" fill="white" stroke="#D1E0E8" stroke-width="2"/>
<rect x="570" y="74" width="520" height="278" rx="15" fill="white" stroke="#D1E0E8" stroke-width="2"/>
<text x="52" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#1B5766">Manual-reset event</text>
<text x="593" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#1B5766">Auto-reset event</text>
<rect x="54" y="149" width="137" height="66" rx="10" fill="#D8F1E9" stroke="#71B5A5"/>
<text x="84" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#165B51">SIGNAL</text>
<path d="M197 182 H250" stroke="#3A6777" stroke-width="3" fill="none"/>
<path d="M250 182 l-12 -7 v14 z" fill="#3A6777"/>
<rect x="256" y="149" width="257" height="66" rx="10" fill="#E3F1F7" stroke="#89B8C7"/>
<text x="274" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#245470">State remains signalled</text>
<text x="274" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#245470">until the owner resets it</text>
<text x="54" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#395569">All eligible waiters can observe the condition.</text>
<text x="54" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#56707C">Use when the condition genuinely remains true.</text>
<rect x="598" y="149" width="137" height="66" rx="10" fill="#D8F1E9" stroke="#71B5A5"/>
<text x="628" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#165B51">SIGNAL</text>
<path d="M741 182 H796" stroke="#3A6777" stroke-width="3" fill="none"/>
<path d="M796 182 l-12 -7 v14 z" fill="#3A6777"/>
<rect x="802" y="149" width="257" height="66" rx="10" fill="#FFF1DB" stroke="#D4AD64"/>
<text x="819" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#77532B">One waiter / one credit</text>
<text x="819" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#77532B">then the credit clears</text>
<text x="596" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#395569">Repeated signals may coalesce into one credit.</text>
<text x="596" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#56707C">The receiver must still check its owned queue.</text>
<rect x="28" y="365" width="1062" height="34" rx="8" fill="#E4EBF0"/>
<text x="44" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#27485A">Either way: an event is a notification. The message queue remains the source of truth.</text>
</svg>
