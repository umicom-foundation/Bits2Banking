<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="840" viewBox="0 0 1460 840" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Virtual filesystem dispatch</title><desc id="dsc">An application path resolves to a VFS mount and then an independently owned provider.</desc>
<defs><marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#0b7285"/></marker><marker id="tip2" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#577486"/></marker></defs>
<style>
:root { color-scheme: light; }
.title {font:700 38px 'Segoe UI',Arial,sans-serif;fill:#203247}
.sub {font:21px 'Segoe UI',Arial,sans-serif;fill:#435a69}
.boxhead {font:700 25px 'Segoe UI',Arial,sans-serif;fill:#153f59}
.body {font:20px 'Segoe UI',Arial,sans-serif;fill:#213c51}
.small {font:18px 'Segoe UI',Arial,sans-serif;fill:#486276}
.label {font:700 20px 'Segoe UI',Arial,sans-serif;fill:#0a6376}
.step {font:700 23px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
.arrow {stroke:#0b7285;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#tip)}
.dash {stroke:#577486;stroke-width:3;stroke-dasharray:8,7;fill:none;marker-end:url(#tip2)}
</style><rect width="1460" height="840" fill="#f4f8fa"/>
<text class="title" x="55" y="68">From a pathname to a storage provider</text>
<text class="sub" x="55" y="109">The VFS validates the name and delegates I/O; providers own file bytes.</text>
<rect x="435" y="148" rx="18" width="590" height="116" fill="#ffffff" stroke="#8bbbc2" stroke-width="2"/><text class="boxhead" x="455" y="189">Application: open a document</text><text class="body" x="455" y="231">/notes/PROJECT.TXT</text>
<polyline class="arrow" points="730,264 730,303"/>
<rect x="465" y="306" rx="18" width="530" height="142" fill="#e5f3f5" stroke="#8bbbc2" stroke-width="2"/><text class="boxhead" x="485" y="347">VFS: validate and select mount</text><text class="body" x="485" y="389">Reject traversal and missing paths</text><text class="body" x="485" y="423">Issue a client-owned descriptor token</text>
<polyline class="arrow" points="600,448 390,500 390,541"/>
<polyline class="arrow" points="860,448 1080,500 1080,541"/>
<rect x="70" y="543" rx="18" width="635" height="176" fill="#ecf4fd" stroke="#9abadd" stroke-width="2"/><text class="boxhead" x="90" y="584">/notes  →  RAM Notes provider</text><text class="body" x="90" y="626">Open / Read / Write / Unlink / Release</text><text class="body" x="90" y="660">Provider owns mutable, copied file bytes</text>
<rect x="755" y="543" rx="18" width="635" height="176" fill="#eef8e9" stroke="#a2c49b" stroke-width="2"/><text class="boxhead" x="775" y="584">/library  →  Reference provider</text><text class="body" x="775" y="626">Open / Read / Release</text><text class="body" x="775" y="660">Write and Unlink are unavailable</text>
<text class="small" x="110" y="780">Same VFS interface; different storage and permission policies.</text>
</svg>
