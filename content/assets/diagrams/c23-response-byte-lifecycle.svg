<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" viewBox="0 0 1200 650">
 <title id="tt">Response bytes and completion</title><desc id="dd">A response is complete only when every planned wire byte has been accepted by the local socket API.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#187e86"/></marker></defs>
 <rect width="1200" height="650" fill="#f5f9fb" rx="14"/>
 <text x="42" y="60" font-family="Segoe UI, sans-serif" font-weight="700" font-size="30" fill="#163047">Response bytes and completion</text>
<rect x="45" y="150" width="250" height="125" rx="13" fill="#e6f1f4" stroke="#76a9ae" stroke-width="2"/>
<text x="170.0" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">HTTP headers</text>
<text x="170.0" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">status / type / length</text>
<rect x="380" y="150" width="250" height="125" rx="13" fill="#e5f3e7" stroke="#76a9ae" stroke-width="2"/>
<text x="505.0" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">GET body</text>
<text x="505.0" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">0 ... N counted bytes</text>
<rect x="715" y="150" width="235" height="125" rx="13" fill="#e5f3e7" stroke="#76a9ae" stroke-width="2"/>
<text x="832.5" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Complete</text>
<text x="832.5" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">all planned bytes sent</text>
<path d="M295 212 L380 212" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="337.5" y="202.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">GET</text>
<path d="M630 212 L715 212" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="672.5" y="202.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">all bytes</text>
<rect x="380" y="340" width="250" height="110" rx="13" fill="#fff3dc" stroke="#76a9ae" stroke-width="2"/>
<text x="505.0" y="375" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">HEAD</text>
<text x="505.0" y="405" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">no body on wire</text>
<path d="M295 245 L380 390" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="337.5" y="307.5" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">HEAD</text>
<path d="M630 390 L715 270" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="672.5" y="320.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">headers done</text>
<rect x="715" y="395" width="235" height="120" rx="13" fill="#fde7e6" stroke="#76a9ae" stroke-width="2"/>
<text x="832.5" y="430" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Failed</text>
<text x="832.5" y="460" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">disconnect / timeout</text>
<path d="M630 280 L715 430" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="672.5" y="345.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">partial</text>
<rect x="50" y="475" width="275" height="110" rx="13" fill="#fff3dc" stroke="#76a9ae" stroke-width="2"/>
<text x="187.5" y="510" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Declared length</text>
<text x="187.5" y="540" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">GET announces full body</text>
<text x="187.5" y="563" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">HEAD sends no body</text>
<text x="45" y="620" font-size="17" font-family="Segoe UI, sans-serif" fill="#415b70">“Sent” here means accepted by the local network stack; it is not an end-to-end acknowledgement.</text>
</svg>
