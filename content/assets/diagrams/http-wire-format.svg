<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">HTTP/1.1 request and response wire format</title>
<desc id="desc">A simple GET request has a request line, a Host header and a blank CRLF line. The response contains a status, headers, a blank line and fixed JSON body. The parser treats bytes as counted input.</desc>
<defs><style>.bg{fill:#f2f7fa}.box{fill:#fff;stroke:#a0bdcf;stroke-width:2}.label{font:700 23px 'Segoe UI',Arial,sans-serif;fill:#173a55}.small{font:17px 'Segoe UI',Arial,sans-serif;fill:#426177}.code{font:20px Consolas,'Liberation Mono',monospace;fill:#203e52}.mark{fill:#e0f4eb;stroke:#3b9b84}.amber{fill:#fff0d5;stroke:#c18c35}</style></defs>
<rect class="bg" width="1080" height="560" rx="18"/>
<text x="42" y="50" class="label">HTTP messages are structured bytes, not arbitrary strings</text>
<rect x="42" y="80" width="470" height="403" rx="12" class="box"/>
<rect x="566" y="80" width="470" height="403" rx="12" class="box"/>
<text x="66" y="119" class="label">Request</text><text x="590" y="119" class="label">Response</text>
<rect x="60" y="141" width="429" height="51" rx="8" class="mark"/><text x="73" y="174" class="code">GET /health HTTP/1.1</text>
<rect x="60" y="207" width="429" height="51" rx="8" class="mark"/><text x="73" y="240" class="code">Host: 127.0.0.1:8765</text>
<rect x="60" y="273" width="429" height="51" rx="8" class="amber"/><text x="73" y="305" class="code">CRLF (empty line)</text>
<text x="70" y="356" class="small">The blank line completes the headers.</text>
<text x="70" y="387" class="small">Each line ends with CRLF (\r\n).</text>
<text x="70" y="419" class="small">No request body is supported here.</text>
<rect x="584" y="141" width="430" height="51" rx="8" class="mark"/><text x="597" y="174" class="code">HTTP/1.1 200 OK</text>
<rect x="584" y="207" width="430" height="51" rx="8" class="mark"/><text x="597" y="240" class="code">Content-Length: 53</text>
<rect x="584" y="273" width="430" height="51" rx="8" class="amber"/><text x="597" y="305" class="code">CRLF (empty line)</text>
<text x="595" y="356" class="code">{"status":"ready", ...}</text>
<text x="595" y="396" class="small">GET sends the response body.</text><text x="595" y="426" class="small">HEAD sends headers only.</text>
<text x="44" y="526" class="small">The real response also includes Content-Type, Connection: close, no-cache and no-sniff headers.</text>
</svg>
