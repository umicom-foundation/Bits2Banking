<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Windows Terminal can contain PowerShell 7, Windows PowerShell 5.1 and Command Prompt as separate tabs" viewBox="0 0 1120 430">
<title>Windows Terminal is a host, not a shell</title><desc>One Windows Terminal window contains separate tabs for PowerShell 7, Windows PowerShell 5.1 or Command Prompt. ISE is a separate legacy application.</desc>
<rect width="1120" height="430" rx="18" fill="#f3f8fc"/><text x="560" y="52" font-family="Segoe UI,Arial" font-size="28" fill="#123149" text-anchor="middle" font-weight="bold">Windows Terminal is a window that hosts shells</text>
<rect x="378" y="86" width="364" height="74" rx="12" fill="#d9f0e8" stroke="#1b7a72" stroke-width="3"/><text x="560" y="132" font-family="Segoe UI,Arial" font-size="24" fill="#153249" text-anchor="middle" font-weight="bold">Windows Terminal</text>
<g stroke="#168474" stroke-width="3" fill="none"><path d="M560 160 V194 H195 V216"/><path d="M560 194 V216"/><path d="M560 194 H925 V216"/></g>
<g font-family="Segoe UI,Arial" font-size="18" fill="#19394b" text-anchor="middle">
<rect x="75" y="216" width="240" height="96" rx="12" fill="#eaf5ff" stroke="#446d86" stroke-width="2"/><text x="195" y="254" font-weight="bold">PowerShell 7</text><text x="195" y="280">pwsh</text>
<rect x="440" y="216" width="240" height="96" rx="12" fill="#fff0dc" stroke="#927035" stroke-width="2"/><text x="560" y="254" font-weight="bold">Windows PowerShell</text><text x="560" y="280">5.1 · powershell.exe</text>
<rect x="805" y="216" width="240" height="96" rx="12" fill="#eaf5ff" stroke="#446d86" stroke-width="2"/><text x="925" y="254" font-weight="bold">Command Prompt</text><text x="925" y="280">cmd.exe</text>
</g><text x="560" y="356" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#30485a">ISE and Developer PowerShell are other entries; verify the actual running version.</text><text x="560" y="386" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#30485a">PowerShell: run $PSVersionTable.PSVersion before following a tutorial.</text></svg>
