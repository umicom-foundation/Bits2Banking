<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
 <title id="title">A linker resolves an external symbol and relocation</title>
 <desc id="desc">The C object has a call site and relocation referring to an unresolved Assembly function. A separate Assembly object defines the function. The linker combines both objects to produce an executable with matching symbol references.</desc>
 <rect width="1120" height="505" fill="#f5f9fc" rx="18"/>
 <text x="50" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#203247">One call, two object files, one final link</text>
 <rect x="42" y="100" width="335" height="230" rx="16" fill="#203247"/>
 <text x="63" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700">C23 object file</text>
 <text x="64" y="190" font-family="Consolas,monospace" font-size="16" fill="#cde4ea">call BtbAssemblyAddU32</text>
 <text x="64" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ffd79a">Relocation record:</text>
 <text x="64" y="260" font-family="Consolas,monospace" font-size="16" fill="#ffeccc">fix this call's address</text>
 <rect x="743" y="100" width="335" height="230" rx="16" fill="#203247"/>
 <text x="764" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700">Assembly object file</text>
 <text x="764" y="195" font-family="Consolas,monospace" font-size="16" fill="#b5f3e9">BtbAssemblyAddU32:</text>
 <text x="764" y="230" font-family="Consolas,monospace" font-size="16" fill="#dceaf3">  mov ...</text>
 <text x="764" y="260" font-family="Consolas,monospace" font-size="16" fill="#dceaf3">  add ...</text>
 <text x="764" y="290" font-family="Consolas,monospace" font-size="16" fill="#dceaf3">  ret</text>
 <rect x="455" y="137" width="212" height="144" rx="16" fill="#dff2f2" stroke="#087f8c" stroke-width="3"/>
 <text x="560" y="193" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#075869">LINKER</text>
 <text x="560" y="227" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#255e67">Resolve symbols</text>
 <text x="560" y="252" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#255e67">Apply relocations</text>
 <path d="M382 207 H447" stroke="#087f8c" stroke-width="5" fill="none"/><path d="M435 196 L450 207 L435 218" stroke="#087f8c" stroke-width="5" fill="none"/>
 <path d="M735 207 H676" stroke="#087f8c" stroke-width="5" fill="none"/><path d="M688 196 L672 207 L688 218" stroke="#087f8c" stroke-width="5" fill="none"/>
 <path d="M560 286 V358" stroke="#087f8c" stroke-width="5" fill="none"/><path d="M550 349 L560 368 L570 349" stroke="#087f8c" stroke-width="5" fill="none"/>
 <rect x="305" y="373" width="511" height="78" rx="13" fill="#e0f5e9" stroke="#178356" stroke-width="2"/>
 <text x="560" y="405" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#145a3b">Linked native executable</text>
 <text x="560" y="432" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#145a3b">C caller and Assembly callee have a matching ABI</text>
</svg>
