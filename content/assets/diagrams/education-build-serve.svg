<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" role="img" aria-labelledby="t d">
 <title id="t">Generate HTML before starting the native C web server</title>
 <desc id="d">Content Markdown and mkdocs.yml are read by the MkDocs build. Generated HTML files go into site. The C server sends those files to a browser over localhost HTTP.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#0c7081"/></marker></defs>
 <rect x="1" y="1" width="898" height="300" rx="18" fill="#f6fafc" stroke="#c7dbe5"/>
 <text x="32" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#173b51">Build once. Preview generated pages.</text>
 <rect x="27" y="90" width="185" height="125" rx="11" fill="#e5eef6" stroke="#83aabd"/>
 <text x="41" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173b51">Source</text>
 <text x="41" y="158" font-family="Consolas,monospace" font-size="15" fill="#173b51">content/*.md</text>
 <text x="41" y="187" font-family="Consolas,monospace" font-size="15" fill="#173b51">mkdocs.yml</text>
 <path d="M214 151 H255" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="262" y="90" width="151" height="125" rx="11" fill="#fff3dc" stroke="#d4ae69"/>
 <text x="278" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#704a1d">MkDocs</text>
 <text x="278" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#704a1d">build --strict</text>
 <text x="278" y="186" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#704a1d">Python required</text>
 <path d="M415 151 H454" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="461" y="90" width="187" height="125" rx="11" fill="#e1f1ea" stroke="#83b49e"/>
 <text x="477" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17513f">Generated site</text>
 <text x="477" y="158" font-family="Consolas,monospace" font-size="15" fill="#17513f">site/index.html</text>
 <text x="477" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#315f4b">Static files</text>
 <path d="M650 151 H689" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="696" y="90" width="176" height="125" rx="11" fill="#e3eef7" stroke="#84aecd"/>
 <text x="712" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173b51">Native C server</text>
 <text x="712" y="156" font-family="Consolas,monospace" font-size="14" fill="#173b51">127.0.0.1:8765</text>
 <text x="712" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173b51">Browser preview</text>
 <text x="32" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#173b51">doctor checks tools, build creates files, serve reads them.</text>
</svg>
