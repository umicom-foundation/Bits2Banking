<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="One Framework source, two consumer gitlinks">
<title>One Framework source, two consumer gitlinks</title><desc>Framework changes are published once, then tested and pinned by each consumer.</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#426d88"/></marker></defs>
<style>.title{font:700 27px system-ui,sans-serif;fill:#142d49}.sub{font:15px system-ui,sans-serif;fill:#4a6274}.name{font:700 17px system-ui,sans-serif;fill:#163f61}.detail{font:13px system-ui,sans-serif;fill:#3c596b}.foot{font:14px system-ui,sans-serif;fill:#4a6274}</style>
<rect width="1120" height="380" rx="16" fill="#fafcff" stroke="#d4e1ec"/>
<text x="50" y="50" class="title">One Framework source, two consumer gitlinks</text><text x="50" y="77" class="sub">Framework changes are published once, then tested and pinned by each consumer.</text>
<g><rect x="400" y="105" width="320" height="82" rx="13" fill="#e8f5f4" stroke="#087a70" stroke-width="2"/><text x="560.0" y="135" class="name" text-anchor="middle">Umicom Framework</text><text x="560.0" y="158" class="detail" text-anchor="middle">canonical C23 source; remote main</text></g><path d="M545,187 L285,241" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><path d="M575,187 L841,241" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="55" y="241" width="360" height="72" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="235.0" y="271" class="name" text-anchor="middle">Umicom Applications</text><text x="235.0" y="294" class="detail" text-anchor="middle">parent gitlink → tested child SHA</text></g><g><rect x="707" y="241" width="360" height="72" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="887.0" y="271" class="name" text-anchor="middle">Umicom OS</text><text x="887.0" y="294" class="detail" text-anchor="middle">separate parent gitlink → tested SHA</text></g><text x="50" y="333" class="foot">A parent commit records a child revision; it does not contain the child source tree.</text>
</svg>