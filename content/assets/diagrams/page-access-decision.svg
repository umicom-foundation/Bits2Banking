<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">How a page access succeeds or faults</title><desc id="desc">Map lookup and permissions are separate checks. The model does not handle hardware traps.</desc>
<rect width="1100" height="540" fill="#f5f9fc"/><style>
 .title{font:bold 27px 'Segoe UI',Arial,sans-serif;fill:#1c3650}.subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#425c6e}
 .label{font:bold 17px 'Segoe UI',Arial,sans-serif;fill:#182c3d}.light{font:bold 17px 'Segoe UI',Arial,sans-serif;fill:#fff}
 .small{font:14px 'Segoe UI',Arial,sans-serif;fill:#31475b}.darksmall{font:14px 'Segoe UI',Arial,sans-serif;fill:#f3fafc}
 .note{font:13px 'Segoe UI',Arial,sans-serif;fill:#4b6072}.stroke{stroke:#9eb8c4;stroke-width:2}
 </style>
<text x="46" y="52" class="title">How a page access succeeds or faults</text>
<text x="46" y="80" class="subtitle">Map lookup and permissions are separate checks. The model does not handle hardware traps.</text>
<defs><marker id="arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#087a87"/></marker></defs>
<rect x="40" y="140" width="250" height="105" rx="12" fill="#daeff2" stroke="#bed0d9" stroke-width="2"/>
<text x="60" y="188" class="label">CPU memory access</text>
<rect x="345" y="140" width="310" height="105" rx="12" fill="#fff" stroke="#bed0d9" stroke-width="2"/>
<text x="365" y="188" class="label">Is there a mapping?</text>
<rect x="730" y="140" width="330" height="105" rx="12" fill="#fff" stroke="#bed0d9" stroke-width="2"/>
<text x="750" y="188" class="label">Are the rights sufficient?</text>
<rect x="40" y="350" width="270" height="95" rx="12" fill="#ffebe8" stroke="#bed0d9" stroke-width="2"/>
<text x="60" y="398" class="label">No mapping: fault</text>
<rect x="405" y="350" width="270" height="95" rx="12" fill="#fff0d9" stroke="#bed0d9" stroke-width="2"/>
<text x="425" y="398" class="label">Not permitted: fault</text>
<rect x="775" y="350" width="285" height="95" rx="12" fill="#d2f1ee" stroke="#bed0d9" stroke-width="2"/>
<text x="795" y="398" class="label">Allowed: translate</text>
<text x="62" y="207" class="small">read / write / execute</text>
<text x="368" y="207" class="small">Look up virtual page</text>
<text x="752" y="207" class="small">Check R, W or X bit</text>
<path d="M290,192 L343,192" fill="none" stroke="#087a87" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M655,192 L730,192" fill="none" stroke="#087a87" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M425,245 L190,348" fill="none" stroke="#087a87" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M920,245 L540,349" fill="none" stroke="#087a87" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M932,245 L932,349" fill="none" stroke="#087a87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="195" y="302" class="small">No</text>
<text x="670" y="315" class="small">No</text>
<text x="944" y="310" class="small">Yes</text>
<text x="63" y="430" class="small">Not mapped</text>
<text x="420" y="430" class="small">Mapping exists, denied</text>
<text x="795" y="430" class="small">Preserve page offset</text>
<text x="46" y="520" class="note">Bits2Banking · Umicom Foundation · Editable technical illustration (teaching model; not actual hardware state)</text>
</svg>
