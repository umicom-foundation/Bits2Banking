<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 410" role="img" aria-labelledby="title desc">
<title id="title">Umicom OS gitlink and independently versioned Framework</title><desc id="desc">OS parent commit O1 stores a gitlink pointing to Framework commit F3, while Framework remote main may advance separately to F7. Updating the Framework repository alone does not update the OS gitlink.</desc>
<defs><marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1f667e"/></marker></defs>
<rect width="1020" height="410" rx="18" fill="#f2f7fa"/><text x="40" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#143043">A Git submodule is an exact commit reference, not a source copy</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="54" y="105" width="270" height="91" rx="13" fill="#d9eaff" stroke="#2d6c99" stroke-width="2"/><text x="189" y="138" font-size="20" font-weight="700" fill="#123247">Umicom OS: O1</text><text x="189" y="169" font-size="17" fill="#123247">framework gitlink = F3</text>
<rect x="385" y="232" width="215" height="91" rx="13" fill="#e0f5e8" stroke="#28805c" stroke-width="2"/><text x="492" y="265" font-size="20" font-weight="700" fill="#123247">Framework: F3</text><text x="492" y="294" font-size="16" fill="#123247">OS's pinned revision</text>
<rect x="737" y="232" width="215" height="91" rx="13" fill="#fff0d8" stroke="#a67923" stroke-width="2"/><text x="844" y="265" font-size="20" font-weight="700" fill="#123247">Framework: F7</text><text x="844" y="294" font-size="16" fill="#123247">Framework main tip</text>
</g>
<g stroke="#1f667e" stroke-width="3" fill="none" marker-end="url(#s)"><path d="M280 196L424 228"/><path d="M600 277H731"/></g>
<rect x="80" y="346" width="860" height="43" rx="10" fill="#fff" stroke="#c5d2dd"/><text x="510" y="372" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#2b4e60">To upgrade OS, verify the new Framework revision and commit the changed OS gitlink separately.</text>
</svg>
