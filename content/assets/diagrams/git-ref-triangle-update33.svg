<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="Three references, three different answers">
<title>Three references, three different answers</title><desc>Detached HEAD may differ from local main and last fetched origin/main.</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#426d88"/></marker></defs>
<style>.title{font:700 27px system-ui,sans-serif;fill:#142d49}.sub{font:15px system-ui,sans-serif;fill:#4a6274}.name{font:700 17px system-ui,sans-serif;fill:#163f61}.detail{font:13px system-ui,sans-serif;fill:#3c596b}.foot{font:14px system-ui,sans-serif;fill:#4a6274}</style>
<rect width="1120" height="380" rx="16" fill="#fafcff" stroke="#d4e1ec"/>
<text x="50" y="50" class="title">Three references, three different answers</text><text x="50" y="77" class="sub">Detached HEAD may differ from local main and last fetched origin/main.</text>
<g><rect x="52" y="124" width="290" height="92" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="197.0" y="154" class="name" text-anchor="middle">HEAD</text><text x="197.0" y="177" class="detail" text-anchor="middle">current checked-out commit</text></g><g><rect x="415" y="124" width="290" height="92" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="560.0" y="154" class="name" text-anchor="middle">refs/heads/main</text><text x="560.0" y="177" class="detail" text-anchor="middle">local branch tip</text></g><g><rect x="778" y="124" width="290" height="92" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="923.0" y="154" class="name" text-anchor="middle">origin/main</text><text x="923.0" y="177" class="detail" text-anchor="middle">locally stored remote view</text></g><path d="M342,170 L405,170" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" stroke-dasharray="7 5"/><path d="M705,170 L768,170" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" stroke-dasharray="7 5"/><text x="50" y="333" class="foot">git push origin main publishes local main, not necessarily detached HEAD.</text>
</svg>