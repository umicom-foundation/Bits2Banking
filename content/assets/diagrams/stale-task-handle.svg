<?xml version="1.0" encoding="UTF-8"?>
<!-- Bits to Banking · Umicom Foundation · MIT · Source-editable teaching diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Rejecting a stale task handle after slot reuse</title>
<desc id="desc">The slot number is the same but the generation changes when a task exits and another task is admitted. The original token is refused.</desc>
<rect width="1100" height="420" fill="#f2f6f9"/>
<rect x="25" y="22" width="1050" height="375" rx="17" fill="#ffffff" stroke="#cadae5" stroke-width="2"/>
<text x="55" y="72" fill="#1e394b" font-size="27" font-weight="700" font-family="Segoe UI, sans-serif">A slot can be reused; its old handle cannot.</text>
<text x="65" y="125" fill="#38586d" font-size="20" font-family="Segoe UI, sans-serif">Earlier task: Notes</text>
<rect x="61" y="141" width="240" height="69" rx="9" fill="#fce7e2" stroke="#bf6c56" stroke-width="2"/>
<text x="80" y="169" fill="#974634" font-size="17" font-family="Segoe UI, sans-serif">Generation = 1</text>
<text x="80" y="195" fill="#974634" font-size="17" font-family="Segoe UI, sans-serif">Slot = 1</text>
<path d="M 312 177 H 470" stroke="#b26d5e" stroke-width="4" fill="none"/>
<path d="M 470 177 l -14 -9 v 18 z" fill="#b26d5e"/>
<rect x="477" y="143" width="171" height="70" rx="9" fill="#f8ece9" stroke="#bf6c56"/>
<text x="505" y="170" fill="#974634" font-size="17" font-weight="700" font-family="Segoe UI, sans-serif">STOPPED</text>
<text x="505" y="194" fill="#974634" font-size="15" font-family="Segoe UI, sans-serif">Old token invalid</text>
<text x="66" y="275" fill="#38586d" font-size="20" font-family="Segoe UI, sans-serif">New task: Reports</text>
<rect x="61" y="291" width="240" height="69" rx="9" fill="#e5f6f0" stroke="#16847a" stroke-width="2"/>
<text x="80" y="319" fill="#105c55" font-size="17" font-family="Segoe UI, sans-serif">Generation = 2</text>
<text x="80" y="345" fill="#105c55" font-size="17" font-family="Segoe UI, sans-serif">Slot = 1</text>
<path d="M 312 323 H 470" stroke="#16847a" stroke-width="4" fill="none"/>
<path d="M 470 323 l -14 -9 v 18 z" fill="#16847a"/>
<rect x="477" y="289" width="171" height="70" rx="9" fill="#e5f6f0" stroke="#16847a"/>
<text x="502" y="319" fill="#105c55" font-size="17" font-weight="700" font-family="Segoe UI, sans-serif">READY</text>
<text x="502" y="343" fill="#105c55" font-size="15" font-family="Segoe UI, sans-serif">New token valid</text>
<rect x="708" y="141" width="324" height="218" rx="12" fill="#173f55"/>
<text x="732" y="180" fill="#ffffff" font-size="20" font-weight="700" font-family="Segoe UI, sans-serif">Lookup checks both fields</text>
<text x="732" y="223" fill="#d5e8f0" font-size="17" font-family="Segoe UI, sans-serif">1. Validate slot range</text>
<text x="732" y="255" fill="#d5e8f0" font-size="17" font-family="Segoe UI, sans-serif">2. Compare generation</text>
<text x="732" y="287" fill="#d5e8f0" font-size="17" font-family="Segoe UI, sans-serif">3. Check live state</text>
<text x="732" y="321" fill="#d5e8f0" font-size="15" font-family="Segoe UI, sans-serif">Kernel access also needs rights.</text>
</svg>
