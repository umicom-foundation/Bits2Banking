<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ttl desc">
<title id="ttl">URL path validation in a static file server</title>
<desc id="desc">A valid path under /assets can be served with a media type; dot-dot traversal, percent-escaped separators and hidden metadata are refused.</desc>
<rect width="1200" height="420" fill="#f2f6fa"/>
<text x="52" y="58" font-family="Segoe UI, sans-serif" fill="#173247" font-size="31" font-weight="700">Choose a file — never trust the URL by itself</text>
<rect x="54" y="92" width="510" height="260" rx="15" fill="white" stroke="#b7d5d7" stroke-width="2"/>
<rect x="634" y="92" width="510" height="260" rx="15" fill="white" stroke="#efb8b0" stroke-width="2"/>
<rect x="54" y="92" width="510" height="52" rx="15" fill="#006f73"/>
<rect x="634" y="92" width="510" height="52" rx="15" fill="#a33e37"/>
<text x="80" y="126" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="white">ACCEPT — inside the chosen root</text>
<text x="660" y="126" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="white">REFUSE — unsafe or unavailable access</text>
<g font-family="Consolas, monospace" font-size="20" fill="#173247">
<text x="83" y="187">/</text><text x="217" y="187" font-family="Segoe UI, sans-serif" font-size="17">index.html</text>
<text x="83" y="235">/assets/site.css</text>
<text x="83" y="283">/assets/site%2Ecss</text>
<text x="660" y="187">/../private.txt</text>
<text x="660" y="235">/%2e%2e/private.txt</text>
<text x="660" y="283">/.git/config</text>
</g>
<g font-family="Segoe UI, sans-serif" font-size="15" fill="#5d7380">
<text x="83" y="323">Verified, read-only opened file handles</text>
<text x="660" y="323">Directory traversal and metadata protection</text>
</g>
<text x="65" y="391" font-family="Segoe UI, sans-serif" font-size="17" fill="#496577">HTTP Content-Type describes the bytes; Content-Length counts bytes, not characters.</text>
</svg>
