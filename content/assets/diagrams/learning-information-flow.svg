<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title description">
<title id="title">Working information and a saved file</title>
<desc id="description">An editor has a working version in memory. Saving asks the system to store that version in a file. Opening a saved file brings information back into the application. Editing after saving can make the two versions different.</desc>
<!-- Original educational diagram. Sammy Hegab, Umicom Foundation. MIT. -->
<rect width="960" height="330" rx="20" fill="#f3f7fb"/>
<g font-family="Arial,sans-serif" fill="#192c3e">
<rect x="35" y="48" width="330" height="170" rx="16" fill="#e3f5f4" stroke="#087784" stroke-width="2"/>
<text x="60" y="88" font-size="25" font-weight="bold">Working version</text>
<text x="60" y="126" font-size="21">Held by the application</text>
<text x="60" y="158" font-size="21">while you edit</text>
<text x="60" y="192" font-size="19">May include unsaved changes</text>
<rect x="595" y="48" width="330" height="170" rx="16" fill="#fff" stroke="#203247" stroke-width="2"/>
<text x="620" y="88" font-size="25" font-weight="bold">Saved file</text>
<text x="620" y="126" font-size="21">Named information</text>
<text x="620" y="158" font-size="21">in persistent storage</text>
<text x="620" y="192" font-size="19">Check its name and location</text>
<path d="M380 100 H565" stroke="#087784" stroke-width="4"/><path d="M552 90 L568 100 L552 110" fill="none" stroke="#087784" stroke-width="4"/>
<text x="426" y="82" font-size="21">Save</text>
<path d="M565 175 H380" stroke="#203247" stroke-width="4"/><path d="M393 165 L377 175 L393 185" fill="none" stroke="#203247" stroke-width="4"/>
<text x="424" y="209" font-size="21">Open</text>
<text x="45" y="269" font-size="22">A request can fail. Check the application's result.</text>
<text x="45" y="302" font-size="19">This is a learning model; automatic saving and recovery depend on the application.</text>
</g></svg>
