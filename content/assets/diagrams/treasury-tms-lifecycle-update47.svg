<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="TMS financial lifecycle">
<rect width="1100" height="360" fill="#f3f7fc"/><text x="40" y="48" font-size="29" font-family="Arial" font-weight="bold" fill="#153c63">From a business agreement to a verified financial outcome</text>
<g font-size="18" font-family="Arial" text-anchor="middle"><rect x="38" y="104" width="210" height="112" rx="15" fill="#dcedfc" stroke="#235b88" stroke-width="2"/><text x="143" y="150">Trade or cash</text><text x="143" y="176">instruction</text><rect x="303" y="104" width="210" height="112" rx="15" fill="#e0f2eb" stroke="#236e62" stroke-width="2"/><text x="408" y="150">Validation</text><text x="408" y="176">and approval</text><rect x="568" y="104" width="210" height="112" rx="15" fill="#fff1d8" stroke="#ab7026" stroke-width="2"/><text x="673" y="150">Obligations</text><text x="673" y="176">and messages</text><rect x="833" y="104" width="230" height="112" rx="15" fill="#e7e4f9" stroke="#6452a0" stroke-width="2"/><text x="948" y="150">Settlement</text><text x="948" y="176">and reconciliation</text></g>
<g stroke="#476477" stroke-width="4" fill="none"><path d="M250 160h50m-14 -10l14 10-14 10"/><path d="M515 160h50m-14 -10l14 10-14 10"/><path d="M780 160h50m-14 -10l14 10-14 10"/></g><text x="45" y="290" font-size="16" font-family="Arial" fill="#344c64">Each box has an owner, an identifier, a timestamp and evidence. A generated message does not prove settlement.</text><text x="45" y="320" font-size="14" font-family="Arial" fill="#536779">Umicom Foundation · Bits to Banking · Independent teaching illustration</text></svg>
