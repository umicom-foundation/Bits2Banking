<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">A bounded educational IPC trace</title><desc id="desc">Versioned little-endian header, fixed record headers and bounded payload bytes.</desc>
<rect width="1100" height="340" fill="#f7fafc" rx="18"/>
<text x="40" y="50" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#203247">A bounded educational IPC trace</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#167a89"/></marker></defs>
<rect x="38" y="106" width="250" height="152" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="55" y="140" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Header: 16 bytes</text>
<text x="55" y="169" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Magic: UMIIPC1 + NUL</text>
<text x="55" y="194" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Version: LE16 = 1</text>
<text x="55" y="219" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Flags: LE16 = 0</text>
<text x="55" y="244" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Count: LE32</text>
<line x1="297" y1="179" x2="364" y2="179" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><rect x="374" y="106" width="320" height="152" rx="12" fill="#fff5e5" stroke="#d38d30" stroke-width="2"/>
<text x="391" y="140" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Repeated record: 16 bytes</text>
<text x="391" y="169" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Sequence: LE32</text>
<text x="391" y="194" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Kind: SEND / RECEIVE</text>
<text x="391" y="219" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Flags: zero + payload length</text>
<text x="391" y="244" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Sender ID / recipient ID</text>
<line x1="700" y1="179" x2="763" y2="179" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><rect x="774" y="106" width="289" height="152" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="791" y="140" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Payload: 0–256 bytes</text>
<text x="791" y="169" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">SEND: 1–256 bytes</text>
<text x="791" y="194" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">RECEIVE: no payload</text>
<text x="791" y="219" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">End: no extra bytes</text>
<text x="550" y="302" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#425667">A length is checked against available bytes before parsing or copying.</text></svg>
