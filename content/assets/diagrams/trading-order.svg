<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 370" width="1140" height="370" role="img" aria-labelledby="title desc">
<title id="title">Simplified order lifecycle</title><desc id="desc">After validation an order can fill, partially fill, be cancelled or be rejected</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="570" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#2d4f64">A simulated order lifecycle</text>
<rect x="70" y="98" width="220" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="180.0" y="142.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">New request</text>
<rect x="385" y="98" width="245" height="78" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="507.5" y="142.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Validation / accepted</text>
<rect x="730" y="98" width="240" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="850.0" y="142.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Working order</text>
<path d="M300 137 L375 137" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<path d="M640 137 L720 137" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="80" y="245" width="290" height="69" rx="14" fill="#fff3e2" stroke="#b57b2e" stroke-width="2"/>
<text x="225.0" y="284.5" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Rejected</text>
<rect x="380" y="245" width="290" height="69" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="525.0" y="284.5" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Partially filled</text>
<rect x="720" y="245" width="290" height="69" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="865.0" y="284.5" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Filled / cancelled</text>
<path d="M500 181 L225 236" fill="none" stroke="#247a8a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/>
<path d="M850 181 L525 236" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<path d="M850 181 L865 236" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/></g></svg>