<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Recurring maintenance and evidence</title><desc id="desc">Different cadences lead to an accountable review, not automatic success.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Recurring maintenance and evidence</text><text x="38" y="75" class="s">Different cadences lead to an accountable review, not automatic success.</text><rect class="step" x="40" y="145" width="216" height="112" rx="14"/><text x="148.0" y="182" text-anchor="middle" class="x">Daily</text><text x="148.0" y="211" text-anchor="middle" class="s">Disk + queue</text><rect class="step" x="296" y="145" width="216" height="112" rx="14"/><text x="404.0" y="182" text-anchor="middle" class="x">Weekly</text><text x="404.0" y="211" text-anchor="middle" class="s">Backup status</text><rect class="step" x="552" y="145" width="216" height="112" rx="14"/><text x="660.0" y="182" text-anchor="middle" class="x">Monthly</text><text x="660.0" y="211" text-anchor="middle" class="s">Restore drill</text><rect class="warn" x="808" y="145" width="216" height="112" rx="14"/><text x="916.0" y="182" text-anchor="middle" class="x">Exception</text><text x="916.0" y="211" text-anchor="middle" class="s">Missed check → owner</text><path class="arr" d="M256 199 L289 199"/><path class="arr" d="M512 199 L545 199"/><path class="arr" d="M768 199 L801 199"/><text class="s" x="540" y="318" text-anchor="middle">A timetable is an intention; each check still needs evidence of completion.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>