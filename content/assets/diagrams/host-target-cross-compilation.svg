<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Cross compilation from Windows x86-64 to RISC-V64 ELF objects</title>
  <desc id="desc">A host computer runs GCC or Clang. A native build creates a Windows COFF x86-64 object. A Clang cross-compiler targeting riscv64-unknown-elf creates RISC-V ELF objects. Linking and booting require additional kernel-specific stages.</desc>
  <rect width="1200" height="480" fill="#f6f9fc"/>
  <text x="50" y="54" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#203247">Host is not the same as target</text>
  <text x="50" y="85" font-family="Segoe UI, sans-serif" font-size="17" fill="#456377">One development computer can produce objects for two processor architectures.</text>
  <rect x="49" y="135" width="280" height="234" rx="17" fill="#203247"/>
  <text x="189" y="189" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="25" font-weight="bold">Host computer</text>
  <text x="189" y="233" text-anchor="middle" fill="#d5e5f0" font-family="Segoe UI, sans-serif" font-size="22">Windows x86-64</text>
  <text x="189" y="282" text-anchor="middle" fill="#d5e5f0" font-family="Segoe UI, sans-serif" font-size="17">CMake + Ninja</text>
  <text x="189" y="314" text-anchor="middle" fill="#d5e5f0" font-family="Segoe UI, sans-serif" font-size="17">GCC and/or Clang</text>
  <path d="M329 190 H468" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="468,190 450,180 450,200" fill="#007d8c"/>
  <path d="M329 318 H468" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="468,318 450,308 450,328" fill="#007d8c"/>
  <rect x="478" y="137" width="306" height="104" rx="13" fill="#e1f3f4" stroke="#007d8c" stroke-width="3"/>
  <text x="631" y="173" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" fill="#203247" font-weight="bold">Native compiler</text>
  <text x="631" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#203247">x86-64 COFF .obj</text>
  <rect x="478" y="265" width="306" height="104" rx="13" fill="#e1f3f4" stroke="#007d8c" stroke-width="3"/>
  <text x="631" y="302" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" fill="#203247" font-weight="bold">Clang cross target</text>
  <text x="631" y="339" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#203247">riscv64-unknown-elf</text>
  <path d="M784 189 H852" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="852,189 834,179 834,199" fill="#007d8c"/>
  <rect x="862" y="136" width="289" height="106" rx="13" fill="#ffffff" stroke="#203247" stroke-width="3"/>
  <text x="1007" y="174" text-anchor="middle" fill="#203247" font-family="Segoe UI, sans-serif" font-size="21" font-weight="bold">Hosted application</text>
  <text x="1007" y="204" text-anchor="middle" fill="#456377" font-family="Segoe UI, sans-serif" font-size="17">link with host runtime</text>
  <path d="M784 318 H852" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="852,318 834,308 834,328" fill="#007d8c"/>
  <rect x="862" y="265" width="289" height="105" rx="13" fill="#ffffff" stroke="#203247" stroke-width="3"/>
  <text x="1007" y="303" text-anchor="middle" fill="#203247" font-family="Segoe UI, sans-serif" font-size="21" font-weight="bold">RISC-V ELF objects</text>
  <text x="1007" y="334" text-anchor="middle" fill="#456377" font-family="Segoe UI, sans-serif" font-size="17">not executable yet</text>
  <text x="600" y="426" text-anchor="middle" fill="#203247" font-family="Segoe UI, sans-serif" font-size="20">Kernel boot additionally needs a linker script, entry point, memory map and emulator / hardware.</text>
</svg>
