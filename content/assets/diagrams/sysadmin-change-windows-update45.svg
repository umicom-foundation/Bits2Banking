<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Maintenance window and control gates</title><desc id="desc">Source revision, approved timing, verification and honest outcome.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Maintenance window and control gates</text><text x="38" y="75" class="s">Source revision, approved timing, verification and honest outcome.</text><rect class="step" x="38" y="142" width="180" height="110" rx="14"/><text x="128.0" y="179" text-anchor="middle" class="x">Plan</text><text x="128.0" y="208" text-anchor="middle" class="s">Scope + UTC time</text><rect class="step" x="245" y="142" width="180" height="110" rx="14"/><text x="335.0" y="179" text-anchor="middle" class="x">Approve</text><text x="335.0" y="208" text-anchor="middle" class="s">Independent owner</text><rect class="step" x="452" y="142" width="180" height="110" rx="14"/><text x="542.0" y="179" text-anchor="middle" class="x">Validate</text><text x="542.0" y="208" text-anchor="middle" class="s">Build + tests</text><rect class="warn" x="659" y="142" width="180" height="110" rx="14"/><text x="749.0" y="179" text-anchor="middle" class="x">Go / no-go</text><text x="749.0" y="208" text-anchor="middle" class="s">Safety decision</text><rect class="accent" x="866" y="142" width="180" height="110" rx="14"/><text x="956.0" y="179" text-anchor="middle" class="x">Recover</text><text x="956.0" y="208" text-anchor="middle" class="s">Verify results</text><path class="arr" d="M218 196 L245 196"/><path class="arr" d="M425 196 L452 196"/><path class="arr" d="M632 196 L659 196"/><path class="arr" d="M839 196 L866 196"/><text class="s" x="540" y="317" text-anchor="middle">A successful rollback to an older version is not a successful new-version upgrade.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>