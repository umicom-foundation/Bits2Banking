<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">Copied IPC message ownership</title><desc id="desc">Two copies transfer information without borrowing an untrusted sender pointer.</desc>
<rect width="1100" height="340" fill="#f7fafc" rx="18"/>
<text x="40" y="50" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#203247">Copied IPC message ownership</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#167a89"/></marker></defs>
<rect x="45" y="108" width="270" height="137" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="62" y="142" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Sender-owned bytes</text>
<text x="62" y="171" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Notes event text</text>
<text x="62" y="196" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">May change after send</text>
<line x1="322" y1="175" x2="393" y2="175" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><text x="357" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#14717e">copy</text><rect x="400" y="108" width="283" height="137" rx="12" fill="#fff5e5" stroke="#d38d30" stroke-width="2"/>
<text x="417" y="142" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Channel-owned queue</text>
<text x="417" y="171" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Full copied payload</text>
<text x="417" y="196" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">FIFO + fixed capacity</text>
<line x1="690" y1="175" x2="756" y2="175" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><text x="723" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#14717e">copy</text><rect x="762" y="108" width="292" height="137" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="779" y="142" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Receiver-owned bytes</text>
<text x="779" y="171" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Complete delivery only</text>
<text x="779" y="196" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">No partial consumption</text>
<text x="550" y="293" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#425667">The sender, queue and receiver own separate byte sequences.</text></svg>
