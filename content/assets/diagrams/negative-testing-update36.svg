<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Negative testing and failure-atomicity"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Negative testing and failure-atomicity</text><text class="subtitle" x="42" y="88">A safe API returns a status and never leaves partly updated caller-owned output.</text><rect x="75" y="165" width="290" height="112" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="95" y="201">Valid input</text><text class="boxDetail" x="95" y="229">Commit + module graph</text><rect x="75" y="325" width="290" height="112" rx="15" fill="#65422b" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="95" y="361">Invalid input</text><text class="boxDetail" x="95" y="389">Cycle, overflow or bad mask</text><rect x="476" y="215" width="290" height="112" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="496" y="251">C23 contract</text><text class="boxDetail" x="496" y="279">Validate before mutation</text><rect x="868" y="157" width="284" height="112" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="888" y="193">Success</text><text class="boxDetail" x="888" y="221">Complete owned output</text><rect x="868" y="320" width="284" height="112" rx="15" fill="#613640" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="888" y="356">Refusal</text><text class="boxDetail" x="888" y="384">Output unchanged</text><path class="edge" d="M368 215 L473 250"/><path class="edge" d="M368 375 L473 293"/><path class="edge" d="M768 255 L865 214"/><path class="review" d="M768 292 L865 367"/></svg>
