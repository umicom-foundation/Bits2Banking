<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Standalone Umicom Notes and Umicom Applications both depend on one Umicom Notes module; Framework remains separately shared" viewBox="0 0 1120 450">
<title>A shared Umicom module can be pinned by more than one parent</title><desc>Two parents, standalone Umicom Notes and Umicom Applications, each reference the Umicom Notes module through an exact Git commit. Both consume shared Umicom Framework capabilities.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#187869"/></marker></defs>
<rect width="1120" height="450" rx="18" fill="#f3f8fc"/><text x="560" y="52" text-anchor="middle" font-family="Segoe UI,Arial" font-size="25" fill="#123149" font-weight="bold">Two parents reference the same authoritative module</text>
<rect x="63" y="110" width="410" height="70" rx="13" fill="#e6f1ff" stroke="#4a779e" stroke-width="2"/><text x="268" y="154" font-family="Segoe UI,Arial" font-size="19" text-anchor="middle" fill="#17374d" font-weight="bold">Standalone Umicom Notes</text>
<rect x="647" y="110" width="410" height="70" rx="13" fill="#e6f1ff" stroke="#4a779e" stroke-width="2"/><text x="852" y="154" font-family="Segoe UI,Arial" font-size="19" text-anchor="middle" fill="#17374d" font-weight="bold">Umicom Applications suite</text>
<rect x="63" y="302" width="410" height="70" rx="13" fill="#e1f4ec" stroke="#2d846c" stroke-width="2"/><text x="268" y="342" font-family="Segoe UI,Arial" font-size="18" text-anchor="middle" fill="#173e32" font-weight="bold">Umicom Framework repository</text>
<rect x="647" y="302" width="410" height="70" rx="13" fill="#fef0e1" stroke="#b87936" stroke-width="2"/><text x="852" y="342" font-family="Segoe UI,Arial" font-size="18" text-anchor="middle" fill="#633d18" font-weight="bold">Umicom Notes module repository</text>
<g fill="none" stroke="#187869" stroke-width="3" marker-end="url(#arrow)"><path d="M268 180 V300"/><path d="M852 180 V300"/><path d="M440 181 L694 298"/><path d="M680 181 L426 298"/></g>
<text x="560" y="224" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#365c67">each parent saves exact commit pins</text>
<text x="560" y="415" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#314f61">Git submodule registration ≠ CMake build registration. Auto-discovery is planned.</text></svg>
