<?xml version="1.0" encoding="UTF-8"?>
<!-- Bits to Banking · Umicom Foundation · MIT · Source-editable teaching diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">A waiting service receives an owned message</title>
<desc id="desc">One thread serially checks an empty copied-message queue, registers a wait, then observes a sender's accepted message and wakes the receiving task.</desc>
<rect width="1100" height="530" fill="#f2f6f9"/>
<rect x="28" y="23" width="1044" height="483" rx="17" fill="#ffffff" stroke="#cfdee7" stroke-width="2"/>
<text x="62" y="72" fill="#1e394b" font-size="27" font-weight="700" font-family="Segoe UI, sans-serif">Who owns the message while Notes is waiting?</text>
<rect x="60" y="113" width="273" height="139" rx="12" fill="#e8f0f7" stroke="#487999" stroke-width="2"/>
<text x="86" y="145" fill="#24516c" font-size="19" font-weight="700" font-family="Segoe UI, sans-serif">Sender</text>
<text x="86" y="185" fill="#24516c" font-size="20" font-family="Segoe UI, sans-serif">“Draft stored”</text>
<text x="86" y="222" fill="#46677d" font-size="16" font-family="Segoe UI, sans-serif">Owns original buffer</text>
<path d="M 335 182 H 401" stroke="#18837c" stroke-width="4" fill="none"/>
<path d="M 402 182 l -14 -9 v 18 z" fill="#18837c"/>
<text x="343" y="163" fill="#18837c" font-size="14" font-family="Segoe UI, sans-serif">copy</text>
<rect x="405" y="113" width="278" height="139" rx="12" fill="#e7f5ef" stroke="#16847a" stroke-width="2"/>
<text x="432" y="145" fill="#105c55" font-size="19" font-weight="700" font-family="Segoe UI, sans-serif">Copied-message channel</text>
<text x="432" y="186" fill="#105c55" font-size="20" font-family="Segoe UI, sans-serif">“Draft stored”</text>
<text x="432" y="222" fill="#34766d" font-size="16" font-family="Segoe UI, sans-serif">Owns accepted bytes</text>
<path d="M 685 182 H 752" stroke="#18837c" stroke-width="4" fill="none"/>
<path d="M 753 182 l -14 -9 v 18 z" fill="#18837c"/>
<text x="688" y="163" fill="#18837c" font-size="14" font-family="Segoe UI, sans-serif">ready</text>
<rect x="758" y="113" width="273" height="139" rx="12" fill="#fff4dd" stroke="#cc9240" stroke-width="2"/>
<text x="780" y="145" fill="#75501c" font-size="19" font-weight="700" font-family="Segoe UI, sans-serif">Notes receiver</text>
<text x="780" y="188" fill="#75501c" font-size="18" font-family="Segoe UI, sans-serif">WAITING → READY</text>
<text x="780" y="222" fill="#80683a" font-size="16" font-family="Segoe UI, sans-serif">Not running yet</text>
<path d="M 890 254 V 304 H 557 V 324" stroke="#4b7191" stroke-width="3" fill="none" stroke-dasharray="9 6"/>
<path d="M 557 325 l -9 -13 h 18 z" fill="#4b7191"/>
<rect x="241" y="330" width="615" height="106" rx="12" fill="#1b475e"/>
<text x="270" y="365" fill="#ffffff" font-size="18" font-weight="700" font-family="Segoe UI, sans-serif">Scheduler selects Notes later</text>
<text x="270" y="394" fill="#f0f7fb" font-size="18" font-family="Segoe UI, sans-serif">Receive checks the destination capacity, then copies the message.</text>
<text x="61" y="474" fill="#008075" font-size="15" font-weight="650" font-family="Segoe UI, sans-serif">This model is serial on one owner thread. Multi-core wait registration needs stronger synchronisation.</text>
</svg>
