<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Framework-first engineering ownership"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Framework-first engineering ownership</text><text class="subtitle" x="42" y="88">Reuse native Framework services instead of inventing Git or compiler parsers.</text><rect x="55" y="160" width="295" height="108" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="75" y="196">Umicom Framework VCS</text><text class="boxDetail" x="75" y="224">UmiVcsWorkingTreeRead</text><rect x="55" y="303" width="295" height="108" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="75" y="339">Umicom Framework build</text><text class="boxDetail" x="75" y="367">umi_build_parse_diagnostic_line</text><rect x="457" y="228" width="310" height="108" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="477" y="264">Copied observations</text><text class="boxDetail" x="477" y="292">Typed, bounded input facts</text><rect x="858" y="228" width="290" height="108" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="878" y="264">C23 teaching policy</text><text class="boxDetail" x="878" y="292">Affected nodes + required gates</text><path class="edge" d="M353 210 L455 254"/><path class="edge" d="M353 351 L455 306"/><path class="edge" d="M770 282 L856 282"/><text class="legend" x="60" y="453">Existing Framework APIs own live inspection and diagnostics; the lab never mutates Git.</text></svg>
