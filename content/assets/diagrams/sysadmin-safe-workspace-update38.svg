<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="User practice folders are separate from real Umicom source repositories" viewBox="0 0 1120 380">
<title>Safe training workspaces are isolated from real projects</title><desc>The user's home directory contains UmicomLearning Notes and a disposable Git project, while C:\umicom contains independent real repositories that learners do not modify.</desc>
<rect width="1120" height="380" rx="18" fill="#f3f8fc"/><text x="560" y="54" text-anchor="middle" font-family="Segoe UI,Arial" font-size="27" fill="#123149" font-weight="bold">Keep training files separate from project source</text>
<rect x="62" y="102" width="485" height="198" rx="15" fill="#e5f5ed" stroke="#27856f" stroke-width="2"/><text x="304" y="135" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#12513f" font-weight="bold">Safe personal practice</text>
<rect x="93" y="163" width="423" height="45" rx="8" fill="#fff" stroke="#63a68c"/><text x="304" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#153d35">$HOME/UmicomLearning</text>
<rect x="93" y="225" width="195" height="45" rx="8" fill="#fff" stroke="#63a68c"/><text x="190" y="254" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#153d35">Notes/README.md</text>
<rect x="309" y="225" width="207" height="45" rx="8" fill="#fff" stroke="#63a68c"/><text x="413" y="254" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#153d35">git-first-project</text>
<rect x="573" y="102" width="485" height="198" rx="15" fill="#fff1e8" stroke="#c47e42" stroke-width="2"/><text x="815" y="135" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#86491d" font-weight="bold">Real source — do not experiment here</text>
<rect x="607" y="163" width="420" height="45" rx="8" fill="#fff" stroke="#d2a075"/><text x="817" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#754824">C:\umicom</text>
<rect x="607" y="225" width="198" height="45" rx="8" fill="#fff" stroke="#d2a075"/><text x="706" y="254" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#754824">Umicom-Applications</text>
<rect x="826" y="225" width="201" height="45" rx="8" fill="#fff" stroke="#d2a075"/><text x="926" y="254" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#754824">umicomOS</text>
<text x="560" y="346" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#314f61">Check Get-Location or pwd before every unfamiliar command.</text></svg>
