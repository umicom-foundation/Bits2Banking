<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" role="img" aria-labelledby="t d">
<title id="t">From backup file to independently verified recovery</title>
<desc id="d">A left-to-right four-stage process; boxes show each verification step. This is explanatory and does not represent live system results.</desc>
<defs><marker id="arr" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#2c8275" stroke-width="2"/></marker></defs>
<rect width="1050" height="330" rx="24" fill="#f4f9fb"/><text x="525" y="52" fill="#132e40" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">From backup file to independently verified recovery</text>
<rect x="24" y="112" width="218" height="148" rx="13" fill="#ffffff" stroke="#438d84" stroke-width="2"/>
<text x="133.0" y="164" text-anchor="middle" fill="#165d56" font-size="21" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Backup</text>
<text x="133.0" y="198" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">Versioned copy +</text>
<text x="133.0" y="220" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">retention</text>
<line x1="246" y1="184" x2="277" y2="184" stroke="#2c8275" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="285" y="112" width="218" height="148" rx="13" fill="#ffffff" stroke="#438d84" stroke-width="2"/>
<text x="394.0" y="164" text-anchor="middle" fill="#165d56" font-size="21" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Restore</text>
<text x="394.0" y="198" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">Isolated practice</text>
<text x="394.0" y="220" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">destination</text>
<line x1="507" y1="184" x2="538" y2="184" stroke="#2c8275" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="546" y="112" width="218" height="148" rx="13" fill="#ffffff" stroke="#438d84" stroke-width="2"/>
<text x="655.0" y="164" text-anchor="middle" fill="#165d56" font-size="21" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Inspect</text>
<text x="655.0" y="198" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">Checksum plus</text>
<text x="655.0" y="220" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">application reading</text>
<line x1="768" y1="184" x2="799" y2="184" stroke="#2c8275" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="807" y="112" width="218" height="148" rx="13" fill="#e7f7f1" stroke="#438d84" stroke-width="2"/>
<text x="916.0" y="164" text-anchor="middle" fill="#165d56" font-size="21" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Approve</text>
<text x="916.0" y="198" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">Independent check +</text>
<text x="916.0" y="220" text-anchor="middle" fill="#36556a" font-size="15" font-family="Segoe UI,Arial,sans-serif">RPO/RTO record</text>
<text x="525" y="303" text-anchor="middle" fill="#536c7c" font-size="13" font-family="Segoe UI,Arial,sans-serif">Illustration only · Use authorised, read-only observations before any change</text>
</svg>
