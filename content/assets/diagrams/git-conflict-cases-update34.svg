<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="504" viewBox="0 0 1080 504" role="img" aria-labelledby="title desc"><title id="title">Cases in a three-way record merge</title><desc id="desc">Different outcomes for same, one-sided, identical, and conflicting edits and deletions.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192b43}.heading{font-size:26px;font-weight:750}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#35536a}.mono{font-size:15px;font-family:Consolas,monospace}.darktext{fill:#fff}.line{stroke:#54758b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.box{fill:#f3f8fd;stroke:#315f83;stroke-width:2}.ok{fill:#e1f6ee;stroke:#08745f;stroke-width:2}.warn{fill:#fff1da;stroke:#bb7429;stroke-width:2}.dark{fill:#14283f;stroke:#243c55;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#54758b"/></marker></defs><rect width="1080" height="504" fill="#f9fbfe"/>
