<rect width="1240" height="340" rx="22" fill="#f9fcfd"/><text class="title" x="36" y="57">Loopback access and perimeter controls</text><rect x="35" y="108" width="255" height="118" rx="18" fill="#eaf5fd" stroke="#466f85" stroke-width="2"/><text x="163" y="143" text-anchor="middle" class="heading">Local client</text><text x="163" y="179" text-anchor="middle" class="desc">On the same computer</text><path d="M293 168 H329" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="108" width="255" height="118" rx="18" fill="#eaf8f3" stroke="#466f85" stroke-width="2"/><text x="463" y="143" text-anchor="middle" class="heading">127.0.0.1:8765</text><text x="463" y="179" text-anchor="middle" class="desc">Loopback destination</text><path d="M593 168 H629" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="635" y="108" width="255" height="118" rx="18" fill="#fff5e8" stroke="#466f85" stroke-width="2"/><text x="763" y="143" text-anchor="middle" class="heading">Listening service</text><text x="763" y="179" text-anchor="middle" class="desc">Must have a real process</text><path d="M893 168 H929" stroke="#177a77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="935" y="108" width="255" height="118" rx="18" fill="#eff1fe" stroke="#466f85" stroke-width="2"/><text x="1063" y="143" text-anchor="middle" class="heading">Observed response</text><text x="1063" y="179" text-anchor="middle" class="desc">Application-level check</text><text class="note" x="35" y="286">Firewall policy and bind address are different controls.</text></svg>