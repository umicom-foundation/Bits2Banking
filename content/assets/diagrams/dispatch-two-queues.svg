<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">Bounded queues and downstream backpressure</title><desc id="desc">An eight-slot work queue feeds a four-slot completion queue. When the completion queue is full, additional work processing and cancellation refuse to execute until a result is received.</desc>
<rect width="1040" height="410" rx="18" fill="#f0f6fd"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#162a3f"><text x="40" y="45" font-size="25" font-weight="700">Two bounded queues, one controlled handoff</text>
<text x="48" y="115" font-size="20" font-weight="700">Work queue: 8 slots</text><text x="635" y="115" font-size="20" font-weight="700">Completion queue: 4 slots</text></g>
<g stroke="#386b86" stroke-width="2"><rect x="45" y="140" width="61" height="74" fill="#d6ecff"/><rect x="108" y="140" width="61" height="74" fill="#d6ecff"/><rect x="171" y="140" width="61" height="74" fill="#d6ecff"/><rect x="234" y="140" width="61" height="74" fill="#d6ecff"/><rect x="297" y="140" width="61" height="74" fill="#fff"/><rect x="360" y="140" width="61" height="74" fill="#fff"/><rect x="423" y="140" width="61" height="74" fill="#fff"/><rect x="486" y="140" width="61" height="74" fill="#fff"/>
<rect x="635" y="140" width="86" height="74" fill="#ffe8c5" stroke="#9e5800"/><rect x="724" y="140" width="86" height="74" fill="#ffe8c5" stroke="#9e5800"/><rect x="813" y="140" width="86" height="74" fill="#ffe8c5" stroke="#9e5800"/><rect x="902" y="140" width="86" height="74" fill="#ffe8c5" stroke="#9e5800"/></g>
<text x="296" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#27485c">4 waiting; 4 already terminal</text><text x="813" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#704300">4 undelivered notices: FULL</text>
<rect x="90" y="300" width="860" height="70" rx="14" fill="#fff" stroke="#b26b18" stroke-width="2"/>
<text x="520" y="328" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#664000">Backpressure: refuse another Step before taking a work item.</text><text x="520" y="353" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#664000">Receive one result to create downstream capacity; no notification is silently dropped.</text>
</svg>
