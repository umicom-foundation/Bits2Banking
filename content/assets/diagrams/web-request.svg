<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 315" width="1100" height="315" role="img" aria-labelledby="title desc">
<title id="title">Browser and server request cycle</title><desc id="desc">Browser sends HTTP POST to server which validates and returns HTML</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="550" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">Browser and server communication</text>
<rect x="90" y="84" width="280" height="100" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="230.0" y="127.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">Browser</text>
<text x="230.0" y="151.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">HTML form</text>
<rect x="740" y="84" width="280" height="100" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="880.0" y="127.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">PHP server</text>
<text x="880.0" y="151.0" text-anchor="middle" font-size="17" font-weight="650" fill="#193448">validate input</text>
<path d="M380 108 L728 108" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<text x="550" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#2d4f64">HTTP request (POST)</text>
<path d="M728 158 L382 158" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<text x="550" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#2d4f64">HTML response</text>
<rect x="742" y="220" width="274" height="62" rx="14" fill="#fff3e2" stroke="#b57b2e" stroke-width="2"/>
<text x="879.0" y="256.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">Storage can be added later</text>
<path d="M875 188 L875 214" fill="none" stroke="#247a8a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/></g></svg>