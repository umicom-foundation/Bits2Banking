<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Public C function symbols and a private static helper</title>
  <desc id="desc">A public ledger header names two callable functions. The private source file implements them and a static AddChecked helper. The application calls only public functions, while the linker map records which object supplied them.</desc>
  <rect width="1200" height="480" fill="#f6f9fc"/>
  <text x="55" y="55" font-family="Segoe UI, sans-serif" font-size="29" font-weight="bold" fill="#203247">Public contract versus private implementation</text>
  <text x="55" y="83" font-family="Segoe UI, sans-serif" font-size="17" fill="#456377">C23 external linkage, internal linkage and linker evidence</text>
  <rect x="60" y="125" width="310" height="273" rx="18" fill="#ffffff" stroke="#007d8c" stroke-width="3"/>
  <rect x="60" y="125" width="310" height="57" rx="16" fill="#007d8c"/>
  <text x="215" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#ffffff">ledger.h</text>
  <text x="91" y="220" font-family="Segoe UI, sans-serif" font-size="19" font-weight="bold" fill="#203247">Public API</text>
  <text x="91" y="262" font-family="Consolas, monospace" font-size="17" fill="#203247">BtbLedgerTotalPence</text>
  <text x="91" y="295" font-family="Consolas, monospace" font-size="17" fill="#203247">BtbLedgerFormatPence</text>
  <text x="91" y="345" font-family="Segoe UI, sans-serif" font-size="16" fill="#547080">Visible to callers</text>
  <rect x="438" y="125" width="310" height="273" rx="18" fill="#ffffff" stroke="#355e79" stroke-width="3"/>
  <rect x="438" y="125" width="310" height="57" rx="16" fill="#203247"/>
  <text x="593" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#ffffff">ledger.c</text>
  <text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="19" font-weight="bold" fill="#203247">Definitions</text>
  <text x="470" y="260" font-family="Consolas, monospace" font-size="17" fill="#203247">BtbLedgerTotalPence</text>
  <text x="470" y="293" font-family="Consolas, monospace" font-size="17" fill="#203247">BtbLedgerFormatPence</text>
  <rect x="469" y="318" width="250" height="53" rx="10" fill="#eef2fb" stroke="#687d99"/>
  <text x="594" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#203247">static AddChecked</text>
  <path d="M371 260 H433" fill="none" stroke="#007d8c" stroke-width="5"/>
  <polygon points="433,260 420,252 420,268" fill="#007d8c"/>
  <text x="398" y="241" font-family="Segoe UI, sans-serif" text-anchor="middle" font-size="14" fill="#456377">match</text>
  <rect x="816" y="125" width="332" height="273" rx="18" fill="#e2f3f4" stroke="#007d8c" stroke-width="3"/>
  <text x="982" y="167" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="bold" fill="#203247">Application and linker</text>
  <text x="849" y="213" font-family="Segoe UI, sans-serif" font-size="18" fill="#203247">main.c calls public functions</text>
  <text x="849" y="254" font-family="Segoe UI, sans-serif" font-size="18" fill="#203247">Linker selects ledger.o</text>
  <text x="849" y="295" font-family="Segoe UI, sans-serif" font-size="18" fill="#203247">Map records symbols</text>
  <text x="849" y="338" font-family="Segoe UI, sans-serif" font-size="17" fill="#385a68">No public call to AddChecked</text>
  <path d="M749 262 H812" fill="none" stroke="#007d8c" stroke-width="5"/>
  <polygon points="812,262 799,254 799,270" fill="#007d8c"/>
  <text x="55" y="442" font-family="Segoe UI, sans-serif" font-size="18" fill="#456377">Internal linkage prevents external references; local symbols may still appear in debugging tools.</text>
</svg>
