<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1150 558">
  <title id="title">Exact multiset comparison of two C23 build snapshots</title>
  <desc id="desc">An earlier build has two occurrences of diagnostic A and one B. The current build has one A and one C. Matching yields one persisting A, two resolved occurrences, and one introduced C.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#16203b"/><stop offset="1" stop-color="#2d486b"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b8d4f5"/></marker><style>.title{font:700 29px system-ui;fill:#f3f8ff}.subtitle{font:16px system-ui;fill:#c1d4e9}.heading{font:700 19px system-ui;fill:#eff7ff;text-anchor:middle}.problem{font:700 18px ui-monospace,monospace;fill:#fafcff;text-anchor:middle}.box{fill:#263c60;stroke:#7298c7;stroke-width:2}.warning{fill:#6d4c34;stroke:#f1c077;stroke-width:2}.good{fill:#165e52;stroke:#82dbc0;stroke-width:2}.bad{fill:#6d3847;stroke:#ef9ba7;stroke-width:2}.line{fill:none;stroke:#b8d4f5;stroke-width:3;marker-end:url(#arr)}</style></defs>
  <rect width="1150" height="558" rx="18" fill="url(#bg)"/>
  <text x="40" y="54" class="title">One-to-one matching of repeated diagnostics</text>
  <text x="40" y="83" class="subtitle">Exact stage + severity + path + line + column + code + message identity</text>
  <rect class="box" x="80" y="118" width="370" height="73" rx="12"/><text class="heading" x="265" y="162">Before (same profile and toolchain)</text>
  <rect class="box" x="701" y="118" width="370" height="73" rx="12"/><text class="heading" x="886" y="162">After (same profile and toolchain)</text>
  <rect class="warning" x="120" y="215" width="290" height="62" rx="12"/><text class="problem" x="265" y="253">Warning A · occurrence 1</text>
  <rect class="warning" x="120" y="296" width="290" height="62" rx="12"/><text class="problem" x="265" y="334">Warning A · occurrence 2</text>
  <rect class="bad" x="120" y="377" width="290" height="62" rx="12"/><text class="problem" x="265" y="415">Error B</text>
  <rect class="good" x="741" y="215" width="290" height="62" rx="12"/><text class="problem" x="886" y="253">Warning A · occurrence 1</text>
  <rect class="warning" x="741" y="343" width="290" height="62" rx="12"/><text class="problem" x="886" y="382">Warning C · new</text>
  <path class="line" d="M410 247H731"/>
  <text x="535" y="232" class="subtitle">1 persists</text>
  <path d="M410 329H560" stroke="#ef9ba7" stroke-width="3" stroke-dasharray="8 6"/><text x="567" y="335" class="subtitle">1 resolved</text>
  <path d="M410 409H560" stroke="#ef9ba7" stroke-width="3" stroke-dasharray="8 6"/><text x="567" y="416" class="subtitle">1 resolved</text>
  <text x="40" y="493" class="subtitle">Result: persisting = 1  ·  introduced = 1  ·  resolved = 2</text>
  <text x="40" y="521" class="subtitle">Moving the same message to a new line changes its exact identity in this educational model.</text>
</svg>
