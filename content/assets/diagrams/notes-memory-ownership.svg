<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="t d">
 <title id="t">A note's text has one owner</title>
 <desc id="d">The caller supplies temporary title text. The Notes store copies the text into owned storage. Reading copies it into a separate caller buffer.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#0c7081"/></marker></defs>
 <rect x="1" y="1" width="918" height="358" rx="18" fill="#f6fafc" stroke="#cbdde6"/>
 <text x="36" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#173b51">Notes: who owns the memory?</text>
 <rect x="34" y="83" width="235" height="156" rx="12" fill="#dfeff5" stroke="#7aa7ba"/>
 <text x="54" y="118" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173b51">Caller</text>
 <text x="54" y="150" font-family="Consolas,monospace" font-size="15" fill="#173b51">char title[]</text>
 <text x="54" y="177" font-family="Consolas,monospace" font-size="15" fill="#173b51">"Review source"</text>
 <text x="54" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#3f6072">Temporary local storage</text>
 <rect x="354" y="83" width="232" height="156" rx="12" fill="#e1f2ec" stroke="#59a589"/>
 <text x="372" y="118" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17513f">Owned Notes store</text>
 <text x="372" y="150" font-family="Consolas,monospace" font-size="15" fill="#17513f">malloc + memcpy</text>
 <text x="372" y="177" font-family="Consolas,monospace" font-size="15" fill="#17513f">"Review source"</text>
 <text x="372" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#315e4e">Released by Destroy</text>
 <rect x="670" y="83" width="216" height="156" rx="12" fill="#fff4dc" stroke="#dca955"/>
 <text x="688" y="118" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#744b1e">Read buffer</text>
 <text x="688" y="151" font-family="Consolas,monospace" font-size="15" fill="#744b1e">char output[81]</text>
 <text x="688" y="177" font-family="Consolas,monospace" font-size="15" fill="#744b1e">"Review source"</text>
 <text x="688" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#795f3f">Owned by caller</text>
 <path d="M270 166 H346" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="278" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0c7081">copy</text>
 <path d="M588 166 H662" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="595" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0c7081">copy</text>
 <rect x="38" y="273" width="844" height="55" rx="8" fill="#edf4f8"/>
 <text x="55" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173b51">After Add: caller may change its original text without changing the saved note.</text>
 <text x="55" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#365c70">After Destroy: the store's allocated memory is released; caller buffers remain separate.</text>
</svg>
