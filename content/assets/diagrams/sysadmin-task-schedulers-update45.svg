<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Windows tasks and Linux timers</title><desc id="desc">Both systems separate scheduling from the result of the work.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Windows tasks and Linux timers</text><text x="38" y="75" class="s">Both systems separate scheduling from the result of the work.</text><rect class="accent" x="65" y="135" width="400" height="95" rx="14"/><text x="265.0" y="172" text-anchor="middle" class="x">Windows Task Scheduler</text><text x="265.0" y="201" text-anchor="middle" class="s">Trigger → Action → Result</text><rect class="accent" x="615" y="135" width="400" height="95" rx="14"/><text x="815.0" y="172" text-anchor="middle" class="x">Linux systemd / cron</text><text x="815.0" y="201" text-anchor="middle" class="s">Timer → Service → Result</text><path class="arr" d="M260 230 L260 275"/><path class="arr" d="M820 230 L820 275"/><rect class="step" x="110" y="290" width="300" height="85" rx="14"/><text x="260.0" y="327" text-anchor="middle" class="x">Observed outcome</text><text x="260.0" y="356" text-anchor="middle" class="s">Logs and produced file</text><rect class="step" x="670" y="290" width="300" height="85" rx="14"/><text x="820.0" y="327" text-anchor="middle" class="x">Observed outcome</text><text x="820.0" y="356" text-anchor="middle" class="s">Service result and evidence</text><text class="s" x="540" y="412" text-anchor="middle">Inspect first. Do not run, disable, edit, or delete unfamiliar scheduled tasks.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>