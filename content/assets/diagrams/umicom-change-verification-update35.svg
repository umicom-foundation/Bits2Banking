<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1180 680">
  <title id="title">Umicom Framework to OS source-preserving publication sequence</title>
  <desc id="desc">Change and test authoritative Framework main, publish it, inspect the separate OS Framework checkout, build and test Umicom OS, stage the OS gitlink with existing Framework tooling, then review and publish the OS parent.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081d33"/><stop offset="1" stop-color="#12485d"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8adce7"/></marker><style>.title{font:700 29px system-ui;fill:#f4ffff}.label{font:700 18px system-ui;fill:#f1fffd;text-anchor:middle}.detail{font:14px system-ui;fill:#cee7ee;text-anchor:middle}.caption{font:15px system-ui;fill:#c6dfeb}.box{fill:#174660;stroke:#65b7cc;stroke-width:2}.framework{fill:#19584a;stroke:#93e5ba;stroke-width:3}.os{fill:#265078;stroke:#80c3ee;stroke-width:3}.review{fill:#5b4239;stroke:#f0c08c;stroke-width:2}.line{fill:none;stroke:#8adce7;stroke-width:3;marker-end:url(#arr)}</style></defs>
  <rect width="1180" height="680" rx="18" fill="url(#bg)"/>
  <text x="40" y="53" class="title">Source-preserving Framework → OS publication</text>
  <text x="40" y="85" class="caption">Framework is the source owner; OS records and tests an exact Framework gitlink.</text>
  <rect class="framework" x="50" y="146" width="322" height="100" rx="13"/><text class="label" x="211" y="182">1 · Framework main</text><text class="detail" x="211" y="209">review code · build · test</text><text class="detail" x="211" y="231">commit and push source</text>
  <path class="line" d="M372 195H430"/>
  <rect class="review" x="439" y="146" width="302" height="100" rx="13"/><text class="label" x="590" y="182">2 · Preserve local work</text><text class="detail" x="590" y="209">inspect OS child status</text><text class="detail" x="590" y="231">no forced checkout or deletion</text>
  <path class="line" d="M741 195H790"/>
  <rect class="os" x="799" y="146" width="325" height="100" rx="13"/><text class="label" x="961" y="182">3 · OS Framework child</text><text class="detail" x="961" y="209">fast-forward after review</text><text class="detail" x="961" y="231">record complete child SHA</text>
  <path class="line" d="M960 246V290"/>
  <rect class="os" x="790" y="299" width="334" height="100" rx="13"/><text class="label" x="957" y="335">4 · OS host qualification</text><text class="detail" x="957" y="361">configure · build · CTest</text><text class="detail" x="957" y="383">startup checks as applicable</text>
  <path class="line" d="M790 352H741"/>
  <rect class="framework" x="439" y="299" width="302" height="100" rx="13"/><text class="label" x="590" y="335">5 · Native repo tooling</text><text class="detail" x="590" y="361">umicom repo verify .</text><text class="detail" x="590" y="383">umicom repo lock .</text>
  <path class="line" d="M439 352H381"/>
  <rect class="review" x="50" y="299" width="322" height="100" rx="13"/><text class="label" x="211" y="335">6 · Inspect staged gitlink</text><text class="detail" x="211" y="361">git diff --cached --submodule</text><text class="detail" x="211" y="383">review source preservation</text>
  <path class="line" d="M211 399V454H488"/>
  <rect class="os" x="494" y="452" width="432" height="96" rx="13"/><text class="label" x="710" y="487">7 · Publish OS main</text><text class="detail" x="710" y="513">git add -A · inspect · commit · push</text><text class="detail" x="710" y="535">only after exact integration tests</text>
  <rect class="review" x="160" y="581" width="856" height="63" rx="12"/><text class="label" x="588" y="618">Never confuse clean status, a staging action, or a source SHA with passing integration tests.</text>
</svg>
