<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Security operations: evidence is not approval</title><desc id="diagram-desc">A teaching sequence that makes technical observations distinct from policy review and authorisation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087566"/></marker></defs>
<style>
.bg{fill:#f2f7fb;stroke:#d9e5ee;stroke-width:2} .node{fill:#fff;stroke:#3c7599;stroke-width:2} .end{fill:#d8f2e9;stroke:#087566;stroke-width:2.6}
.arrow{fill:none;stroke:#087566;stroke-width:2.8;marker-end:url(#arrow)}
.heading{fill:#12314b;font:700 29px system-ui,'Segoe UI',Arial,sans-serif}
.sub{fill:#536a7b;font:16px system-ui,'Segoe UI',Arial,sans-serif}
.main{fill:#173b51;font:700 16px system-ui,'Segoe UI',Arial,sans-serif}
.small{fill:#5b6e7d;font:12px system-ui,'Segoe UI',Arial,sans-serif}
</style>
<rect class="bg" x="5" y="5" width="1030" height="290" rx="20"/>
<text class="heading" x="48" y="58">Security operations: evidence is not approval</text>
<text class="sub" x="48" y="91">A teaching sequence that makes technical observations distinct from policy review and authorisation.</text>
<rect class="node" x="50.0" y="127" width="142.5" height="98" rx="14"/><text class="main" x="121.2" y="163" text-anchor="middle">Observe</text><text class="small" x="121.2" y="188" text-anchor="middle">time · source</text><path class="arrow" d="M 194.5 178 L 205.5 178"/><rect class="node" x="209.5" y="127" width="142.5" height="98" rx="14"/><text class="main" x="280.8" y="163" text-anchor="middle">Compare</text><text class="small" x="280.8" y="188" text-anchor="middle">expected policy</text><path class="arrow" d="M 354.0 178 L 365.0 178"/><rect class="node" x="369.0" y="127" width="142.5" height="98" rx="14"/><text class="main" x="440.2" y="163" text-anchor="middle">Identify gap</text><text class="small" x="440.2" y="188" text-anchor="middle">missing or failed</text><path class="arrow" d="M 513.5 178 L 524.5 178"/><rect class="node" x="528.5" y="127" width="142.5" height="98" rx="14"/><text class="main" x="599.8" y="163" text-anchor="middle">Request review</text><text class="small" x="599.8" y="188" text-anchor="middle">human owner</text><path class="arrow" d="M 673.0 178 L 684.0 178"/><rect class="node" x="688.0" y="127" width="142.5" height="98" rx="14"/><text class="main" x="759.2" y="163" text-anchor="middle">Approve separately</text><text class="small" x="759.2" y="188" text-anchor="middle">never implicit</text><path class="arrow" d="M 832.5 178 L 843.5 178"/><rect class="end" x="847.5" y="127" width="142.5" height="98" rx="14"/><text class="main" x="918.8" y="163" text-anchor="middle">Verify</text><text class="small" x="918.8" y="188" text-anchor="middle">record result</text>
<text class="sub" x="50" y="264">Bits2Banking · Umicom Foundation · educational model, not an operating-system control.</text>
</svg>
