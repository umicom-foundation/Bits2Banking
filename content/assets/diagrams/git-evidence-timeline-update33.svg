<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="Evidence is bound to an observation">
<title>Evidence is bound to an observation</title><desc>A later observation invalidates earlier build and test proof.</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#426d88"/></marker></defs>
<style>.title{font:700 27px system-ui,sans-serif;fill:#142d49}.sub{font:15px system-ui,sans-serif;fill:#4a6274}.name{font:700 17px system-ui,sans-serif;fill:#163f61}.detail{font:13px system-ui,sans-serif;fill:#3c596b}.foot{font:14px system-ui,sans-serif;fill:#4a6274}</style>
<rect width="1120" height="380" rx="16" fill="#fafcff" stroke="#d4e1ec"/>
<text x="50" y="50" class="title">Evidence is bound to an observation</text><text x="50" y="77" class="sub">A later observation invalidates earlier build and test proof.</text>
<g><rect x="46" y="127" width="230" height="95" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="161.0" y="157" class="name" text-anchor="middle">Observation 41</text><text x="161.0" y="180" class="detail" text-anchor="middle">SHA A; worktree known</text></g><path d="M276,174 L308,174" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="309" y="127" width="210" height="95" rx="13" fill="#e8f5f4" stroke="#087a70" stroke-width="2"/><text x="414.0" y="157" class="name" text-anchor="middle">Build and test</text><text x="414.0" y="180" class="detail" text-anchor="middle">both PASS for 41</text></g><path d="M519,174 L552,174" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="553" y="127" width="230" height="95" rx="13" fill="#eff5ff" stroke="#346ba9" stroke-width="2"/><text x="668.0" y="157" class="name" text-anchor="middle">Observation 42</text><text x="668.0" y="180" class="detail" text-anchor="middle">new status; proofs reset</text></g><path d="M783,174 L817,174" stroke="#426d88" stroke-width="2.5" fill="none" marker-end="url(#end)" /><g><rect x="818" y="127" width="245" height="95" rx="13" fill="#e8f5f4" stroke="#087a70" stroke-width="2"/><text x="940.5" y="157" class="name" text-anchor="middle">New evidence</text><text x="940.5" y="180" class="detail" text-anchor="middle">required for 42</text></g><text x="50" y="333" class="foot">A green result is not transferred automatically between observations.</text>
</svg>