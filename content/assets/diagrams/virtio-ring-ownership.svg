<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">VirtIO split rings: driver, queue and device</title><desc id="desc">Diagram separates descriptor table, available ring and used ring; a device finishes work independently of driver submission.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#167a89"/></marker>
<style>.cap{font-family:Segoe UI,Arial,sans-serif;font-size:28px;font-weight:700;fill:#1c344a}.body{font-family:Segoe UI,Arial,sans-serif;font-size:19px;fill:#36546a}.small{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#39566d}.num{font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700;fill:#167a89}.code{font-family:Consolas,monospace;font-size:18px;fill:#1d3a4f}.warn{font-family:Segoe UI,Arial,sans-serif;font-size:17px;fill:#853a24;font-weight:600}.line{stroke:#167a89;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c8dce8;stroke-width:2;rx:16}.hcard{fill:#eaf5f5;stroke:#9ac8c8;stroke-width:2;rx:16}</style></defs>
<rect x="0" y="0" width="1280" height="520" fill="#f4f8fa" />
<text x="52" y="62" class="cap">VirtIO split rings: driver, queue and device</text>
<rect class="card" x="47" y="132" width="406" height="285" rx="16" />
<rect class="card" x="827" y="132" width="406" height="285" rx="16" />
<rect class="hcard" x="503" y="134" width="274" height="279" rx="16" />
<text x="71" y="173" class="num">DRIVER</text>
<text x="71" y="223" class="body">Owns descriptor</text>
<text x="71" y="251" class="body">and payload memory</text>
<text x="71" y="292" class="small">Publishes available</text>
<text x="71" y="317" class="small">descriptor token</text>
<text x="520" y="174" class="num">SHARED QUEUE</text>
<rect class="card" x="525" y="199" width="230" height="51" rx="16" />
<text x="539" y="231" class="code">Descriptor table</text>
<rect class="card" x="525" y="267" width="230" height="51" rx="16" />
<text x="552" y="299" class="code">Available ring</text>
<rect class="card" x="525" y="335" width="230" height="51" rx="16" />
<text x="582" y="367" class="code">Used ring</text>
<text x="851" y="173" class="num">DEVICE (SIMULATED)</text>
<text x="851" y="223" class="body">Reads published</text>
<text x="851" y="251" class="body">request metadata</text>
<text x="851" y="292" class="small">Reports a finished</text>
<text x="851" y="317" class="small">descriptor chain</text>
<path class="line" d="M453,289 L503,289" />
<path class="line" d="M777,290 L827,290" />
<path class="line" d="M827,361 L778,361" />
<path class="line" d="M503,362 L453,362" />
<text x="62" y="473" class="body">Only after collecting validated completion may the driver reclaim the old buffer.</text>
<text x="62" y="497" class="small">Teaching model — arrays and fake device calls, not VirtIO wire-compatible DMA.</text>
</svg>