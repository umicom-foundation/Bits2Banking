<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 232" width="1100" height="232" role="img" aria-labelledby="title desc">
<title id="title">A simplified CPU instruction cycle</title><desc id="desc">Fetch decode execute repeats and overlaps in modern processors</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="550.0" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#2d4f64">A simplified CPU instruction cycle</text>
<rect x="32.0" y="73" width="320.0" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="192.0" y="113.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">1. Fetch</text>
<text x="192.0" y="137.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">read instruction</text>
<path d="M357.0 120.5 L383.0 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="390.0" y="73" width="320.0" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="550.0" y="113.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">2. Decode</text>
<text x="550.0" y="137.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">understand operation</text>
<path d="M715.0 120.5 L741.0 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="748.0" y="73" width="320.0" height="95" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="908.0" y="113.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">3. Execute</text>
<text x="908.0" y="137.5" text-anchor="middle" font-size="18" font-weight="650" fill="#193448">perform operation</text></g></svg>