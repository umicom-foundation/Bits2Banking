<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">A safe change keeps failure and recovery distinct</title><desc id="desc">A failed upgrade that was RESTORED must never be labelled COMPLETE.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop offset="0" stop-color="#f6fbfd"/><stop offset="1" stop-color="#e9f3f5"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2e7084"/></marker></defs>
<rect width="1200" height="350" rx="26" fill="url(#background)"/><rect x="24" y="20" width="1152" height="309" rx="20" fill="#fff" stroke="#bfd7df"/>
<text x="65" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#19374c">A safe change keeps failure and recovery distinct</text>
<text x="65" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#507080">BITS TO BANKING  /  UMICOM FOUNDATION  /  SYSTEM ADMINISTRATION</text><rect x="58" y="139" width="250" height="119" rx="14" fill="#e8f8f3" stroke="#7eabb4" stroke-width="1.6"/><text x="183" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" fill="#19374c">Baseline</text><text x="183" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#486877">current evidence</text><path d="M310 200 L344 200" fill="none" stroke="#2e7084" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="139" width="250" height="119" rx="14" fill="#e9f3fc" stroke="#7eabb4" stroke-width="1.6"/><text x="475" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" fill="#19374c">Review</text><text x="475" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#486877">approval + backup</text><path d="M602 200 L636 200" fill="none" stroke="#2e7084" stroke-width="3" marker-end="url(#arrow)"/><rect x="642" y="139" width="250" height="119" rx="14" fill="#f5f1fe" stroke="#7eabb4" stroke-width="1.6"/><text x="767" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" fill="#19374c">Post-change</text><text x="767" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#486877">verify or block</text><path d="M894 200 L928 200" fill="none" stroke="#2e7084" stroke-width="3" marker-end="url(#arrow)"/><rect x="934" y="139" width="250" height="119" rx="14" fill="#e6f7ee" stroke="#7eabb4" stroke-width="1.6"/><text x="1059" y="182" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" fill="#19374c">Recovery</text><text x="1059" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#486877">new capture + audit</text><text x="64" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#3b5869">A failed upgrade that was RESTORED must never be labelled COMPLETE.</text></svg>