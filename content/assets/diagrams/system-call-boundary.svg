<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">Application and kernel service boundary</title><desc id="desc">User applications request operations; the kernel checks identity, memory and rights before the service acts.</desc>
<rect width="1100" height="340" fill="#f7fafc" rx="18"/>
<text x="40" y="50" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#203247">Application and kernel service boundary</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#167a89"/></marker></defs>
<rect x="42" y="100" width="265" height="145" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="59" y="134" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">User process</text>
<text x="59" y="163" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Notes application</text>
<text x="59" y="188" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Unprivileged request</text>
<line x1="312" y1="174" x2="390" y2="174" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><text x="351" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#14717e">request</text><rect x="395" y="100" width="295" height="145" rx="12" fill="#fff5e5" stroke="#d38d30" stroke-width="2"/>
<text x="412" y="134" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Kernel boundary</text>
<text x="412" y="163" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Validate caller + handle</text>
<text x="412" y="188" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Check user buffer + rights</text>
<line x1="693" y1="174" x2="765" y2="174" stroke="#167a89" stroke-width="3" marker-end="url(#arrow)"/><text x="729" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#14717e">accepted</text><rect x="772" y="100" width="285" height="145" rx="12" fill="#edf6f7" stroke="#1a8793" stroke-width="2"/>
<text x="789" y="134" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#203247">Protected service</text>
<text x="789" y="163" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Owns authorised changes</text>
<text x="789" y="188" font-family="Segoe UI, sans-serif" font-size="16" fill="#425667">Returns status + result</text>
<text x="552" y="284" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#425667">A system call is a controlled request, not permission granted by the caller.</text></svg>
