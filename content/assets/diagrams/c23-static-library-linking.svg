<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 410">
<title id="title">One C23 library, two independent applications</title>
<desc id="desc">A library built from catalogue.c and catalogue.h links into a demonstration programme and a separately compiled automated test. Both share the same implementation.</desc>
<rect width="1100" height="410" rx="24" fill="#f1f6f9"/>
<text x="42" y="49" fill="#1a3d51" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700">Reuse one implementation</text>
<rect x="42" y="101" width="283" height="120" rx="14" fill="#e4eef5" stroke="#7494a6" stroke-width="2"/>
<text x="68" y="140" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#12384d">catalogue.c</text>
<text x="68" y="172" font-family="Segoe UI,sans-serif" font-size="17" fill="#31576a">function definitions</text>
<text x="68" y="197" font-family="Segoe UI,sans-serif" font-size="15" fill="#4b6a79">catalogue.h: shared contract</text>
<rect x="426" y="103" width="264" height="118" rx="14" fill="#186b80"/>
<text x="558" y="146" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="21" font-weight="700" fill="white">Static library</text>
<text x="558" y="180" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="16" fill="#daf1f9">libbtb_course_catalogue.a</text>
<rect x="796" y="74" width="260" height="111" rx="14" fill="#17674f"/>
<text x="925" y="112" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="white">main.c</text>
<text x="925" y="142" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="16" fill="#e2ffec">course catalogue app</text>
<rect x="796" y="252" width="260" height="111" rx="14" fill="#17674f"/>
<text x="925" y="288" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="white">test_catalogue.c</text>
<text x="925" y="318" font-family="Segoe UI,sans-serif" text-anchor="middle" font-size="16" fill="#e2ffec">automated verification</text>
<g fill="none" stroke="#2f6880" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M330 160h85m-11-10 11 10-11 10"/>
<path d="M700 160h39v-31h46m-10-10 10 10-10 10"/>
<path d="M700 160h39v147h46m-10-10 10 10-10 10"/>
</g>
<text x="41" y="336" font-family="Segoe UI,sans-serif" font-size="17" fill="#2b4c62">Edit catalogue.c once; both client targets receive the change.</text>
<text x="41" y="365" font-family="Segoe UI,sans-serif" font-size="14" fill="#537183">CMake records the dependencies; Ninja schedules only the required rebuilds.</text>
</svg>
