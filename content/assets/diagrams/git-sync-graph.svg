<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Remote ahead and divergent Git histories</title><desc id="desc">Top: local main at A and remote main at B with A as ancestor; pulling fast-forward is safe. Bottom: B and C diverged from A; a fast-forward-only pull refuses and requires deliberate reconciliation.</desc>
<rect width="1000" height="400" rx="18" fill="#f1f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#153047"><text x="36" y="47" font-size="25" font-weight="700">Git ancestry decides whether an update is fast-forward</text><text x="55" y="101" font-size="20" font-weight="700">Case 1: remote ahead</text><text x="55" y="254" font-size="20" font-weight="700">Case 2: histories diverged</text></g>
<g stroke="#155f83" stroke-width="4" fill="none"><path d="M280 151H650"/><path d="M280 308L570 268"/><path d="M280 308L570 349"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><circle cx="280" cy="151" r="26" fill="#d4eaf9" stroke="#155f83" stroke-width="3"/><text x="280" y="157" font-size="19" fill="#14354a">A</text><circle cx="650" cy="151" r="26" fill="#d4f4e5" stroke="#1b795c" stroke-width="3"/><text x="650" y="157" font-size="19" fill="#14354a">B</text>
<text x="280" y="197" font-size="16" fill="#2b4d61">local main</text><text x="650" y="197" font-size="16" fill="#2b4d61">origin/main</text>
<circle cx="280" cy="308" r="26" fill="#d4eaf9" stroke="#155f83" stroke-width="3"/><text x="280" y="314" font-size="19" fill="#14354a">A</text>
<circle cx="570" cy="268" r="26" fill="#fff0d0" stroke="#a7741a" stroke-width="3"/><text x="570" y="274" font-size="19" fill="#14354a">B</text><circle cx="570" cy="349" r="26" fill="#d4f4e5" stroke="#1b795c" stroke-width="3"/><text x="570" y="355" font-size="19" fill="#14354a">C</text>
<text x="750" y="136" font-size="16" fill="#216146">Fast-forward allowed</text><text x="755" y="304" font-size="16" fill="#8d5d16">Pull --ff-only refuses</text>
</g>
</svg>
