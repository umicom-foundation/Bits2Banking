<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Bounded in-memory diagnostics compared with a validated teaching file</title>
  <desc id="desc">Eight-slot ring after ten events holds sequences three through ten and reports two overwritten items. A separate file can have verified hash links but neither design authenticates a producer or guarantees durable audit evidence.</desc>
  <rect width="1120" height="460" fill="#f4f8fa"/>
  <text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#203247">Bounded memory and retained evidence solve different problems</text>
  <rect x="40" y="90" width="503" height="290" rx="12" fill="#fff" stroke="#ccd8df" stroke-width="2"/>
  <rect x="575" y="90" width="503" height="290" rx="12" fill="#fff" stroke="#ccd8df" stroke-width="2"/>
  <text x="62" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#203247">In-memory C23 ring</text>
  <text x="598" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#203247">Classroom trace file</text>
  <g font-family="Consolas,monospace" font-size="18" text-anchor="middle">
    <rect x="63" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="90" y="191" fill="#203247">9</text>
    <rect x="120" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="147" y="191" fill="#203247">10</text>
    <rect x="177" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="204" y="191" fill="#203247">3</text>
    <rect x="234" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="261" y="191" fill="#203247">4</text>
    <rect x="291" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="318" y="191" fill="#203247">5</text>
    <rect x="348" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="375" y="191" fill="#203247">6</text>
    <rect x="405" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="432" y="191" fill="#203247">7</text>
    <rect x="462" y="157" width="55" height="54" rx="6" fill="#dcebef"/><text x="489" y="191" fill="#203247">8</text>
  </g>
  <text x="62" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#324e62">Reading order: 3, 4, 5, 6, 7, 8, 9, 10</text>
  <text x="62" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#9c4539">Overwritten: 2 · Power loss clears this memory</text>
  <g font-family="Consolas,monospace" font-size="14" fill="#fff">
    <rect x="598" y="155" width="450" height="44" rx="7" fill="#203247"/><text x="620" y="182">record 1 · metadata + digest</text>
    <rect x="598" y="207" width="450" height="44" rx="7" fill="#087c83"/><text x="620" y="234">record 2 · metadata + digest</text>
    <rect x="598" y="259" width="450" height="44" rx="7" fill="#203247"/><text x="620" y="286">record 3 · metadata + digest</text>
  </g>
  <text x="62" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#324e62">Fixed-size storage · copied snapshots</text>
  <text x="598" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#324e62">Read-only validation of a named file</text>
  <rect x="40" y="400" width="1038" height="40" rx="8" fill="#fff0d6"/>
  <text x="58" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#80581c">Neither example provides a trusted signature, authenticated device identity, or guaranteed durable logging.</text>
</svg>
