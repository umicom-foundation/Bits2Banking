<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tt dd" viewBox="0 0 1200 620">
 <title id="tt">One listener, two sources of content</title><desc id="dd">A validated HTTP request selects an exact C handler or falls back to a read-only file provider.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#187e86"/></marker></defs>
 <rect width="1200" height="620" fill="#f5f9fb" rx="14"/>
 <text x="42" y="60" font-family="Segoe UI, sans-serif" font-weight="700" font-size="30" fill="#163047">One listener, two sources of content</text>
<rect x="50" y="145" width="230" height="125" rx="13" fill="#e6f1f4" stroke="#76a9ae" stroke-width="2"/>
<text x="165.0" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">TCP + HTTP</text>
<text x="165.0" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">Host / method / path</text>
<rect x="360" y="145" width="235" height="125" rx="13" fill="#e6f1f4" stroke="#76a9ae" stroke-width="2"/>
<text x="477.5" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Registered paths</text>
<text x="477.5" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">Exact matching in C23</text>
<rect x="690" y="110" width="240" height="110" rx="13" fill="#e5f3e7" stroke="#76a9ae" stroke-width="2"/>
<text x="810.0" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">C23 handler</text>
<text x="810.0" y="175" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">/api/courses</text>
<rect x="690" y="290" width="240" height="125" rx="13" fill="#fff3dc" stroke="#76a9ae" stroke-width="2"/>
<text x="810.0" y="325" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Static file owner</text>
<text x="810.0" y="355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">/assets/site.css</text>
<rect x="985" y="195" width="165" height="130" rx="13" fill="#e5f3e7" stroke="#76a9ae" stroke-width="2"/>
<text x="1067.5" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Response</text>
<text x="1067.5" y="260" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">headers + body</text>
<path d="M280 207 L360 207" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M595 183 L690 165" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="642.5" y="164.0" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">Match</text>
<path d="M595 237 L690 350" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="642.5" y="283.5" font-size="15" fill="#24515a" text-anchor="middle" font-family="Segoe UI, sans-serif">No match</text>
<path d="M930 165 L985 235" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M930 350 L985 285" stroke="#187e86" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="340" y="455" width="510" height="92" rx="13" fill="#f2eefa" stroke="#76a9ae" stroke-width="2"/>
<text x="595.0" y="490" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#163047">Two different owners, one listener</text>
<text x="595.0" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#3b5568">Route handlers do not open sockets or bypass file-root checks.</text>
<text x="45" y="590" font-size="17" font-family="Segoe UI, sans-serif" fill="#415b70">A route miss means “not handled here”; the existing static-file checks remain authoritative.</text>
</svg>
