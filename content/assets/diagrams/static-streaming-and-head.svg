<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ttl desc">
<title id="ttl">Stream a large file through a fixed-size C buffer</title>
<desc id="desc">The file stays open while 8192-byte chunks pass to the TCP sender. GET sends headers and content; HEAD returns descriptive headers without the file body.</desc>
<rect width="1200" height="420" fill="#f2f6fa"/>
<text x="55" y="61" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#173247">One file, a small buffer, a complete response</text>
<rect x="60" y="105" width="270" height="155" rx="16" fill="#fff" stroke="#ccdce6" stroke-width="2"/>
<rect x="455" y="105" width="280" height="155" rx="16" fill="#e4f6f3" stroke="#007a80" stroke-width="2"/>
<rect x="862" y="105" width="280" height="155" rx="16" fill="#fff" stroke="#ccdce6" stroke-width="2"/>
<g font-family="Segoe UI, sans-serif" fill="#173247">
<text x="87" y="148" font-size="24" font-weight="700">Opened file</text>
<text x="87" y="188" font-size="21">151,241 bytes</text>
<text x="87" y="220" font-size="16" fill="#557488">Fixed file identity</text>
<text x="483" y="148" font-size="24" font-weight="700">C23 buffer</text>
<text x="483" y="188" font-size="22">8,192 bytes</text>
<text x="483" y="220" font-size="16" fill="#557488">Read, send, repeat</text>
<text x="886" y="148" font-size="24" font-weight="700">TCP socket</text>
<text x="886" y="188" font-size="21">Send all bytes</text>
<text x="886" y="220" font-size="16" fill="#557488">Check every return</text>
</g>
<g fill="none" stroke="#006e78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M334 183H441"/><path d="m430 174 11 9-11 9"/>
<path d="M740 183H848"/><path d="m837 174 11 9-11 9"/>
</g>
<rect x="60" y="303" width="514" height="74" rx="11" fill="#e4f6f3" stroke="#007a80"/>
<rect x="626" y="303" width="516" height="74" rx="11" fill="#fff0dc" stroke="#e1b16b"/>
<text x="82" y="333" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#17615b">GET</text>
<text x="82" y="359" font-family="Segoe UI, sans-serif" font-size="17" fill="#17615b">Headers + all 151,241 body bytes</text>
<text x="649" y="333" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#835013">HEAD</text>
<text x="649" y="359" font-family="Segoe UI, sans-serif" font-size="17" fill="#835013">Same Content-Length; zero body bytes</text>
</svg>
