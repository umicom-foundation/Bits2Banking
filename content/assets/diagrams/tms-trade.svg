<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 440" width="1150" height="440" role="img" aria-labelledby="title desc">
<title id="title">FX forward trade processing</title><desc id="desc">The lifecycle proceeds through reference data, capture, validation, confirmation, valuation, risk, settlement, reconciliation and accounting</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="575" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">A trade moves through controlled states</text>
<rect x="45" y="78" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="210.0" y="122.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">1. Reference data</text>
<path d="M380 117 L412 117" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="420" y="78" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="585.0" y="122.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">2. Trade capture</text>
<path d="M755 117 L787 117" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="795" y="78" width="330" height="78" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="960.0" y="122.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">3. Validation</text>
<rect x="45" y="196" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="210.0" y="240.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">4. Confirmation</text>
<path d="M380 235 L412 235" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="420" y="196" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="585.0" y="240.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">5. Valuation</text>
<path d="M755 235 L787 235" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="795" y="196" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="960.0" y="240.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">6. Risk</text>
<rect x="45" y="314" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="210.0" y="358.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">7. Settlement</text>
<path d="M380 353 L412 353" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="420" y="314" width="330" height="78" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="585.0" y="358.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">8. Reconciliation</text>
<path d="M755 353 L787 353" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="795" y="314" width="330" height="78" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="960.0" y="358.0" text-anchor="middle" font-size="19" font-weight="650" fill="#193448">9. Accounting</text>
<text x="575" y="423" text-anchor="middle" font-size="16"  fill="#2d4f64">Read left to right across each row, then continue on the row below.</text></g></svg>