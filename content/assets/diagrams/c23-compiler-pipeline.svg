<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 340">
<title id="title">From C23 source files to a native executable</title>
<desc id="desc">The preprocessor handles headers and directives, the compiler generates Assembly, the assembler produces an object file, and the linker combines it with a library to create an executable.</desc>
<rect width="1200" height="340" rx="22" fill="#eff5f8"/>
<text x="45" y="48" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#163850">C23 → native machine code</text>
<g font-family="Segoe UI, sans-serif" text-anchor="middle">
  <rect x="35" y="100" width="185" height="112" rx="12" fill="#153a54"/>
  <text x="127" y="139" fill="white" font-size="18" font-weight="700">main.c</text>
  <text x="127" y="168" fill="#d0e5ef" font-size="15">catalogue.h</text>
  <text x="127" y="191" fill="#d0e5ef" font-size="14">source and interface</text>
  <rect x="263" y="100" width="185" height="112" rx="12" fill="#176a7c"/>
  <text x="355" y="145" fill="white" font-size="18" font-weight="700">Preprocessor</text>
  <text x="355" y="174" fill="#e3f4f9" font-size="15">main.i</text>
  <rect x="491" y="100" width="185" height="112" rx="12" fill="#176a7c"/>
  <text x="583" y="145" fill="white" font-size="18" font-weight="700">Compiler</text>
  <text x="583" y="174" fill="#e3f4f9" font-size="15">main.s</text>
  <rect x="719" y="100" width="185" height="112" rx="12" fill="#176a7c"/>
  <text x="811" y="145" fill="white" font-size="18" font-weight="700">Assembler</text>
  <text x="811" y="174" fill="#e3f4f9" font-size="15">main.o / .obj</text>
  <rect x="947" y="100" width="218" height="112" rx="12" fill="#1a855f"/>
  <text x="1056" y="145" fill="white" font-size="18" font-weight="700">Linker</text>
  <text x="1056" y="174" fill="#e5faee" font-size="15">application.exe</text>
</g>
<g fill="none" stroke="#26617d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M224 156h32m-10 -10 10 10-10 10"/><path d="M452 156h32m-10 -10 10 10-10 10"/><path d="M680 156h32m-10 -10 10 10-10 10"/><path d="M908 156h32m-10 -10 10 10-10 10"/>
<path d="M1056 272v-53" stroke="#14916b" stroke-dasharray="6 7"/>
</g>
<rect x="831" y="259" width="333" height="54" rx="10" fill="#d5efe4" stroke="#a3d7c1"/>
<text x="998" y="282" fill="#175b45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="17">Library: libbtb_course_catalogue.a</text>
<text x="998" y="301" fill="#175b45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13">supplies missing function definitions</text>
<text x="44" y="281" font-family="Segoe UI, sans-serif" font-size="16" fill="#38576a">The compiler can accept a function call before the linker finds its definition.</text>
</svg>
