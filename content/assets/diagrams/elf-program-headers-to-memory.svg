<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">From ELF programme headers to a memory layout</title>
<desc id="desc">An ELF file with code and data segment entries points to two memory segments. File-backed bytes are copied and additional memory is zero-filled.</desc>
<rect width="1120" height="470" rx="20" fill="#f0f5fa"/>
<rect x="32" y="48" width="360" height="368" rx="14" fill="#fff" stroke="#cad7e2" stroke-width="2"/>
<text x="56" y="88" fill="#203247" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">ELF executable file</text>
<rect x="56" y="112" width="312" height="49" rx="7" fill="#deedf0"/>
<text x="73" y="144" fill="#193749" font-family="Segoe UI, sans-serif" font-size="19">ELF header · entry point</text>
<rect x="56" y="176" width="312" height="83" rx="8" fill="#e0eff6" stroke="#9fc9df"/>
<text x="73" y="205" fill="#203247" font-family="Consolas, monospace" font-size="18">PT_LOAD #1 · R-X</text>
<text x="73" y="233" fill="#526579" font-family="Segoe UI, sans-serif" font-size="16">128 file bytes · 512 memory bytes</text>
<rect x="56" y="274" width="312" height="83" rx="8" fill="#e8f5e9" stroke="#b0d8b5"/>
<text x="73" y="305" fill="#203247" font-family="Consolas, monospace" font-size="18">PT_LOAD #2 · RW-</text>
<text x="73" y="333" fill="#526579" font-family="Segoe UI, sans-serif" font-size="16">32 file bytes · 256 memory bytes</text>
<text x="56" y="392" fill="#4f6979" font-family="Segoe UI, sans-serif" font-size="15">Metadata inspected; file not executed</text>
<path d="M406 224 H492" stroke="#0f7778" stroke-width="5" fill="none"/>
<path d="M481 214 L498 224 L481 234" fill="none" stroke="#0f7778" stroke-width="5" stroke-linecap="round"/>
<text x="412" y="202" fill="#0f7778" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">plan</text>
<rect x="516" y="48" width="574" height="368" rx="14" fill="#fff" stroke="#cad7e2" stroke-width="2"/>
<text x="544" y="88" fill="#203247" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Hypothetical memory layout</text>
<rect x="546" y="113" width="515" height="132" rx="9" fill="#eef5fa" stroke="#9fc9df"/>
<text x="563" y="142" fill="#203247" font-family="Consolas, monospace" font-size="18">Virtual 0x80200000 · executable</text>
<rect x="565" y="158" width="125" height="48" rx="6" fill="#4a92b1"/>
<text x="575" y="188" fill="white" font-family="Segoe UI, sans-serif" font-size="17">128 bytes</text>
<rect x="699" y="158" width="342" height="48" rx="6" fill="#d1e3ed" stroke="#a8c6d6"/>
<text x="730" y="188" fill="#203247" font-family="Segoe UI, sans-serif" font-size="17">384 zero-initialised bytes</text>
<rect x="546" y="260" width="515" height="132" rx="9" fill="#eff7ed" stroke="#b0d8b5"/>
<text x="563" y="289" fill="#203247" font-family="Consolas, monospace" font-size="18">Virtual 0x80202000 · data</text>
<rect x="565" y="306" width="91" height="46" rx="6" fill="#438e61"/>
<text x="574" y="335" fill="white" font-family="Segoe UI, sans-serif" font-size="15">32 bytes</text>
<rect x="665" y="306" width="376" height="46" rx="6" fill="#d9eed9" stroke="#b0d8b5"/>
<text x="728" y="335" fill="#203247" font-family="Segoe UI, sans-serif" font-size="17">224 zero-initialised bytes</text>
<text x="33" y="448" fill="#526579" font-family="Segoe UI, sans-serif" font-size="15">Umicom Foundation · Bits2Banking · read-only educational load plan (not a loader)</text>
</svg>
