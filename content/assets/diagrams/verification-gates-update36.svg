<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Verification-gate matrix"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Verification-gate matrix</text><text class="subtitle" x="42" y="88">Affected modules determine what evidence is required, not what is already proven.</text><rect x="50" y="163" width="265" height="100" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="70" y="199">Reviewed change</text><text class="boxDetail" x="70" y="227">Known full revision</text><rect x="396" y="163" width="295" height="100" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="416" y="199">Impact plan</text><text class="boxDetail" x="416" y="227">Transitive consumer set</text><rect x="773" y="163" width="365" height="100" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="793" y="199">Verification gates</text><text class="boxDetail" x="793" y="227">BUILD · UNIT · UI · BOOT</text><path class="edge" d="M317 213 L393 213"/><path class="edge" d="M694 213 L770 213"/><rect x="130" y="335" width="277" height="85" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="150" y="371">PASSED</text><text class="boxDetail" x="150" y="399">The check actually ran</text><rect x="462" y="335" width="277" height="85" rx="15" fill="#65422b" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="482" y="371">NOT RUN</text><text class="boxDetail" x="482" y="399">Explicitly unexecuted</text><rect x="795" y="335" width="277" height="85" rx="15" fill="#613640" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="815" y="371">MISSING</text><text class="boxDetail" x="815" y="399">No valid outcome supplied</text><text class="legend" x="52" y="455">A gate requirement is not a passed result; incomplete evidence blocks human review.</text></svg>
