<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="t d">
 <title id="t">Check before changing two fictional balances</title>
 <desc id="d">A fictional transfer of 25 pounds prepares two balances and revisions, checks them all, and only then commits both records.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#0c7081"/></marker></defs>
 <rect x="1" y="1" width="958" height="368" rx="17" fill="#f6fafc" stroke="#c7dde8"/>
 <text x="32" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#173b51">A checked fictional transfer</text>
 <rect x="32" y="79" width="243" height="184" rx="11" fill="#e1eef6" stroke="#84b1c5"/>
 <text x="49" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#173b51">Before</text>
 <text x="49" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173b51">Education: £150.00</text>
 <text x="49" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173b51">Materials: £40.00</text>
 <text x="49" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#3c6679">Transfer: £25.00</text>
 <path d="M277 173 H318" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="326" y="79" width="300" height="184" rx="11" fill="#fff3db" stroke="#d5aa64"/>
 <text x="342" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#705021">Prepare and check</text>
 <text x="342" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#624a2c">£150.00 − £25.00 = £125.00</text>
 <text x="342" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#624a2c">£40.00 + £25.00 = £65.00</text>
 <text x="342" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#624a2c">Validate both revisions</text>
 <text x="342" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#905924">If any check fails, change neither</text>
 <path d="M628 173 H668" stroke="#0c7081" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="674" y="79" width="251" height="184" rx="11" fill="#e1f3e9" stroke="#82bda0"/>
 <text x="690" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#17513f">After acceptance</text>
 <text x="690" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#17513f">Education: £125.00</text>
 <text x="690" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#17513f">Materials: £65.00</text>
 <text x="690" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#315e4e">Both revisions +1</text>
 <rect x="35" y="294" width="886" height="47" rx="8" fill="#edf4f8"/>
 <text x="52" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173b51">Example only: no bank connection, audit ledger, database transaction or concurrent access.</text>
</svg>
