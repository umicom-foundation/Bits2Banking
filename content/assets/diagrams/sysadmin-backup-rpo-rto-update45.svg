<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Backup evidence, RPO and RTO</title><desc id="desc">Two independent recovery objectives illustrated with a fictional outage.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Backup evidence, RPO and RTO</text><text x="38" y="75" class="s">Two independent recovery objectives illustrated with a fictional outage.</text><line x1="96" y1="265" x2="993" y2="265" stroke="#315d78" stroke-width="4"/><line x1="155" y1="265" x2="155" y2="175" stroke="#536d85" stroke-width="2"/><rect class="accent" x="39" y="100" width="232" height="85" rx="14"/><text x="155.0" y="137" text-anchor="middle" class="x">09:00</text><text x="155.0" y="166" text-anchor="middle" class="s">Last good backup</text><line x1="550" y1="265" x2="550" y2="175" stroke="#536d85" stroke-width="2"/><rect class="bad" x="434" y="100" width="232" height="85" rx="14"/><text x="550.0" y="137" text-anchor="middle" class="x">09:18</text><text x="550.0" y="166" text-anchor="middle" class="s">Outage</text><line x1="890" y1="265" x2="890" y2="175" stroke="#536d85" stroke-width="2"/><rect class="accent" x="774" y="100" width="232" height="85" rx="14"/><text x="890.0" y="137" text-anchor="middle" class="x">10:38</text><text x="890.0" y="166" text-anchor="middle" class="s">Service restored</text><text x="352" y="296" class="x" text-anchor="middle">RPO observation: 18 min</text><text x="755" y="335" class="x" text-anchor="middle">RTO observation: 80 min</text><text x="545" y="390" class="s" text-anchor="middle">RPO measures recoverable data age; RTO measures time to restore useful service.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>