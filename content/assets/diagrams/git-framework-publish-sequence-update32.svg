<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><ns0:title id="title">One Framework source, multiple tested pins</ns0:title><ns0:desc id="desc">Commit Framework once. Parent repositories record exact published commit identifiers.</ns0:desc><ns0:defs><ns0:marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><ns0:path d="M0 0L10 5L0 10z" fill="#80d3f1" /></ns0:marker></ns0:defs><ns0:rect width="1200" height="460" rx="18" fill="#0b1624" /><ns0:text x="40" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#e9f4ff" font-weight="bold" text-anchor="start">One Framework source, multiple tested pins</ns0:text><ns0:text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">Commit Framework once. Parent repositories record exact published commit identifiers.</ns0:text><ns0:rect x="25" y="135" width="232" height="138" rx="14" fill="#1c3752" stroke="#9be8b0" stroke-width="2" /><ns0:text x="141.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Framework source</ns0:text><ns0:text x="141.0" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">C23 implementation</ns0:text><ns0:text x="141.0" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">single canonical owner</ns0:text><ns0:rect x="303" y="135" width="232" height="138" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><ns0:text x="419.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Framework remote</ns0:text><ns0:text x="419.0" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">published commit SHA</ns0:text><ns0:text x="419.0" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">origin/main reachable</ns0:text><ns0:rect x="581" y="135" width="232" height="138" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><ns0:text x="697.0" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">OS child checkout</ns0:text><ns0:text x="697.0" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">fast-forward when clean</ns0:text><ns0:text x="697.0" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">build and test OS</ns0:text><ns0:rect x="859" y="135" width="315" height="138" rx="14" fill="#1c3752" stroke="#ffd483" stroke-width="2" /><ns0:text x="1016.5" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">OS parent gitlink</ns0:text><ns0:text x="1016.5" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">mode 160000 + SHA</ns0:text><ns0:text x="1016.5" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">commit / push OS main</ns0:text><ns0:path d="M257 203 L294 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><ns0:path d="M535 203 L572 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><ns0:path d="M813 203 L850 203" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><ns0:text x="35" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e9f4ff" font-weight="normal" text-anchor="start">Framework push ≠ OS parent push. The OS parent records a published, tested child revision.</ns0:text><ns0:rect x="70" y="364" width="320" height="85" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><ns0:text x="230.0" y="394" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Applications parent</ns0:text><ns0:text x="230.0" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">Own separate tested pin</ns0:text><ns0:text x="565" y="403" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#9be8b0" font-weight="normal" text-anchor="start">No source-copy workaround  •  No force checkout  •  No scripts</ns0:text></ns0:svg>