<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">Sv39 three-level page-table translation</title>
<desc id="desc">A canonical 64-bit Sv39 virtual address contains three nine-bit page indices and a twelve-bit offset. Three page tables select a physical frame and retain the byte offset.</desc>
<rect width="1120" height="480" rx="20" fill="#f0f5fa"/>
<text x="40" y="58" fill="#203247" font-size="29" font-weight="700" font-family="Segoe UI, sans-serif">Sv39: three levels, one 4 KiB physical page</text>
<text x="40" y="91" fill="#526579" font-size="17" font-family="Segoe UI, sans-serif">Upper virtual-address bits must sign-extend bit 38.</text>
<g font-family="Consolas, monospace" text-anchor="middle" font-size="18">
<rect x="42" y="116" width="267" height="64" rx="7" fill="#cbd9e7"/><text x="176" y="143" fill="#203247">Sign extension</text><text x="176" y="163" font-size="14" fill="#4c6073">bits 63–39</text>
<rect x="317" y="116" width="195" height="64" rx="7" fill="#2d668d"/><text x="414" y="144" fill="white">VPN[2]</text><text x="414" y="164" font-size="14" fill="#deedfa">9 bits</text>
<rect x="520" y="116" width="195" height="64" rx="7" fill="#387e87"/><text x="618" y="144" fill="white">VPN[1]</text><text x="618" y="164" font-size="14" fill="#ddf7f8">9 bits</text>
<rect x="723" y="116" width="195" height="64" rx="7" fill="#408d71"/><text x="820" y="144" fill="white">VPN[0]</text><text x="820" y="164" font-size="14" fill="#e7faf0">9 bits</text>
<rect x="926" y="116" width="153" height="64" rx="7" fill="#dcad5d"/><text x="1002" y="144" fill="#203247">Offset</text><text x="1002" y="164" font-size="14" fill="#304657">12 bits</text>
</g>
<g fill="none" stroke-width="3">
<path d="M414 180 V222" stroke="#2d668d"/><path d="M406 214 L414 225 L422 214" stroke="#2d668d"/>
<path d="M618 180 V260" stroke="#387e87"/><path d="M610 252 L618 263 L626 252" stroke="#387e87"/>
<path d="M820 180 V299" stroke="#408d71"/><path d="M812 290 L820 301 L828 290" stroke="#408d71"/>
<path d="M1002 180 V338" stroke="#b17d32"/><path d="M994 330 L1002 341 L1010 330" stroke="#b17d32"/>
</g>
<g font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">
<rect x="270" y="231" width="288" height="58" rx="10" fill="#e2edf5" stroke="#9fbfd7"/><text x="414" y="267" fill="#203247">Level 2: choose next table</text>
<rect x="474" y="270" width="288" height="58" rx="10" fill="#def1f1" stroke="#abd1d2"/><text x="618" y="306" fill="#203247">Level 1: choose next table</text>
<rect x="676" y="309" width="288" height="58" rx="10" fill="#e4f4e9" stroke="#b1d1bd"/><text x="820" y="345" fill="#203247">Level 0: leaf PTE → PPN</text>
</g>
<rect x="42" y="386" width="1037" height="53" rx="9" fill="#203247"/>
<text x="72" y="418" fill="#fff" font-family="Consolas, monospace" font-size="21">Virtual 0x40201120 → physical frame 0x9000 + offset 0x120 = 0x9120</text>
<text x="42" y="464" fill="#526579" font-family="Segoe UI, sans-serif" font-size="15">Umicom Foundation · Bits2Banking · C23 software walk, not a hardware MMU activation</text>
</svg>
