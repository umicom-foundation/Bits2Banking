<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Native build-failure triage"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Native build-failure triage</text><text class="subtitle" x="42" y="88">Configuration, compiler, linker, test, launch and installer are different failure stages.</text><rect x="45" y="139" width="335" height="104" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="65" y="175">01  Configure</text><text class="boxDetail" x="65" y="203">CMake settings &amp; packages</text><path class="edge" d="M383 191 L431 191"/><rect x="435" y="139" width="335" height="104" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="455" y="175">02  Compile</text><text class="boxDetail" x="455" y="203">C23 syntax and types</text><path class="edge" d="M773 191 L821 191"/><rect x="825" y="139" width="335" height="104" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="845" y="175">03  Link</text><text class="boxDetail" x="845" y="203">Symbols and ABI</text><rect x="45" y="309" width="335" height="104" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="65" y="345">04  CTest</text><text class="boxDetail" x="65" y="373">Failed / Not Run</text><path class="edge" d="M383 361 L431 361"/><rect x="435" y="309" width="335" height="104" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="455" y="345">05  Launch</text><text class="boxDetail" x="455" y="373">DLL and resource paths</text><path class="edge" d="M773 361 L821 361"/><rect x="825" y="309" width="335" height="104" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="845" y="345">06  Package</text><text class="boxDetail" x="845" y="373">Installed artefacts</text><text class="legend" x="45" y="469">Investigate the earliest observed failure; do not silently discard downstream evidence.</text></svg>
