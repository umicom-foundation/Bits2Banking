<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="425" viewBox="0 0 1160 425" role="img" aria-labelledby="title desc">
<title id="title">Recovery preserves accepted work</title><desc id="desc">Revision one stays accepted after revision two faults; a reviewed recovery clears in-flight state without committing or replaying it automatically.</desc>
<rect width="1160" height="425" rx="14" fill="#f1f6f8"/>
<text x="38" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#203247">Recovery preserves accepted work</text>
<rect x="38" y="110" width="330" height="95" rx="10" fill="#dbf1e6" stroke="#83b9a4" stroke-width="2"/><text x="203" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">COMMITTED = 1</text><text x="203" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Revision 1 accepted</text><rect x="414" y="110" width="330" height="95" rx="10" fill="#fff1d9" stroke="#d0af79" stroke-width="2"/><text x="579" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">IN FLIGHT = 2</text><text x="579" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Revision 2 not accepted</text><rect x="790" y="110" width="330" height="95" rx="10" fill="#ffeadf" stroke="#d9a98b" stroke-width="2"/><text x="955" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">FAULTED</text><text x="955" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Ordinary commit refused</text><path d="M368 160 L405 160" fill="none" stroke="#36677c" stroke-width="3"/><path d="M414 160 l-12 -7 v14 z" fill="#36677c"/><path d="M744 160 L781 160" fill="none" stroke="#36677c" stroke-width="3"/><path d="M790 160 l-12 -7 v14 z" fill="#36677c"/><path d="M953 216 V268 H182 V216" fill="none" stroke="#497c8a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="580" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#28586a">REVIEW + RECOVER — discard unfinished revision only</text><rect x="165" y="299" width="370" height="84" rx="10" fill="#e0f3e8" stroke="#80bc9d" stroke-width="2"/><text x="350" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">COMMITTED = 1</text><text x="350" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Previously accepted work retained</text><rect x="622" y="299" width="370" height="84" rx="10" fill="#e5f0f8" stroke="#9dbed3" stroke-width="2"/><text x="807" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">RETRY REVISION 2</text><text x="807" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Only a new explicit Begin / Commit</text><path d="M535 339 L613 339" fill="none" stroke="#36677c" stroke-width="3"/><path d="M622 339 l-12 -7 v14 z" fill="#36677c"/>
</svg>