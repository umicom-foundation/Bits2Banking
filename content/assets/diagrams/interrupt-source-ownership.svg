<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
<title id="title">Interrupt source lifecycle — one owner per source</title><desc id="desc">A linear lease and acknowledgement path; optional cancellation before service or explicitly reviewed recovery after a fault.</desc>
<rect width="1160" height="430" rx="14" fill="#f1f6f8"/>
<text x="38" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#203247">Interrupt source lifecycle — one owner per source</text>
<rect x="30" y="98" width="180" height="90" rx="10" fill="#ddf2e9" stroke="#9ac2cf" stroke-width="2"/><text x="120" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">FREE</text><text x="120" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">No current owner</text><rect x="265" y="98" width="180" height="90" rx="10" fill="#ddf2e9" stroke="#9ac2cf" stroke-width="2"/><text x="355" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">LEASED</text><text x="355" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Checked source lease</text><rect x="500" y="98" width="180" height="90" rx="10" fill="#e3f0fa" stroke="#9ac2cf" stroke-width="2"/><text x="590" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">ARMED</text><text x="590" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Source enabled</text><rect x="735" y="98" width="180" height="90" rx="10" fill="#e3f0fa" stroke="#9ac2cf" stroke-width="2"/><text x="825" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">SERVICING</text><text x="825" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Handler entered</text><rect x="970" y="98" width="180" height="90" rx="10" fill="#e3f0fa" stroke="#9ac2cf" stroke-width="2"/><text x="1060" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">ACKED</text><text x="1060" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Event acknowledged</text><path d="M210 143 L256 143" fill="none" stroke="#36677c" stroke-width="3"/><path d="M265 143 l-12 -7 v14 z" fill="#36677c"/><path d="M445 143 L491 143" fill="none" stroke="#36677c" stroke-width="3"/><path d="M500 143 l-12 -7 v14 z" fill="#36677c"/><path d="M680 143 L726 143" fill="none" stroke="#36677c" stroke-width="3"/><path d="M735 143 l-12 -7 v14 z" fill="#36677c"/><path d="M915 143 L961 143" fill="none" stroke="#36677c" stroke-width="3"/><path d="M970 143 l-12 -7 v14 z" fill="#36677c"/><path d="M1050 197 L1050 228 L353 228 L353 193" stroke="#3d7484" stroke-width="3" fill="none" stroke-dasharray="8 5"/>
<text x="690" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#245369">RETURN — to leased state</text><rect x="505" y="276" width="260" height="81" rx="10" fill="#fff2dd" stroke="#d9b279" stroke-width="2"/><text x="635" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">CANCEL</text><text x="635" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Only before ENTER</text><rect x="810" y="276" width="260" height="81" rx="10" fill="#fff2e5" stroke="#d9b279" stroke-width="2"/><text x="940" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#1b4255">FAULT / RECOVER</text><text x="940" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#365d6c">Explicit reviewed transition</text><path d="M594 193 V274" stroke="#ae8651" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
<path d="M831 193 L910 275" stroke="#ae8651" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
<text x="30" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#425d69">Source ownership is logical policy; the classroom model never masks hardware interrupts.</text>
</svg>