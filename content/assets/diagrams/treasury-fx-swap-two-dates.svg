<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">FX swap near and far currency movements</title>
<desc id="desc">On 2 November the company pays GBP 100000 and receives USD 125000. On 2 December it receives GBP 100000 and pays USD 126000. Values are fictional.</desc>
<rect width="1000" height="475" rx="16" fill="#fff"/>
<text x="50" y="45" fill="#14334a" font-family="system-ui" font-size="25" font-weight="700">One FX swap, two settlement dates</text>
<text x="50" y="72" fill="#506c7d" font-family="system-ui" font-size="14">All amounts and directions from the company's point of view · teaching example</text>
<rect x="58" y="106" width="413" height="273" rx="16" fill="#eef6fc" stroke="#9abacc"/>
<rect x="529" y="106" width="413" height="273" rx="16" fill="#fff5ec" stroke="#e2ae86"/>
<text x="265" y="143" text-anchor="middle" fill="#174a6a" font-family="system-ui" font-size="23" font-weight="700">Near leg</text>
<text x="265" y="166" text-anchor="middle" fill="#405c70" font-family="system-ui" font-size="14">2 November · initial exchange</text>
<rect x="81" y="196" width="366" height="57" rx="9" fill="#ffffff"/>
<text x="101" y="232" fill="#9b3c23" font-family="system-ui" font-size="21" font-weight="700">GBP −100,000</text>
<text x="383" y="232" text-anchor="end" fill="#506070" font-family="system-ui" font-size="15">Pay</text>
<rect x="81" y="275" width="366" height="57" rx="9" fill="#ffffff"/>
<text x="101" y="311" fill="#166f5b" font-family="system-ui" font-size="21" font-weight="700">USD +125,000</text>
<text x="383" y="311" text-anchor="end" fill="#506070" font-family="system-ui" font-size="15">Receive</text>
<text x="735" y="143" text-anchor="middle" fill="#8a4d24" font-family="system-ui" font-size="23" font-weight="700">Far leg</text>
<text x="735" y="166" text-anchor="middle" fill="#775d48" font-family="system-ui" font-size="14">2 December · reverse exchange</text>
<rect x="553" y="196" width="365" height="57" rx="9" fill="#ffffff"/>
<text x="573" y="232" fill="#166f5b" font-family="system-ui" font-size="21" font-weight="700">GBP +100,000</text>
<text x="857" y="232" text-anchor="end" fill="#506070" font-family="system-ui" font-size="15">Receive</text>
<rect x="553" y="275" width="365" height="57" rx="9" fill="#ffffff"/>
<text x="573" y="311" fill="#9b3c23" font-family="system-ui" font-size="21" font-weight="700">USD −126,000</text>
<text x="857" y="311" text-anchor="end" fill="#506070" font-family="system-ui" font-size="15">Pay</text>
<path d="M477 244 L523 244" stroke="#385974" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M518 236 L526 244 L518 252" stroke="#385974" stroke-width="3" fill="none"/>
<text x="500" y="417" text-anchor="middle" fill="#344e61" font-family="system-ui" font-size="17">Near and far obligations are linked, but each needs its own settlement evidence.</text>
</svg>