<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Trade processing: economic agreement, controls and settlement evidence</title>
<desc id="desc">Trade capture leads to control and authorisation, transfer obligations, messaging and settlement evidence. Accounting runs alongside relevant business events. A final check compares the intended and actual business outcomes.</desc>
<rect width="1100" height="510" fill="#fff" rx="16"/>
<text x="55" y="43" fill="#14334a" font-family="system-ui" font-size="25" font-weight="700">From saved trade to proven settlement</text>
<text x="55" y="71" fill="#547081" font-family="system-ui" font-size="15">Each stage answers a different question · conceptual order only</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#59788e"/></marker></defs>
<g font-family="system-ui" text-anchor="middle">
<rect x="45" y="126" width="185" height="121" fill="#eef6fc" stroke="#9bbad0" rx="12"/>
<text x="137" y="165" font-size="18" font-weight="700" fill="#174862">Trade capture</text><text x="137" y="190" font-size="13" fill="#4c6779">Agreement recorded</text><text x="137" y="209" font-size="13" fill="#4c6779">at a known version</text>
<rect x="260" y="126" width="185" height="121" fill="#edf7f2" stroke="#96c9b5" rx="12"/>
<text x="352" y="165" font-size="18" font-weight="700" fill="#245f50">Controls</text><text x="352" y="190" font-size="13" fill="#4c6779">Permissions, checks,</text><text x="352" y="209" font-size="13" fill="#4c6779">workflow action</text>
<rect x="475" y="126" width="185" height="121" fill="#fff5e8" stroke="#e3c69d" rx="12"/>
<text x="567" y="165" font-size="18" font-weight="700" fill="#7e5425">Transfers</text><text x="567" y="190" font-size="13" fill="#4c6779">Cash obligations</text><text x="567" y="209" font-size="13" fill="#4c6779">and account details</text>
<rect x="690" y="126" width="185" height="121" fill="#f1effc" stroke="#baa8d3" rx="12"/>
<text x="782" y="165" font-size="18" font-weight="700" fill="#5c4779">Messages</text><text x="782" y="190" font-size="13" fill="#4c6779">Send, acknowledge,</text><text x="782" y="209" font-size="13" fill="#4c6779">match and repair</text>
<rect x="905" y="126" width="150" height="121" fill="#edf7f2" stroke="#96c9b5" rx="12"/>
<text x="980" y="165" font-size="18" font-weight="700" fill="#245f50">Settlement</text><text x="980" y="190" font-size="13" fill="#4c6779">Prove the actual</text><text x="980" y="209" font-size="13" fill="#4c6779">cash movements</text>
</g>
<g fill="none" stroke="#59788e" stroke-width="2.5" marker-end="url(#a)"><path d="M231 186 H257"/><path d="M446 186 H472"/><path d="M661 186 H687"/><path d="M876 186 H902"/></g>
<rect x="308" y="303" width="475" height="85" rx="13" fill="#eef4f8" stroke="#abc1d0"/>
<text x="545" y="338" text-anchor="middle" fill="#14334a" font-family="system-ui" font-size="19" font-weight="700">Accounting and reconciliation</text>
<text x="545" y="363" text-anchor="middle" fill="#435e6d" font-family="system-ui" font-size="14">Separate evidence of the financial effects and completed obligations</text>
<path d="M353 249 V292 H408 V302" stroke="#59788e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M980 249 V292 H690 V302" stroke="#59788e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="550" y="439" text-anchor="middle" font-family="system-ui" font-size="16" fill="#324e60">A green status at one stage does not automatically prove the whole process completed.</text>
</svg>