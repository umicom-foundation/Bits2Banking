<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 670" role="img" aria-labelledby="title description">
 <title id="title">Conditional HTTP requests</title><desc id="description">Browser revalidates a retained static file through GET, If-None-Match and a 304 response.</desc>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7fb"/><stop offset="1" stop-color="#e7f2f3"/></linearGradient>
 <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9" fill="#08777a"/></marker>
 </defs><rect width="1120" height="670" rx="25" fill="url(#bg)"/>
 <rect x="32" y="32" width="8" height="68" rx="4" fill="#0b8589"/>
 <text x="62" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">Conditional HTTP requests</text>
 <text x="62" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#536879">Bits2Banking · Native C23 · Umicom Foundation</text>
<rect x="48" y="160" width="320" height="135" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="66" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Browser</text><text x="66" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Retains file bytes + ETag</text><text x="66" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Sends a conditional request</text><rect x="414" y="160" width="290" height="135" rx="16" fill="#e6eef9" stroke="#b5c9d5" stroke-width="1.6"/><text x="432" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">C23 HTTP parser</text><text x="432" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Checks Host and header syntax</text><text x="432" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Rejects invalid input</text><rect x="747" y="160" width="325" height="135" rx="16" fill="#e2f5f4" stroke="#b5c9d5" stroke-width="1.6"/><text x="765" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Rooted static-file owner</text><text x="765" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Opens an admitted file</text><text x="765" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Builds a weak metadata ETag</text><path d="M370 227 L409 227" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M706 227 L742 227" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="365" width="480" height="140" rx="16" fill="#e2f5f4" stroke="#b5c9d5" stroke-width="1.6"/><text x="78" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Match → 304 Not Modified</text><text x="78" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">No response body is transmitted</text><text x="78" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Browser reuses its retained representation</text><rect x="580" y="365" width="480" height="140" rx="16" fill="#e6eef9" stroke="#b5c9d5" stroke-width="1.6"/><text x="598" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Miss → 200 OK</text><text x="598" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Send current bytes and updated ETag</text><text x="598" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">HEAD announces length but has no body</text><path d="M890 300 L875 359" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M890 300 L295 359" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="612" width="1044" height="40" rx="10" fill="#d4e8ec"/><text x="58" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#203247">An ETag does not bypass path permissions. A weak metadata tag is not a byte-exact content digest.</text></svg>