<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 443" role="img" aria-labelledby="title desc"><title id="title">Fail closed: three outcomes with different meanings</title><desc id="desc">Malformed evidence is not equivalent to an ordinary blocked release.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80d3f1" /></marker></defs><rect width="1200" height="443" rx="18" fill="#0b1624" /><text x="40" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#e9f4ff" font-weight="bold" text-anchor="start">Fail closed: three outcomes with different meanings</text><text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">Malformed evidence is not equivalent to an ordinary blocked release.</text><rect x="25" y="147" width="330" height="150" rx="14" fill="#1c3752" stroke="#ff9caa" stroke-width="2" /><text x="190.0" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">INVALID</text><text x="190.0" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">bad enum / malformed SHA</text><text x="190.0" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">previous output untouched</text><rect x="435" y="147" width="330" height="150" rx="14" fill="#1c3752" stroke="#ffd483" stroke-width="2" /><text x="600.0" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">BLOCKED</text><text x="600.0" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">valid but insufficient proof</text><text x="600.0" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">all reasons reported</text><rect x="845" y="147" width="330" height="150" rx="14" fill="#1c3752" stroke="#9be8b0" stroke-width="2" /><text x="1010.0" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">READY</text><text x="1010.0" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">all modelled gates pass</text><text x="1010.0" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">still requires Git + reviewer</text><text x="48" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ff9caa" font-weight="normal" text-anchor="start">Example: non-hex SHA</text><text x="457" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#ffd483" font-weight="normal" text-anchor="start">Example: untested child</text><text x="867" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#9be8b0" font-weight="normal" text-anchor="start">Example: reviewed clean push</text><text x="48" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#b4c9dc" font-weight="normal" text-anchor="start">100,000 deterministic negative mutations prove added hazards never create READY in the model.</text></svg>