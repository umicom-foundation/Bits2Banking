<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Change-impact propagation"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Change-impact propagation</text><text class="subtitle" x="42" y="88">A checked dependency graph describes risk; it does not compile or test software.</text><rect x="55" y="150" width="250" height="100" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="75" y="186">Framework base</text><text class="boxDetail" x="75" y="214">C23 public contract</text><rect x="462" y="125" width="250" height="100" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="482" y="161">Framework VCS</text><text class="boxDetail" x="482" y="189">Depends on base</text><rect x="462" y="270" width="250" height="100" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="482" y="306">Framework build</text><text class="boxDetail" x="482" y="334">Depends on base</text><rect x="865" y="125" width="280" height="100" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="885" y="161">Studio IDE</text><text class="boxDetail" x="885" y="189">Depends on VCS