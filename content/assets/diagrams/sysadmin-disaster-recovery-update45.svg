<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Disaster recovery rehearsal</title><desc id="desc">A complete drill verifies useful business behaviour, not only process startup.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Disaster recovery rehearsal</text><text x="38" y="75" class="s">A complete drill verifies useful business behaviour, not only process startup.</text><rect class="step" x="42" y="146" width="175" height="102" rx="14"/><text x="129.5" y="183" text-anchor="middle" class="x">Declare</text><text x="129.5" y="212" text-anchor="middle" class="s">Scope + owners</text><rect class="step" x="248" y="146" width="175" height="102" rx="14"/><text x="335.5" y="183" text-anchor="middle" class="x">Recover</text><text x="335.5" y="212" text-anchor="middle" class="s">Isolated copy</text><rect class="step" x="454" y="146" width="175" height="102" rx="14"/><text x="541.5" y="183" text-anchor="middle" class="x">Check data</text><text x="541.5" y="212" text-anchor="middle" class="s">Read + save</text><rect class="step" x="660" y="146" width="175" height="102" rx="14"/><text x="747.5" y="183" text-anchor="middle" class="x">Verify</text><text x="747.5" y="212" text-anchor="middle" class="s">Independent test</text><rect class="accent" x="866" y="146" width="175" height="102" rx="14"/><text x="953.5" y="183" text-anchor="middle" class="x">Record</text><text x="953.5" y="212" text-anchor="middle" class="s">RPO / RTO</text><path class="arr" d="M217 198 L244 198"/><path class="arr" d="M423 198 L450 198"/><path class="arr" d="M629 198 L656 198"/><path class="arr" d="M835 198 L862 198"/><text class="s" x="540" y="330" text-anchor="middle">Do not overwrite the original data during a beginner restore exercise.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>