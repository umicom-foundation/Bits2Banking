<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
<title id="title">C23 work handoff and completion composition</title>
<desc id="desc">Five stages: a requester submits copied bytes to the existing work handoff; the new dispatcher runs work; the existing completion queue records a notification; the requester receives an owned receipt.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#12667a"/></marker></defs>
<rect width="1040" height="400" rx="18" fill="#eef7fb"/>
<text x="36" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#102638">One request, several separate ownership events</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="18" fill="#112a3a">
<rect x="22" y="95" width="174" height="102" rx="12" fill="#fff" stroke="#23637d" stroke-width="2"/>
<text x="109" y="134" font-weight="700">Requester</text><text x="109" y="164" font-size="15">caller-owned input</text>
<rect x="225" y="95" width="177" height="102" rx="12" fill="#d7f2e8" stroke="#12775e" stroke-width="2"/>
<text x="314" y="130" font-weight="700">Work handoff</text><text x="314" y="158" font-size="15">existing queue</text><text x="314" y="177" font-size="14">deep copy</text>
<rect x="433" y="95" width="174" height="102" rx="12" fill="#e4eaff" stroke="#5058a9" stroke-width="2"/>
<text x="520" y="130" font-weight="700">Dispatch adapter</text><text x="520" y="160" font-size="15">one C23 Step</text>
<rect x="638" y="95" width="179" height="102" rx="12" fill="#d7f2e8" stroke="#12775e" stroke-width="2"/>
<text x="727" y="128" font-weight="700">Completion FIFO</text><text x="727" y="159" font-size="15">existing queue</text><text x="727" y="179" font-size="14">value copy</text>
<rect x="846" y="95" width="173" height="102" rx="12" fill="#fff" stroke="#23637d" stroke-width="2"/>
<text x="932" y="134" font-weight="700">Receive</text><text x="932" y="162" font-size="15">owned receipt</text>
</g>
<g stroke="#12667a" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M196 145H220"/><path d="M402 145H428"/><path d="M607 145H633"/><path d="M817 145H841"/></g>
<rect x="82" y="256" width="880" height="87" rx="12" fill="#fff" stroke="#a4bdc8"/>
<text x="520" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#102638">Ownership rule</text>
<text x="520" y="321" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#2b4858">The work slot is released only after the completion notice is consumed.</text>
</svg>
