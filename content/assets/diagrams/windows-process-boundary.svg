<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Passing a Python executable path with spaces safely to Windows</title>
<desc id="desc">The native Umicom Education tool constructs an explicit UTF-16 executable path and correctly quoted arguments for CreateProcessW, which starts one Python process. The child receives separate argv entries for the module, build, configuration file and site directory.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#143247}.heading{font-size:25px;font-weight:750}.label{font-size:19px;font-weight:700}.small{font-size:15px}.box{fill:#fff;stroke:#85a7b7;stroke-width:2}.accent{fill:#e5f5f0;stroke:#128977;stroke-width:2}.arrow{stroke:#128977;stroke-width:3;marker-end:url(#tip)}</style>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#128977"/></marker></defs>
<rect width="1000" height="400" rx="18" fill="#f3f8fa"/>
<text x="30" y="47" class="heading">A file path with spaces must remain one argument</text>
<rect class="box" x="34" y="91" width="259" height="109" rx="12"/>
<text x="54" y="126" class="label">umicom-education</text>
<text x="54" y="151" class="small">Interpreter: Python path</text>
<text x="54" y="177" class="small">Options: --config-file, --site-dir</text>
<path class="arrow" d="M302 146 H350"/>
<rect class="accent" x="361" y="91" width="265" height="109" rx="12"/>
<text x="381" y="126" class="label">CreateProcessW</text>
<text x="381" y="153" class="small">Explicit application name</text>
<text x="381" y="178" class="small">Quoted UTF-16 argv string</text>
<path class="arrow" d="M636 146 H686"/>
<rect class="box" x="698" y="91" width="268" height="109" rx="12"/>
<text x="718" y="126" class="label">Python / MkDocs</text>
<text x="718" y="153" class="small">argv[1] = -m</text>
<text x="718" y="178" class="small">argv[2] = mkdocs</text>
<rect x="34" y="242" width="932" height="119" rx="12" fill="#e2eff6"/>
<text x="53" y="272" class="label">The regression test uses this example path:</text>
<text x="53" y="298" class="small">.../renderer fixture with spaces/python test.exe</text>
<text x="53" y="326" class="small">The child verifies that configuration and output directories each arrive as one unchanged argv entry.</text>
</svg>
