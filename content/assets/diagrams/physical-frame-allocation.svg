<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Physical page-frame allocation</title>
<desc id="desc">The first eight 4096-byte frames are reserved; the next frame is allocated to a caller. All other frames remain free. An allocation failure never changes reserved frames.</desc>
<rect width="1120" height="460" rx="20" fill="#f0f5fa"/>
<text x="45" y="68" fill="#203247" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Physical memory: 128 × 4096-byte frames</text>
<text x="45" y="106" fill="#51687a" font-family="Segoe UI, sans-serif" font-size="19">A frame is identified by its physical address. It is not a user-space pointer.</text>
<g font-family="Consolas, monospace" font-size="19" text-anchor="middle">
<rect x="46" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="95" y="192" fill="white">frame 0</text><text x="95" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="153" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="202" y="192" fill="white">frame 1</text><text x="202" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="260" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="309" y="192" fill="white">frame 2</text><text x="309" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="367" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="416" y="192" fill="white">frame 3</text><text x="416" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="474" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="523" y="192" fill="white">frame 4</text><text x="523" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="581" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="630" y="192" fill="white">frame 5</text><text x="630" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="688" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="737" y="192" fill="white">frame 6</text><text x="737" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="795" y="153" width="98" height="104" rx="9" fill="#203247"/><text x="844" y="192" fill="white">frame 7</text><text x="844" y="220" fill="#d8e4ef" font-size="14">reserved</text>
<rect x="902" y="153" width="172" height="104" rx="9" fill="#0e7978"/><text x="988" y="192" fill="white">frame 8</text><text x="988" y="220" fill="#edffff" font-size="14">allocated</text>
</g>
<path d="M46 278 H894" stroke="#203247" stroke-width="3"/><path d="M46 269 V286 M894 269 V286" stroke="#203247" stroke-width="3"/>
<text x="470" y="310" fill="#203247" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18">Frames 0–7 are unavailable to ordinary allocation</text>
<path d="M988 261 V314" stroke="#0e7978" stroke-width="3"/><path d="M980 307 L988 320 L996 307" fill="none" stroke="#0e7978" stroke-width="3"/>
<rect x="700" y="331" width="373" height="75" rx="12" fill="#e5f2ef" stroke="#95c7c1"/>
<text x="725" y="361" fill="#203247" font-family="Consolas, monospace" font-size="18">0x80008000</text>
<text x="725" y="385" fill="#416274" font-family="Segoe UI, sans-serif" font-size="16">First free page returned to caller</text>
<text x="46" y="379" fill="#526579" font-family="Segoe UI, sans-serif" font-size="18">Frame 9 onward: free (unless separately reserved)</text>
<text x="45" y="441" fill="#526579" font-family="Segoe UI, sans-serif" font-size="15">Umicom Foundation · Bits2Banking · fictional physical memory pool</text>
</svg>
