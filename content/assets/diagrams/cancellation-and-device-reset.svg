<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="title description"><title id="title">Cancellation and device completion</title><desc id="description">A cancellation request may be honoured or the device may have already finished; release must wait for a confirmed result.</desc><rect width="1060" height="360" rx="18" fill="#f0f5f8"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}.title{font-size:23px;font-weight:700}.item{font-size:18px;font-weight:650}.small{font-size:14px}.sub{font-size:15px}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087b83"/></marker></defs><text class="title" x="35" y="46">Cancel request and terminal outcome are separate facts</text><rect x="55" y="105" width="215" height="72" rx="12" fill="#ffffff" stroke="#b8cedc" stroke-width="2"/><text class="item" text-anchor="middle" x="162.5" y="147.0">Submit request 7</text><path d="M276 141 H332" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><rect x="338" y="105" width="232" height="72" rx="12" fill="#fff5e5" stroke="#c49a59" stroke-width="2"/><text class="item" text-anchor="middle" x="454.0" y="147.0">Cancel requested</text><path d="M570 140 H626 V91 H694" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><path d="M626 141 V209 H694" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><rect x="706" y="55" width="287" height="77" rx="12" fill="#e9f7f6" stroke="#65b3b3" stroke-width="2"/><text class="item" text-anchor="middle" x="849.5" y="99.5">Cancellation confirmed</text><rect x="706" y="182" width="287" height="77" rx="12" fill="#e9f7f6" stroke="#65b3b3" stroke-width="2"/><text class="item" text-anchor="middle" x="849.5" y="226.5">Device already finished</text><text class="sub" x="51" y="308">Both branches require a real completion, collection and reviewed resource release.</text></svg>