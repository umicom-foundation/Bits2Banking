<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">C23 source files, static library archive and executable link</title>
  <desc id="desc">ledger.c compiles to ledger.o, which becomes a member of libbtb_ledger.a. main.c compiles to main.o; the linker uses the archive to resolve library functions and produces btb-ledger-demo.exe.</desc>
  <rect width="1200" height="460" fill="#f6f9fc"/>
  <text x="60" y="57" fill="#203247" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">A library is a container; the linker selects what it needs</text>
  <text x="60" y="87" fill="#456377" font-family="Segoe UI, sans-serif" font-size="17">Umicom Bits2Banking · C23 compilation and link process</text>
  <rect x="40" y="132" width="205" height="100" rx="14" fill="#203247"/>
  <text x="142" y="175" text-anchor="middle" fill="#fff" font-family="Consolas, monospace" font-size="24" font-weight="bold">ledger.c</text>
  <text x="142" y="203" text-anchor="middle" fill="#bfe3ed" font-family="Segoe UI, sans-serif" font-size="16">library source</text>
  <path d="M245 181 H315" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="315,181 300,173 300,189" fill="#007d8c"/>
  <text x="275" y="160" fill="#406074" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">compile</text>
  <rect x="318" y="132" width="175" height="100" rx="14" fill="#e2f3f4" stroke="#007d8c" stroke-width="3"/>
  <text x="405" y="175" text-anchor="middle" fill="#153d51" font-family="Consolas, monospace" font-size="23">ledger.o</text>
  <text x="405" y="203" text-anchor="middle" fill="#37616e" font-family="Segoe UI, sans-serif" font-size="15">object code</text>
  <path d="M493 181 H558" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="558,181 543,173 543,189" fill="#007d8c"/>
  <text x="526" y="160" fill="#406074" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14">archive</text>
  <rect x="562" y="128" width="265" height="112" rx="14" fill="#dae5f0" stroke="#203247" stroke-width="3"/>
  <text x="695" y="167" text-anchor="middle" fill="#203247" font-family="Consolas, monospace" font-size="21">libbtb_ledger.a</text>
  <text x="695" y="201" text-anchor="middle" fill="#385b71" font-family="Segoe UI, sans-serif" font-size="16">ar member: ledger.o</text>
  <text x="695" y="223" text-anchor="middle" fill="#385b71" font-family="Segoe UI, sans-serif" font-size="14">plus optional symbol index</text>
  <rect x="40" y="300" width="205" height="100" rx="14" fill="#203247"/>
  <text x="142" y="345" text-anchor="middle" fill="#fff" font-family="Consolas, monospace" font-size="24">main.c</text>
  <text x="142" y="374" text-anchor="middle" fill="#bfe3ed" font-family="Segoe UI, sans-serif" font-size="16">application source</text>
  <path d="M245 350 H315" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="315,350 300,342 300,358" fill="#007d8c"/>
  <rect x="318" y="300" width="175" height="100" rx="14" fill="#e2f3f4" stroke="#007d8c" stroke-width="3"/>
  <text x="405" y="345" text-anchor="middle" fill="#153d51" font-family="Consolas, monospace" font-size="23">main.o</text>
  <text x="405" y="374" text-anchor="middle" fill="#37616e" font-family="Segoe UI, sans-serif" font-size="15">unresolved call</text>
  <path d="M827 184 H880 V310 H928" stroke="#007d8c" stroke-width="5" fill="none"/>
  <path d="M493 350 H880 V340 H928" stroke="#007d8c" stroke-width="5" fill="none"/>
  <polygon points="928,310 913,302 913,318" fill="#007d8c"/>
  <polygon points="928,340 913,332 913,348" fill="#007d8c"/>
  <rect x="932" y="270" width="222" height="125" rx="14" fill="#007d8c"/>
  <text x="1043" y="307" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">linker</text>
  <text x="1043" y="336" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16">resolve symbols</text>
  <text x="1043" y="358" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16">write executable + map</text>
  <text x="1043" y="421" text-anchor="middle" fill="#203247" font-family="Consolas, monospace" font-size="17">btb-ledger-demo.exe</text>
