<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">Graceful quiescence requires delivery as well as work completion</title><desc id="desc">After admission closes, queued work can finish; terminal notifications must then be received and all work slots released before the dispatcher reports drained.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2c6374"/></marker></defs>
<rect width="1000" height="385" rx="18" fill="#f4f8fa"/><text x="42" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#123041">What a graceful shutdown must prove</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#102b3a">
<rect x="45" y="101" width="204" height="85" rx="12" fill="#d8ebf9" stroke="#386880" stroke-width="2"/><text x="147" y="134" font-weight="700">Quiesce</text><text x="147" y="159" font-size="15">refuse new requests</text>
<rect x="283" y="101" width="204" height="85" rx="12" fill="#e7f3e3" stroke="#377445" stroke-width="2"/><text x="385" y="134" font-weight="700">Finish work</text><text x="385" y="159" font-size="15">queued = active = 0</text>
<rect x="521" y="101" width="204" height="85" rx="12" fill="#fff0d5" stroke="#a17421" stroke-width="2"/><text x="623" y="134" font-weight="700">Receive notices</text><text x="623" y="159" font-size="15">no outstanding results</text>
<rect x="759" y="101" width="204" height="85" rx="12" fill="#d9f0e6" stroke="#267055" stroke-width="2"/><text x="861" y="134" font-weight="700">Drained</text><text x="861" y="159" font-size="15">all slots free</text>
</g>
<g stroke="#2c6374" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M249 141H278"/><path d="M487 141H516"/><path d="M725 141H754"/></g>
<rect x="100" y="238" width="800" height="96" rx="13" fill="#fff" stroke="#c1ccd5"/>
<text x="500" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#122f43" font-weight="700">WorkDrained does not mean all receipts were consumed.</text><text x="500" y="304" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#305061">DispatchDrained adds completion-count and slot-release checks.</text>
</svg>
