<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" role="img" aria-labelledby="title desc">
<title id="title">Binary search for the first bad commit</title>
<desc id="desc">A known good revision and known bad revision bound the search; Git bisect checks midpoint commits and narrows the suspected range. Tests must be deterministic, and reset returns to initial checkout.</desc>
<rect width="1140" height="360" rx="18" fill="#0d1928"/>
<text x="36" y="55" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Git bisect searches history using test evidence</text>
<g stroke="#77b5d9" stroke-width="3"><line x1="105" y1="167" x2="1050" y2="167"/></g>
<g font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><circle cx="105" cy="167" r="36" fill="#0f6755" stroke="#63dec2" stroke-width="3"/><text x="105" y="175" fill="white">A</text><circle cx="262" cy="167" r="30" fill="#193e59" stroke="#89bce2" stroke-width="2"/><text x="262" y="175" fill="white">B</text><circle cx="419" cy="167" r="30" fill="#193e59" stroke="#89bce2" stroke-width="2"/><text x="419" y="175" fill="white">C</text><circle cx="576" cy="167" r="38" fill="#5f3f1e" stroke="#f7bd6a" stroke-width="3"/><text x="576" y="175" fill="white">D</text><circle cx="733" cy="167" r="30" fill="#193e59" stroke="#89bce2" stroke-width="2"/><text x="733" y="175" fill="white">E</text><circle cx="890" cy="167" r="30" fill="#193e59" stroke="#89bce2" stroke-width="2"/><text x="890" y="175" fill="white">F</text><circle cx="1047" cy="167" r="36" fill="#6a2831" stroke="#ed8790" stroke-width="3"/><text x="1047" y="175" fill="white">G</text></g>
<g font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="105" y="245" fill="#8deed6">Known good</text><text x="576" y="245" fill="#ffd495">Test midpoint</text><text x="1047" y="245" fill="#ffb8bf">Known bad</text></g>
<rect x="237" y="286" width="666" height="38" rx="10" fill="#143d4d"/>
<text x="570" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#d8f5ff">Mark each tested commit good, bad or skip; finish with git bisect reset</text>
</svg>
