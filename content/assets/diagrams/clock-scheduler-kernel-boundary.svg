<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc">
<title id="title">A timer makes a task ready, then the scheduler chooses when it runs</title>
<desc id="desc">On real hardware, timer expiry enters RISC-V trap Assembly, invokes C23 Kernel policy and eventually informs the scheduler. The learner's logical clock simulates only the decision, not privileged execution.</desc>
<rect width="1120" height="435" rx="16" fill="#F2F6FA"/>
<text x="35" y="47" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#18374B">Timer expiry does not mean immediate execution</text>
<text x="35" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#496073">Real Umicom Kernel path: hardware mechanism → Kernel policy → scheduler choice</text>
<rect x="35" y="125" width="226" height="153" rx="12" fill="#E1EEF8" stroke="#92B3CD" stroke-width="2"/>
<text x="58" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#245270">Hardware timer</text>
<text x="58" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#325B72">Monotonic clock</text>
<text x="58" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#325B72">and interrupt cause</text>
<text x="58" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#325B72">Privileged entry</text>
<path d="M261 202 H322" stroke="#367183" stroke-width="4"/>
<path d="M322 202 l-14 -8 v16 z" fill="#367183"/>
<rect x="329" y="125" width="226" height="153" rx="12" fill="#E2F3EE" stroke="#8BB9AB" stroke-width="2"/>
<text x="352" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#205B55">RISC-V Assembly</text>
<text x="352" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376860">Save registers</text>
<text x="352" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#376860">and trap frame</text>
<text x="352" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#376860">Mechanism, not policy</text>
<path d="M555 202 H616" stroke="#367183" stroke-width="4"/>
<path d="M616 202 l-14 -8 v16 z" fill="#367183"/>
<rect x="623" y="125" width="226" height="153" rx="12" fill="#FFF0DC" stroke="#D2B077" stroke-width="2"/>
<text x="646" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#79592B">Kernel C23 policy</text>
<text x="646" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#775D35">Complete wait /</text>
<text x="646" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#775D35">retain continuation</text>
<text x="646" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#775D35">Ready ≠ Running</text>
<path d="M849 202 H910" stroke="#367183" stroke-width="4"/>
<path d="M910 202 l-14 -8 v16 z" fill="#367183"/>
<rect x="918" y="125" width="166" height="153" rx="12" fill="#E3EAF7" stroke="#A2B3D6" stroke-width="2"/>
<text x="935" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#3A557C">Scheduler</text>
<text x="935" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#53688B">Select a Ready</text>
<text x="935" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#53688B">task to run</text>
<rect x="35" y="313" width="1049" height="91" rx="12" fill="#FFFFFF" stroke="#D1DFE7"/>
<text x="58" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#20566C">Bits2Banking C23 exercises</text>
<text x="58" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#486474">Simulate tick advances, timeout precedence and Ready transitions; do not install interrupt vectors or run real tasks.</text>
</svg>
