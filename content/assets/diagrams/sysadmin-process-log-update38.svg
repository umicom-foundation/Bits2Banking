<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A running service does not prove the business task works." viewBox="0 0 1120 350">
<title>Diagnose a service by collecting several independent observations</title>
<desc>A running service does not prove the business task works.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#207468"/></marker></defs>
<rect x="0" y="0" width="1120" height="350" rx="22" fill="#f3f8fc"/>
<text x="560" y="54" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#123149">Diagnose a service by collecting several independent observations</text>
<rect x="70" y="125" width="180" height="104" rx="15" fill="#d9f0e8" stroke="#416b85" stroke-width="2"/>
<text x="160" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">User reports an</text>
<text x="160" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">error</text>
<path d="M 254 177 L 268 177" stroke="#207468" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="270" y="125" width="180" height="104" rx="15" fill="#eff6ff" stroke="#416b85" stroke-width="2"/>
<text x="360" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">Process and service</text>
<text x="360" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">state</text>
<path d="M 454 177 L 468 177" stroke="#207468" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="470" y="125" width="180" height="104" rx="15" fill="#f8eee4" stroke="#416b85" stroke-width="2"/>
<text x="560" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">Event logs /</text>
<text x="560" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">timestamp</text>
<path d="M 654 177 L 668 177" stroke="#207468" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="670" y="125" width="180" height="104" rx="15" fill="#eff6ff" stroke="#416b85" stroke-width="2"/>
<text x="760" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">Reproduce user</text>
<text x="760" y="189" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">operation</text>
<path d="M 854 177 L 868 177" stroke="#207468" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="870" y="125" width="180" height="104" rx="15" fill="#d9f0e8" stroke="#416b85" stroke-width="2"/>
<text x="960" y="177" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#17324c" font-weight="600">Record findings</text>
<text x="560" y="286" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#30485a">A running service does not prove the business task works.</text>
</svg>
