<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1180 480">
  <title id="title">Framework diagnostics to C23 evidence pipeline</title>
  <desc id="desc">Compiler and build output flows into the shared Framework parser; structured diagnostics are copied through an optional adapter into an educational, bounded snapshot for review.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d37"/><stop offset="1" stop-color="#203754"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8bbef4"/></marker><style>.title{font:700 28px system-ui;fill:#f7fbff}.tag{font:700 17px system-ui;fill:#f3f8ff;text-anchor:middle}.desc{font:14px system-ui;fill:#bed4e7;text-anchor:middle}.note{font:15px system-ui;fill:#c6d5ea}.box{fill:#253958;stroke:#7197c8;stroke-width:2}.framework{fill:#174d58;stroke:#79dac7;stroke-width:3}.arrow{stroke:#8bbef4;stroke-width:3;marker-end:url(#arr);fill:none}.warn{fill:#412f29;stroke:#e9b982;stroke-width:2}</style></defs>
  <rect width="1180" height="480" rx="18" fill="url(#bg)"/>
  <text class="title" x="40" y="55">Build diagnostics: one parser, explicit evidence</text>
  <rect class="box" x="34" y="127" width="218" height="112" rx="12"/><text class="tag" x="143" y="164">GCC · Clang · CMake</text><text class="desc" x="143" y="189">raw output + exit status</text><text class="desc" x="143" y="209">retain original transcript</text>
  <path class="arrow" d="M252 181H293"/>
  <rect class="framework" x="303" y="127" width="260" height="112" rx="12"/><text class="tag" x="433" y="163">Umicom Framework</text><text class="desc" x="433" y="188">compiler_parser.h</text><text class="desc" x="433" y="209">build/parser.h</text>
  <path class="arrow" d="M563 181H603"/>
  <rect class="box" x="613" y="127" width="239" height="112" rx="12"/><text class="tag" x="732" y="163">Normalised records</text><text class="desc" x="732" y="188">path · line · column</text><text class="desc" x="732" y="209">severity · dropped count</text>
  <path class="arrow" d="M852 181H892"/>
  <rect class="box" x="902" y="127" width="243" height="112" rx="12"/><text class="tag" x="1024" y="164">C23 teaching review</text><text class="desc" x="1024" y="189">copy at most 24 items</text><text class="desc" x="1024" y="209">compare sealed snapshots</text>
  <rect class="warn" x="243" y="304" width="705" height="95" rx="12"/><text class="tag" x="595" y="338">Failure boundaries must remain visible</text><text class="desc" x="595" y="366">Nonzero process exit ≠ zero parsed diagnostics</text><text class="desc" x="595" y="387">Dropped, stale or not-run evidence cannot silently pass</text>
  <path class="arrow" d="M143 239V350H242"/><path class="arrow" d="M733 239V303"/>
  <text class="note" x="43" y="448">No raw-log parser or new Git implementation is introduced in Bits2Banking.</text>
</svg>
