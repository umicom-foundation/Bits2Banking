<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" role="img" aria-labelledby="title desc">
<title id="title">Main components of a computer</title><desc id="desc">A motherboard connects CPU, RAM, storage, graphics and networking</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="560" y="43" text-anchor="middle" font-size="25" font-weight="700" fill="#2d4f64">The main parts of a computer</text>
<rect x="95" y="85" width="930" height="225" rx="14" fill="#e8eff4" stroke="#14354a" stroke-width="2"/>
<text x="560.0" y="202.5" text-anchor="middle" font-size="20" font-weight="650" fill="#193448">Motherboard — connects components</text>
<rect x="130" y="160" width="185" height="104" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="222.5" y="205.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">CPU</text>
<text x="222.5" y="229.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">processes instructions</text>
<rect x="340" y="160" width="185" height="104" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="432.5" y="205.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">RAM</text>
<text x="432.5" y="229.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">active working data</text>
<rect x="550" y="160" width="185" height="104" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="642.5" y="205.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">SSD</text>
<text x="642.5" y="229.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">saved files</text>
<rect x="760" y="160" width="185" height="104" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="852.5" y="205.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">GPU / Network</text>
<text x="852.5" y="229.0" text-anchor="middle" font-size="14" font-weight="650" fill="#193448">display and connectivity</text>
<path d="M319 210 L335 210" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<path d="M529 210 L545 210" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<path d="M739 210 L755 210" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<text x="560" y="342" text-anchor="middle" font-size="16"  fill="#2d4f64">Input devices and operating-system services connect programs to these components.</text></g></svg>