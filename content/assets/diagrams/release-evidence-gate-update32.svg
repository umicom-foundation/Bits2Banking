<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc"><title id="title">Evidence in, explainable C23 decision out</title><desc id="desc">Umicom Framework observes repositories. The teaching gate evaluates caller-provided snapshots.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80d3f1" /></marker></defs><rect width="1200" height="445" rx="18" fill="#0b1624" /><text x="40" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#e9f4ff" font-weight="bold" text-anchor="start">Evidence in, explainable C23 decision out</text><text x="40" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="start">Umicom Framework observes repositories. The teaching gate evaluates caller-provided snapshots.</text><rect x="38" y="140" width="335" height="150" rx="14" fill="#1c3752" stroke="#9be8b0" stroke-width="2" /><text x="205.5" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Framework observations</text><text x="205.5" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">UmiVcsWorkingTreeRead</text><text x="205.5" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">remote refs + test evidence</text><rect x="420" y="140" width="335" height="150" rx="14" fill="#1c3752" stroke="#80d3f1" stroke-width="2" /><text x="587.5" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">BtbGateEvaluate</text><text x="587.5" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">input borrowed for one call</text><text x="587.5" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">report replaced atomically</text><rect x="804" y="130" width="355" height="162" rx="14" fill="#1c3752" stroke="#ffd483" stroke-width="2" /><text x="981.5" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#e9f4ff" font-weight="bold" text-anchor="middle">Three distinct decisions</text><text x="981.5" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">COMMIT: staged review</text><text x="981.5" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">PUSH: clean + ahead</text><text x="981.5" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#b4c9dc" font-weight="normal" text-anchor="middle">PIN: verified child SHA</text><path d="M373 215 L411 215" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><path d="M755 215 L795 215" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)" /><text x="50" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e9f4ff" font-weight="normal" text-anchor="start">The gate neither calls Git nor stages, commits, pushes or updates Framework.</text><text x="50" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#b4c9dc" font-weight="normal" text-anchor="start">External truth and human approval remain mandatory. Remote state can change between checks.</text></svg>