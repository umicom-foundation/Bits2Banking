<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="title description"><title id="title">Bounded completion queue</title><desc id="description">Four copied results, head and count; full means refused insertion without overwrite.</desc><rect width="1060" height="360" rx="18" fill="#f0f5f8"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}.title{font-size:23px;font-weight:700}.item{font-size:18px;font-weight:650}.small{font-size:14px}.sub{font-size:15px}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087b83"/></marker></defs><text class="title" x="35" y="45">Four-slot bounded completion queue</text><rect x="93" y="115" width="190" height="102" rx="12" fill="#ffffff" stroke="#7fabb8" stroke-width="2"/><text class="item" text-anchor="middle" x="188.0" y="172.0">Completion 10</text><text class="small" x="113" y="242">slot 0</text><rect x="328" y="115" width="190" height="102" rx="12" fill="#ffffff" stroke="#7fabb8" stroke-width="2"/><text class="item" text-anchor="middle" x="423.0" y="172.0">Completion 11</text><text class="small" x="348" y="242">slot 1</text><rect x="563" y="115" width="190" height="102" rx="12" fill="#ffffff" stroke="#7fabb8" stroke-width="2"/><text class="item" text-anchor="middle" x="658.0" y="172.0">Completion 12</text><text class="small" x="583" y="242">slot 2</text><rect x="798" y="115" width="190" height="102" rx="12" fill="#ffffff" stroke="#7fabb8" stroke-width="2"/><text class="item" text-anchor="middle" x="893.0" y="172.0">Completion 13</text><text class="small" x="818" y="242">slot 3</text><path d="M80 113 v-24 H188 v20" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><text class="sub" x="80" y="79">Head: oldest</text><path d="M940 113 v-24 h-75 v20" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><text class="sub" x="798" y="79">Count: four</text><rect x="115" y="268" width="830" height="52" rx="10" fill="#d9eeee"/><text class="sub" text-anchor="middle" x="530" y="290">Fifth completion must wait; the oldest accepted result is never overwritten.</text><text class="small" text-anchor="middle" x="530" y="309">After collecting two results, insertions wrap back to earlier empty slots.</text></svg>