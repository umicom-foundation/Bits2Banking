<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc"><title id="title">Capacity trends and review thresholds</title><desc id="desc">A rising series of observations approaches a proposed safe limit.</desc><rect width="1080" height="460" rx="22" fill="#f0f6fa"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1c8175"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183047} .h{font-size:22px;font-weight:750}.s{font-size:15px}.x{font-size:18px;font-weight:700}.step{fill:#f7fbff;stroke:#527994;stroke-width:2}.accent{fill:#e1f5f0;stroke:#11816e;stroke-width:2}.warn{fill:#fff2d6;stroke:#bf851e;stroke-width:2}.bad{fill:#ffeded;stroke:#b65757;stroke-width:2}.arr{stroke:#1c8175;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 6}</style><text x="38" y="48" class="h">Capacity trends and review thresholds</text><text x="38" y="75" class="s">A rising series of observations approaches a proposed safe limit.</text><line x1="100" y1="330" x2="935" y2="330" stroke="#395d73" stroke-width="3"/><line x1="100" y1="120" x2="100" y2="330" stroke="#395d73" stroke-width="3"/><line x1="100" y1="210" x2="935" y2="210" stroke="#b87028" stroke-width="3" stroke-dasharray="10 7"/><polyline points="135,310 340,280 535,244 720,199 910,152" fill="none" stroke="#19786f" stroke-width="5"/><circle cx="135" cy="310" r="7" fill="#19786f"/><circle cx="340" cy="280" r="7" fill="#19786f"/><circle cx="535" cy="244" r="7" fill="#19786f"/><circle cx="720" cy="199" r="7" fill="#19786f"/><circle cx="910" cy="152" r="7" fill="#19786f"/><text x="115" y="105" class="s">Used capacity ↑</text><text x="938" y="200" class="s" text-anchor="end">Review threshold</text><text x="925" y="365" class="s" text-anchor="end">Time →</text><text x="555" y="392" class="s" text-anchor="middle">A trend suggests a need to investigate; it does not predict an exact failure date.</text><text x="38" y="438" class="s">Bits2Banking · Umicom Foundation · Stage 8 · Classroom illustration</text></svg>