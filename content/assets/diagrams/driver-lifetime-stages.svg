<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="title description">
  <title id="title">Fictional driver lifecycle and explicit recovery</title>
  <desc id="description">The driver is attached, becomes ready, may fault and recover after review, then quiesces, stops and releases its source. A release is not the same as acknowledgement.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4a6377"/></marker></defs>
  <rect width="1040" height="450" fill="#f5f8fa"/>
  <text x="40" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#203247">A driver's checked lifetime</text>
  <text x="40" y="77" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526575">Fictional C23 model · one owner identity and generation per lifetime</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle">
    <rect x="40" y="114" width="176" height="72" rx="12" fill="#203247"/><text x="128" y="157" fill="#fff">ATTACHED</text>
    <rect x="294" y="114" width="176" height="72" rx="12" fill="#087c83"/><text x="382" y="157" fill="#fff">READY</text>
    <rect x="548" y="114" width="176" height="72" rx="12" fill="#dcedf0" stroke="#087c83" stroke-width="2"/><text x="636" y="156" fill="#17434b">QUIESCING</text>
    <rect x="802" y="114" width="176" height="72" rx="12" fill="#203247"/><text x="890" y="156" fill="#fff">STOPPED</text>
    <rect x="294" y="306" width="176" height="72" rx="12" fill="#9f3e32"/><text x="382" y="349" fill="#fff">FAULTED</text>
    <rect x="552" y="306" width="174" height="72" rx="12" fill="#fff2d8" stroke="#bd7d23" stroke-width="2"/><text x="639" y="334" fill="#73501f">REVIEW</text><text x="639" y="358" fill="#73501f">CHECKPOINT</text>
  </g>
  <g fill="none" stroke="#4a6377" stroke-width="3" marker-end="url(#arrow)">
    <path d="M216 150 H292"/><path d="M470 150 H546"/><path d="M724 150 H800"/>
    <path d="M382 186 V303"/><path d="M470 342 H549"/>
    <path d="M639 306 V247 H434 V189"/>
    <path d="M890 187 V244 H959"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#203247">
    <text x="250" y="135" text-anchor="middle">start</text><text x="510" y="136" text-anchor="middle">quiesce</text><text x="759" y="135" text-anchor="middle">stop</text>
    <text x="390" y="246">fault</text><text x="507" y="321">inspect</text><text x="536" y="238">recover only after review</text>
    <text x="796" y="235">RELEASE after stopped</text>
  </g>
  <rect x="40" y="400" width="940" height="30" rx="6" fill="#e5edf1"/>
  <text x="58" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#203247">An accepted revision is not a failed attempt. A simulated recovery decision is not proof of hardware repair.</text>
</svg>
