<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="title description"><title id="title">Device request lifecycle</title><desc id="description">Submit, pending, complete, collect, and only then release.</desc><rect width="1060" height="360" rx="18" fill="#f0f5f8"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#203247}.title{font-size:23px;font-weight:700}.item{font-size:18px;font-weight:650}.small{font-size:14px}.sub{font-size:15px}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087b83"/></marker></defs><text class="title" x="35" y="46">Device request: separate acceptance from completion</text><rect x="35" y="93" width="175" height="84" rx="12" fill="#ffffff" stroke="#b8cedc" stroke-width="2"/><text class="item" text-anchor="middle" x="122.5" y="141.0">Submit</text><rect x="265" y="93" width="175" height="84" rx="12" fill="#ffffff" stroke="#b8cedc" stroke-width="2"/><text class="item" text-anchor="middle" x="352.5" y="141.0">Pending</text><rect x="495" y="93" width="175" height="84" rx="12" fill="#ffffff" stroke="#b8cedc" stroke-width="2"/><text class="item" text-anchor="middle" x="582.5" y="141.0">Complete</text><rect x="725" y="93" width="175" height="84" rx="12" fill="#ffffff" stroke="#b8cedc" stroke-width="2"/><text class="item" text-anchor="middle" x="812.5" y="141.0">Collect</text><path d="M214 135 H260" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><path d="M444 135 H490" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><path d="M674 135 H720" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><rect x="352" y="235" width="360" height="72" rx="12" fill="#e9f7f6" stroke="#65b3b3" stroke-width="2"/><text class="item" text-anchor="middle" x="532.0" y="277.0">Release request record</text><path d="M812 181 V216 H528 V231" fill="none" stroke="#087b83" stroke-width="3" marker-end="url(#tip)"/><text class="sub" x="35" y="318">Submit is not success. Completion is retained until collected.</text></svg>