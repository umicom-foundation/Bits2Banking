<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 385" role="img" aria-labelledby="title desc">
<title id="title">Sixteen-byte payment record in network order</title>
<desc id="desc">A fixed-width record contains four bytes for a payment ID, eight bytes for the unsigned amount in minor units, three bytes for the uppercase currency code and one status byte. Example 00 00 00 1B 00 00 00 00 00 01 E8 48 47 42 50 01.</desc>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#153043}.title{font-size:25px;font-weight:750}.label{font-size:18px;font-weight:650}.small{font-size:16px}.byte{font-family:Consolas,monospace;font-size:18px;fill:#12304a}.top{fill:#e9f6f3;stroke:#168274;stroke-width:2}.middle{fill:#e9efff;stroke:#5c7dc5;stroke-width:2}.end{fill:#fff2de;stroke:#b17a22;stroke-width:2}</style>
<rect width="1100" height="385" rx="18" fill="#f4f8fb"/>
<text x="32" y="45" class="title">A message is a sequence of bytes, not a C structure cast</text>
<text x="32" y="75" class="small">Example: simulated payment ID 27, amount 125000 minor units, currency GBP, state 1.</text>
<g transform="translate(30 107)">
<rect class="top" x="0" y="0" width="248" height="103" rx="10"/>
<rect class="middle" x="262" y="0" width="488" height="103" rx="10"/>
<rect class="end" x="764" y="0" width="182" height="103" rx="10"/>
<rect class="top" x="960" y="0" width="81" height="103" rx="10"/>
<text x="15" y="25" class="label">Payment ID · 4 bytes</text><text x="18" y="63" class="byte">00 00 00 1B</text>
<text x="278" y="25" class="label">Amount minor · 8 bytes</text><text x="278" y="63" class="byte">00 00 00 00 00 01 E8 48</text>
<text x="777" y="25" class="label">Currency · 3</text><text x="777" y="63" class="byte">47 42 50</text>
<text x="969" y="25" class="small">State</text><text x="970" y="63" class="byte">01</text>
<text x="9" y="129" class="small">Bytes 0–3</text><text x="270" y="129" class="small">Bytes 4–11</text><text x="771" y="129" class="small">Bytes 12–14</text><text x="968" y="129" class="small">15</text>
</g>
<rect x="32" y="287" width="1036" height="67" rx="10" fill="#e0efe9"/>
<text x="51" y="317" class="label">Safe encoding checks capacity and valid fields before writing.</text>
<text x="51" y="341" class="small">No pointers, padding bytes, host-endianness assumptions or live bank transactions enter the wire format.</text>
</svg>
