<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Git DAG with divergent tips and a two-parent merge</title>
<desc id="desc">Commit A is the common ancestor. B and D form one line; C and E form another. D and E diverge. Commit F has parents D and E, so both are ancestors of F.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64dabb"/></marker></defs>
<rect width="1120" height="470" rx="18" fill="#081724"/>
<text x="35" y="52" fill="white" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Commit ancestry determines fast-forward eligibility</text>
<text x="35" y="85" fill="#b4cedd" font-family="Arial,sans-serif" font-size="18">Commit IDs are classroom labels; each edge connects a parent to its child</text>
<g stroke="#64dabb" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M166 231L350 150"/><path d="M166 231L350 315"/><path d="M437 150H605"/><path d="M437 315H605"/><path d="M690 150L885 231"/><path d="M690 315L885 231"/></g>
<g fill="#17344c" stroke="#7db9e4" stroke-width="3"><circle cx="123" cy="231" r="43"/><circle cx="393" cy="150" r="43"/><circle cx="393" cy="315" r="43"/><circle cx="649" cy="150" r="43"/><circle cx="649" cy="315" r="43"/><circle cx="929" cy="231" r="43"/></g>
<g fill="white" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold"><text x="123" y="240">A</text><text x="393" y="159">B</text><text x="393" y="324">C</text><text x="649" y="159">D</text><text x="649" y="324">E</text><text x="929" y="240">F</text></g>
<rect x="765" y="113" width="250" height="33" rx="8" fill="#5f3c1d"/>
<text x="890" y="136" font-family="Arial,sans-serif" fill="white" text-anchor="middle" font-size="17">local main before merge (D)</text>
<rect x="557" y="363" width="200" height="34" rx="8" fill="#215247"/>
<text x="657" y="386" font-family="Arial,sans-serif" fill="white" text-anchor="middle" font-size="17">remote main before merge</text>
<text x="900" y="310" font-family="Arial,sans-serif" fill="#b9d7ea" text-anchor="middle" font-size="18">F merges both parents</text>
<text x="36" y="442" font-family="Arial,sans-serif" fill="#a9d1e7" font-size="16">Before F: neither D nor E descends from the other. After F: both D and E are ancestors of F.</text>
</svg>
