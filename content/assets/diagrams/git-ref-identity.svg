<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Different Git references can name different commits</title>
<desc id="desc">Commits A, B, C, D form a chain. A detached HEAD and origin/main name D; local main names B. Pushing local main selects B, not detached HEAD D.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#18a999"/></marker></defs>
<rect width="1120" height="440" rx="18" fill="#0b1725"/>
<text x="44" y="53" fill="#f3faff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">A detached HEAD is not the local main branch</text>
<text x="44" y="91" fill="#bfd2e3" font-family="Arial,sans-serif" font-size="19">Commit ancestry runs left to right; ref labels are movable pointers</text>
<g fill="#162f44" stroke="#76bfe5" stroke-width="3"><circle cx="160" cy="225" r="42"/><circle cx="390" cy="225" r="42"/><circle cx="625" cy="225" r="42"/><circle cx="860" cy="225" r="42"/></g>
<path d="M205 225H345 M435 225H580 M670 225H815" stroke="#18a999" stroke-width="4" marker-end="url(#a)"/>
<g fill="#fff" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" font-weight="bold"><text x="160" y="234">A</text><text x="390" y="234">B</text><text x="625" y="234">C</text><text x="860" y="234">D</text></g>
<rect x="284" y="310" width="215" height="62" rx="11" fill="#593d1c" stroke="#efb35e" stroke-width="2"/>
<text x="390" y="338" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">local main</text>
<text x="390" y="362" text-anchor="middle" fill="#ffe5c0" font-family="Arial,sans-serif" font-size="15">push origin main selects B</text>
<path d="M390 310V270" stroke="#efb35e" stroke-width="3"/>
<rect x="735" y="302" width="245" height="74" rx="11" fill="#124536" stroke="#42c9a5" stroke-width="2"/>
<text x="858" y="329" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">origin/main</text>
<text x="858" y="356" text-anchor="middle" fill="#caffee" font-family="Arial,sans-serif" font-size="17">detached HEAD</text>
<path d="M858 302V268" stroke="#42c9a5" stroke-width="3"/>
<text x="44" y="421" fill="#bfd2e3" font-family="Arial,sans-serif" font-size="15">Educational example • actual refs must be verified in the working repository</text>
</svg>
