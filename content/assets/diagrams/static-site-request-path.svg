<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ttl desc">
<title id="ttl">From a browser to a file inside a chosen website root</title>
<desc id="desc">A browser request reaches a C23 loopback listener, then an HTTP parser, then a rooted file reader. Only files inside the website folder may be returned.</desc>
<rect width="1200" height="420" fill="#f2f6fa"/>
<text x="55" y="67" font-size="31" font-weight="700" font-family="Segoe UI, sans-serif" fill="#173247">Static website serving</text>
<text x="56" y="100" font-size="16" font-family="Segoe UI, sans-serif" fill="#547084">The trusted file root, not the client URL, defines what the server may read.</text>
<rect x="50" y="153" width="235" height="133" rx="15" fill="#ffffff" stroke="#cbdce6" stroke-width="2"/>
<rect x="337" y="153" width="235" height="133" rx="15" fill="#ffffff" stroke="#cbdce6" stroke-width="2"/>
<rect x="624" y="153" width="235" height="133" rx="15" fill="#ffffff" stroke="#cbdce6" stroke-width="2"/>
<rect x="911" y="153" width="235" height="133" rx="15" fill="#e7f7f4" stroke="#006b74" stroke-width="2"/>
<g font-family="Segoe UI, sans-serif" fill="#173247">
<text x="76" y="195" font-size="23" font-weight="700">Browser</text><text x="76" y="229" font-size="16">GET /guide/</text><text x="76" y="258" font-size="14" fill="#5c7487">localhost:8765</text>
<text x="362" y="195" font-size="23" font-weight="700">Listener</text><text x="362" y="229" font-size="16">TCP on loopback</text><text x="362" y="258" font-size="14" fill="#5c7487">tcp_server.c</text>
<text x="648" y="195" font-size="23" font-weight="700">HTTP check</text><text x="648" y="229" font-size="16">method + Host</text><text x="648" y="258" font-size="14" fill="#5c7487">http.c</text>
<text x="935" y="195" font-size="23" font-weight="700">Rooted file</text><text x="935" y="229" font-size="16">guide/index.html</text><text x="935" y="258" font-size="14" fill="#236e72">static_files.c</text>
</g>
<g fill="none" stroke="#007b83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M286 220H326"/><path d="m317 212 9 8-9 8"/>
<path d="M574 220H612"/><path d="m603 212 9 8-9 8"/>
<path d="M861 220H899"/><path d="m890 212 9 8-9 8"/>
</g>
<rect x="624" y="317" width="522" height="69" rx="12" fill="#fff3df" stroke="#e1b76d"/>
<text x="646" y="343" font-size="17" font-family="Segoe UI, sans-serif" font-weight="700" fill="#7c4b0a">File access boundary</text>
<text x="646" y="367" font-size="16" font-family="Segoe UI, sans-serif" fill="#7c4b0a">Reject traversal, hidden metadata and path escapes.</text>
</svg>
