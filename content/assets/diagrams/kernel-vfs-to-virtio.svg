<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-label="Where storage ownership lives in Umicom Kernel"><title>Where storage ownership lives in Umicom Kernel</title><desc>Filesystem names, provider callbacks, block requests and DMA lifetime are distinct owners.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#235a70" stroke-width="1.7" stroke-linecap="round"/></marker></defs>
 <rect width="1200" height="550" fill="#f5f9fc"/>
 <text x="38" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#16354a">Where storage ownership lives in Umicom Kernel</text>
 <text x="38" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4d6575">Filesystem names, provider callbacks, block requests and DMA lifetime are distinct owners.</text>
<rect x="62" y="120" width="245" height="128" rx="16" fill="#ffffff" stroke="#8bb1bd" stroke-width="2"/>
<text x="81" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">User file service</text>
<text x="81" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Validate user requests</text>
<text x="81" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Caller-specific authority</text>
<rect x="355" y="120" width="245" height="128" rx="16" fill="#ecf5fb" stroke="#8bb1bd" stroke-width="2"/>
<text x="374" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Virtual File System</text>
<text x="374" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Path resolution</text>
<text x="374" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Open descriptions</text>
<rect x="648" y="120" width="245" height="128" rx="16" fill="#ecf7ee" stroke="#8bb1bd" stroke-width="2"/>
<text x="667" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">FAT16 / RAMFS</text>
<text x="667" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">File bytes, allocation</text>
<text x="667" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Filesystem metadata</text>
<rect x="941" y="120" width="211" height="128" rx="16" fill="#fff5e5" stroke="#dda45c" stroke-width="2"/>
<text x="960" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">VirtIO block</text>
<text x="960" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Queue, DMA, reset</text>
<text x="960" y="203" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Write and flush</text>
<path d="M310 182 L352 182" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M602 182 L645 182" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M896 182 L936 182" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="95" y="318" width="470" height="117" rx="16" fill="#eff7fb" stroke="#8bb1bd" stroke-width="2"/>
<text x="114" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Read-only admission</text>
<text x="114" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">A mount retains its qualified block handle.</text>
<text x="114" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">Read rights do not imply write rights.</text>
<rect x="636" y="318" width="470" height="117" rx="16" fill="#e6f7f1" stroke="#67aa9d" stroke-width="2"/>
<text x="655" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#173c50">Explicit writable lease</text>
<text x="655" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">WRITE completion and FLUSH are distinct.</text>
<text x="655" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#334f60">DMA pages remain owned until safe release.</text>
<path d="M776 253 L776 312" fill="none" stroke="#235a70" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#506879">Kernel files remain authoritative. These classroom labs do not provide a second privileged driver.</text>
</svg>