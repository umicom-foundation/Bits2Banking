<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 670" role="img" aria-labelledby="title description">
 <title id="title">Bounded admission and backpressure</title><desc id="description">Four queued request slots and two simulated active slots with explicit cancellation and completion.</desc>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7fb"/><stop offset="1" stop-color="#e7f2f3"/></linearGradient>
 <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9" fill="#08777a"/></marker>
 </defs><rect width="1120" height="670" rx="25" fill="url(#bg)"/>
 <rect x="32" y="32" width="8" height="68" rx="4" fill="#0b8589"/>
 <text x="62" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">Bounded admission and backpressure</text>
 <text x="62" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#536879">Bits2Banking · Native C23 · Umicom Foundation</text>
<rect x="45" y="142" width="244" height="110" rx="16" fill="#e6eef9" stroke="#b5c9d5" stroke-width="1.6"/><text x="63" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Slot 1</text><text x="63" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Ticket #1</text><text x="63" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Accepted request</text><rect x="313" y="142" width="244" height="110" rx="16" fill="#e6eef9" stroke="#b5c9d5" stroke-width="1.6"/><text x="331" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Slot 2</text><text x="331" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Ticket #2</text><text x="331" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Accepted request</text><rect x="581" y="142" width="244" height="110" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="599" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Slot 3</text><text x="599" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Ticket #3</text><text x="599" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Accepted request</text><rect x="849" y="142" width="244" height="110" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="867" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Slot 4</text><text x="867" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Ticket #4</text><text x="867" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Accepted request</text><path d="M155 262 L155 340" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 262 L420 340" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="350" width="515" height="125" rx="16" fill="#e2f5f4" stroke="#b5c9d5" stroke-width="1.6"/><text x="63" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Simulated active capacity: 2</text><text x="63" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Start tickets in FIFO order</text><text x="63" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Completion or acknowledgement releases active work</text><rect x="594" y="350" width="470" height="125" rx="16" fill="#fff0ed" stroke="#b5c9d5" stroke-width="1.6"/><text x="612" y="382" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Fifth submission: refused</text><text x="612" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Queue is full → explicit FULL result</text><text x="612" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">No hidden, unlimited pending work</text><path d="M561 409 L586 409" stroke="#08777a" stroke-width="3" marker-end="url(#arrow)"/><rect x="78" y="524" width="965" height="70" rx="16" fill="#fff" stroke="#b5c9d5" stroke-width="1.6"/><text x="96" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17384d">Cancellation rule</text><text x="96" y="584" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#52677b">Queued: remove now. Active: record intent; release only after completion.</text><rect x="38" y="612" width="1044" height="40" rx="10" fill="#d4e8ec"/><text x="58" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#203247">This is a serial teaching model: it does not start OS threads or make the socket server concurrent.</text></svg>