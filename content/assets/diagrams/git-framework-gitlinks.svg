<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 565" role="img" aria-labelledby="title desc">
<title id="title">Framework source and consumer gitlinks</title>
<desc id="desc">One authoritative Umicom Framework Git remote. Umicom Applications and Umicom OS each record and test separate gitlinks referencing published Framework revisions. Umicom Kernel is independent.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53c4b2"/></marker></defs>
<rect width="1160" height="565" rx="18" fill="#0c1727"/>
<text x="42" y="55" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="bold">One Framework source • two pinned consumers</text>
<rect x="300" y="95" width="560" height="105" rx="18" fill="#144f56" stroke="#78dccd" stroke-width="3"/>
<text x="580" y="137" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Umicom Framework · canonical Git remote</text>
<text x="580" y="170" text-anchor="middle" fill="#c8fffa" font-family="Arial,sans-serif" font-size="18">Published source commits and tested C23 contracts</text>
<path d="M420 200V262H265V288 M740 200V262H887V288" stroke="#53c4b2" stroke-width="4" fill="none" marker-end="url(#tip)"/>
<rect x="70" y="292" width="400" height="130" rx="15" fill="#192f4d" stroke="#7da6e2" stroke-width="3"/>
<text x="270" y="333" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Umicom Applications</text>
<text x="270" y="369" text-anchor="middle" fill="#d1e6ff" font-family="Arial,sans-serif" font-size="18">framework/ gitlink → commit F</text>
<text x="270" y="398" text-anchor="middle" fill="#b7d0ee" font-family="Arial,sans-serif" font-size="16">Build • Test • Commit parent</text>
<rect x="690" y="292" width="400" height="130" rx="15" fill="#192f4d" stroke="#7da6e2" stroke-width="3"/>
<text x="890" y="333" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Umicom OS</text>
<text x="890" y="369" text-anchor="middle" fill="#d1e6ff" font-family="Arial,sans-serif" font-size="18">framework/ gitlink → commit F</text>
<text x="890" y="398" text-anchor="middle" fill="#b7d0ee" font-family="Arial,sans-serif" font-size="16">Build • Test • Commit parent</text>
<rect x="374" y="458" width="410" height="62" rx="13" fill="#343046" stroke="#a998d7" stroke-width="2"/>
<text x="579" y="484" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Umicom Kernel</text>
<text x="579" y="509" text-anchor="middle" fill="#e2dafa" font-family="Arial,sans-serif" font-size="16">Independent: no Framework submodule</text>
<text x="44" y="549" fill="#bdcedf" font-family="Arial,sans-serif" font-size="15">The two consumer gitlinks may differ during rollout; never equate them with duplicated Framework source.</text>
</svg>
