<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 350" role="img" aria-labelledby="title desc">
<title id="title">Safe Git check-in from working files to remote main</title>
<desc id="desc">Inspect status, stage changes, inspect the index, run tests, commit and push main. Any unexpected changes or test failures return to review.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80d3f1"/></marker></defs>
<rect width="1220" height="350" rx="18" fill="#0b1624"/>
<text x="40" y="54" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Review source and index before publishing</text>
<g fill="#1c3752" stroke="#79bce2" stroke-width="2"><rect x="35" y="120" width="170" height="105" rx="14"/><rect x="241" y="120" width="170" height="105" rx="14"/><rect x="447" y="120" width="170" height="105" rx="14"/><rect x="653" y="120" width="170" height="105" rx="14"/><rect x="859" y="120" width="145" height="105" rx="14"/><rect x="1040" y="120" width="145" height="105" rx="14"/></g>
<path d="M205 172H237 M411 172H443 M617 172H649 M823 172H855 M1004 172H1036" fill="none" stroke="#80d3f1" stroke-width="3" marker-end="url(#arrow)"/>
<g fill="white" font-family="Arial,sans-serif" text-anchor="middle"><text x="120" y="159" font-size="20" font-weight="bold">Inspect</text><text x="120" y="191" font-size="15">git status</text><text x="326" y="159" font-size="20" font-weight="bold">Stage</text><text x="326" y="191" font-size="15">git add -A</text><text x="532" y="159" font-size="20" font-weight="bold">Check index</text><text x="532" y="191" font-size="15">diff --cached</text><text x="738" y="159" font-size="20" font-weight="bold">Test</text><text x="738" y="191" font-size="15">CMake + CTest</text><text x="932" y="159" font-size="20" font-weight="bold">Commit</text><text x="932" y="191" font-size="15">main</text><text x="1112" y="159" font-size="20" font-weight="bold">Push</text><text x="1112" y="191" font-size="15">origin main</text></g>
<rect x="270" y="264" width="686" height="44" rx="10" fill="#4a2f19" stroke="#edb470" stroke-width="2"/>
<text x="612" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#ffeacb">Unexpected file, conflict or test failure? Stop and review.</text>
</svg>
