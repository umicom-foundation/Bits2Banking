<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
<title id="title">Safely recover blocked Git submodule updates</title><desc id="desc">Diagnose the nested repository, preserve local changes with a stash and unpublished commits with a tag if necessary, synchronise safely, then compare saved changes before reapplying anything.</desc>
<defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#196a79"/></marker></defs>
<rect width="1040" height="360" rx="18" fill="#eef6f9"/><text x="37" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#123140">Preserve before checkout; compare before restoring</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#18394a"><rect x="32" y="105" width="205" height="103" rx="11" fill="#fff" stroke="#246b87" stroke-width="2"/><text x="135" y="138" font-size="20" font-weight="700">Inspect</text><text x="135" y="169" font-size="15">status / log / stash</text>
<rect x="293" y="105" width="205" height="103" rx="11" fill="#deefe5" stroke="#217f58" stroke-width="2"/><text x="396" y="138" font-size="20" font-weight="700">Preserve</text><text x="396" y="169" font-size="15">stash + rescue tag</text>
<rect x="554" y="105" width="205" height="103" rx="11" fill="#e5e8ff" stroke="#5c69aa" stroke-width="2"/><text x="657" y="138" font-size="20" font-weight="700">Synchronise</text><text x="657" y="169" font-size="15">clean checkout only</text>
<rect x="815" y="105" width="205" height="103" rx="11" fill="#fff0d5" stroke="#ae7720" stroke-width="2"/><text x="918" y="138" font-size="20" font-weight="700">Compare</text><text x="918" y="169" font-size="15">do not blindly pop</text></g>
<g stroke="#196a79" stroke-width="3" fill="none" marker-end="url(#r)"><path d="M237 156H288"/><path d="M498 156H549"/><path d="M759 156H810"/></g>
<rect x="120" y="261" width="800" height="68" rx="12" fill="#fff" stroke="#ba5466" stroke-width="2"/>
<text x="520" y="288" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="18" fill="#90304a">Never treat force checkout, clean -fd or reset --hard as a default repair.</text><text x="520" y="312" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#6b4051">Check saved untracked files and unpublished detached commits explicitly.</text>
</svg>
