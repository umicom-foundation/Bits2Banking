<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="338" viewBox="0 0 1080 338" role="img" aria-labelledby="title desc"><title id="title">Merge safety gates</title><desc id="desc">Review-only workflow: observe, preserve, compare, resolve, test and then publish. No automatic destructive repairs.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192b43}.heading{font-size:26px;font-weight:750}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#35536a}.mono{font-size:15px;font-family:Consolas,monospace}.darktext{fill:#fff}.line{stroke:#54758b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.box{fill:#f3f8fd;stroke:#315f83;stroke-width:2}.ok{fill:#e1f6ee;stroke:#08745f;stroke-width:2}.warn{fill:#fff1da;stroke:#bb7429;stroke-width:2}.dark{fill:#14283f;stroke:#243c55;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#54758b"/></marker></defs><rect width="1080" height="338" fill="#f9fbfe"/>
<text x="540" y="45" text-anchor="middle" class="heading">SAFE RECOVERY = EVIDENCE FIRST</text>
<rect x="22" y="113" width="166" height="143" rx="14" class="box"/>
<text x="105" y="145" text-anchor="middle" class="small">01</text>
<text x="105" y="182" text-anchor="middle" class="label">Observe</text>
<text x="105" y="218" text-anchor="middle" class="small">HEAD / refs / status</text>
<path d="M188,185 L200,185" class="line"/>
<rect x="200" y="113" width="166" height="143" rx="14" class="box"/>
<text x="283" y="145" text-anchor="middle" class="small">02</text>
<text x="283" y="182" text-anchor="middle" class="label">Preserve</text>
<text x="283" y="218" text-anchor="middle" class="small">tracked + untracked</text>
<path d="M366,185 L378,185" class="line"/>
<rect x="378" y="113" width="166" height="143" rx="14" class="box"/>
<text x="461" y="145" text-anchor="middle" class="small">03</text>
<text x="461" y="182" text-anchor="middle" class="label">Compare</text>
<text x="461" y="218" text-anchor="middle" class="small">base / ours / theirs</text>
<path d="M544,185 L556,185" class="line"/>
<rect x="556" y="113" width="166" height="143" rx="14" class="warn"/>
<text x="639" y="145" text-anchor="middle" class="small">04</text>
<text x="639" y="182" text-anchor="middle" class="label">Resolve</text>
<text x="639" y="218" text-anchor="middle" class="small">retain behaviour</text>
<path d="M722,185 L734,185" class="line"/>
<rect x="734" y="113" width="166" height="143" rx="14" class="ok"/>
<text x="817" y="145" text-anchor="middle" class="small">05</text>
<text x="817" y="182" text-anchor="middle" class="label">Test</text>
<text x="817" y="218" text-anchor="middle" class="small">compile + CTest</text>
<path d="M900,185 L912,185" class="line"/>
<rect x="912" y="113" width="166" height="143" rx="14" class="ok"/>
<text x="995" y="145" text-anchor="middle" class="small">06</text>
<text x="995" y="182" text-anchor="middle" class="label">Publish</text>
<text x="995" y="218" text-anchor="middle" class="small">reviewed main only</text>
<rect x="190" y="280" width="700" height="42" rx="9" class="dark"/>
<text x="540" y="308" text-anchor="middle" class="small darktext">Stop safely when evidence is incomplete; never erase source silently</text>
</svg>
