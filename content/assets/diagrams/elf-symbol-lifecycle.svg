<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">How a C23 source file becomes an ELF symbol table</title>
  <desc id="desc">A C23 source and public header compile into an object. Its symbol table records one defined public function, one local helper, and one undefined Assembly reference. The linker will resolve the undefined reference.</desc>
  <rect width="1100" height="430" rx="20" fill="#f5f9fc"/>
  <text x="52" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#203247">Defined and undefined names in one object file</text>
  <rect x="45" y="98" width="310" height="240" rx="16" fill="#203247"/>
  <text x="73" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="white">course_totals.c</text>
  <text x="73" y="181" font-family="Consolas,monospace" font-size="15" fill="#a7e4e9">int BtbCourseTotalsAdd(...)</text>
  <text x="73" y="215" font-family="Consolas,monospace" font-size="15" fill="#d6e4ee">static int BtbCanAdd(...)</text>
  <text x="73" y="249" font-family="Consolas,monospace" font-size="15" fill="#f6dba0">extern BtbAssemblyAddU32</text>
  <text x="73" y="301" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#d7e6ee">Public, private and external names</text>
  <path d="M365 215 H448" stroke="#087f8c" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M440 201 L463 215 L440 229" fill="none" stroke="#087f8c" stroke-width="7" stroke-linecap="round"/>
  <text x="369" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#203247">compile</text>
  <rect x="474" y="98" width="580" height="240" rx="16" fill="white" stroke="#bacfdb" stroke-width="2"/>
  <text x="507" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#203247">course_totals.c.o — symbol table</text>
  <rect x="508" y="159" width="508" height="44" rx="7" fill="#e4f7ed"/>
  <text x="520" y="187" font-family="Consolas,monospace" font-size="18" fill="#14553a">GLOBAL  defined:    BtbCourseTotalsAdd</text>
  <rect x="508" y="212" width="508" height="44" rx="7" fill="#edf4fc"/>
  <text x="520" y="240" font-family="Consolas,monospace" font-size="18" fill="#274a79">LOCAL   defined:    BtbCanAdd</text>
  <rect x="508" y="265" width="508" height="44" rx="7" fill="#fff1dc"/>
  <text x="520" y="293" font-family="Consolas,monospace" font-size="18" fill="#8b520a">GLOBAL  undefined:  BtbAssemblyAddU32</text>
  <text x="52" y="386" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#344b5e">Undefined in an object does not mean incorrect. A matching definition must be supplied at link time.</text>
</svg>
