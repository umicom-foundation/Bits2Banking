<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Framework-to-OS source preservation"><rect width="1200" height="490" rx="18" fill="#091827"/><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4bc4c8"/></marker><marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7bf71"/></marker></defs><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#edf5ff}.title{font-size:30px;font-weight:bold}.subtitle{font-size:16px;fill:#acc7da}.boxTitle{font-size:20px;font-weight:700}.boxDetail{font-size:15px;fill:#c5d8e5}.edge{stroke:#4bc4c8;fill:none;stroke-width:3;marker-end:url(#arr)}.review{stroke:#f7bf71;fill:none;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#orange)}.legend{font-size:14px;fill:#b7cddd}</style><text class="title" x="42" y="58">Framework-to-OS source preservation</text><text class="subtitle" x="42" y="88">One source owner, separate pinned parents and explicit test evidence.</text><rect x="50" y="149" width="306" height="110" rx="15" fill="#1b4c57" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="70" y="185">Authoritative Framework</text><text class="boxDetail" x="70" y="213">Commit source to main</text><rect x="447" y="149" width="306" height="110" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="467" y="185">Applications parent</text><text class="boxDetail" x="467" y="213">Test then pin gitlink</text><rect x="844" y="149" width="306" height="110" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="864" y="185">OS parent</text><text class="boxDetail" x="864" y="213">Test and pin independently</text><path class="edge" d="M358 203 L445 203"/><path class="edge" d="M756 203 L842 203"/><rect x="50" y="332" width="306" height="92" rx="15" fill="#65422b" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="70" y="368">Preserve local work</text><text class="boxDetail" x="70" y="396">Tracked + untracked + SHAs</text><rect x="447" y="332" width="306" height="92" rx="15" fill="#19394e" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="467" y="368">Verify identity</text><text class="boxDetail" x="467" y="396">HEAD vs main vs origin/main</text><rect x="844" y="332" width="306" height="92" rx="15" fill="#194e48" stroke="#46758b" stroke-width="2"/><text class="boxTitle" x="864" y="368">Publish in order</text><text class="boxDetail" x="864" y="396">Review stage before push</text><text class="legend" x="50" y="456">No force push, hard reset or clean -fd. A parent gitlink is not copied Framework source.</text></svg>
