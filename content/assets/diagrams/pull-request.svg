<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 232" width="1100" height="232" role="img" aria-labelledby="title desc">
<title id="title">How a contribution reaches the project</title><desc id="desc">A fork and branch lead through review before a maintainer merges</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#247a8a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc" rx="18"/>
<g font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif"><text x="550.0" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#2d4f64">How a contribution reaches the project</text>
<rect x="32.0" y="73" width="176.8" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="120.4" y="113.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">Fork</text>
<text x="120.4" y="137.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">your copy</text>
<path d="M213.8 120.5 L239.8 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="246.8" y="73" width="176.8" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="335.20000000000005" y="113.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">Branch</text>
<text x="335.20000000000005" y="137.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">make a change</text>
<path d="M428.6 120.5 L454.6 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="461.6" y="73" width="176.8" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="550.0" y="113.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">Pull request</text>
<text x="550.0" y="137.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">ask for review</text>
<path d="M643.4000000000001 120.5 L669.4000000000001 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="676.4000000000001" y="73" width="176.8" height="95" rx="14" fill="#e7f1fb" stroke="#2566a0" stroke-width="2"/>
<text x="764.8000000000001" y="113.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">Review</text>
<text x="764.8000000000001" y="137.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">check and improve</text>
<path d="M858.2 120.5 L884.2 120.5" fill="none" stroke="#247a8a" stroke-width="3"  marker-end="url(#arr)"/>
<rect x="891.2" y="73" width="176.8" height="95" rx="14" fill="#e2f4f1" stroke="#078575" stroke-width="2"/>
<text x="979.6" y="113.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">Merge</text>
<text x="979.6" y="137.5" text-anchor="middle" font-size="16" font-weight="650" fill="#193448">upstream main</text></g></svg>