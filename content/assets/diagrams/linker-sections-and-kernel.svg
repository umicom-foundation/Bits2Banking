<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 480" role="img" aria-labelledby="title desc">
 <title id="title">How code and data sections are arranged for a freestanding kernel</title>
 <desc id="desc">An illustrative address map shows executable text.boot and text, read-only data, initialised data and BSS. Assembly entry initialises a stack and zeroes BSS before entering C. This is not a complete Umicom Kernel linker script.</desc>
 <rect width="1070" height="480" rx="20" fill="#f5f9fc"/>
 <text x="46" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#203247">Sections have different responsibilities</text>
 <rect x="50" y="101" width="410" height="287" rx="14" fill="white" stroke="#b7cbd9" stroke-width="2"/>
 <text x="72" y="138" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="21" fill="#203247">Illustrative kernel output layout</text>
 <rect x="80" y="157" width="349" height="48" rx="7" fill="#275178"/>
 <text x="100" y="188" font-family="Consolas,monospace" font-size="19" fill="white">.text.boot  |  _start</text>
 <rect x="80" y="211" width="349" height="40" rx="7" fill="#477d9c"/>
 <text x="100" y="237" font-family="Consolas,monospace" font-size="18" fill="white">.text       |  C23 code</text>
 <rect x="80" y="257" width="349" height="40" rx="7" fill="#e6d49d"/>
 <text x="100" y="283" font-family="Consolas,monospace" font-size="18" fill="#4c3c17">.rodata     |  constants</text>
 <rect x="80" y="303" width="349" height="38" rx="7" fill="#c5e0f4"/>
 <text x="100" y="328" font-family="Consolas,monospace" font-size="18" fill="#234b6d">.data       |  globals</text>
 <rect x="80" y="347" width="349" height="33" rx="7" fill="#cee8dd"/>
 <text x="100" y="369" font-family="Consolas,monospace" font-size="17" fill="#225842">.bss        |  zero on boot</text>
 <path d="M485 242 H567" stroke="#087f8c" stroke-width="6" fill="none"/>
 <path d="M554 229 L573 242 L554 255" stroke="#087f8c" stroke-width="6" fill="none"/>
 <rect x="585" y="113" width="440" height="260" rx="15" fill="#203247"/>
 <text x="614" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700">Assembly bootstrap</text>
 <text x="614" y="201" font-family="Consolas,monospace" font-size="17" fill="#cfe6ee">1. Establish the stack pointer</text>
 <text x="614" y="236" font-family="Consolas,monospace" font-size="17" fill="#cfe6ee">2. Clear the BSS region</text>
 <text x="614" y="271" font-family="Consolas,monospace" font-size="17" fill="#cfe6ee">3. Pass boot arguments</text>
 <text x="614" y="306" font-family="Consolas,monospace" font-size="17" fill="#9be6d8">4. Call UmiKernelMain()</text>
 <text x="49" y="436" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#355269">Placement is controlled by the real platform linker script; a generic diagram cannot replace it.</text>
</svg>
