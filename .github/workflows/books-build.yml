name: Books — Build & Publish

on:
  push:
    paths:
      - "dropzone/**"
      - "scripts/**"
      - ".github/workflows/books-build.yml"
      - ".typos.toml"
  pull_request:
    paths:
      - "dropzone/**"
      - "scripts/**"
      - ".github/workflows/books-build.yml"
      - ".typos.toml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Ubuntu 24.04 provides the PDF renderer required by BookForge.
    # Ubuntu 26.04 was selected by the former floating runner.
    # runs-on: ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # Use the Node.js 24 checkout action supported by hosted runners.
        # uses: actions/checkout@v4
        uses: actions/checkout@v5
        with:
          # Changed-only builds compare the event base with the checked-out source.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OS deps (pandoc + wkhtmltopdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Install Python deps (if provided)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install python-docx; fi

      - name: Determine base SHA for changed-only builds
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "base_sha=${{ github.event.before }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          else
            echo "base_sha=" >> $GITHUB_OUTPUT
          fi

      # The old command assumed the event base always existed in the checkout.
      # Fall back to building every book for a new branch or an unavailable base.
      # - name: Build books (changed only if possible)
      #   run: |
      #     python scripts/forge_all.py --changed-only "${{ steps.base.outputs.base_sha }}"
      - name: Build books using the available Git history
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            python scripts/forge_all.py --changed-only "$BASE_SHA"
          else
            python scripts/forge_all.py
          fi

      - name: Upload book artifacts
        # Workflow-only changes can produce a catalogue without new books.
        if: ${{ hashFiles('output/*/books/*.docx', 'output/*/books/*.pdf') != '' }}
        # Use the Node.js 24 artifact uploader with the existing artifact inputs.
        # uses: actions/upload-artifact@v4
        uses: actions/upload-artifact@v7
        with:
          name: books-all
          path: |
            output/*/books/*.docx
            output/*/books/*.pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Upload catalog site (for Pages)
        # Use the Pages uploader that delegates to the Node.js 24 artifact action.
        # uses: actions/upload-pages-artifact@v4
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site

  # The former deployment owner is retained for engineering review rather
  # than removed. The same BookForge output is now included under archive/books
  # by learning-pages.yml, which is the single GitHub Pages deployment owner.
  # This job must not deploy independently or race with the learning website.
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        