name: Learning site validation

on:
  push:
    paths:
      - "content/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/validate_learning.py"
      - "tools/check_mkdocs_config.py"
      - "tests/test_mkdocs_config07.py"
      - "tools/prepare_learning_site.py"
      - "scripts/Prepare-UmicomLearningSite.ps1"
      - "dropzone/documents/islam_blueprint_for_life/**"
      - "dropzone/images/**"
      - "tests/test_learning_site.py"
      - "tests/test_islam_volume_and_brand.py"
      - ".github/workflows/learning-site-check.yml"
  pull_request:
    paths:
      - "content/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/validate_learning.py"
      - "tools/check_mkdocs_config.py"
      - "tests/test_mkdocs_config07.py"
      - "tools/prepare_learning_site.py"
      - "scripts/Prepare-UmicomLearningSite.ps1"
      - "dropzone/documents/islam_blueprint_for_life/**"
      - "dropzone/images/**"
      - "tests/test_learning_site.py"
      - "tests/test_islam_volume_and_brand.py"
      - ".github/workflows/learning-site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      # Use the Node.js 24 checkout action supported by hosted runners.
      # - uses: actions/checkout@v4
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The runner could not read the separate Framework repository.
      # Site preparation uses the reviewed artwork from this checkout.
      # Preserve the earlier cross-repository checkout for review.
      # - name: Check out canonical Framework branding
      #   uses: actions/checkout@v4
      #   with:
      #     repository: umicom-foundation/umicom-framework
      #     path: .site-brand-framework
      #     sparse-checkout: |
      #       resources/brand
      #     sparse-checkout-cone-mode: false
      - name: Install site dependencies
        run: |
          python -m pip install -r requirements-docs.txt
          python -m pip install pytest
      # Use the same approved artwork in validation and publication.
      # The preparer checks required files and leaves matching artwork in place.
      # The earlier source path depended on the retired checkout.
      # - name: Prepare preserved book chapters and Umicom brand
      #   run: python tools/prepare_learning_site.py --brand-source .site-brand-framework/resources/brand
      - name: Prepare historical books and verify checked-in Umicom branding
        run: python tools/prepare_learning_site.py --brand-source content/assets/branding
      - name: Validate MkDocs YAML and complete navigation before rendering
        run: |
          python tools/check_mkdocs_config.py
          python -m pytest -q -p no:cacheprovider tests/test_mkdocs_config07.py
      - name: Check course and repository links
        run: python tools/validate_learning.py
      - name: Validate learning tests
        run: python -m pytest -q -p no:cacheprovider tests/test_learning_site.py tests/test_islam_volume_and_brand.py
      - name: Build the complete MkDocs website
        run: python -m mkdocs build --strict
      - name: Upload website preview
        # Use the Node.js 24 artifact uploader with the existing artifact inputs.
        # uses: actions/upload-artifact@v4
        uses: actions/upload-artifact@v7
        with:
          name: umicom-learning-website-preview
          path: site/
          if-no-files-found: error
