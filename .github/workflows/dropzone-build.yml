name: Dropzone Build & Publish

on:
  push:
    paths:
      - "dropzone/**"
      - "scripts/bookforge.py"
      - "scripts/forge_all.py"
      - ".github/workflows/dropzone-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 24.04 provides the PDF renderer required by BookForge.
    # Ubuntu 26.04 was selected by the former floating runner.
    # runs-on: ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
      # Use the Node.js 24 checkout action supported by hosted runners.
      # - uses: actions/checkout@v4
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install python-docx Pillow

      - name: Install pandoc & wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      # The direct builder writes one book into its slug directory.
      # The shared runner also assembles those sites under output/site.
      # - name: Build with BookForge (to output/)
      #   run: python scripts/bookforge.py
      - name: Build the books and catalogue with BookForge
        run: python scripts/forge_all.py

      - name: Upload book artifacts
        # Use the Node.js 24 artifact uploader with the existing artifact inputs.
        # uses: actions/upload-artifact@v4
        uses: actions/upload-artifact@v7
        with:
          name: bookforge-outputs
          # Use the per-book directories produced by the catalogue builder.
          # The previous flat paths could not find the generated files.
          # path: |
          #   output/manuscript/book.md
          #   output/books/*.docx
          #   output/books/*.pdf
          path: |
            output/*/manuscript/book.md
            output/*/books/*.docx
            output/*/books/*.pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact (output/site)
        # Use the Pages uploader that delegates to the Node.js 24 artifact action.
        # uses: actions/upload-pages-artifact@v4
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site

  # Preserve the original legacy deployment job for review, but prevent it
  # from racing with the complete learning website. learning-pages.yml now
  # publishes both MkDocs and the existing BookForge output together.
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
