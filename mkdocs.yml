site_name: "Bits to Banking — Umicom Learning"
site_description: "Computers, programming, Umicom and financial systems from first principles"
site_author: "Umicom Foundation"
site_url: "https://umicom-foundation.github.io/Bits2Banking/"
repo_url: "https://github.com/umicom-foundation/Bits2Banking"
repo_name: "umicom-foundation/Bits2Banking"
edit_uri: "edit/main/content/"
docs_dir: content
site_dir: site

# Pages deployment is managed separately from this website build.
theme:
  name: material
  language: en
  font: false
  logo: assets/branding/umicom-icon-on-dark.svg
  favicon: assets/branding/umicom.ico
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - assets/stylesheets/umicom.css
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Quick Upload via raw_docs: CONTRIBUTING_RAW_DOCS.md
  - Home: index.md
  - Start here: start/index.md
  - Our values: values.md
  - Learning roadmap: roadmap.md
  - "Volume 1 — Islam: Blueprint for Life":
      - Overview: v001_islam_blueprint_for_life/index.md
      - "Introduction to Islam — A Complete Way of Life": v001_islam_blueprint_for_life/introduction_to_islam.md
      - "History of Money": v001_islam_blueprint_for_life/history_of_money.md
      - "Decline of Sound Money": v001_islam_blueprint_for_life/decline_of_sound_money.md
      - "Modern Banking and Finance": v001_islam_blueprint_for_life/modern_banking_and_finance.md
      - "Technology and Banking": v001_islam_blueprint_for_life/technology_and_banking.md
      - "Islamic Finance and the Future": v001_islam_blueprint_for_life/islamic_finance_and_future.md
      - "Umicom — Asset-Backed Stable Coin": v001_islam_blueprint_for_life/umicom_abs_coin.md
      - "Governance Firewalls": v001_islam_blueprint_for_life/governance_firewalls.md
      - "Hall of Shame — Collaboration and Betrayal": v001_islam_blueprint_for_life/hall_of_shame_collaboration_and_betrayal.md
      - "Recap": v001_islam_blueprint_for_life/recap.md
      - "Illustrations": v001_islam_blueprint_for_life/illustrations.md
      - "Faith, service and technology": v001_islam_blueprint_for_life/faith-service-and-technology.md
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  - Volumes:
      - Index: VOLUMES.md

plugins:
  - search

markdown_extensions:
  # Structure & links
  - toc:
      permalink: true
  - tables
  - attr_list
  - def_list
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
 # Pymdown extensions (already bundled with Material)
  - pymdownx.details          # collapsible details blocks
  - pymdownx.superfences      # fenced blocks inside other blocks
  - pymdownx.emoji            # emoji shortcodes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
