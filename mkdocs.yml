site_name: "Bits to Banking — Umicom Learning"
site_description: "Computers, programming, Umicom and financial systems from first principles"
site_author: "Umicom Foundation"
site_url: "https://umicom-foundation.github.io/Bits2Banking/"
repo_url: "https://github.com/umicom-foundation/Bits2Banking"
repo_name: "umicom-foundation/Bits2Banking"
edit_uri: "edit/main/content/"
docs_dir: content
site_dir: site

# Pages deployment is managed separately from this website build.
theme:
  name: material
  language: en
  logo: assets/branding/umicom-icon-on-dark.svg
  favicon: assets/branding/umicom.ico
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - assets/stylesheets/umicom.css
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
